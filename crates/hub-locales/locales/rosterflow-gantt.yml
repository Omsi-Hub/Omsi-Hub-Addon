  uk: "Місце перерви зміни %{d} задано"
"A break at %{stop}, where no break may be taken":
  de: "Eine Pause in %{stop}, wo keine Pause erlaubt ist"
  fr: "Une pause à %{stop}, où aucune pause n'est permise"
  nl: "Een pauze bij %{stop}, waar geen pauze mag"
  pl: "Przerwa w %{stop}, gdzie przerwa jest niedozwolona"
  es: "Una pausa en %{stop}, donde no se puede hacer pausa"
  ru: "Перерыв на %{stop}, где перерыв не разрешён"
  uk: "Перерва на %{stop}, де перерва не дозволена"
"Copy to…":
  de: "Kopieren nach…"
  fr: "Copier vers…"
  nl: "Kopiëren naar…"
  pl: "Kopiuj do…"
  es: "Copiar a…"
  ru: "Копировать в…"
  uk: "Копіювати в…"
"Copy the rows ticked to other days: only the trips that match there go along (Ctrl+C, then Ctrl+V on another day)":
  de: "Die angehakten Zeilen auf andere Tage kopieren: nur die Fahrten, die dort passen, kommen mit (Strg+C, dann Strg+V an einem anderen Tag)"
  fr: "Copier les lignes cochées vers d'autres jours : seules les courses qui y correspondent suivent (Ctrl+C, puis Ctrl+V un autre jour)"
  nl: "De aangevinkte rijen naar andere dagen kopiëren: alleen de ritten die daar passen gaan mee (Ctrl+C, dan Ctrl+V op een andere dag)"
  pl: "Kopiuj zaznaczone wiersze na inne dni: idą tylko kursy, które tam pasują (Ctrl+C, potem Ctrl+V w innym dniu)"
  es: "Copiar las filas marcadas a otros días: solo se llevan los viajes que coinciden allí (Ctrl+C, luego Ctrl+V en otro día)"
  ru: "Копировать отмеченные строки на другие дни: переносятся только совпадающие там рейсы (Ctrl+C, затем Ctrl+V в другой день)"
  uk: "Копіювати позначені рядки на інші дні: переносяться лише рейси, що там збігаються (Ctrl+C, потім Ctrl+V в інший день)"
"Copy %{n} rows to…":
  de: "%{n} Zeilen kopieren nach…"
  fr: "Copier %{n} lignes vers…"
  nl: "%{n} rijen kopiëren naar…"
  pl: "Kopiuj wiersze (%{n}) do…"
  es: "Copiar %{n} filas a…"
  ru: "Копировать строки (%{n}) в…"
  uk: "Копіювати рядки (%{n}) в…"
"Same day type":
  de: "Gleiche Tagesart"
  fr: "Même type de jour"
  nl: "Zelfde dagtype"
  pl: "Ten sam typ dnia"
  es: "Mismo tipo de día"
  ru: "Тот же тип дня"
  uk: "Той самий тип дня"
"Only the trips that match there are copied (same line, way, departure and stops); the rest are listed. It goes into your draft: SAVE keeps it.":
  de: "Nur die Fahrten, die dort passen (gleiche Linie, Richtung, Abfahrt und Haltestellen), werden kopiert; die übrigen werden aufgelistet. Es kommt in deinen Entwurf: SPEICHERN behält es."
  fr: "Seules les courses qui y correspondent (même ligne, sens, départ et arrêts) sont copiées ; les autres sont listées. Cela va dans ton brouillon : ENREGISTRER le garde."
  nl: "Alleen de ritten die daar passen (zelfde lijn, richting, vertrek en haltes) worden gekopieerd; de rest wordt opgesomd. Het komt in je concept: OPSLAAN houdt het."
  pl: "Kopiowane są tylko kursy, które tam pasują (ta sama linia, kierunek, odjazd i przystanki); reszta jest wymieniona. Trafia to do twojego szkicu: ZAPISZ to zachowuje."
  es: "Solo se copian los viajes que coinciden allí (misma línea, sentido, salida y paradas); el resto se muestra en una lista. Va a tu borrador: GUARDAR lo conserva."
  ru: "Копируются только совпадающие там рейсы (та же линия, направление, отправление и остановки); остальные перечислены. Это идёт в твой черновик: СОХРАНИТЬ оставляет его."
  uk: "Копіюються лише рейси, що там збігаються (та сама лінія, напрям, відправлення й зупинки); решта перелічена. Це йде у твою чернетку: ЗБЕРЕГТИ залишає її."
"%{n} rows copied: open another day in the switcher and press Ctrl+V to put them there.":
  de: "%{n} Zeilen kopiert: öffne einen anderen Tag in der Tagesauswahl und drücke Strg+V, um sie dort einzufügen."
  fr: "%{n} lignes copiées : ouvre un autre jour dans le sélecteur et appuie sur Ctrl+V pour les y mettre."
  nl: "%{n} rijen gekopieerd: open een andere dag in de dagkiezer en druk op Ctrl+V om ze daar te zetten."
  pl: "Skopiowano wiersze (%{n}): otwórz inny dzień w przełączniku i naciśnij Ctrl+V, aby je tam wstawić."
  es: "%{n} filas copiadas: abre otro día en el selector y pulsa Ctrl+V para ponerlas allí."
  ru: "Строки скопированы (%{n}): открой другой день в переключателе и нажми Ctrl+V, чтобы вставить их туда."
  uk: "Рядки скопійовано (%{n}): відкрий інший день у перемикачі й натисни Ctrl+V, щоб вставити їх туди."
"Open another day in the switcher to put the rows there.":
  de: "Öffne einen anderen Tag in der Tagesauswahl, um die Zeilen dort einzufügen."
  fr: "Ouvre un autre jour dans le sélecteur pour y mettre les lignes."
  nl: "Open een andere dag in de dagkiezer om de rijen daar te zetten."
  pl: "Otwórz inny dzień w przełączniku, aby wstawić tam wiersze."
  es: "Abre otro día en el selector para poner allí las filas."
  ru: "Открой другой день в переключателе, чтобы вставить туда строки."
  uk: "Відкрий інший день у перемикачі, щоб вставити туди рядки."
"Not copied: they match no trip there, or a locked vehicle or duty there has them. Each is shown on the day it was copied from.":
  de: "Nicht kopiert: sie passen dort zu keiner Fahrt, oder ein gesperrtes Fahrzeug oder ein gesperrter Dienst dort hat sie. Jede wird an dem Tag gezeigt, von dem kopiert wurde."
  fr: "Non copiées : elles ne correspondent à aucune course là-bas, ou un véhicule ou un service verrouillé là-bas les a. Chacune est montrée au jour d'où elle a été copiée."
  nl: "Niet gekopieerd: ze passen daar bij geen rit, of een vergrendeld voertuig of een vergrendelde dienst daar heeft ze. Elk wordt getoond op de dag waarvan gekopieerd is."
  pl: "Nie skopiowano: nie pasują tam do żadnego kursu albo ma je tam zablokowany pojazd lub służba. Każdy jest pokazany w dniu, z którego kopiowano."
  es: "No copiados: no coinciden con ningún viaje de allí, o los tiene un vehículo o servicio bloqueado allí. Cada uno se muestra en el día del que se copió."
  ru: "Не скопированы: им там не соответствует ни один рейс, или они у заблокированной там машины или смены. Каждый показан в тот день, откуда копировали."
  uk: "Не скопійовані: їм там не відповідає жоден рейс, або вони в заблокованої там машини чи зміни. Кожен показано в той день, звідки копіювали."
"Tick the rows to copy first.":
  de: "Hake zuerst die Zeilen an, die kopiert werden sollen."
  fr: "Coche d'abord les lignes à copier."
  nl: "Vink eerst de rijen aan die je wilt kopiëren."
  pl: "Najpierw zaznacz wiersze do skopiowania."
  es: "Marca primero las filas que copiar."
  ru: "Сначала отметь строки для копирования."
  uk: "Спочатку познач рядки для копіювання."
"Choose the days to copy to.":
  de: "Wähle die Tage, auf die kopiert werden soll."
  fr: "Choisis les jours vers lesquels copier."
  nl: "Kies de dagen om naar te kopiëren."
  pl: "Wybierz dni, na które kopiować."
  es: "Elige los días a los que copiar."
  ru: "Выбери дни, на которые копировать."
  uk: "Вибери дні, на які копіювати."
"%{n} rows copied to %{days}":
  de: "%{n} Zeilen kopiert nach %{days}"
  fr: "%{n} lignes copiées vers %{days}"
  nl: "%{n} rijen gekopieerd naar %{days}"
  pl: "Wiersze (%{n}) skopiowane do %{days}"
  es: "%{n} filas copiadas a %{days}"
  ru: "Строки (%{n}) скопированы в %{days}"
  uk: "Рядки (%{n}) скопійовано в %{days}"
"Nothing was copied: no trip of those days matches the rows' trips, or a locked vehicle or duty there has them.":
  de: "Nichts kopiert: keine Fahrt dieser Tage passt zu den Fahrten der Zeilen, oder ein gesperrtes Fahrzeug oder ein gesperrter Dienst dort hat sie."
  fr: "Rien n'a été copié : aucune course de ces jours ne correspond aux courses des lignes, ou un véhicule ou un service verrouillé là-bas les a."
  nl: "Er is niets gekopieerd: geen rit van die dagen past bij de ritten van de rijen, of een vergrendeld voertuig of een vergrendelde dienst daar heeft ze."
  pl: "Nic nie skopiowano: żaden kurs tych dni nie pasuje do kursów wierszy albo ma je tam zablokowany pojazd lub służba."
  es: "No se ha copiado nada: ningún viaje de esos días coincide con los viajes de las filas, o los tiene un vehículo o servicio bloqueado allí."
  ru: "Ничего не скопировано: ни один рейс этих дней не совпадает с рейсами строк, или они у заблокированной там машины или смены."
  uk: "Нічого не скопійовано: жоден рейс цих днів не збігається з рейсами рядків, або вони в заблокованої там машини чи зміни."
"Copied to %{days}: in your draft - SAVE keeps it, Undo takes it back.":
  de: "Kopiert nach %{days}: in deinem Entwurf - SPEICHERN behält es, Rückgängig nimmt es zurück."
  fr: "Copié vers %{days} : dans ton brouillon - ENREGISTRER le garde, Annuler le retire."
  nl: "Gekopieerd naar %{days}: in je concept - OPSLAAN houdt het, Ongedaan maken neemt het terug."
  pl: "Skopiowano do %{days}: w twoim szkicu - ZAPISZ to zachowuje, Cofnij to wycofuje."
  es: "Copiado a %{days}: en tu borrador; GUARDAR lo conserva, Deshacer lo retira."
  ru: "Скопировано в %{days}: в твоём черновике - СОХРАНИТЬ оставляет, Отменить убирает."
  uk: "Скопійовано в %{days}: у твоїй чернетці - ЗБЕРЕГТИ залишає, Скасувати прибирає."
"%{n} of their trips were not copied: they match no trip there, or a locked vehicle or duty there has them.":
  de: "%{n} ihrer Fahrten wurden nicht kopiert: sie passen dort zu keiner Fahrt, oder ein gesperrtes Fahrzeug oder ein gesperrter Dienst dort hat sie."
  fr: "%{n} de leurs courses n'ont pas été copiées : elles ne correspondent à aucune course là-bas, ou un véhicule ou un service verrouillé là-bas les a."
  nl: "%{n} van hun ritten zijn niet gekopieerd: ze passen daar bij geen rit, of een vergrendeld voertuig of een vergrendelde dienst daar heeft ze."
  pl: "Kursy nieskopiowane (%{n}): nie pasują tam do żadnego kursu albo ma je tam zablokowany pojazd lub służba."
  es: "%{n} de sus viajes no se han copiado: no coinciden con ningún viaje de allí, o los tiene un vehículo o servicio bloqueado allí."
  ru: "Рейсы не скопированы (%{n}): им там не соответствует ни один рейс, или они у заблокированной там машины или смены."
  uk: "Рейси не скопійовано (%{n}): їм там не відповідає жоден рейс, або вони в заблокованої там машини чи зміни."
