# --- the set-up assistant --------------------------------------------------------------------
"Let go of everything":
  nl: "Laat alles los"
  de: "Alles loslassen"
  fr: "Lâchez tout"
  ru: "Отпустите всё"
  uk: "Відпустіть усе"
  pl: "Puść wszystko"
  es: "Suéltalo todo"
"Take your hands off the wheel and your feet off the pedals, the wheel in the middle; then press Next.":
  nl: "Haal je handen van het stuur en je voeten van de pedalen, het stuur in het midden; druk dan op Volgende."
  de: "Nimm die Hände vom Lenkrad und die Füße von den Pedalen, das Lenkrad in der Mitte; dann drücke Weiter."
  fr: "Lâchez le volant et retirez vos pieds des pédales, le volant au centre ; puis appuyez sur Suivant."
  ru: "Уберите руки с руля и ноги с педалей, руль по центру; затем нажмите «Далее»."
  uk: "Приберіть руки з керма і ноги з педалей, кермо по центру; потім натисніть «Далі»."
  pl: "Zdejmij ręce z kierownicy i stopy z pedałów, kierownica na środku; potem naciśnij Dalej."
  es: "Quita las manos del volante y los pies de los pedales, con el volante en el centro; luego pulsa Siguiente."
"Turn the wheel (or move the stick) all the way to the LEFT and hold it there; then press Next. No wheel (pedals only): Skip.":
  nl: "Draai het stuur (of beweeg de stick) helemaal naar LINKS en houd het daar; druk dan op Volgende. Geen stuur (alleen pedalen): Overslaan."
  de: "Dreh das Lenkrad (oder bewege den Stick) ganz nach LINKS und halte es dort; dann drücke Weiter. Kein Lenkrad (nur Pedale): Überspringen."
  fr: "Tournez le volant (ou poussez le stick) complètement à GAUCHE et maintenez-le ; puis appuyez sur Suivant. Pas de volant (pédales seules) : Passer."
  ru: "Поверните руль (или стик) до упора ВЛЕВО и удерживайте; затем нажмите «Далее». Нет руля (только педали): «Пропустить»."
  uk: "Поверніть кермо (або стік) до упору ЛІВОРУЧ і утримуйте; потім натисніть «Далі». Немає керма (лише педалі): «Пропустити»."
  pl: "Skręć kierownicę (lub przesuń drążek) do końca w LEWO i przytrzymaj; potem naciśnij Dalej. Bez kierownicy (same pedały): Pomiń."
  es: "Gira el volante (o mueve la palanca) del todo a la IZQUIERDA y mantenlo ahí; luego pulsa Siguiente. Sin volante (solo pedales): Omitir."
"Press the throttle pedal all the way down and hold it; then press Next. No pedals: Skip.":
  nl: "Trap het gaspedaal helemaal in en houd het vast; druk dan op Volgende. Geen pedalen: Overslaan."
  de: "Tritt das Gaspedal ganz durch und halte es; dann drücke Weiter. Keine Pedale: Überspringen."
  fr: "Enfoncez l'accélérateur à fond et maintenez-le ; puis appuyez sur Suivant. Pas de pédales : Passer."
  ru: "Выжмите педаль газа до упора и удерживайте; затем нажмите «Далее». Нет педалей: «Пропустить»."
  uk: "Вичавіть педаль газу до упору і утримуйте; потім натисніть «Далі». Немає педалей: «Пропустити»."
  pl: "Wciśnij pedał gazu do końca i przytrzymaj; potem naciśnij Dalej. Brak pedałów: Pomiń."
  es: "Pisa el acelerador a fondo y mantenlo; luego pulsa Siguiente. Sin pedales: Omitir."
"Press the brake pedal all the way down and hold it; then press Next. No brake pedal: Skip.":
  nl: "Trap het rempedaal helemaal in en houd het vast; druk dan op Volgende. Geen rempedaal: Overslaan."
  de: "Tritt das Bremspedal ganz durch und halte es; dann drücke Weiter. Kein Bremspedal: Überspringen."
  fr: "Enfoncez la pédale de frein à fond et maintenez-la ; puis appuyez sur Suivant. Pas de pédale de frein : Passer."
  ru: "Выжмите педаль тормоза до упора и удерживайте; затем нажмите «Далее». Нет педали тормоза: «Пропустить»."
  uk: "Вичавіть педаль гальма до упору і утримуйте; потім натисніть «Далі». Немає педалі гальма: «Пропустити»."
  pl: "Wciśnij pedał hamulca do końca i przytrzymaj; potem naciśnij Dalej. Brak pedału hamulca: Pomiń."
  es: "Pisa el freno a fondo y mantenlo; luego pulsa Siguiente. Sin pedal de freno: Omitir."
"Press the clutch pedal all the way down and hold it; then press Next. No clutch: Skip.":
  nl: "Trap het koppelingspedaal helemaal in en houd het vast; druk dan op Volgende. Geen koppeling: Overslaan."
  de: "Tritt das Kupplungspedal ganz durch und halte es; dann drücke Weiter. Keine Kupplung: Überspringen."
  fr: "Enfoncez la pédale d'embrayage à fond et maintenez-la ; puis appuyez sur Suivant. Pas d'embrayage : Passer."
  ru: "Выжмите педаль сцепления до упора и удерживайте; затем нажмите «Далее». Нет сцепления: «Пропустить»."
  uk: "Вичавіть педаль зчеплення до упору і утримуйте; потім натисніть «Далі». Немає зчеплення: «Пропустити»."
  pl: "Wciśnij pedał sprzęgła do końca i przytrzymaj; potem naciśnij Dalej. Brak sprzęgła: Pomiń."
  es: "Pisa el embrague a fondo y mantenlo; luego pulsa Siguiente. Sin embrague: Omitir."
"Nothing moved far enough: hold it all the way, or skip this step.":
  nl: "Niets bewoog ver genoeg: houd het helemaal vast, of sla deze stap over."
  de: "Nichts hat sich weit genug bewegt: halte es ganz durchgedrückt, oder überspringe diesen Schritt."
  fr: "Rien n'a bougé assez loin : maintenez-le à fond, ou passez cette étape."
  ru: "Ничто не сдвинулось достаточно: удерживайте до упора или пропустите этот шаг."
  uk: "Ніщо не зрушило достатньо: утримуйте до упору або пропустіть цей крок."
  pl: "Nic nie przesunęło się wystarczająco: przytrzymaj do końca albo pomiń ten krok."
  es: "Nada se ha movido lo suficiente: llévalo hasta el tope o omite este paso."
"Nothing was found: start again and hold each control all the way.":
  nl: "Er is niets gevonden: begin opnieuw en houd elke bediening helemaal vast."
  de: "Nichts gefunden: fang neu an und halte jedes Bedienelement ganz durch."
  fr: "Rien n'a été trouvé : recommencez et maintenez chaque commande à fond."
  ru: "Ничего не найдено: начните заново и удерживайте каждый орган управления до упора."
  uk: "Нічого не знайдено: почніть знову й утримуйте кожен орган керування до упору."
  pl: "Nic nie znaleziono: zacznij od nowa i przytrzymuj każdy element do końca."
  es: "No se ha detectado nada: empieza de nuevo y lleva cada control hasta el tope."
"The device is not connected: plug it in to set it up.":
  nl: "Het apparaat is niet aangesloten: sluit het aan om het in te stellen."
  de: "Das Gerät ist nicht angeschlossen: schließe es an, um es einzurichten."
  fr: "Le périphérique n'est pas branché : branchez-le pour le configurer."
  ru: "Устройство не подключено: подключите его, чтобы настроить."
  uk: "Пристрій не під'єднано: під'єднайте його, щоб налаштувати."
  pl: "Urządzenie nie jest podłączone: podłącz je, aby je skonfigurować."
  es: "El dispositivo no está conectado: enchúfalo para configurarlo."

