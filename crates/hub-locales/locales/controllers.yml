"Not set up yet: the assistant finds the wheel and the pedals in a few steps. Until then openOMSI steers with its X axis.":
  nl: "Nog niet ingesteld: de assistent vindt het stuur en de pedalen in een paar stappen. Tot dan stuurt openOMSI met de X-as."
  de: "Noch nicht eingerichtet: der Assistent findet Lenkrad und Pedale in wenigen Schritten. Bis dahin lenkt openOMSI mit der X-Achse."
  fr: "Pas encore configuré : l'assistant trouve le volant et les pédales en quelques étapes. D'ici là, openOMSI braque avec l'axe X."
  ru: "Ещё не настроено: помощник найдёт руль и педали за несколько шагов. До тех пор openOMSI рулит по оси X."
  uk: "Ще не налаштовано: помічник знайде кермо й педалі за кілька кроків. Доти openOMSI кермує віссю X."
  pl: "Jeszcze nieskonfigurowane: asystent znajdzie kierownicę i pedały w kilku krokach. Do tego czasu openOMSI skręca osią X."
  es: "Aún sin configurar: el asistente encuentra el volante y los pedales en unos pocos pasos. Hasta entonces, openOMSI dirige con su eje X."
