"A gamepad needs no setting up: the left stick steers, the right trigger is the throttle and the left one the brake. With \"Default gamepad buttons\" on (below), its buttons work the indicators, the doors, the views, the gears, the menu and the pause.":
  nl: "Een gamepad hoeft niet ingesteld te worden: de linker stick stuurt, de rechter trigger is het gas en de linker de rem. Met \"Standaard gamepadknoppen\" aan (hieronder) bedienen de knoppen de richtingaanwijzers, de deuren, de zichten, de versnellingen, het menu en de pauze."
  de: "Ein Gamepad braucht keine Einrichtung: der linke Stick lenkt, der rechte Trigger ist das Gas und der linke die Bremse. Mit \"Standard-Gamepadtasten\" an (unten) bedienen seine Tasten Blinker, Türen, Ansichten, Gänge, Menü und Pause."
  fr: "Une manette n'a pas besoin de configuration : le stick gauche dirige, la gâchette droite est l'accélérateur et la gauche le frein. Avec « Boutons de manette par défaut » activé (ci-dessous), ses boutons commandent les clignotants, les portes, les vues, les rapports, le menu et la pause."
  ru: "Геймпад не нужно настраивать: левый стик рулит, правый курок — газ, левый — тормоз. Если включено «Кнопки геймпада по умолчанию» (ниже), его кнопки управляют поворотниками, дверями, видами, передачами, меню и паузой."
  uk: "Геймпад не потребує налаштування: лівий стік кермує, правий курок — газ, лівий — гальмо. Якщо ввімкнено «Типові кнопки геймпада» (нижче), його кнопки керують поворотами, дверима, видами, передачами, меню й паузою."
  pl: "Gamepad nie wymaga konfiguracji: lewy drążek kieruje, prawy spust to gaz, a lewy hamulec. Z włączonym „Domyślne przyciski gamepada” (poniżej) jego przyciski obsługują kierunkowskazy, drzwi, widoki, biegi, menu i pauzę."
  es: "Un gamepad no necesita configuración: el stick izquierdo dirige, el gatillo derecho es el acelerador y el izquierdo el freno. Con «Botones predeterminados del gamepad» activado (abajo), sus botones manejan los intermitentes, las puertas, las vistas, las marchas, el menú y la pausa."
