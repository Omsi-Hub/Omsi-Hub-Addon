"Your steering wheel, pedals, joysticks, shifters and button boxes as openOMSI drives them. Move a control or press a button: it shows here. Every change is saved at once.":
  nl: "Je stuur, pedalen, joysticks, schakelpoken en knoppenkasten zoals openOMSI ze gebruikt. Beweeg een bediening of druk op een knop: dat zie je hier. Elke wijziging wordt meteen opgeslagen."
  de: "Dein Lenkrad, deine Pedale, Joysticks, Schalthebel und Button-Boxen, wie openOMSI sie nutzt. Bewege ein Bedienelement oder drücke eine Taste: es erscheint hier. Jede Änderung wird sofort gespeichert."
  fr: "Votre volant, vos pédales, joysticks, leviers de vitesse et boîtiers de boutons tels qu'openOMSI les utilise. Bougez une commande ou appuyez sur un bouton : cela s'affiche ici. Chaque modification est enregistrée aussitôt."
  ru: "Ваш руль, педали, джойстики, рычаги КПП и кнопочные панели так, как их использует openOMSI. Подвигайте орган управления или нажмите кнопку: это видно здесь. Каждое изменение сохраняется сразу."
  uk: "Ваше кермо, педалі, джойстики, важелі КПП і кнопкові панелі так, як їх використовує openOMSI. Порухайте орган керування або натисніть кнопку: це видно тут. Кожна зміна зберігається одразу."
  pl: "Twoja kierownica, pedały, joysticki, drążki zmiany biegów i panele przycisków tak, jak używa ich openOMSI. Porusz elementem lub naciśnij przycisk: pojawi się tutaj. Każda zmiana zapisuje się od razu."
  es: "Tu volante, pedales, joysticks, palancas de cambio y cajas de botones tal como los usa openOMSI. Mueve un control o pulsa un botón: aparece aquí. Cada cambio se guarda al momento."
"Devices":
  nl: "Apparaten"
  de: "Geräte"
  fr: "Périphériques"
  ru: "Устройства"
  uk: "Пристрої"
  pl: "Urządzenia"
  es: "Dispositivos"
"No game controller is connected, and none is set up yet. Connect a wheel, pedals or a joystick and move it or press one of its buttons: it shows up here. A gamepad works without setting up.":
  nl: "Er is geen spelcontroller aangesloten en er is er nog geen ingesteld. Sluit een stuur, pedalen of een joystick aan en beweeg die of druk op een van de knoppen: dan verschijnt hij hier. Een gamepad werkt zonder instellen."
  de: "Kein Gamecontroller ist angeschlossen, und noch keiner ist eingerichtet. Schließe ein Lenkrad, Pedale oder einen Joystick an und bewege ihn oder drücke eine seiner Tasten: er erscheint hier. Ein Gamepad funktioniert ohne Einrichtung."
  fr: "Aucune manette n'est branchée, et aucune n'est encore configurée. Branchez un volant, des pédales ou un joystick et bougez-le ou appuyez sur l'un de ses boutons : il apparaît ici. Une manette de jeu fonctionne sans configuration."
  ru: "Игровой контроллер не подключён, и ни один ещё не настроен. Подключите руль, педали или джойстик и подвигайте его или нажмите одну из кнопок: он появится здесь. Геймпад работает без настройки."
  uk: "Ігровий контролер не під'єднано, і жоден ще не налаштовано. Під'єднайте кермо, педалі або джойстик і порухайте його чи натисніть одну з кнопок: він з'явиться тут. Геймпад працює без налаштування."
  pl: "Nie podłączono żadnego kontrolera i żaden nie jest jeszcze skonfigurowany. Podłącz kierownicę, pedały lub joystick i porusz nim albo naciśnij jeden z przycisków: pojawi się tutaj. Gamepad działa bez konfiguracji."
  es: "No hay ningún mando de juego conectado ni configurado. Conecta un volante, unos pedales o un joystick y muévelo o pulsa uno de sus botones: aparecerá aquí. Un gamepad funciona sin configurarlo."
"No gamectrler.cfg yet: it is made with the first change.":
  nl: "Nog geen gamectrler.cfg: die wordt bij de eerste wijziging gemaakt."
  de: "Noch keine gamectrler.cfg: sie entsteht mit der ersten Änderung."
  fr: "Pas encore de gamectrler.cfg : il est créé à la première modification."
  ru: "gamectrler.cfg ещё нет: он создаётся при первом изменении."
  uk: "gamectrler.cfg ще немає: його буде створено з першою зміною."
  pl: "Nie ma jeszcze gamectrler.cfg: powstanie przy pierwszej zmianie."
  es: "Aún no hay gamectrler.cfg: se crea con el primer cambio."
"These come from OMSI 2's own file. Your changes are saved in openOMSI's own; OMSI 2's stays as it is.":
  nl: "Deze komen uit het eigen bestand van OMSI 2. Je wijzigingen worden in dat van openOMSI opgeslagen; dat van OMSI 2 blijft zoals het is."
  de: "Diese stammen aus der Datei von OMSI 2. Deine Änderungen werden in der von openOMSI gespeichert; die von OMSI 2 bleibt, wie sie ist."
  fr: "Ceux-ci viennent du fichier d'OMSI 2. Vos modifications sont enregistrées dans celui d'openOMSI ; celui d'OMSI 2 reste tel quel."
  ru: "Это из собственного файла OMSI 2. Ваши изменения сохраняются в файл openOMSI; файл OMSI 2 остаётся как есть."
  uk: "Це з власного файлу OMSI 2. Ваші зміни зберігаються у файл openOMSI; файл OMSI 2 лишається як є."
  pl: "Pochodzą z własnego pliku OMSI 2. Twoje zmiany zapisują się w pliku openOMSI; plik OMSI 2 pozostaje bez zmian."
  es: "Estos vienen del propio archivo de OMSI 2. Tus cambios se guardan en el de openOMSI; el de OMSI 2 se queda como está."
"For every device":
