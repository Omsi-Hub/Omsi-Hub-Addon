"The new launcher draws its window with Microsoft WebView2, which this Windows does not have. Install it now (a small installer from Microsoft, about a minute), or go on with this launcher.":
  nl: "De nieuwe launcher tekent zijn venster met Microsoft WebView2, dat deze Windows niet heeft. Installeer het nu (een klein installatieprogramma van Microsoft, ongeveer een minuut), of ga verder met deze launcher."
  de: "Der neue Launcher zeichnet sein Fenster mit Microsoft WebView2, das diesem Windows fehlt. Jetzt installieren (ein kleines Installationsprogramm von Microsoft, etwa eine Minute) oder mit diesem Launcher weitermachen."
  fr: "Le nouveau lanceur dessine sa fenêtre avec Microsoft WebView2, que ce Windows n'a pas. Installez-le maintenant (un petit programme d'installation de Microsoft, environ une minute), ou continuez avec ce lanceur."
  ru: "Новый лаунчер рисует окно с помощью Microsoft WebView2, а в этой Windows его нет. Установите его сейчас (небольшой установщик Microsoft, около минуты) или продолжайте в этом лаунчере."
  uk: "Новий лаунчер малює вікно за допомогою Microsoft WebView2, а в цій Windows його немає. Встановіть його зараз (невеликий інсталятор Microsoft, близько хвилини) або продовжуйте в цьому лаунчері."
  pl: "Nowy launcher rysuje swoje okno za pomocą Microsoft WebView2, którego ten Windows nie ma. Zainstaluj go teraz (mały instalator Microsoftu, około minuty) lub kontynuuj z tym launcherem."
  es: "El nuevo lanzador dibuja su ventana con Microsoft WebView2, que este Windows no tiene. Instálalo ahora (un pequeño instalador de Microsoft, aproximadamente un minuto) o sigue con este lanzador."
"Microsoft's installer is running: follow its window. The new launcher opens when it has finished.":
  nl: "Het installatieprogramma van Microsoft loopt: volg het venster ervan. De nieuwe launcher opent zodra het klaar is."
  de: "Das Installationsprogramm von Microsoft läuft: folgen Sie seinem Fenster. Der neue Launcher öffnet sich danach."
  fr: "Le programme d'installation de Microsoft est en cours : suivez sa fenêtre. Le nouveau lanceur s'ouvre une fois qu'il a terminé."
  ru: "Идёт установка от Microsoft: следуйте её окну. Когда она закончится, откроется новый лаунчер."
  uk: "Триває встановлення від Microsoft: дотримуйтеся його вікна. Коли воно завершиться, відкриється новий лаунчер."
  pl: "Instalator Microsoftu działa: postępuj zgodnie z jego oknem. Nowy launcher otworzy się, gdy skończy."
  es: "El instalador de Microsoft está en marcha: sigue su ventana. El nuevo lanzador se abrirá cuando haya terminado."
"WebView2 could not be installed. Try again, or install it from Microsoft's website.":
  nl: "WebView2 kon niet worden geïnstalleerd. Probeer het opnieuw, of installeer het vanaf de website van Microsoft."
  de: "WebView2 konnte nicht installiert werden. Erneut versuchen oder von der Website von Microsoft installieren."
  fr: "WebView2 n'a pas pu être installé. Réessayez, ou installez-le depuis le site de Microsoft."
  ru: "Не удалось установить WebView2. Попробуйте ещё раз или установите его с сайта Microsoft."
  uk: "Не вдалося встановити WebView2. Спробуйте ще раз або встановіть його з сайту Microsoft."
  pl: "Nie udało się zainstalować WebView2. Spróbuj ponownie lub zainstaluj go ze strony Microsoftu."
  es: "No se ha podido instalar WebView2. Inténtalo de nuevo o instálalo desde la web de Microsoft."
