"A radio's station button n plays the n-th station, a cassette player the first; Shift+R steps through them. An address is an MP3, AAC or Ogg stream or an .m3u/.pls playlist.":
  nl: "Zenderknop n van een radio speelt de n-de zender, een cassettespeler de eerste; Shift+R loopt ze langs. Een adres is een MP3-, AAC- of Ogg-stream of een .m3u/.pls-afspeellijst."
  de: "Stationstaste n eines Radios spielt den n-ten Sender, ein Kassettenspieler den ersten; Shift+R schaltet durch. Eine Adresse ist ein MP3-, AAC- oder Ogg-Stream oder eine .m3u/.pls-Playlist."
  fr: "La touche de station n d'une radio joue la n-ième station, un lecteur de cassettes la première ; Maj+R les fait défiler. Une adresse est un flux MP3, AAC ou Ogg ou une liste de lecture .m3u/.pls."
  ru: "Кнопка станции n у радио включает n-ю станцию, кассетный плеер — первую; Shift+R перебирает их. Адрес — поток MP3, AAC или Ogg либо плейлист .m3u/.pls."
