"Driving keys: %{name} (Settings). Those keys drive the bus and win over the list below. Change any key here and your own layout (Custom controls) is used from then on.":
  nl: "Rijtoetsen: %{name} (Instellingen). Die toetsen besturen de bus en gaan voor de lijst hieronder. Wijzig hier een toets en vanaf dan wordt je eigen indeling (Eigen besturing) gebruikt."
  de: "Fahrtasten: %{name} (Einstellungen). Diese Tasten fahren den Bus und haben Vorrang vor der Liste unten. Änderst du hier eine Taste, gilt ab dann deine eigene Belegung (Eigene Steuerung)."
  fr: "Touches de conduite : %{name} (Réglages). Ces touches conduisent le bus et l'emportent sur la liste ci-dessous. Changez une touche ici et votre propre disposition (Commandes personnalisées) est utilisée dès lors."
  ru: "Клавиши вождения: %{name} (Настройки). Эти клавиши ведут автобус и важнее списка ниже. Измените здесь любую клавишу — и дальше будет использоваться ваша раскладка («Своё управление»)."
  uk: "Клавіші водіння: %{name} (Налаштування). Ці клавіші ведуть автобус і важливіші за список нижче. Змініть тут будь-яку клавішу — і далі використовуватиметься ваша розкладка («Власне керування»)."
  pl: "Klawisze jazdy: %{name} (Ustawienia). Te klawisze prowadzą autobus i mają pierwszeństwo przed listą poniżej. Zmień tu dowolny klawisz, a od tej pory używany będzie twój własny układ (Własne sterowanie)."
  es: "Teclas de conducción: %{name} (Ajustes). Esas teclas conducen el autobús y tienen prioridad sobre la lista de abajo. Si cambias aquí cualquier tecla, a partir de entonces se usa tu propia distribución (Controles personalizados)."
