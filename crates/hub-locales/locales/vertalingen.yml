"Copy the whole OMSI 2 folder (with maps and Vehicles in it) onto the phone - by cable, from a PC or a USB stick - for example as openOMSI/OMSI 2 in the internal storage, then choose it here with Browse. Mods go into openOMSI/Mods or are installed from the Mods page.":
  nl: "Kopieer de hele OMSI 2-map (met maps en Vehicles erin) naar de telefoon - via een kabel, vanaf een pc of een usb-stick - bijvoorbeeld als openOMSI/OMSI 2 in de interne opslag, en kies hem hier met Bladeren. Mods gaan in openOMSI/Mods of worden via de Mods-pagina geïnstalleerd."
  de: "Kopiere den ganzen OMSI-2-Ordner (mit maps und Vehicles darin) aufs Handy - per Kabel, vom PC oder von einem USB-Stick -, zum Beispiel als openOMSI/OMSI 2 in den internen Speicher, und wähle ihn hier mit Durchsuchen. Mods kommen nach openOMSI/Mods oder werden über die Seite Mods installiert."
  fr: "Copiez tout le dossier OMSI 2 (avec maps et Vehicles dedans) sur le téléphone - par câble, depuis un PC ou une clé USB - par exemple dans openOMSI/OMSI 2 de la mémoire interne, puis choisissez-le ici avec Parcourir. Les mods vont dans openOMSI/Mods ou s'installent depuis la page Mods."
  ru: "Скопируйте всю папку OMSI 2 (с maps и Vehicles) на телефон — по кабелю, с ПК или с флешки — например в openOMSI/OMSI 2 во внутренней памяти, затем выберите её здесь кнопкой «Обзор». Моды кладутся в openOMSI/Mods или устанавливаются со страницы «Моды»."
  uk: "Скопіюйте всю теку OMSI 2 (з maps і Vehicles) на телефон — кабелем, із ПК або з флешки — наприклад в openOMSI/OMSI 2 у внутрішній пам'яті, потім виберіть її тут кнопкою «Огляд». Моди кладуться в openOMSI/Mods або встановлюються зі сторінки «Моди»."
  pl: "Skopiuj cały folder OMSI 2 (z maps i Vehicles w środku) na telefon - kablem, z komputera lub z pendrive'a - na przykład jako openOMSI/OMSI 2 w pamięci wewnętrznej, a potem wybierz go tutaj przyciskiem Przeglądaj. Mody trafiają do openOMSI/Mods lub instaluje się je ze strony Mody."
  es: "Copia toda la carpeta de OMSI 2 (con maps y Vehicles dentro) en el teléfono - por cable, desde un PC o un pendrive -, por ejemplo como openOMSI/OMSI 2 en el almacenamiento interno, y luego elígela aquí con Examinar. Los mods van a openOMSI/Mods o se instalan desde la página Mods."
