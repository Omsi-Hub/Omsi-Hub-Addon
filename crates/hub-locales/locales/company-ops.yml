"Line %{n} tour %{tour}: %{min} minutes behind. Left as it is: %{trips} late trips ahead, %{amount} in penalties. The Operations page has ways to bring it back on time.":
  de: "Linie %{n} Umlauf %{tour}: %{min} Minuten hinter dem Fahrplan. Bleibt es so: %{trips} verspätete Fahrten, %{amount} Vertragsstrafen. Auf der Seite Fahrbetrieb gibt es Wege, ihn wieder pünktlich zu machen."
  fr: "Ligne %{n} service %{tour} : %{min} minutes de retard. Sans rien faire : %{trips} trajets en retard à venir, %{amount} de pénalités. La page Exploitation propose des moyens de le remettre à l'heure."
  nl: "Lijn %{n} omloop %{tour}: %{min} minuten achter. Zo gelaten: %{trips} late ritten nog, %{amount} aan boetes. De pagina Exploitatie heeft manieren om hem weer op tijd te krijgen."
  pl: "Linia %{n} brygada %{tour}: %{min} minut opóźnienia. Bez działania: %{trips} spóźnionych kursów, %{amount} kar. Strona Eksploatacja ma sposoby, by przywrócić punktualność."
  es: "Línea %{n} recorrido %{tour}: %{min} minutos de retraso. Si no se hace nada: %{trips} viajes con retraso por delante, %{amount} en penalizaciones. La página de Explotación tiene formas de devolverlo a su horario."
  ru: "Линия %{n} выход %{tour}: отставание %{min} мин. Если ничего не делать: %{trips} опоздавших рейсов впереди, %{amount} штрафов. На странице «Перевозки» есть способы вернуть его в график."
  uk: "Лінія %{n} випуск %{tour}: відставання %{min} хв. Якщо нічого не робити: %{trips} запізнілих рейсів попереду, %{amount} штрафів. На сторінці «Перевезення» є способи повернути його в графік."
