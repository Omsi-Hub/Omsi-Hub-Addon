"The server has not answered yet (is its address right? is it running?)":
  nl: "De server heeft nog niet geantwoord (klopt het adres? draait hij?)"
  de: "Der Server hat noch nicht geantwortet (stimmt die Adresse? läuft er?)"
  fr: "Le serveur n'a pas encore répondu (l'adresse est-elle correcte ? est-il lancé ?)"
  ru: "Сервер пока не ответил (верен ли адрес? запущен ли он?)"
  uk: "Сервер ще не відповів (чи правильна адреса? чи він працює?)"
  pl: "Serwer jeszcze nie odpowiedział (czy adres jest dobry? czy działa?)"
  es: "El servidor aún no ha respondido (¿es correcta su dirección? ¿está en marcha?)"
"Your next duty opens a session. Give the code to your friends: it works at home and over the internet.":
  nl: "Je volgende dienst opent een sessie. Geef de code aan je vrienden: werkt thuis en via internet."
  de: "Dein nächster Dienst öffnet eine Sitzung. Gib deinen Freunden den Code: er funktioniert zu Hause und über das Internet."
  fr: "Votre prochain service ouvre une session. Donnez le code à vos amis : il fonctionne à la maison et sur Internet."
  ru: "Ваша следующая смена откроет сессию. Дайте код друзьям: он работает и дома, и через интернет."
  uk: "Ваш наступний наряд відкриє сесію. Дайте код друзям: працює вдома й через інтернет."
  pl: "Twoja następna służba otworzy sesję. Podaj kod znajomym: działa w domu i przez internet."
  es: "Tu próximo servicio abre una sesión. Da el código a tus amigos: funciona en casa y por internet."
"Friends can join from anywhere":
  nl: "Vrienden kunnen overal meedoen"
  de: "Freunde können von überall beitreten"
  fr: "Vos amis peuvent rejoindre de partout"
  ru: "Друзья могут подключиться откуда угодно"
  uk: "Друзі можуть приєднатися звідусіль"
  pl: "Znajomi mogą dołączyć z dowolnego miejsca"
  es: "Tus amigos pueden unirse desde cualquier lugar"
"Getting ready for friends on the internet...":
  nl: "Voorbereiden voor vrienden op internet..."
  de: "Vorbereitung für Freunde im Internet..."
  fr: "Préparation pour les amis sur Internet..."
  ru: "Подготовка к подключению друзей через интернет..."
  uk: "Підготовка до гри з друзями через інтернет..."
  pl: "Przygotowywanie dla znajomych w internecie..."
  es: "Preparándose para amigos por internet..."
"Start a duty on the Drive page: the code appears here.":
  nl: "Start een dienst op de pagina Rijden: de code verschijnt hier."
  de: "Starte einen Dienst auf der Seite „Fahren“: Der Code erscheint hier."
  fr: "Démarrez un service sur la page Conduite : le code apparaît ici."
  ru: "Начните наряд на странице «Поездка»: код появится здесь."
  uk: "Почніть наряд на сторінці «Їхати»: код з'явиться тут."
  pl: "Rozpocznij służbę na stronie Jedź: kod pojawi się tutaj."
  es: "Empieza un servicio en la página Conducir: el código aparece aquí."
"Turn on hosting, then start a duty on the Drive page.":
  nl: "Zet hosten aan en start dan een dienst op de pagina Rijden."
  de: "Aktiviere das Hosting und starte dann einen Dienst auf der Seite „Fahren“."
  fr: "Activez l'hébergement, puis démarrez un service sur la page Conduite."
  ru: "Включите хостинг, затем начните наряд на странице «Поездка»."
  uk: "Увімкніть хостинг, потім почніть наряд на сторінці «Їхати»."
  pl: "Włącz hosting, potem rozpocznij służbę na stronie Jedź."
  es: "Activa el alojamiento y luego empieza un servicio en la página Conducir."
"Drive with friends by a code, or on servers that are always on.":
  nl: "Rijd met vrienden via een code, of op servers die altijd aan staan."
  de: "Fahre mit Freunden per Code oder auf Servern, die immer laufen."
  fr: "Roulez avec des amis par code ou sur des serveurs toujours en ligne."
  ru: "Ездите с друзьями по коду или на серверах, которые работают всегда."
  uk: "Грайте з друзями за кодом або на серверах, що працюють постійно."
  pl: "Jedź ze znajomymi po kodzie lub na serwerach działających cały czas."
  es: "Conduce con amigos mediante un código, o en servidores siempre activos."
