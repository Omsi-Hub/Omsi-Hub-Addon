"No servers yet. Add a server by the address its owner gives you.":
  nl: "Nog geen servers. Voeg een server toe met het adres dat de eigenaar je geeft."
  de: "Noch keine Server. Füge einen Server mit der Adresse hinzu, die dir sein Besitzer gibt."
  fr: "Aucun serveur pour l'instant. Ajoutez un serveur avec l'adresse donnée par son propriétaire."
  ru: "Серверов пока нет. Добавьте сервер по адресу, который даст его владелец."
  uk: "Серверів ще немає. Додайте сервер за адресою, яку дасть його власник."
  pl: "Brak serwerów. Dodaj serwer według adresu podanego przez właściciela."
  es: "Aún no hay servidores. Añade un servidor con la dirección que te dé su propietario."
"Paste a session code first":
  nl: "Plak eerst een sessiecode"
  de: "Zuerst einen Sitzungscode einfügen"
  fr: "Collez d'abord un code de session"
  ru: "Сначала вставьте код сеанса"
  uk: "Спершу вставте код сесії"
  pl: "Najpierw wklej kod sesji"
  es: "Pega primero un código de sesión"
"Paste the code your friend's game shows. The map, time and weather are the host's; you choose your bus.":
  nl: "Plak de code die het spel van je vriend toont. Kaart, tijd en weer zijn die van de host; jij kiest je bus."
  de: "Füge den Code aus dem Spiel deines Freundes ein. Karte, Zeit und Wetter sind die des Hosts; den Bus wählst du."
  fr: "Collez le code affiché par le jeu de votre ami. La carte, l'heure et la météo sont celles de l'hôte ; vous choisissez votre bus."
  ru: "Вставьте код из игры друга. Карта, время и погода - как у хоста; автобус выбираете вы."
  uk: "Вставте код, який показує гра вашого друга. Мапа, час і погода - від хоста; автобус обираєте ви."
  pl: "Wklej kod pokazywany przez grę znajomego. Mapa, czas i pogoda są hosta; autobus wybierasz ty."
  es: "Pega el código que muestra el juego de tu amigo. El mapa, la hora y el tiempo son los del anfitrión; tú eliges tu autobús."
