# The company's settings: friends joining the shared company without an invite (Luc, 2026-10-19:
# "invite my friends ... they don't have to enter the code anymore").
"Multiplayer":
  de: "Mehrspieler"
  fr: "Multijoueur"
  nl: "Multiplayer"
  pl: "Tryb wieloosobowy"
  es: "Multijugador"
  ru: "Мультиплеер"
  uk: "Мультиплеєр"
"Friends can join without an invite":
  de: "Freunde können ohne Einladung beitreten"
  fr: "Les amis peuvent rejoindre sans invitation"
  nl: "Vrienden kunnen zonder uitnodiging meedoen"
  pl: "Znajomi mogą dołączyć bez zaproszenia"
  es: "Los amigos pueden unirse sin invitación"
  ru: "Друзья могут присоединиться без приглашения"
  uk: "Друзі можуть приєднатися без запрошення"
"While you share the company, your Omsi-Hub friends see a Join button in their friends list: no session code needed.":
  de: "Solange du den Betrieb teilst, sehen deine Omsi-Hub-Freunde in ihrer Freundesliste einen Beitreten-Knopf: kein Sitzungscode nötig."
  fr: "Tant que tu partages l'entreprise, tes amis Omsi-Hub voient un bouton Rejoindre dans leur liste d'amis : pas besoin de code de session."
  nl: "Zolang je het bedrijf deelt, zien je Omsi-Hub-vrienden een knop Meedoen in hun vriendenlijst: geen sessiecode nodig."
  pl: "Gdy udostępniasz firmę, twoi znajomi z Omsi-Hub widzą przycisk Dołącz na swojej liście znajomych: kod sesji nie jest potrzebny."
  es: "Mientras compartes la empresa, tus amigos de Omsi-Hub ven un botón Unirse en su lista de amigos: no hace falta código de sesión."
  ru: "Пока вы делитесь компанией, ваши друзья в Omsi-Hub видят кнопку «Присоединиться» в своём списке друзей: код сессии не нужен."
  uk: "Поки ви ділитеся компанією, ваші друзі в Omsi-Hub бачать кнопку «Приєднатися» у своєму списку друзів: код сесії не потрібен."
"Off: friends join when you invite them from your friends list, or with the session code.":
  de: "Aus: Freunde treten bei, wenn du sie aus deiner Freundesliste einlädst, oder mit dem Sitzungscode."
  fr: "Désactivé : les amis rejoignent quand tu les invites depuis ta liste d'amis, ou avec le code de session."
  nl: "Uit: vrienden doen mee als je ze uitnodigt vanuit je vriendenlijst, of met de sessiecode."
  pl: "Wyłączone: znajomi dołączają, gdy zaprosisz ich ze swojej listy znajomych, albo z kodem sesji."
  es: "Desactivado: los amigos se unen cuando los invitas desde tu lista de amigos o con el código de sesión."
  ru: "Выкл.: друзья присоединяются, когда вы приглашаете их из своего списка друзей, или по коду сессии."
  uk: "Вимк.: друзі приєднуються, коли ви запрошуєте їх зі свого списку друзів, або за кодом сесії."
"Session code":
  nl: "Sessiecode"
  de: "Sitzungscode"
  fr: "Code de session"
  ru: "Код сессии"
  uk: "Код сесії"
  pl: "Kod sesji"
  es: "Código de sesión"
# Driving together (2026-10-20): the duties of players at the same time, driven in the company's
# world (`world.rs`) - or alone, the player's choice.
"Drive alone":
  nl: "Solo rijden"
  de: "Allein fahren"
  fr: "Conduire seul"
  pl: "Jedź sam"
  es: "Conducir solo"
  ru: "Ехать одному"
  uk: "Їхати самому"
"Drive together":
  nl: "Samen rijden"
  de: "Zusammen fahren"
  fr: "Conduire ensemble"
  pl: "Jedźcie razem"
  es: "Conducir juntos"
  ru: "Ехать вместе"
  uk: "Їхати разом"
"Single player: the duty in a game of your own, at your own pace.":
  nl: "Singleplayer: de dienst in een eigen spel, in je eigen tempo."
  de: "Einzelspieler: der Dienst in einem eigenen Spiel, in deinem eigenen Tempo."
  fr: "Solo : le service dans votre propre partie, à votre rythme."
  pl: "Jeden gracz: służba we własnej grze, we własnym tempie."
  es: "Un jugador: el servicio en una partida propia, a tu ritmo."
  ru: "Одиночная игра: смена в вашей собственной игре, в вашем темпе."
  uk: "Одиночна гра: зміна у вашій власній грі, у вашому темпі."
"In the company's world, with the players whose duties run at the same time: bound to your duty's times.":
  nl: "In de wereld van het bedrijf, met de spelers wier diensten tegelijk lopen: gebonden aan de tijden van je dienst."
  de: "In der Welt des Betriebs, mit den Spielern, deren Dienste zur selben Zeit laufen: an die Zeiten deines Dienstes gebunden."
  fr: "Dans le monde de l'entreprise, avec les joueurs dont les services ont lieu en même temps : lié aux horaires de votre service."
  pl: "W świecie firmy, z graczami, których służby trwają w tym samym czasie: związany z godzinami twojej służby."
  es: "En el mundo de la empresa, con los jugadores cuyos servicios transcurren a la vez: sujeto a los horarios de tu servicio."
  ru: "В мире компании, с игроками, чьи смены идут в то же время: по времени вашей смены."
  uk: "У світі компанії, з гравцями, чиї зміни йдуть у той самий час: за часом вашої зміни."
"At the same time: %{names}":
  nl: "Tegelijk: %{names}"
  de: "Zur selben Zeit: %{names}"
  fr: "En même temps : %{names}"
  pl: "W tym samym czasie: %{names}"
  es: "A la vez: %{names}"
  ru: "В то же время: %{names}"
  uk: "У той самий час: %{names}"
"%{name} is opening the company's world…":
  nl: "%{name} opent de wereld van het bedrijf…"
  de: "%{name} öffnet die Welt des Betriebs…"
  fr: "%{name} ouvre le monde de l'entreprise…"
  pl: "%{name} otwiera świat firmy…"
  es: "%{name} está abriendo el mundo de la empresa…"
  ru: "%{name} открывает мир компании…"
  uk: "%{name} відкриває світ компанії…"
"The company's world is open (%{name}), its clock at %{time}: %{drivers} drive in it.":
  nl: "De wereld van het bedrijf is open (%{name}), de klok staat op %{time}: %{drivers} rijden erin."
  de: "Die Welt des Betriebs ist offen (%{name}), ihre Uhr steht auf %{time}: %{drivers} fahren darin."
  fr: "Le monde de l'entreprise est ouvert (%{name}), son horloge à %{time} : %{drivers} y conduisent."
  pl: "Świat firmy jest otwarty (%{name}), jego zegar wskazuje %{time}: jeżdżą w nim %{drivers}."
  es: "El mundo de la empresa está abierto (%{name}), con su reloj a las %{time}: %{drivers} conducen en él."
  ru: "Мир компании открыт (%{name}), его часы показывают %{time}: в нём ездят %{drivers}."
  uk: "Світ компанії відкритий (%{name}), його годинник показує %{time}: у ньому їздять %{drivers}."
"%{name} is opening the company's world: try again in a moment.":
  nl: "%{name} opent de wereld van het bedrijf: probeer het zo nog eens."
  de: "%{name} öffnet die Welt des Betriebs: versuche es gleich noch einmal."
  fr: "%{name} ouvre le monde de l'entreprise : réessayez dans un instant."
  pl: "%{name} otwiera świat firmy: spróbuj ponownie za chwilę."
  es: "%{name} está abriendo el mundo de la empresa: inténtalo de nuevo en un momento."
  ru: "%{name} открывает мир компании: попробуйте ещё раз через минуту."
  uk: "%{name} відкриває світ компанії: спробуйте ще раз за хвилину."
"The company's world is at %{now}: you can join it for this duty from %{from}.":
  nl: "De wereld van het bedrijf staat op %{now}: voor deze dienst kun je vanaf %{from} aansluiten."
  de: "Die Welt des Betriebs steht auf %{now}: für diesen Dienst kannst du ab %{from} beitreten."
  fr: "Le monde de l'entreprise est à %{now} : pour ce service, vous pouvez le rejoindre à partir de %{from}."
  pl: "Świat firmy wskazuje %{now}: do tej służby możesz dołączyć od %{from}."
  es: "El mundo de la empresa va por las %{now}: puedes unirte para este servicio a partir de las %{from}."
  ru: "В мире компании %{now}: на эту смену можно присоединиться с %{from}."
  uk: "У світі компанії %{now}: на цю зміну можна приєднатися з %{from}."
"The company's world is at %{now}, past this duty's start (%{start}): drive it on your own.":
  nl: "De wereld van het bedrijf staat op %{now}, na het begin van deze dienst (%{start}): rijd hem solo."
  de: "Die Welt des Betriebs steht auf %{now}, nach dem Beginn dieses Dienstes (%{start}): fahre ihn allein."
  fr: "Le monde de l'entreprise est à %{now}, après le début de ce service (%{start}) : conduisez-le seul."
  pl: "Świat firmy wskazuje %{now}, po początku tej służby (%{start}): jedź ją sam."
  es: "El mundo de la empresa va por las %{now}, pasado el inicio de este servicio (%{start}): condúcelo por tu cuenta."
  ru: "В мире компании %{now}, смена уже началась (%{start}): выполните её один."
  uk: "У світі компанії %{now}, зміна вже почалася (%{start}): виконайте її самі."
"The company's world drives %{date}: drive this duty on your own.":
  nl: "De wereld van het bedrijf rijdt %{date}: rijd deze dienst solo."
  de: "Die Welt des Betriebs fährt den %{date}: fahre diesen Dienst allein."
  fr: "Le monde de l'entreprise roule le %{date} : conduisez ce service seul."
  pl: "Świat firmy jeździ dnia %{date}: jedź tę służbę sam."
  es: "El mundo de la empresa circula el %{date}: conduce este servicio por tu cuenta."
  ru: "Мир компании идёт по дню %{date}: выполните эту смену один."
  uk: "Світ компанії йде за днем %{date}: виконайте цю зміну самі."
"Only the player who opened the company's world can say its code.":
  nl: "Alleen de speler die de wereld van het bedrijf opende, kan de code ervan doorgeven."
  de: "Nur der Spieler, der die Welt des Betriebs geöffnet hat, kann ihren Code nennen."
  fr: "Seul le joueur qui a ouvert le monde de l'entreprise peut en donner le code."
  pl: "Tylko gracz, który otworzył świat firmy, może podać jego kod."
  es: "Solo el jugador que abrió el mundo de la empresa puede dar su código."
  ru: "Только игрок, открывший мир компании, может сообщить его код."
  uk: "Лише гравець, який відкрив світ компанії, може повідомити його код."
"%{name} opened the company's world: drive along from your duty's start.":
  nl: "%{name} heeft de wereld van het bedrijf geopend: rij mee vanaf het begin van je dienst."
  de: "%{name} hat die Welt des Betriebs geöffnet: fahr ab dem Beginn deines Dienstes mit."
  fr: "%{name} a ouvert le monde de l'entreprise : rejoignez-le dès le début de votre service."
  pl: "%{name} otworzył świat firmy: dołącz od początku swojej służby."
  es: "%{name} ha abierto el mundo de la empresa: únete desde el inicio de tu servicio."
  ru: "%{name} открыл мир компании: присоединяйтесь с начала своей смены."
  uk: "%{name} відкрив світ компанії: приєднуйтеся з початку своєї зміни."
"%{name} drives along in the company's world.":
  nl: "%{name} rijdt mee in de wereld van het bedrijf."
  de: "%{name} fährt in der Welt des Betriebs mit."
  fr: "%{name} conduit dans le monde de l'entreprise."
  pl: "%{name} jeździ razem w świecie firmy."
  es: "%{name} conduce en el mundo de la empresa."
  ru: "%{name} ездит вместе в мире компании."
  uk: "%{name} їздить разом у світі компанії."
"The company's world closed: %{name}'s game ended.":
  nl: "De wereld van het bedrijf is gesloten: het spel van %{name} is gestopt."
  de: "Die Welt des Betriebs ist geschlossen: das Spiel von %{name} ist beendet."
  fr: "Le monde de l'entreprise est fermé : la partie de %{name} est terminée."
  pl: "Świat firmy został zamknięty: gra gracza %{name} się zakończyła."
  es: "El mundo de la empresa se ha cerrado: la partida de %{name} ha terminado."
  ru: "Мир компании закрыт: игра %{name} завершилась."
  uk: "Світ компанії закрито: гра %{name} завершилася."
"Share the company first: driving together needs its session.":
  nl: "Deel eerst het bedrijf: samen rijden heeft de sessie ervan nodig."
  de: "Teile zuerst den Betrieb: zusammen fahren braucht seine Sitzung."
  fr: "Partagez d'abord l'entreprise : conduire ensemble a besoin de sa session."
  pl: "Najpierw udostępnij firmę: wspólna jazda potrzebuje jej sesji."
  es: "Primero comparte la empresa: conducir juntos necesita su sesión."
  ru: "Сначала откройте доступ к компании: для совместной езды нужна её сессия."
  uk: "Спершу відкрийте доступ до компанії: для спільної їзди потрібна її сесія."
"Together: in the company's world, on its clock. You can join it from %{early} min before your duty's start until %{late} min after it; the world closes with the game of whoever opened it.":
  nl: "Samen: in de wereld van het bedrijf, op de klok ervan. Je kunt aansluiten van %{early} min voor het begin van je dienst tot %{late} min erna; de wereld sluit met het spel van wie hem opende."
  de: "Zusammen: in der Welt des Betriebs, nach ihrer Uhr. Du kannst ab %{early} Min. vor dem Beginn deines Dienstes bis %{late} Min. danach beitreten; die Welt schließt mit dem Spiel dessen, der sie geöffnet hat."
  fr: "Ensemble : dans le monde de l'entreprise, à son horloge. Vous pouvez le rejoindre de %{early} min avant le début de votre service jusqu'à %{late} min après ; le monde se ferme avec la partie de celui qui l'a ouvert."
  pl: "Razem: w świecie firmy, według jego zegara. Możesz dołączyć od %{early} min przed początkiem służby do %{late} min po nim; świat zamyka się wraz z grą tego, kto go otworzył."
  es: "Juntos: en el mundo de la empresa, con su reloj. Puedes unirte desde %{early} min antes del inicio de tu servicio hasta %{late} min después; el mundo se cierra con la partida de quien lo abrió."
  ru: "Вместе: в мире компании, по его часам. Присоединиться можно за %{early} мин до начала смены и до %{late} мин после него; мир закрывается вместе с игрой того, кто его открыл."
  uk: "Разом: у світі компанії, за його годинником. Приєднатися можна за %{early} хв до початку зміни і до %{late} хв після нього; світ закривається разом із грою того, хто його відкрив."
"Not together yet":
  nl: "Nog niet samen"
  de: "Noch nicht zusammen"
  fr: "Pas encore ensemble"
  pl: "Jeszcze nie razem"
  es: "Aún no estáis juntos"
  ru: "Пока не вместе"
  uk: "Поки не разом"
"Wait a moment, or drive the duty alone.":
  nl: "Wacht even, of rijd de dienst solo."
  de: "Warte einen Moment, oder fahre den Dienst allein."
  fr: "Attendez un instant, ou conduisez le service seul."
  pl: "Poczekaj chwilę albo jedź służbę sam."
  es: "Espera un momento o conduce el servicio solo."
  ru: "Подождите немного или выполните смену один."
  uk: "Зачекайте трохи або виконайте зміну самі."
"Open: %{name} drives it unless a player takes it":
  nl: "Open: %{name} rijdt hem, tenzij een speler hem neemt"
  de: "Offen: %{name} fährt ihn, es sei denn, ein Spieler übernimmt ihn"
  fr: "Ouvert : %{name} le conduit, sauf si un joueur le prend"
  pl: "Otwarta: jeździ ją %{name}, chyba że weźmie ją gracz"
  es: "Abierto: lo conduce %{name}, salvo que lo coja un jugador"
  ru: "Открыта: её выполняет %{name}, если её не возьмёт игрок"
  uk: "Відкрита: її виконує %{name}, якщо її не візьме гравець"
"The company's world is at %{now}: no trip of this duty is left to drive in it.":
  nl: "De wereld van het bedrijf staat op %{now}: van deze dienst is geen rit meer over om erin te rijden."
  de: "Die Welt des Betriebs steht auf %{now}: von diesem Dienst ist keine Fahrt mehr übrig, um sie darin zu fahren."
  fr: "Le monde de l'entreprise est à %{now} : il ne reste aucune course de ce service à y conduire."
  pl: "Świat firmy wskazuje %{now}: z tej służby nie został żaden kurs do przejechania w nim."
  es: "El mundo de la empresa va por las %{now}: no queda ningún viaje de este servicio que conducir en él."
  ru: "В мире компании %{now}: в этой смене не осталось рейсов, чтобы выполнить их в нём."
  uk: "У світі компанії %{now}: у цій зміні не лишилося рейсів, щоб виконати їх у ньому."
"%{name} drives along in the company's world from %{time}: the AI drove the trips of his duty before.":
  nl: "%{name} rijdt vanaf %{time} mee in de wereld van het bedrijf: de AI reed de ritten van zijn dienst daarvoor."
  de: "%{name} fährt ab %{time} in der Welt des Betriebs mit: die KI fuhr die Fahrten seines Dienstes davor."
  fr: "%{name} conduit dans le monde de l'entreprise à partir de %{time} : l'IA a conduit les courses de son service avant."
  pl: "%{name} jeździ razem w świecie firmy od %{time}: wcześniejsze kursy jego służby przejechała SI."
  es: "%{name} conduce en el mundo de la empresa desde las %{time}: la IA condujo antes los viajes de su servicio."
  ru: "%{name} ездит вместе в мире компании с %{time}: предыдущие рейсы его смены выполнил ИИ."
  uk: "%{name} їздить разом у світі компанії з %{time}: попередні рейси його зміни виконав ШІ."
