"Start a session":
  de: "Sitzung starten"
  fr: "Lancer une session"
  nl: "Sessie starten"
  pl: "Rozpocznij sesję"
  es: "Iniciar una sesión"
  ru: "Начать сессию"
  uk: "Почати сесію"
"Friends join your company with a session code and drive duties of its day for it, in your world. Money, planning and staff stay yours: their trips are booked as your drivers' are.":
  de: "Freunde treten deinem Betrieb mit einem Sitzungscode bei und fahren Dienste seines Tages für ihn, in deiner Welt. Geld, Planung und Personal bleiben deine Sache: ihre Fahrten werden gebucht wie die deiner Fahrer."
  fr: "Vos amis rejoignent votre entreprise avec un code de session et conduisent pour elle des services de sa journée, dans votre monde. L'argent, la planification et le personnel restent à vous : leurs trajets sont comptabilisés comme ceux de vos conducteurs."
  nl: "Vrienden doen met een sessiecode mee met je bedrijf en rijden diensten van zijn dag ervoor, in jouw wereld. Geld, planning en personeel blijven van jou: hun ritten worden geboekt zoals die van je chauffeurs."
  pl: "Znajomi dołączają do twojej firmy kodem sesji i jeżdżą dla niej służby z jej dnia, w twoim świecie. Pieniądze, planowanie i personel zostają twoje: ich kursy są księgowane jak kursy twoich kierowców."
  es: "Tus amigos se unen a tu empresa con un código de sesión y conducen servicios de su jornada para ella, en tu mundo. El dinero, la planificación y el personal siguen siendo tuyos: sus viajes se contabilizan como los de tus conductores."
  ru: "Друзья присоединяются к вашей компании по коду сессии и выполняют для неё смены её дня в вашем мире. Деньги, планирование и персонал остаются за вами: их рейсы учитываются, как рейсы ваших водителей."
  uk: "Друзі приєднуються до вашої компанії за кодом сесії й виконують для неї зміни її дня у вашому світі. Гроші, планування й персонал залишаються за вами: їхні рейси обліковуються, як рейси ваших водіїв."
"Start a session: you get a code to send your friends.":
  de: "Starte eine Sitzung: du bekommst einen Code für deine Freunde."
  fr: "Lancez une session : vous obtenez un code à envoyer à vos amis."
  nl: "Start een sessie: je krijgt een code om naar je vrienden te sturen."
  pl: "Rozpocznij sesję: dostaniesz kod do wysłania znajomym."
  es: "Inicia una sesión: recibirás un código para enviar a tus amigos."
  ru: "Начните сессию: вы получите код, который нужно отправить друзьям."
  uk: "Почніть сесію: ви отримаєте код, який треба надіслати друзям."
"They choose \"Join a company\" in Omsi-Hub and paste it.":
  de: "Sie wählen in Omsi-Hub „Einem Betrieb beitreten“ und fügen ihn ein."
  fr: "Ils choisissent « Rejoindre une entreprise » dans Omsi-Hub et le collent."
  nl: "Zij kiezen in Omsi-Hub \"Meedoen met een bedrijf\" en plakken hem."
  pl: "Wybierają w Omsi-Hub „Dołącz do firmy” i wklejają go."
  es: "Ellos eligen «Unirse a una empresa» en Omsi-Hub y lo pegan."
  ru: "Они выбирают в Omsi-Hub «Присоединиться к компании» и вставляют его."
  uk: "Вони обирають в Omsi-Hub «Приєднатися до компанії» і вставляють його."
"They take open duties (or you give them one in RosterFlow's Roster), and drive them in your world: open it here, or drive a duty of your own.":
  de: "Sie übernehmen offene Dienste (oder du gibst ihnen einen im Dienstplan von RosterFlow) und fahren sie in deiner Welt: öffne sie hier oder fahre selbst einen Dienst."
  fr: "Ils prennent des services à pourvoir (ou vous leur en donnez un dans le Roster de RosterFlow) et les conduisent dans votre monde : ouvrez-le ici, ou conduisez vous-même un service."
  nl: "Zij nemen open diensten (of jij geeft ze er een in het Rooster van RosterFlow) en rijden ze in jouw wereld: open die hier, of rijd zelf een dienst."
  pl: "Biorą otwarte służby (albo dajesz im jedną w grafiku RosterFlow) i jeżdżą je w twoim świecie: otwórz go tutaj albo sam jedź jakąś służbę."
  es: "Toman servicios libres (o tú les das uno en el Cuadrante de RosterFlow) y los conducen en tu mundo: ábrelo aquí o conduce tú mismo un servicio."
  ru: "Они берут открытые смены (или вы даёте им смену в графике RosterFlow) и выполняют их в вашем мире: откройте его здесь или сами выполняйте смену."
  uk: "Вони беруть відкриті зміни (або ви даєте їм зміну в графіку RosterFlow) і виконують їх у вашому світі: відкрийте його тут або самі виконуйте зміну."
