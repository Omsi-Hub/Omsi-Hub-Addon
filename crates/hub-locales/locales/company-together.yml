"Your game drives %{duty} in the boss's world: its trips go to the company as they end.":
  de: "Dein Spiel fährt %{duty} in der Welt des Chefs: die Fahrten gehen an den Betrieb, sobald sie enden."
  fr: "Votre jeu conduit %{duty} dans le monde du patron : ses trajets vont à l'entreprise dès qu'ils se terminent."
  nl: "Je spel rijdt %{duty} in de wereld van de baas: de ritten gaan naar het bedrijf zodra ze klaar zijn."
  pl: "Twoja gra jedzie %{duty} w świecie szefa: kursy trafiają do firmy, gdy się kończą."
  es: "Tu juego conduce %{duty} en el mundo del jefe: sus viajes pasan a la empresa a medida que terminan."
  ru: "Ваша игра выполняет %{duty} в мире босса: рейсы передаются компании по мере их завершения."
  uk: "Ваша гра виконує %{duty} у світі боса: рейси передаються компанії, щойно завершуються."
"Boss: %{name}  ·  %{map}":
  de: "Chef: %{name}  ·  %{map}"
  fr: "Patron : %{name}  ·  %{map}"
  nl: "Baas: %{name}  ·  %{map}"
  pl: "Szef: %{name}  ·  %{map}"
  es: "Jefe: %{name}  ·  %{map}"
  ru: "Босс: %{name}  ·  %{map}"
  uk: "Бос: %{name}  ·  %{map}"
"The boss's world is open: you can drive your duties.":
  de: "Die Welt des Chefs ist offen: du kannst deine Dienste fahren."
  fr: "Le monde du patron est ouvert : vous pouvez conduire vos services."
  nl: "De wereld van de baas is open: je kunt je diensten rijden."
  pl: "Świat szefa jest otwarty: możesz jeździć swoje służby."
  es: "El mundo del jefe está abierto: puedes conducir tus servicios."
  ru: "Мир босса открыт: вы можете выполнять свои смены."
  uk: "Світ боса відкритий: ви можете виконувати свої зміни."
"The boss's world isn't open yet: Drive works once his game runs the company's map.":
  de: "Die Welt des Chefs ist noch nicht offen: Fahren geht, sobald sein Spiel die Karte des Betriebs geladen hat."
  fr: "Le monde du patron n'est pas encore ouvert : Conduire fonctionnera quand son jeu tournera sur la carte de l'entreprise."
  nl: "De wereld van de baas is nog niet open: Rijden werkt zodra zijn spel de kaart van het bedrijf draait."
  pl: "Świat szefa nie jest jeszcze otwarty: Jedź zadziała, gdy jego gra uruchomi mapę firmy."
  es: "El mundo del jefe aún no está abierto: Conducir funcionará cuando su juego tenga cargado el mapa de la empresa."
  ru: "Мир босса ещё не открыт: «Поехать» заработает, когда его игра запустит карту компании."
  uk: "Світ боса ще не відкритий: «Їхати» запрацює, коли його гра запустить мапу компанії."
"Take an open duty: it is yours at once.":
  de: "Übernimm einen offenen Dienst: er gehört sofort dir."
  fr: "Prenez un service à pourvoir : il est à vous tout de suite."
  nl: "Neem een open dienst: hij is meteen van jou."
  pl: "Weź otwartą służbę: od razu jest twoja."
  es: "Toma un servicio libre: es tuyo al instante."
  ru: "Возьмите открытую смену: она сразу ваша."
  uk: "Візьміть відкриту зміну: вона одразу ваша."
"The boss decides: ask for an open duty, and he says yes or no.":
  de: "Der Chef entscheidet: bitte um einen offenen Dienst, und er sagt ja oder nein."
  fr: "Le patron décide : demandez un service à pourvoir, et il dit oui ou non."
  nl: "De baas beslist: vraag om een open dienst, en hij zegt ja of nee."
  pl: "Szef decyduje: poproś o otwartą służbę, a on powie tak lub nie."
  es: "Decide el jefe: pide un servicio libre y él dice sí o no."
  ru: "Решает босс: попросите открытую смену, и он ответит да или нет."
  uk: "Вирішує бос: попросіть відкриту зміну, і він відповість так чи ні."
"Drove duty %{k} of line %{n} for %{company}":
  de: "Dienst %{k} der Linie %{n} für %{company} gefahren"
  fr: "Service %{k} de la ligne %{n} conduit pour %{company}"
  nl: "Dienst %{k} van lijn %{n} gereden voor %{company}"
  pl: "Przejechana służba %{k} linii %{n} dla %{company}"
  es: "Servicio %{k} de la línea %{n} conducido para %{company}"
  ru: "Выполнена смена %{k} линии %{n} для %{company}"
  uk: "Виконано зміну %{k} лінії %{n} для %{company}"
"%{trips} trips · score %{score} · +%{xp} XP":
  de: "%{trips} Fahrten · Wertung %{score} · +%{xp} EP"
  fr: "%{trips} trajets · note %{score} · +%{xp} XP"
