  fr: "Recherche du lanceur du patron…"
  nl: "Launcher van de baas zoeken…"
  pl: "Szukam launchera szefa…"
  es: "Buscando el lanzador del jefe…"
  ru: "Ищем лаунчер босса…"
  uk: "Шукаємо лаунчер боса…"
"A game is running: close it, then drive the duty.":
  de: "Ein Spiel läuft: schließe es, dann fahre den Dienst."
  fr: "Un jeu est en cours : fermez-le, puis conduisez le service."
  nl: "Er loopt een spel: sluit het en rijd dan de dienst."
  pl: "Gra jest uruchomiona: zamknij ją, a potem jedź służbę."
  es: "Hay una partida en marcha: ciérrala y luego conduce el servicio."
  ru: "Игра запущена: закройте её, затем выполняйте смену."
  uk: "Гра запущена: закрийте її, потім виконуйте зміну."
"The duty's bus is not installed on this computer: %{bus}. Install it, or ask the boss to give the tour another bus.":
  de: "Der Bus des Dienstes ist auf diesem Computer nicht installiert: %{bus}. Installiere ihn, oder bitte den Chef, dem Umlauf einen anderen Bus zu geben."
  fr: "Le bus du service n'est pas installé sur cet ordinateur : %{bus}. Installez-le, ou demandez au patron de donner un autre bus à la tournée."
  nl: "De bus van de dienst is niet geïnstalleerd op deze computer: %{bus}. Installeer hem, of vraag de baas de omloop een andere bus te geven."
  pl: "Autobus tej służby nie jest zainstalowany na tym komputerze: %{bus}. Zainstaluj go albo poproś szefa o inny autobus dla brygady."
  es: "El autobús del servicio no está instalado en este ordenador: %{bus}. Instálalo o pide al jefe que asigne otro autobús al recorrido."
  ru: "Автобус этой смены не установлен на этом компьютере: %{bus}. Установите его или попросите босса дать выходу другой автобус."
  uk: "Автобус цієї зміни не встановлено на цьому комп'ютері: %{bus}. Встановіть його або попросіть боса дати обороту інший автобус."
