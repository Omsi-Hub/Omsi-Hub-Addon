"The planning no longer has this duty.":
  de: "Die Planung hat diesen Dienst nicht mehr."
  fr: "La planification n'a plus ce service."
  nl: "De planning heeft deze dienst niet meer."
  pl: "Planowanie nie ma już tej służby."
  es: "La planificación ya no tiene este servicio."
  ru: "В планировании этой смены больше нет."
  uk: "У плануванні цієї зміни більше немає."
"Only duties of the company's day can be taken.":
  de: "Nur Dienste des Betriebstages können übernommen werden."
  fr: "Seuls les services de la journée de l'entreprise peuvent être pris."
  nl: "Alleen diensten van de dag van het bedrijf kunnen worden genomen."
  pl: "Można brać tylko służby z dnia firmy."
  es: "Solo se pueden tomar servicios de la jornada de la empresa."
  ru: "Брать можно только смены текущего дня компании."
  uk: "Брати можна лише зміни поточного дня компанії."
"Somebody drives this duty already.":
  de: "Diesen Dienst fährt schon jemand."
  fr: "Quelqu'un conduit déjà ce service."
  nl: "Iemand rijdt deze dienst al."
  pl: "Ktoś już jeździ tę służbę."
  es: "Alguien ya conduce este servicio."
  ru: "Эту смену уже кто-то выполняет."
  uk: "Цю зміну вже хтось виконує."
"This duty has no bus of the fleet yet: the boss gives its tour one first.":
  de: "Dieser Dienst hat noch keinen Bus der Flotte: der Chef gibt seinem Umlauf zuerst einen."
  fr: "Ce service n'a pas encore de bus de la flotte : le patron en donne d'abord un à sa tournée."
  nl: "Deze dienst heeft nog geen bus van de vloot: de baas geeft zijn omloop er eerst een."
  pl: "Ta służba nie ma jeszcze autobusu floty: najpierw szef musi dać go brygadzie."
  es: "Este servicio aún no tiene autobús de la flota: primero el jefe debe asignar uno a su recorrido."
  ru: "У этой смены ещё нет автобуса парка: сначала босс даёт его выходу."
  uk: "Ця зміна ще не має автобуса парку: спершу бос дає його обороту."
"This duty has begun already.":
  de: "Dieser Dienst hat schon begonnen."
  fr: "Ce service a déjà commencé."
  nl: "Deze dienst is al begonnen."
  pl: "Ta służba już się zaczęła."
  es: "Este servicio ya ha empezado."
  ru: "Эта смена уже началась."
  uk: "Ця зміна вже почалася."
"This duty was driven already.":
  de: "Dieser Dienst wurde schon gefahren."
  fr: "Ce service a déjà été conduit."
  nl: "Deze dienst is al gereden."
  pl: "Ta służba została już przejechana."
  es: "Este servicio ya se ha conducido."
  ru: "Эта смена уже выполнена."
  uk: "Цю зміну вже виконано."
"This duty is not yours.":
  de: "Dieser Dienst gehört nicht dir."
  fr: "Ce service n'est pas le vôtre."
  nl: "Deze dienst is niet van jou."
  pl: "To nie jest twoja służba."
  es: "Este servicio no es tuyo."
  ru: "Это не ваша смена."
  uk: "Це не ваша зміна."
"You have another duty at that time.":
  de: "Du hast zu dieser Zeit einen anderen Dienst."
  fr: "Vous avez un autre service à ce moment-là."
  nl: "Je hebt op dat moment een andere dienst."
  pl: "Masz w tym czasie inną służbę."
  es: "Tienes otro servicio a esa hora."
  ru: "В это время у вас другая смена."
  uk: "У цей час у вас інша зміна."
"You are driving this duty: it stays yours until you have finished.":
  de: "Du fährst diesen Dienst gerade: er bleibt deiner, bis du fertig bist."
  fr: "Vous conduisez ce service : il reste le vôtre jusqu'à ce que vous ayez fini."
  nl: "Je rijdt deze dienst nu: hij blijft van jou tot je klaar bent."
  pl: "Jedziesz tę służbę: zostaje twoja, dopóki nie skończysz."
  es: "Estás conduciendo este servicio: sigue siendo tuyo hasta que termines."
  ru: "Вы выполняете эту смену: она остаётся вашей, пока вы не закончите."
  uk: "Ви виконуєте цю зміну: вона лишається вашою, доки не закінчите."
"This duty is finished: what was driven stays.":
  de: "Dieser Dienst ist beendet: was gefahren wurde, bleibt."
  fr: "Ce service est terminé : ce qui a été conduit reste."
  nl: "Deze dienst is klaar: wat gereden is, blijft."
  pl: "Ta służba jest zakończona: to, co przejechano, zostaje."
  es: "Este servicio ha terminado: lo conducido se conserva."
  ru: "Эта смена завершена: выполненное остаётся."
  uk: "Ця зміна завершена: виконане лишається."
"The company has as many players as it can take.":
  de: "Der Betrieb hat so viele Spieler, wie er aufnehmen kann."
  fr: "L'entreprise a autant de joueurs qu'elle peut en accueillir."
  nl: "Het bedrijf heeft zoveel spelers als het kan hebben."
  pl: "Firma ma już tylu graczy, ilu może przyjąć."
  es: "La empresa ya tiene todos los jugadores que admite."
  ru: "В компании уже столько игроков, сколько она может принять."
  uk: "У компанії вже стільки гравців, скільки вона може прийняти."
"The code is no longer valid: ask the boss for the code of his session.":
  de: "Der Code ist nicht mehr gültig: bitte den Chef um den Code seiner Sitzung."
  fr: "Le code n'est plus valable : demandez au patron le code de sa session."
  nl: "De code is niet meer geldig: vraag de baas om de code van zijn sessie."
  pl: "Kod jest już nieważny: poproś szefa o kod jego sesji."
  es: "El código ya no es válido: pide al jefe el código de su sesión."
  ru: "Код больше не действует: попросите у босса код его сессии."
  uk: "Код більше не дійсний: попросіть у боса код його сесії."
"The boss's world isn't open yet.":
  de: "Die Welt des Chefs ist noch nicht offen."
  fr: "Le monde du patron n'est pas encore ouvert."
  nl: "De wereld van de baas is nog niet open."
  pl: "Świat szefa nie jest jeszcze otwarty."
  es: "El mundo del jefe aún no está abierto."
  ru: "Мир босса ещё не открыт."
  uk: "Світ боса ще не відкритий."
"The boss's game runs another map: the company's world has to be open.":
  de: "Das Spiel des Chefs läuft auf einer anderen Karte: die Welt des Betriebs muss offen sein."
  fr: "Le jeu du patron tourne sur une autre carte : le monde de l'entreprise doit être ouvert."
  nl: "Het spel van de baas draait een andere kaart: de wereld van het bedrijf moet open zijn."
  pl: "Gra szefa działa na innej mapie: świat firmy musi być otwarty."
  es: "El juego del jefe tiene cargado otro mapa: el mundo de la empresa tiene que estar abierto."
  ru: "Игра босса запущена на другой карте: должен быть открыт мир компании."
  uk: "Гра боса запущена на іншій мапі: має бути відкритий світ компанії."
"The boss's launcher is still reading the day's timetable: try again in a moment.":
  de: "Der Launcher des Chefs liest noch den Fahrplan des Tages: versuche es gleich noch einmal."
  fr: "Le lanceur du patron lit encore l'horaire du jour : réessayez dans un instant."
  nl: "De launcher van de baas leest de dienstregeling van de dag nog: probeer het zo nog eens."
  pl: "Launcher szefa wciąż wczytuje rozkład dnia: spróbuj za chwilę."
  es: "El lanzador del jefe todavía está leyendo el horario del día: inténtalo de nuevo en un momento."
  ru: "Лаунчер босса ещё читает расписание дня: попробуйте чуть позже."
  uk: "Лаунчер боса ще читає розклад дня: спробуйте трохи згодом."
"The boss's launcher did not understand that: both players need the same version of Omsi-Hub.":
  de: "Der Launcher des Chefs hat das nicht verstanden: beide Spieler brauchen dieselbe Version von Omsi-Hub."
  fr: "Le lanceur du patron n'a pas compris : les deux joueurs ont besoin de la même version d'Omsi-Hub."
  nl: "De launcher van de baas begreep dat niet: beide spelers hebben dezelfde versie van Omsi-Hub nodig."
  pl: "Launcher szefa tego nie zrozumiał: obaj gracze potrzebują tej samej wersji Omsi-Hub."
  es: "El lanzador del jefe no lo ha entendido: ambos jugadores necesitan la misma versión de Omsi-Hub."
  ru: "Лаунчер босса этого не понял: обоим игрокам нужна одна и та же версия Omsi-Hub."
  uk: "Лаунчер боса цього не зрозумів: обом гравцям потрібна однакова версія Omsi-Hub."
"The boss does not have the company open right now.":
  de: "Der Chef hat den Betrieb gerade nicht geöffnet."
  fr: "Le patron n'a pas l'entreprise ouverte en ce moment."
  nl: "De baas heeft het bedrijf nu niet open."
  pl: "Szef nie ma teraz otwartej firmy."
  es: "El jefe no tiene la empresa abierta ahora mismo."
  ru: "Сейчас у босса компания не открыта."
  uk: "Зараз у боса компанія не відкрита."
"%{name} joined the company.":
  de: "%{name} ist dem Betrieb beigetreten."
  fr: "%{name} a rejoint l'entreprise."
  nl: "%{name} doet mee met het bedrijf."
  pl: "%{name} dołącza do firmy."
  es: "%{name} se ha unido a la empresa."
  ru: "%{name} присоединяется к компании."
  uk: "%{name} приєднується до компанії."
"%{name} left.":
  de: "%{name} ist gegangen."
  fr: "%{name} est parti."
  nl: "%{name} is vertrokken."
  pl: "%{name} wychodzi."
  es: "%{name} se ha ido."
  ru: "%{name} выходит."
  uk: "%{name} виходить."
"%{name} took duty %{k} of line %{n} (tour %{tour}).":
  de: "%{name} hat Dienst %{k} der Linie %{n} übernommen (Umlauf %{tour})."
  fr: "%{name} a pris le service %{k} de la ligne %{n} (tournée %{tour})."
  nl: "%{name} nam dienst %{k} van lijn %{n} (omloop %{tour})."
  pl: "%{name} bierze służbę %{k} linii %{n} (brygada %{tour})."
  es: "%{name} ha tomado el servicio %{k} de la línea %{n} (recorrido %{tour})."
  ru: "%{name} берёт смену %{k} линии %{n} (выход %{tour})."
  uk: "%{name} бере зміну %{k} лінії %{n} (оборот %{tour})."
"%{name} asks for duty %{k} of line %{n} (tour %{tour}).":
  de: "%{name} bittet um Dienst %{k} der Linie %{n} (Umlauf %{tour})."
  fr: "%{name} demande le service %{k} de la ligne %{n} (tournée %{tour})."
  nl: "%{name} vraagt om dienst %{k} van lijn %{n} (omloop %{tour})."
  pl: "%{name} prosi o służbę %{k} linii %{n} (brygada %{tour})."
  es: "%{name} pide el servicio %{k} de la línea %{n} (recorrido %{tour})."
  ru: "%{name} просит смену %{k} линии %{n} (выход %{tour})."
  uk: "%{name} просить зміну %{k} лінії %{n} (оборот %{tour})."
"%{name} has duty %{k} of line %{n} (tour %{tour}) now.":
  de: "%{name} hat jetzt Dienst %{k} der Linie %{n} (Umlauf %{tour})."
  fr: "%{name} a maintenant le service %{k} de la ligne %{n} (tournée %{tour})."
  nl: "%{name} heeft nu dienst %{k} van lijn %{n} (omloop %{tour})."
  pl: "%{name} ma teraz służbę %{k} linii %{n} (brygada %{tour})."
  es: "%{name} tiene ahora el servicio %{k} de la línea %{n} (recorrido %{tour})."
  ru: "Теперь у игрока %{name} смена %{k} линии %{n} (выход %{tour})."
  uk: "Тепер у гравця %{name} зміна %{k} лінії %{n} (оборот %{tour})."
"No: duty %{k} of line %{n} (tour %{tour}) is not %{name}'s.":
  de: "Nein: Dienst %{k} der Linie %{n} (Umlauf %{tour}) geht nicht an %{name}."
  fr: "Non : le service %{k} de la ligne %{n} (tournée %{tour}) ne revient pas à %{name}."
  nl: "Nee: dienst %{k} van lijn %{n} (omloop %{tour}) is niet voor %{name}."
  pl: "Nie: służba %{k} linii %{n} (brygada %{tour}) nie trafia do gracza %{name}."
  es: "No: el servicio %{k} de la línea %{n} (recorrido %{tour}) no es para %{name}."
  ru: "Нет: смена %{k} линии %{n} (выход %{tour}) не достаётся игроку %{name}."
  uk: "Ні: зміна %{k} лінії %{n} (оборот %{tour}) не дістається гравцю %{name}."
"%{name} gave back duty %{k} of line %{n} (tour %{tour}).":
  de: "%{name} hat Dienst %{k} der Linie %{n} zurückgegeben (Umlauf %{tour})."
  fr: "%{name} a rendu le service %{k} de la ligne %{n} (tournée %{tour})."
  nl: "%{name} gaf dienst %{k} van lijn %{n} terug (omloop %{tour})."
  pl: "%{name} oddaje służbę %{k} linii %{n} (brygada %{tour})."
  es: "%{name} ha devuelto el servicio %{k} de la línea %{n} (recorrido %{tour})."
  ru: "%{name} возвращает смену %{k} линии %{n} (выход %{tour})."
  uk: "%{name} повертає зміну %{k} лінії %{n} (оборот %{tour})."
"%{name} is off duty %{k} of line %{n} (tour %{tour}).":
  de: "%{name} ist von Dienst %{k} der Linie %{n} abgezogen (Umlauf %{tour})."
  fr: "%{name} est retiré du service %{k} de la ligne %{n} (tournée %{tour})."
  nl: "%{name} is van dienst %{k} van lijn %{n} gehaald (omloop %{tour})."
  pl: "%{name} zdjęty ze służby %{k} linii %{n} (brygada %{tour})."
  es: "%{name} ha sido retirado del servicio %{k} de la línea %{n} (recorrido %{tour})."
  ru: "%{name} снят со смены %{k} линии %{n} (выход %{tour})."
  uk: "%{name} знятий зі зміни %{k} лінії %{n} (оборот %{tour})."
"%{name} wants to drive duty %{k} of line %{n}: the boss's world isn't open yet.":
  de: "%{name} will Dienst %{k} der Linie %{n} fahren: die Welt des Chefs ist noch nicht offen."
  fr: "%{name} veut conduire le service %{k} de la ligne %{n} : le monde du patron n'est pas encore ouvert."
  nl: "%{name} wil dienst %{k} van lijn %{n} rijden: de wereld van de baas is nog niet open."
  pl: "%{name} chce jechać służbę %{k} linii %{n}: świat szefa nie jest jeszcze otwarty."
  es: "%{name} quiere conducir el servicio %{k} de la línea %{n}: el mundo del jefe aún no está abierto."
  ru: "%{name} хочет выполнить смену %{k} линии %{n}: мир босса ещё не открыт."
  uk: "%{name} хоче виконати зміну %{k} лінії %{n}: світ боса ще не відкритий."
"%{name} drives duty %{k} of line %{n} (tour %{tour}).":
  de: "%{name} fährt Dienst %{k} der Linie %{n} (Umlauf %{tour})."
  fr: "%{name} conduit le service %{k} de la ligne %{n} (tournée %{tour})."
  nl: "%{name} rijdt dienst %{k} van lijn %{n} (omloop %{tour})."
  pl: "%{name} jedzie służbę %{k} linii %{n} (brygada %{tour})."
  es: "%{name} conduce el servicio %{k} de la línea %{n} (recorrido %{tour})."
  ru: "%{name} выполняет смену %{k} линии %{n} (выход %{tour})."
  uk: "%{name} виконує зміну %{k} лінії %{n} (оборот %{tour})."
"%{name} finished duty %{k} of line %{n}: %{trips} trips, score %{score}.":
  de: "%{name} hat Dienst %{k} der Linie %{n} beendet: %{trips} Fahrten, Wertung %{score}."
  fr: "%{name} a terminé le service %{k} de la ligne %{n} : %{trips} trajets, note %{score}."
  nl: "%{name} heeft dienst %{k} van lijn %{n} gereden: %{trips} ritten, score %{score}."
  pl: "%{name} kończy służbę %{k} linii %{n}: %{trips} kursów, wynik %{score}."
  es: "%{name} ha terminado el servicio %{k} de la línea %{n}: %{trips} viajes, puntuación %{score}."
  ru: "%{name} завершает смену %{k} линии %{n}: рейсов %{trips}, оценка %{score}."
  uk: "%{name} завершує зміну %{k} лінії %{n}: рейсів %{trips}, оцінка %{score}."
"%{name}: %{text}":
  de: "%{name}: %{text}"
  fr: "%{name} : %{text}"
  nl: "%{name}: %{text}"
  pl: "%{name}: %{text}"
  es: "%{name}: %{text}"
  ru: "%{name}: %{text}"
  uk: "%{name}: %{text}"
"The boss's world is open: duties can be driven.":
  de: "Die Welt des Chefs ist offen: Dienste können gefahren werden."
  fr: "Le monde du patron est ouvert : les services peuvent être conduits."
  nl: "De wereld van de baas is open: diensten kunnen worden gereden."
  pl: "Świat szefa jest otwarty: można jeździć służby."
  es: "El mundo del jefe está abierto: ya se pueden conducir servicios."
  ru: "Мир босса открыт: смены можно выполнять."
  uk: "Світ боса відкритий: зміни можна виконувати."
"This is not a company code. Ask the boss for the code of his company (HUB-…).":
  de: "Das ist kein Betriebscode. Bitte den Chef um den Code seines Betriebs (HUB-…)."
  fr: "Ce n'est pas un code d'entreprise. Demandez au patron le code de son entreprise (HUB-…)."
  nl: "Dit is geen bedrijfscode. Vraag de baas om de code van zijn bedrijf (HUB-…)."
  pl: "To nie jest kod firmy. Poproś szefa o kod jego firmy (HUB-…)."
  es: "Esto no es un código de empresa. Pide al jefe el código de su empresa (HUB-…)."
  ru: "Это не код компании. Попросите у босса код его компании (HUB-…)."
  uk: "Це не код компанії. Попросіть у боса код його компанії (HUB-…)."
"This is the code of a game session. Ask the boss for the code of his company (HUB-…): it is in his \"Play together\" panel.":
  de: "Das ist der Code einer Spielsitzung. Bitte den Chef um den Code seines Betriebs (HUB-…): er steht in seinem Fenster „Zusammen spielen“."
  fr: "C'est le code d'une session de jeu. Demandez au patron le code de son entreprise (HUB-…) : il se trouve dans son panneau « Jouer ensemble »."
  nl: "Dit is de code van een spelsessie. Vraag de baas om de code van zijn bedrijf (HUB-…): die staat in zijn venster \"Samen spelen\"."
  pl: "To kod sesji gry. Poproś szefa o kod jego firmy (HUB-…): jest w jego panelu „Wspólna gra”."
  es: "Este es el código de una sesión de juego. Pide al jefe el código de su empresa (HUB-…): está en su panel «Jugar juntos»."
  ru: "Это код игровой сессии. Попросите у босса код его компании (HUB-…): он в его панели «Играть вместе»."
  uk: "Це код ігрової сесії. Попросіть у боса код його компанії (HUB-…): він у його панелі «Грати разом»."
"The company code has a typo: copy the whole code again.":
  de: "Der Betriebscode hat einen Tippfehler: kopiere den ganzen Code noch einmal."
  fr: "Le code d'entreprise contient une faute de frappe : copiez de nouveau le code entier."
  nl: "De bedrijfscode bevat een tikfout: kopieer de hele code opnieuw."
  pl: "Kod firmy ma literówkę: skopiuj cały kod jeszcze raz."
  es: "El código de empresa tiene una errata: vuelve a copiar el código entero."
  ru: "В коде компании опечатка: скопируйте весь код ещё раз."
  uk: "У коді компанії помилка: скопіюйте весь код ще раз."
"This code was made by another version of Omsi-Hub: both players need the same version.":
  de: "Dieser Code stammt von einer anderen Version von Omsi-Hub: beide Spieler brauchen dieselbe Version."
  fr: "Ce code a été créé par une autre version d'Omsi-Hub : les deux joueurs ont besoin de la même version."
  nl: "Deze code is gemaakt door een andere versie van Omsi-Hub: beide spelers hebben dezelfde versie nodig."
  pl: "Ten kod pochodzi z innej wersji Omsi-Hub: obaj gracze potrzebują tej samej wersji."
  es: "Este código lo ha creado otra versión de Omsi-Hub: ambos jugadores necesitan la misma versión."
  ru: "Этот код создан другой версией Omsi-Hub: обоим игрокам нужна одна и та же версия."
  uk: "Цей код створено іншою версією Omsi-Hub: обом гравцям потрібна однакова версія."
"The boss's launcher does not answer. Is his \"Play together\" session still on? Over the internet both need the same VPN, or his tunnel must be up.":
  de: "Der Launcher des Chefs antwortet nicht. Läuft seine Sitzung „Zusammen spielen“ noch? Über das Internet brauchen beide dasselbe VPN, oder sein Tunnel muss laufen."
  fr: "Le lanceur du patron ne répond pas. Sa session « Jouer ensemble » est-elle toujours active ? Par Internet, il faut le même VPN des deux côtés, ou son tunnel doit être actif."
  nl: "De launcher van de baas antwoordt niet. Loopt zijn sessie \"Samen spelen\" nog? Via internet hebben beiden hetzelfde VPN nodig, of moet zijn tunnel open zijn."
  pl: "Launcher szefa nie odpowiada. Czy jego sesja „Wspólna gra” nadal trwa? Przez internet obaj potrzebujecie tego samego VPN albo jego tunel musi działać."
  es: "El lanzador del jefe no responde. ¿Sigue activa su sesión «Jugar juntos»? Por internet ambos necesitáis la misma VPN, o su túnel debe estar activo."
  ru: "Лаунчер босса не отвечает. Его сессия «Играть вместе» ещё идёт? Через интернет обоим нужен один и тот же VPN, или должен работать его туннель."
  uk: "Лаунчер боса не відповідає. Його сесія «Грати разом» ще триває? Через інтернет обом потрібен той самий VPN, або має працювати його тунель."
"A friend runs a bus company: join it with his session code and drive duties of its day for it, in his world.":
  de: "Ein Freund führt einen Busbetrieb: tritt ihm mit seinem Sitzungscode bei und fahre Dienste seines Tages für ihn, in seiner Welt."
  fr: "Un ami dirige une entreprise de bus : rejoignez-la avec son code de session et conduisez pour elle des services de sa journée, dans son monde."
  nl: "Een vriend runt een busbedrijf: doe mee met zijn sessiecode en rijd diensten van zijn dag ervoor, in zijn wereld."
  pl: "Znajomy prowadzi firmę autobusową: dołącz jego kodem sesji i jeździj dla niej służby z jej dnia, w jego świecie."
  es: "Un amigo dirige una empresa de autobuses: únete con su código de sesión y conduce servicios de su jornada para ella, en su mundo."
  ru: "Друг управляет автобусной компанией: присоединитесь по его коду сессии и выполняйте для неё смены её дня в его мире."
  uk: "Друг керує автобусною компанією: приєднайтеся за його кодом сесії й виконуйте для неї зміни її дня в його світі."
"With a session code":
  de: "Mit einem Sitzungscode"
  fr: "Avec un code de session"
  nl: "Met een sessiecode"
  pl: "Kodem sesji"
  es: "Con un código de sesión"
  ru: "По коду сессии"
  uk: "За кодом сесії"
"The boss starts \"Play together\" in his company and sends you the code.":
  de: "Der Chef startet „Zusammen spielen“ in seinem Betrieb und schickt dir den Code."
  fr: "Le patron lance « Jouer ensemble » dans son entreprise et vous envoie le code."
  nl: "De baas start \"Samen spelen\" in zijn bedrijf en stuurt je de code."
  pl: "Szef uruchamia „Wspólną grę” w swojej firmie i wysyła ci kod."
  es: "El jefe inicia «Jugar juntos» en su empresa y te envía el código."
  ru: "Босс включает «Играть вместе» в своей компании и присылает вам код."
  uk: "Бос вмикає «Грати разом» у своїй компанії й надсилає вам код."
"No bus to start with":
  de: "Kein Bus zum Starten"
  fr: "Aucun bus pour commencer"
  nl: "Geen bus om mee te beginnen"
  pl: "Brak autobusu na start"
  es: "No hay autobús con el que empezar"
  ru: "Нет автобуса для начала"
  uk: "Немає автобуса для початку"
"The session could not start":
  de: "Die Sitzung konnte nicht starten"
  fr: "La session n'a pas pu démarrer"
  nl: "De sessie kon niet starten"
  pl: "Nie udało się rozpocząć sesji"
  es: "No se ha podido iniciar la sesión"
  ru: "Не удалось начать сессию"
  uk: "Не вдалося почати сесію"
