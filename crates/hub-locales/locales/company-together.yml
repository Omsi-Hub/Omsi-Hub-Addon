_version: 2
# "Play together" in the bus company (Beta 58): the boss's session (its code, the players online,
# the duties asked for, his world) and a friend's view of the boss's company (the day, the open
# duties, his own duties and results), the refusals of claims and reports and the notices.
"No port for the session: %{e}":
  de: "Kein Port für die Sitzung: %{e}"
  fr: "Aucun port pour la session : %{e}"
  nl: "Geen poort voor de sessie: %{e}"
  pl: "Brak portu dla sesji: %{e}"
  es: "No hay puerto para la sesión: %{e}"
  ru: "Нет порта для сессии: %{e}"
  uk: "Немає порту для сесії: %{e}"
"Close what uses the port, or start the launcher again.":
  de: "Schließe, was den Port belegt, oder starte den Launcher neu."
  fr: "Fermez ce qui utilise le port, ou redémarrez le lanceur."
  nl: "Sluit wat de poort gebruikt, of start de launcher opnieuw."
  pl: "Zamknij to, co używa portu, albo uruchom launcher ponownie."
  es: "Cierra lo que usa el puerto o vuelve a iniciar el lanzador."
  ru: "Закройте то, что занимает порт, или перезапустите лаунчер."
  uk: "Закрийте те, що займає порт, або перезапустіть лаунчер."
"Play together: friends drive duties of your company in your world":
  de: "Zusammen spielen: Freunde fahren Dienste deines Betriebs in deiner Welt"
  fr: "Jouer ensemble : des amis conduisent les services de votre entreprise dans votre monde"
  nl: "Samen spelen: vrienden rijden diensten van je bedrijf in jouw wereld"
  pl: "Wspólna gra: znajomi jeżdżą służby twojej firmy w twoim świecie"
  es: "Jugar juntos: tus amigos conducen servicios de tu empresa en tu mundo"
  ru: "Играть вместе: друзья выполняют смены вашей компании в вашем мире"
  uk: "Грати разом: друзі виконують зміни вашої компанії у вашому світі"
"Play together: %{n} online":
  de: "Zusammen spielen: %{n} online"
  fr: "Jouer ensemble : %{n} en ligne"
  nl: "Samen spelen: %{n} online"
  pl: "Wspólna gra: %{n} online"
  es: "Jugar juntos: %{n} en línea"
  ru: "Играть вместе: %{n} в сети"
  uk: "Грати разом: %{n} у мережі"
"Your world is open while it runs.":
  de: "Deine Welt ist offen, solange es läuft."
  fr: "Votre monde est ouvert tant qu'il tourne."
  nl: "Je wereld is open zolang het loopt."
  pl: "Twój świat jest otwarty, dopóki gra działa."
  es: "Tu mundo está abierto mientras se ejecuta."
  ru: "Ваш мир открыт, пока игра запущена."
  uk: "Ваш світ відкритий, поки гра запущена."
"Friends join it when it hosts a session; close it to open another.":
  de: "Freunde treten bei, wenn es eine Sitzung hostet; schließe es, um eine andere Welt zu öffnen."
  fr: "Vos amis le rejoignent s'il héberge une session ; fermez-le pour en ouvrir un autre."
  nl: "Vrienden doen mee als het een sessie host; sluit het om een andere te openen."
  pl: "Znajomi dołączą, gdy gra hostuje sesję; zamknij ją, aby otworzyć inną."
  es: "Tus amigos se unen cuando aloja una sesión; ciérralo para abrir otro."
  ru: "Друзья присоединятся, если игра проводит сессию; закройте её, чтобы открыть другую."
  uk: "Друзі приєднаються, якщо гра проводить сесію; закрийте її, щоб відкрити іншу."
"The world opens with you on foot beside a bus of the fleet.":
  de: "Die Welt öffnet sich mit dir zu Fuß neben einem Bus der Flotte."
  fr: "Le monde s'ouvre avec vous à pied à côté d'un bus de la flotte."
  nl: "De wereld opent met jou te voet naast een bus van de vloot."
  pl: "Świat otwiera się z tobą pieszo obok autobusu floty."
  es: "El mundo se abre contigo a pie junto a un autobús de la flota."
  ru: "Мир открывается, а вы стоите пешком рядом с автобусом парка."
  uk: "Світ відкривається, а ви стоїте пішки біля автобуса парку."
"Buy or lease a bus first.":
  de: "Kaufe oder lease zuerst einen Bus."
  fr: "Achetez ou louez d'abord un bus."
  nl: "Koop of lease eerst een bus."
  pl: "Najpierw kup lub weź w leasing autobus."
  es: "Primero compra o alquila un autobús."
  ru: "Сначала купите или возьмите в лизинг автобус."
  uk: "Спершу купіть або візьміть у лізинг автобус."
"Opening your company's world…":
  de: "Die Welt deines Betriebs wird geöffnet…"
  fr: "Ouverture du monde de votre entreprise…"
  nl: "De wereld van je bedrijf wordt geopend…"
  pl: "Otwieranie świata twojej firmy…"
  es: "Abriendo el mundo de tu empresa…"
  ru: "Открывается мир вашей компании…"
  uk: "Відкривається світ вашої компанії…"
