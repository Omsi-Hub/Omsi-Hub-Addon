# RosterFlow's deadheads (a tester, 2026-10-19: "Dead heads are broken ... specify deadheads"):
# Preferences › Vehicles › Deadheads - the minutes and kilometres where nothing is set, to or
# from each relief point, and between two - and the live count of the ones still estimated.
"How long a bus takes to drive empty from one place to another, and how far: between two relief points, or to and from one.":
  en: "How long a bus takes to drive empty from one place to another, and how far: between two relief points, or to and from one."
  nl: "Hoe lang een bus leeg van de ene plek naar de andere rijdt, en hoe ver: tussen twee aflospunten, of van en naar één."
  de: "Wie lange ein Bus leer von einem Ort zum anderen fährt, und wie weit: zwischen zwei Ablösepunkten oder zu und von einem."
  fr: "Combien de temps un bus met à rouler à vide d'un endroit à un autre, et sur quelle distance : entre deux points de relève, ou vers et depuis l'un d'eux."
  ru: "Сколько времени автобус едет порожним от одного места до другого и какое расстояние: между двумя пунктами смены или к одному и от него."
  uk: "Скільки часу автобус їде порожнім від одного місця до іншого і яку відстань: між двома пунктами зміни або до одного й від нього."
  pl: "Jak długo autobus jedzie pusty z jednego miejsca do drugiego i jak daleko: między dwoma punktami zmiany albo do jednego i z niego."
  es: "Cuánto tarda un autobús en ir en vacío de un lugar a otro, y qué distancia: entre dos puntos de relevo, o hacia uno y desde uno."
