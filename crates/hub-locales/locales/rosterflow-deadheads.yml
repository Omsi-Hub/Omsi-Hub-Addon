"The relief points show once the timetable is read.":
  en: "The relief points show once the timetable is read."
  nl: "De aflospunten verschijnen zodra de dienstregeling is gelezen."
  de: "Die Ablösepunkte erscheinen, sobald der Fahrplan gelesen ist."
  fr: "Les points de relève s'affichent une fois l'horaire lu."
  ru: "Пункты смены появятся, когда расписание будет прочитано."
  uk: "Пункти зміни з'являться, коли розклад буде прочитано."
  pl: "Punkty zmiany pojawią się po wczytaniu rozkładu."
  es: "Los puntos de relevo aparecen en cuanto se lee el horario."
"An empty field takes the way back's, else the relief points' own, else the line's quickest trip between the two, else the default. A deadhead whose time is set here is no longer estimated (no orange dot).":
  en: "An empty field takes the way back's, else the relief points' own, else the line's quickest trip between the two, else the default. A deadhead whose time is set here is no longer estimated (no orange dot)."
  nl: "Een leeg veld neemt die van de weg terug, anders die van de aflospunten zelf, anders de snelste rit van de lijn tussen de twee, anders de standaard. Een leegrit waarvan de tijd hier is ingesteld, is niet langer geschat (geen oranje stip)."
  de: "Ein leeres Feld nimmt den Wert des Rückwegs, sonst den der Ablösepunkte selbst, sonst die schnellste Fahrt der Linie zwischen beiden, sonst den Standard. Eine Leerfahrt, deren Zeit hier eingestellt ist, ist nicht mehr geschätzt (kein oranger Punkt)."
  fr: "Un champ vide prend la valeur du retour, sinon celle des points de relève, sinon le trajet le plus rapide de la ligne entre les deux, sinon la valeur par défaut. Un haut-le-pied dont la durée est définie ici n'est plus estimé (pas de point orange)."
  ru: "Пустое поле берёт значение обратного пути, иначе собственное значение пунктов смены, иначе самый быстрый рейс линии между ними, иначе значение по умолчанию. Порожний рейс, время которого задано здесь, больше не оценивается (без оранжевой точки)."
  uk: "Порожнє поле бере значення зворотного шляху, інакше власне значення пунктів зміни, інакше найшвидший рейс лінії між ними, інакше значення за замовчуванням. Порожній рейс, час якого задано тут, більше не оцінюється (без помаранчевої крапки)."
  pl: "Puste pole bierze wartość drogi powrotnej, w przeciwnym razie własną punktów zmiany, w przeciwnym razie najszybszy kurs linii między nimi, w przeciwnym razie domyślną. Przejazd techniczny, którego czas ustawiono tutaj, nie jest już szacowany (bez pomarańczowej kropki)."
  es: "Un campo vacío toma el del camino de vuelta, si no el de los propios puntos de relevo, si no el viaje más rápido de la línea entre los dos, y si no el valor por defecto. Un viaje en vacío cuyo tiempo se fija aquí ya no se estima (sin punto naranja)."
