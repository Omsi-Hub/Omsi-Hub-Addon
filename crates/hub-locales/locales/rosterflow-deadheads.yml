  en: "No deadhead's time is estimated now."
  nl: "Van geen enkele leegrit wordt de tijd nu geschat."
  de: "Die Zeit keiner Leerfahrt ist jetzt geschätzt."
  fr: "Aucune durée de haut-le-pied n'est estimée maintenant."
  ru: "Сейчас время ни одного порожнего рейса не оценивается."
  uk: "Зараз час жодного порожнього рейсу не оцінюється."
  pl: "Teraz czas żadnego przejazdu technicznego nie jest szacowany."
  es: "Ahora no se estima el tiempo de ningún viaje en vacío."
