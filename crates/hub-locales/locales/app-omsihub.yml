"Free: the bus starts where you choose, without a line. Choose a line yourself: it starts at the first stop of the route you pick, and the navigator and the IBIS know the line - nothing is booked either way.":
  nl: "Vrij: de bus staat waar je kiest, zonder lijn. Zelf een lijn kiezen: hij begint bij de eerste halte van de route die je kiest, en de navigatie en de IBIS kennen de lijn - geboekt wordt er in beide gevallen niets."
  de: "Frei: Der Bus steht, wo du willst, ohne Linie. Selbst eine Linie wählen: Er beginnt an der ersten Haltestelle der gewählten Route, und Navi und IBIS kennen die Linie - gebucht wird in beiden Fällen nichts."
  fr: "Libre : le bus est placé où vous voulez, sans ligne. Choisir une ligne soi-même : il part du premier arrêt de l’itinéraire choisi, et le navigateur et l’IBIS connaissent la ligne - rien n’est réservé dans les deux cas."
  ru: "Свободно: автобус стоит там, где вы выберете, без линии. Выбрать линию самому: он начинает с первой остановки выбранного маршрута, навигатор и IBIS знают линию - в обоих случаях ничего не бронируется."
  uk: "Вільно: автобус стоїть там, де ви оберете, без лінії. Обрати лінію самому: він починає з першої зупинки обраного маршруту, навігатор та IBIS знають лінію - в обох випадках нічого не бронюється."
  pl: "Swobodnie: autobus stoi tam, gdzie wybierzesz, bez linii. Wybierz linię samodzielnie: zaczyna na pierwszym przystanku wybranej trasy, a nawigacja i IBIS znają linię - w obu przypadkach nic nie jest rezerwowane."
  es: "Libre: el autobús empieza donde tú elijas, sin línea. Elegir una línea tú mismo: empieza en la primera parada de la ruta que elijas, y el navegador y el IBIS conocen la línea - en ningún caso se registra nada."
