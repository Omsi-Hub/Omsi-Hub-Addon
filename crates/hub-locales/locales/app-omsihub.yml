_version: 2
# Omsi-Hub's own texts of the old game's app.yml: what the fork added to openOMSI's table
# (the company, RosterFlow and the launcher's pages). The English text is the key.
"Force feedback direction":
  nl: "Richting van force feedback"
  de: "Force-Feedback-Richtung"
  fr: "Sens du retour de force"
  ru: "Направление отдачи"
  uk: "Напрямок віддачі"
  pl: "Kierunek force feedback"
  es: "Sentido del force feedback"
"Invert force feedback by default":
  nl: "Force feedback standaard omkeren"
  de: "Force Feedback standardmäßig umkehren"
  fr: "Inverser le retour de force par défaut"
  ru: "Инвертировать отдачу по умолчанию"
  uk: "Інвертувати віддачу типово"
  pl: "Domyślnie odwracaj force feedback"
  es: "Invertir el force feedback por defecto"
"Wheels with a saved direction use their own setting under Controls → Game controllers.":
  nl: "Sturen met een opgeslagen richting gebruiken hun eigen instelling onder Besturing → Gamecontrollers."
  de: "Lenkräder mit gespeicherter Richtung nutzen ihre eigene Einstellung unter Steuerung → Gamecontroller."
  fr: "Les volants dont le sens est enregistré utilisent leur propre réglage dans Commandes → Manettes de jeu."
  ru: "Рули с сохранённым направлением используют свою настройку в разделе Управление → Игровые контроллеры."
  uk: "Керма зі збереженим напрямком використовують власне налаштування в розділі Керування → Ігрові контролери."
  pl: "Kierownice z zapisanym kierunkiem używają własnego ustawienia w Sterowanie → Kontrolery gier."
  es: "Los volantes con un sentido guardado usan su propio ajuste en Controles → Mandos de juego."
"INJURY RISK: TAKE YOUR HANDS OFF THE WHEEL. Keep hands and fingers clear before starting and throughout the test.":
  nl: "GEVAAR VOOR LETSEL: HAAL JE HANDEN VAN HET STUUR. Houd handen en vingers vrij voor de start en tijdens de hele test."
  de: "VERLETZUNGSGEFAHR: NIMM DIE HÄNDE VOM LENKRAD. Halte Hände und Finger vor dem Start und während des ganzen Tests fern."
  fr: "RISQUE DE BLESSURE : RETIREZ VOS MAINS DU VOLANT. Gardez les mains et les doigts à l'écart avant le début et pendant tout le test."
  ru: "ОПАСНОСТЬ ТРАВМЫ: УБЕРИТЕ РУКИ С РУЛЯ. Держите руки и пальцы подальше до начала и во время всего теста."
  uk: "НЕБЕЗПЕКА ТРАВМИ: ПРИБЕРІТЬ РУКИ З КЕРМА. Тримайте руки й пальці подалі до початку й під час усього тесту."
  pl: "RYZYKO URAZU: ZDEJMIJ RĘCE Z KIEROWNICY. Trzymaj dłonie i palce z dala przed rozpoczęciem i przez cały test."
  es: "RIESGO DE LESIONES: QUITA LAS MANOS DEL VOLANTE. Mantén las manos y los dedos alejados antes de empezar y durante toda la prueba."
"If the wheel barely moves, increase Test strength and retry. Keep your hands clear.":
  nl: "Beweegt het stuur nauwelijks, verhoog dan de Teststerkte en probeer opnieuw. Houd je handen vrij."
  de: "Bewegt sich das Lenkrad kaum, erhöhe die Teststärke und versuche es erneut. Halte die Hände fern."
  fr: "Si le volant bouge à peine, augmentez la force du test et réessayez. Gardez les mains à l'écart."
  ru: "Если руль почти не двигается, увеличьте «Силу теста» и повторите. Держите руки подальше."
  uk: "Якщо кермо майже не рухається, збільште «Силу тесту» й повторіть. Тримайте руки подалі."
  pl: "Jeśli kierownica ledwo się porusza, zwiększ siłę testu i spróbuj ponownie. Trzymaj ręce z dala."
  es: "Si el volante apenas se mueve, aumenta la fuerza de prueba y vuelve a intentarlo. Mantén las manos alejadas."
"Direction detected: normal":
  nl: "Richting herkend: normaal"
  de: "Richtung erkannt: normal"
  fr: "Sens détecté : normal"
  ru: "Направление определено: обычное"
  uk: "Напрямок визначено: звичайний"
  pl: "Wykryty kierunek: normalny"
  es: "Sentido detectado: normal"
"Direction detected: inverted":
  nl: "Richting herkend: omgekeerd"
  de: "Richtung erkannt: umgekehrt"
  fr: "Sens détecté : inversé"
  ru: "Направление определено: обратное"
  uk: "Напрямок визначено: зворотний"
  pl: "Wykryty kierunek: odwrócony"
  es: "Sentido detectado: invertido"
"If detection is inconclusive, retry or choose the direction manually. You can change it later on this device's page.":
  nl: "Is de herkenning niet eenduidig, probeer opnieuw of kies de richting zelf. Je kunt het later wijzigen op de pagina van dit apparaat."
  de: "Ist die Erkennung nicht eindeutig, versuche es erneut oder wähle die Richtung von Hand. Du kannst sie später auf der Seite dieses Geräts ändern."
  fr: "Si la détection n'est pas concluante, réessayez ou choisissez le sens à la main. Vous pourrez le changer plus tard sur la page de cet appareil."
  ru: "Если определить не удалось, повторите тест или выберите направление вручную. Его можно изменить позже на странице этого устройства."
  uk: "Якщо визначити не вдалося, повторіть тест або виберіть напрямок вручну. Його можна змінити пізніше на сторінці цього пристрою."
  pl: "Jeśli wykrycie nie jest jednoznaczne, spróbuj ponownie lub wybierz kierunek ręcznie. Możesz go później zmienić na stronie tego urządzenia."
  es: "Si la detección no es concluyente, vuelve a intentarlo o elige el sentido a mano. Puedes cambiarlo más tarde en la página de este dispositivo."
"The test was interrupted. Please try again.":
  nl: "De test is onderbroken. Probeer het opnieuw."
  de: "Der Test wurde unterbrochen. Bitte versuche es erneut."
  fr: "Le test a été interrompu. Veuillez réessayer."
  ru: "Тест прерван. Попробуйте снова."
  uk: "Тест перервано. Спробуйте знову."
  pl: "Test został przerwany. Spróbuj ponownie."
  es: "La prueba se ha interrumpido. Vuelve a intentarlo."
"The wheel is unavailable. Reconnect it and try again.":
  nl: "Het stuur is niet beschikbaar. Sluit het opnieuw aan en probeer het nog eens."
  de: "Das Lenkrad ist nicht verfügbar. Schließe es erneut an und versuche es noch einmal."
  fr: "Le volant n'est pas disponible. Reconnectez-le et réessayez."
  ru: "Руль недоступен. Переподключите его и попробуйте снова."
  uk: "Кермо недоступне. Перепідключіть його й спробуйте знову."
  pl: "Kierownica jest niedostępna. Podłącz ją ponownie i spróbuj jeszcze raz."
  es: "El volante no está disponible. Vuelve a conectarlo e inténtalo de nuevo."
"Force feedback is unavailable. Choose the direction manually.":
  nl: "Force feedback is niet beschikbaar. Kies de richting zelf."
  de: "Force Feedback ist nicht verfügbar. Wähle die Richtung von Hand."
  fr: "Le retour de force n'est pas disponible. Choisissez le sens à la main."
  ru: "Отдача недоступна. Выберите направление вручную."
  uk: "Віддача недоступна. Виберіть напрямок вручну."
  pl: "Force feedback jest niedostępny. Wybierz kierunek ręcznie."
  es: "El force feedback no está disponible. Elige el sentido a mano."
