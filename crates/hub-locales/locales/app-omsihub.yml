"A free Cloudflare quick tunnel makes the page reachable at an https address from anywhere, e.g. over mobile data. Devices still need the pairing code.":
  nl: "Een gratis Cloudflare-snelle tunnel maakt de pagina overal bereikbaar op een https-adres, bijvoorbeeld via mobiele data. Apparaten hebben nog steeds de koppelcode nodig."
  de: "Ein kostenloser Cloudflare-Schnelltunnel macht die Seite überall unter einer https-Adresse erreichbar, z. B. über mobile Daten. Geräte brauchen weiterhin den Kopplungscode."
  fr: "Un tunnel rapide Cloudflare gratuit rend la page accessible partout à une adresse https, par exemple en données mobiles. Les appareils ont toujours besoin du code d'appairage."
  ru: "Бесплатный быстрый туннель Cloudflare делает страницу доступной отовсюду по адресу https, например через мобильный интернет. Устройствам по-прежнему нужен код сопряжения."
  uk: "Безкоштовний швидкий тунель Cloudflare робить сторінку доступною звідусіль за адресою https, наприклад через мобільний інтернет. Пристроям і далі потрібен код спряження."
  pl: "Darmowy szybki tunel Cloudflare udostępnia stronę wszędzie pod adresem https, np. przez dane komórkowe. Urządzenia nadal potrzebują kodu parowania."
  es: "Un túnel rápido gratuito de Cloudflare hace que la página sea accesible desde cualquier lugar en una dirección https, p. ej. con datos móviles. Los dispositivos siguen necesitando el código de emparejamiento."
