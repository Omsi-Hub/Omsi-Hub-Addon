"Passengers from the stops, the transfers at them and the service; the rush hours busiest. A month: the drivers, buses and running at full cost.":
  nl: "Reizigers volgen uit de haltes, de overstappen daar en het aanbod; de spits het drukst. Per maand: chauffeurs, bussen en exploitatie tegen volle kosten."
  de: "Fahrgäste aus den Haltestellen, den Umstiegen dort und dem Angebot; die Spitzen am vollsten. Pro Monat: Fahrer, Busse und Betrieb zu vollen Kosten."
  fr: "Voyageurs selon les arrêts, les correspondances et l'offre ; les heures de pointe les plus chargées. Par mois : conducteurs, bus et exploitation à coût complet."
  ru: "Пассажиры — от остановок, пересадок на них и частоты; больше всего в часы пик. В месяц: водители, автобусы и эксплуатация по полной стоимости."
  uk: "Пасажири — від зупинок, пересадок на них і частоти; найбільше в години пік. На місяць: водії, автобуси й експлуатація за повною вартістю."
  pl: "Pasażerowie z przystanków, przesiadek i oferty; najwięcej w szczycie. Miesięcznie: kierowcy, autobusy i eksploatacja po pełnym koszcie."
  es: "Pasajeros de las paradas, los transbordos en ellas y el servicio; las horas punta, las más concurridas. Al mes: los conductores, los autobuses y la explotación a coste completo."
