"%{n} timetables of the map are no lines of their own (depot and empty runs, specials): they go with the tours that need them.":
  nl: "%{n} dienstregelingen van de kaart zijn geen eigen lijnen (depotritten, leegritten, bijzondere): ze horen bij de omlopen die ze nodig hebben."
  de: "%{n} Fahrpläne der Karte sind keine eigenen Linien (Betriebs- und Leerfahrten, Sonderverkehre): sie gehören zu den Umläufen, die sie brauchen."
  fr: "%{n} horaires de la carte ne sont pas des lignes à part (haut-le-pied, dépôt, services spéciaux) : ils vont avec les services qui en ont besoin."
  ru: "%{n} расписаний карты не являются отдельными линиями (служебные и порожние рейсы, особые): они относятся к оборотам, которым нужны."
  uk: "%{n} розкладів мапи не є окремими лініями (службові та порожні рейси, особливі): вони належать до оборотів, яким потрібні."
  pl: "%{n} rozkładów mapy to nie osobne linie (zjazdy, przejazdy techniczne, specjalne): należą do obiegów, które ich potrzebują."
  es: "%{n} horarios del mapa no son líneas propias (viajes a cochera y en vacío, especiales): van con los recorridos que los necesitan."
"\"Simulate to tomorrow\" at the top runs the rest of the day and closes it at midnight: the tours are run, the money booked, and the next day begins. What you drove yourself on the company's lines counts as measured.":
  nl: "\"Simuleer tot morgen\" bovenaan speelt de rest van de dag af en sluit hem om middernacht: de omlopen worden gereden, het geld geboekt en de volgende dag begint. Wat je zelf op de lijnen van het bedrijf reed, telt als gemeten."
  de: "\"Bis morgen simulieren\" oben spielt den Rest des Tages ab und schließt ihn um Mitternacht: die Umläufe werden gefahren, das Geld gebucht, und der nächste Tag beginnt. Was du selbst auf den Linien der Firma gefahren bist, zählt als gemessen."
  fr: "« Simuler jusqu'à demain » en haut déroule le reste de la journée et la clôture à minuit : les services roulent, l'argent est comptabilisé et le jour suivant commence. Ce que vous avez conduit vous-même sur les lignes de l'entreprise compte comme mesuré."
  ru: "«Симулировать до завтра» вверху проигрывает остаток дня и закрывает его в полночь: обороты выполняются, деньги учитываются, начинается следующий день. То, что вы проехали сами на линиях компании, считается измеренным."
  uk: "«Симулювати до завтра» вгорі програє решту дня й закриває його опівночі: обороти виконуються, гроші обліковуються, починається наступний день. Те, що ви проїхали самі на лініях компанії, вважається виміряним."
  pl: "„Symuluj do jutra” u góry rozgrywa resztę dnia i zamyka go o północy: obiegi są wykonane, pieniądze zaksięgowane, zaczyna się kolejny dzień. To, co sam przejechałeś na liniach firmy, liczy się jako zmierzone."
  es: "\"Simular hasta mañana\", arriba, realiza el resto del día y lo cierra a medianoche: se hacen los recorridos, se contabiliza el dinero y empieza el día siguiente. Lo que hayas conducido tú en las líneas de la empresa cuenta tal como se midió."
