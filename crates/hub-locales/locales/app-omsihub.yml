  de: "%{month} ist abgeschlossen: Löhne, Leasing, Versicherung, Betriebshof und Kreditraten sind gebucht. Das Monatsergebnis: %{amount}."
  fr: "%{month} est clôturé : salaires, leasings, assurance, dépôt et échéances de prêt sont comptabilisés. Le résultat du mois : %{amount}."
  ru: "%{month} закрыт: зарплаты, лизинг, страховка, депо и платежи по кредитам проведены. Результат месяца: %{amount}."
  uk: "%{month} закрито: зарплати, лізинг, страховку, депо й платежі за кредитами проведено. Результат місяця: %{amount}."
  pl: "%{month} zamknięty: płace, leasingi, ubezpieczenie, zajezdnia i raty kredytów zaksięgowane. Wynik miesiąca: %{amount}."
  es: "%{month} está cerrado: se han contabilizado salarios, leasings, seguros, la cochera y las cuotas de los préstamos. El resultado del mes: %{amount}."
