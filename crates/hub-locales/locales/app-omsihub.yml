  fr: "Peins un bus en 3D : couleurs, bandes, textes, images et formes, enregistrés comme une livrée proposée par le jeu."
  ru: "Покрасьте автобус в 3D: цвета, полосы, надписи, картинки и фигуры сохраняются как окраска в игре."
  uk: "Пофарбуйте автобус у 3D: кольори, смуги, написи, картинки й фігури зберігаються як ліврея в грі."
  pl: "Pomaluj autobus w 3D: kolory, pasy, napisy, obrazy i kształty zapisane jako malowanie dostępne w grze."
  es: "Pinta un autobús en 3D: colores, franjas, textos, imágenes y formas, guardados como una librea que el juego ofrece."
