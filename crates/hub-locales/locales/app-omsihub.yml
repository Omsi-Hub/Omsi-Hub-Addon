  es: "El estudio de libreas necesita un ordenador: abre el lanzador en tu PC para pintar un autobús."
"Paint a bus in 3D: colours, stripes, texts, pictures and shapes, saved as a livery the game offers.":
  nl: "Lak een bus in 3D: kleuren, strepen, teksten, afbeeldingen en vormen, opgeslagen als een lak die het spel aanbiedt."
