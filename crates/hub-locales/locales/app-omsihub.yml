"Screens that slide in, tiles that rise under the mouse, a bus between the menus. Some like it lively, others calm.":
  nl: "Schermen die binnenschuiven, tegels die opkomen onder de muis, een bus tussen de menu's. De een houdt van levendig, de ander van rustig."
  de: "Bildschirme, die hereingleiten, Kacheln, die sich unter der Maus heben, ein Bus zwischen den Menüs. Die einen mögen es lebhaft, die anderen ruhig."
  fr: "Des écrans qui glissent, des tuiles qui se soulèvent sous la souris, un bus entre les menus. Certains aiment le mouvement, d’autres le calme."
  ru: "Экраны, которые выезжают, плитки, что приподнимаются под мышью, автобус между меню. Кому-то нравится живо, кому-то спокойно."
  uk: "Екрани, що виїжджають, плитки, що підіймаються під мишею, автобус між меню. Комусь до вподоби жваво, комусь спокійно."
  pl: "Ekrany, które się wsuwają, kafelki unoszące się pod myszą, autobus między menu. Jedni lubią żywo, inni spokojnie."
  es: "Pantallas que se deslizan, mosaicos que se elevan bajo el ratón, un autobús entre los menús. A unos les gusta animado; a otros, tranquilo."
