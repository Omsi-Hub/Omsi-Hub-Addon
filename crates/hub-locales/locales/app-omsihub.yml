"What the line asks of the company on a day like today, against what it has. It comes in not planned: it runs once its tours are planned and its service is started on the Planning page.":
  nl: "Wat de lijn vraagt van het bedrijf op een dag als vandaag, tegenover wat het heeft. Ze komt ongepland binnen: ze rijdt zodra haar omlopen gepland zijn en de dienst gestart is op de pagina Planning."
  de: "Was die Linie an einem Tag wie heute von der Firma verlangt, gegenüber dem, was sie hat. Sie kommt ungeplant: Sie fährt, sobald ihre Umläufe geplant sind und ihr Betrieb auf der Seite Planung gestartet ist."
  fr: "Ce que la ligne demande à l'entreprise un jour comme aujourd'hui, face à ce qu'elle a. Elle arrive non planifiée : elle roule dès que ses services sont planifiés et son service lancé sur la page Planning."
  ru: "Что линия требует от компании в такой день, как сегодня, и что у компании есть. Она приходит незапланированной: работает, когда её обороты запланированы и работа запущена на странице «Планирование»."
  uk: "Що лінія вимагає від компанії в такий день, як сьогодні, і що в компанії є. Вона приходить незапланованою: працює, коли її обороти заплановано і роботу запущено на сторінці «Планування»."
  pl: "Czego linia wymaga od firmy w dzień taki jak dziś, wobec tego, co firma ma. Przychodzi niezaplanowana: kursuje, gdy jej brygady są zaplanowane, a kursowanie uruchomione na stronie Planowanie."
  es: "Lo que la línea pide a la empresa en un día como hoy, frente a lo que tiene. Llega sin planificar: circula cuando sus recorridos están planificados y su servicio se ha iniciado en la página Planificación."
"What the line asks of the company on a day like today, against what it has. Its concession is auctioned: if your bid wins, the line comes in not planned - it runs once its tours are planned and its service is started.":
  nl: "Wat de lijn vraagt van het bedrijf op een dag als vandaag, tegenover wat het heeft. Haar concessie wordt geveild: wint je bod, dan komt de lijn ongepland binnen - ze rijdt zodra haar omlopen gepland zijn en de dienst gestart is."
  de: "Was die Linie an einem Tag wie heute von der Firma verlangt, gegenüber dem, was sie hat. Ihre Konzession wird versteigert: Gewinnt Ihr Gebot, kommt die Linie ungeplant - sie fährt, sobald ihre Umläufe geplant sind und ihr Betrieb gestartet ist."
  fr: "Ce que la ligne demande à l'entreprise un jour comme aujourd'hui, face à ce qu'elle a. Sa concession est mise aux enchères : si votre offre gagne, la ligne arrive non planifiée - elle roule dès que ses services sont planifiés et son service lancé."
  ru: "Что линия требует от компании в такой день, как сегодня, и что у компании есть. Её концессия разыгрывается на аукционе: если ваша ставка выиграет, линия придёт незапланированной - работает, когда её обороты запланированы и работа запущена."
  uk: "Що лінія вимагає від компанії в такий день, як сьогодні, і що в компанії є. Її концесію розігрують на аукціоні: якщо ваша ставка виграє, лінія прийде незапланованою - працює, коли її обороти заплановано і роботу запущено."
  pl: "Czego linia wymaga od firmy w dzień taki jak dziś, wobec tego, co firma ma. Jej koncesja idzie na aukcję: jeśli twoja oferta wygra, linia przychodzi niezaplanowana - kursuje, gdy jej brygady są zaplanowane, a kursowanie uruchomione."
  es: "Lo que la línea pide a la empresa en un día como hoy, frente a lo que tiene. Su concesión se subasta: si tu oferta gana, la línea llega sin planificar - circula cuando sus recorridos están planificados y su servicio se ha iniciado."
