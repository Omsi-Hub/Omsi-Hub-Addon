"No price now: the rate is booked at every month's end, and the bus goes back when the term ends. Insurance is the company's.":
  nl: "Nu geen prijs: de termijn wordt aan het eind van elke maand geboekt, en de bus gaat terug als de looptijd voorbij is. De verzekering is voor het bedrijf."
  de: "Jetzt kein Preis: die Rate wird an jedem Monatsende gebucht, und der Bus geht nach der Laufzeit zurück. Die Versicherung trägt das Unternehmen."
  fr: "Pas de prix maintenant : la mensualité est comptabilisée à chaque fin de mois, et le bus est rendu à la fin du contrat. L'assurance est à la charge de l'entreprise."
  ru: "Сейчас платить не нужно: платёж проводится в конце каждого месяца, а по окончании срока автобус возвращается. Страховка за счёт предприятия."
