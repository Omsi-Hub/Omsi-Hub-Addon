"Points come with every day closed and every trip driven: tours run, trips on time, passengers carried, a good reputation":
  nl: "Punten komen met elke afgesloten dag en elke gereden rit: gereden omlopen, ritten op tijd, vervoerde reizigers, een goede reputatie"
  de: "Punkte gibt es für jeden abgeschlossenen Tag und jede gefahrene Fahrt: gefahrene Umläufe, pünktliche Fahrten, beförderte Fahrgäste, ein guter Ruf"
  fr: "Les points viennent avec chaque journée close et chaque course : services assurés, courses à l'heure, voyageurs transportés, une bonne réputation"
  ru: "Очки дают за каждый закрытый день и каждый рейс: выполненные обороты, рейсы вовремя, перевезённые пассажиры, хорошая репутация"
  uk: "Очки дають за кожен закритий день і кожен рейс: виконані обороти, рейси вчасно, перевезені пасажири, добра репутація"
  pl: "Punkty przychodzą z każdym zamkniętym dniem i każdym kursem: wykonane brygady, kursy na czas, przewiezieni pasażerowie, dobra reputacja"
  es: "Los puntos llegan con cada día cerrado y cada viaje conducido: recorridos realizados, viajes puntuales, pasajeros transportados, una buena reputación"
