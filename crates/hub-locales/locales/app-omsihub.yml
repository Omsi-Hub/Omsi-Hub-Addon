  pl: "Nie przed %{date}: ostatnie księgowanie firmy."
  es: "No antes del %{date}: el último asiento de la empresa."
"Moving the date changes what the company finds there: the dealer's offers and the used market of that day, deliveries and contracts by their own dates, concessions and leases running to theirs. The days between are not simulated: they bring no money and no wear.":
  nl: "De datum verzetten verandert wat het bedrijf daar aantreft: de aanbiedingen van de dealer en de occasionmarkt van die dag, leveringen en contracten op hun eigen data, concessies en leases die tot de hunne lopen. De dagen ertussen worden niet gesimuleerd: ze brengen geen geld en geen slijtage."
  de: "Das Datum zu verschieben ändert, was die Firma dort vorfindet: die Angebote des Händlers und den Gebrauchtmarkt dieses Tages, Lieferungen und Verträge nach ihren eigenen Daten, Konzessionen und Leasingverträge bis zu ihren. Die Tage dazwischen werden nicht simuliert: Sie bringen kein Geld und keinen Verschleiß."
  fr: "Déplacer la date change ce que l'entreprise y trouve : les offres du concessionnaire et le marché de l'occasion de ce jour, livraisons et contrats à leurs propres dates, concessions et leasings jusqu'aux leurs. Les jours intermédiaires ne sont pas simulés : ni argent ni usure."
  ru: "Перенос даты меняет то, что компания там застанет: предложения дилера и рынок подержанных того дня, поставки и договоры по их датам, концессии и лизинг до их сроков. Дни между ними не моделируются: ни денег, ни износа."
  uk: "Перенесення дати змінює те, що компанія там застане: пропозиції дилера і ринок вживаних того дня, поставки і договори за їхніми датами, концесії й лізинг до їхніх строків. Дні між ними не моделюються: ні грошей, ні зносу."
  pl: "Przesunięcie daty zmienia to, co firma tam zastanie: oferty dealera i rynek używanych z tego dnia, dostawy i umowy według ich dat, koncesje i leasingi do ich terminów. Dni pomiędzy nie są symulowane: nie dają pieniędzy ani zużycia."
  es: "Mover la fecha cambia lo que la empresa encuentra allí: las ofertas del concesionario y el mercado de ocasión de ese día, las entregas y los contratos según sus propias fechas, las concesiones y los leasings hasta las suyas. Los días intermedios no se simulan: no traen dinero ni desgaste."
