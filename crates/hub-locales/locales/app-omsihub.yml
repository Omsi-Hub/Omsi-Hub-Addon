"Players near you are heard from where they stand, when GreenTeaSpeak runs with the openOMSI plugin and the server names a voice server.":
  nl: "Spelers in de buurt hoor je vanaf waar ze staan, als GreenTeaSpeak draait met de openOMSI-plugin en de server een spraakserver noemt."
  de: "Spieler in deiner Nähe hörst du von dort, wo sie stehen, wenn GreenTeaSpeak mit dem openOMSI-Plugin läuft und der Server einen Sprachserver nennt."
  fr: "Les joueurs proches de vous s'entendent depuis l'endroit où ils se trouvent, quand GreenTeaSpeak tourne avec le plugin openOMSI et que le serveur indique un serveur vocal."
  ru: "Игроков рядом слышно с того места, где они стоят, когда GreenTeaSpeak работает с плагином openOMSI и сервер указывает голосовой сервер."
  uk: "Гравців поруч чути з того місця, де вони стоять, коли GreenTeaSpeak працює з плагіном openOMSI і сервер указує голосовий сервер."
  pl: "Graczy w pobliżu słychać z miejsca, w którym stoją, gdy GreenTeaSpeak działa z wtyczką openOMSI, a serwer podaje serwer głosowy."
  es: "Oyes a los jugadores cercanos desde donde están, cuando GreenTeaSpeak se ejecuta con el plugin de openOMSI y el servidor indica un servidor de voz."
"Changes every 25-60 minutes, as the month allows":
