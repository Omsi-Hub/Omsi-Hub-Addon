"The copy goes into openOMSI's own folder, beside this bus. Nothing in OMSI 2 is changed or written over.":
  nl: "Het exemplaar komt in de eigen map van openOMSI, naast deze bus. In OMSI 2 wordt niets veranderd of overschreven."
  de: "Die Kopie kommt in den eigenen Ordner von openOMSI, neben diesen Bus. In OMSI 2 wird nichts geändert oder überschrieben."
  fr: "La copie va dans le dossier propre d’openOMSI, à côté de ce bus. Rien n’est modifié ni écrasé dans OMSI 2."
  ru: "Копия ляжет в собственную папку openOMSI, рядом с этим автобусом. В OMSI 2 ничего не меняется и не перезаписывается."
  uk: "Копія ляже до власної теки openOMSI, поруч із цим автобусом. В OMSI 2 нічого не змінюється й не перезаписується."
  pl: "Kopia trafi do własnego folderu openOMSI, obok tego autobusu. W OMSI 2 nic nie zostanie zmienione ani nadpisane."
  es: "La copia va a la carpeta propia de openOMSI, junto a este autobús. No se cambia ni se sobrescribe nada de OMSI 2."
