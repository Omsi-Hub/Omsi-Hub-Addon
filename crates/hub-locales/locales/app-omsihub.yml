"A logo, a coat of arms, a photo: PNG, JPG, BMP, TGA or SVG. Choose one or drop it onto the window, then click on the bus where it goes.":
  nl: "Een logo, een wapen, een foto: PNG, JPG, BMP, TGA of SVG. Kies er een of sleep hem op het venster en klik dan op de bus waar hij moet komen."
  de: "Ein Logo, ein Wappen, ein Foto: PNG, JPG, BMP, TGA oder SVG. Wähle eines oder ziehe es auf das Fenster und klicke dann auf den Bus, wo es hin soll."
  fr: "Un logo, un blason, une photo : PNG, JPG, BMP, TGA ou SVG. Choisis-en une ou dépose-la sur la fenêtre, puis clique sur le bus à l'endroit voulu."
  ru: "Логотип, герб, фото: PNG, JPG, BMP, TGA или SVG. Выберите файл или перетащите его в окно, затем щёлкните место на автобусе."
  uk: "Логотип, герб, фото: PNG, JPG, BMP, TGA або SVG. Виберіть файл або перетягніть його у вікно, потім клацніть місце на автобусі."
  pl: "Logo, herb, zdjęcie: PNG, JPG, BMP, TGA lub SVG. Wybierz plik albo upuść go na okno, a potem kliknij na autobusie, gdzie ma być."
  es: "Un logo, un escudo, una foto: PNG, JPG, BMP, TGA o SVG. Elige una o suéltala en la ventana y luego haz clic en el autobús donde debe ir."
