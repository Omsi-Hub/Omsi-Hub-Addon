"A passenger pays %{fare} on average; the authority pays %{km} for every kilometre run, more the better your reputation.":
  nl: "Een reiziger betaalt gemiddeld %{fare}; de opdrachtgever betaalt %{km} per gereden kilometer, meer naarmate je reputatie beter is."
