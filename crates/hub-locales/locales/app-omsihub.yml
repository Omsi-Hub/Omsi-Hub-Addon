"When the company's day is over, close it with \"Close the day\" at the top: the tours are run, the money booked, and the next day begins. What you drove yourself on the company's lines counts as measured.":
  nl: "Als de bedrijfsdag voorbij is, sluit je hem af met \"Dag afsluiten\" bovenaan: de omlopen worden gereden, het geld geboekt en de volgende dag begint. Wat je zelf op de lijnen van het bedrijf reed, telt als gemeten."
  de: "Ist der Betriebstag vorbei, schließe ihn oben mit \"Tag abschließen\" ab: die Umläufe werden gefahren, das Geld gebucht und der nächste Tag beginnt. Was du selbst auf den Linien des Unternehmens gefahren bist, zählt als gemessen."
  fr: "Quand la journée est finie, clôturez-la avec « Clôturer la journée » en haut : les services roulent, l'argent est comptabilisé et le jour suivant commence. Ce que vous avez conduit vous-même sur les lignes de l'entreprise compte comme mesuré."
  ru: "Когда день предприятия закончится, закройте его кнопкой «Закрыть день» вверху: выходы выполняются, деньги проводятся, начинается следующий день. То, что вы проехали сами на линиях предприятия, засчитывается как измеренное."
  uk: "Коли день підприємства закінчиться, закрийте його кнопкою «Закрити день» угорі: обороти виконуються, гроші проводяться, починається наступний день. Те, що ви проїхали самі на лініях підприємства, зараховується як виміряне."
  pl: "Gdy dzień przedsiębiorstwa się skończy, zamknij go przyciskiem „Zamknij dzień” u góry: brygady jadą, pieniądze są księgowane i zaczyna się następny dzień. To, co sam przejechałeś na liniach przedsiębiorstwa, liczy się jako zmierzone."
  es: "Cuando termine el día de la empresa, ciérralo con \"Cerrar el día\" arriba: se hacen los recorridos, se contabiliza el dinero y empieza el día siguiente. Lo que hayas conducido tú en las líneas de la empresa cuenta tal como se midió."
