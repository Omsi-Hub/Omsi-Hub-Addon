"The list price is where the talk begins: ask for a discount, make an offer, ask for extras. Nothing is booked until you sign the contract.":
  nl: "De catalogusprijs is het begin van het gesprek: vraag om korting, doe een bod, vraag om extra's. Er wordt niets geboekt tot je het contract tekent."
  de: "Der Listenpreis ist der Anfang des Gesprächs: um Rabatt bitten, ein Angebot machen, Extras verlangen. Gebucht wird erst, wenn Sie den Vertrag unterschreiben."
  fr: "Le prix catalogue n'est que le début de la discussion : demandez une remise, faites une offre, demandez des extras. Rien n'est comptabilisé avant la signature du contrat."
  ru: "Цена по прайсу - лишь начало разговора: попросите скидку, сделайте предложение, попросите дополнения. Ничего не проводится, пока вы не подпишете договор."
  uk: "Ціна за прайсом - лише початок розмови: попросіть знижку, зробіть пропозицію, попросіть доповнення. Нічого не проводиться, доки ви не підпишете договір."
  pl: "Cena katalogowa to dopiero początek rozmowy: poproś o rabat, złóż ofertę, poproś o dodatki. Nic nie jest księgowane, dopóki nie podpiszesz umowy."
  es: "El precio de lista es donde empieza la conversación: pide un descuento, haz una oferta, pide extras. No se contabiliza nada hasta que firmes el contrato."
