"From the moment you choose, the line's tours run as they are planned. A tour without its bus or a driver is dropped then, with the contract's penalty - plan first, then start.":
  nl: "Vanaf het moment dat je kiest rijden de omlopen van de lijn zoals ze gepland zijn. Een omloop zonder bus of chauffeur valt dan uit, met de contractboete - eerst plannen, dan starten."
  de: "Ab dem gewählten Zeitpunkt fahren die Umläufe der Linie, wie sie geplant sind. Ein Umlauf ohne Bus oder Fahrer fällt dann aus, mit der Vertragsstrafe - erst planen, dann starten."
  fr: "À partir du moment choisi, les services de la ligne roulent tels qu'ils sont planifiés. Un service sans bus ou sans conducteur est alors supprimé, avec la pénalité du contrat - planifiez d'abord, lancez ensuite."
  ru: "С выбранного момента обороты линии работают по плану. Оборот без автобуса или водителя тогда отменяется со штрафом по договору - сначала планируйте, потом запускайте."
  uk: "З обраного моменту обороти лінії працюють за планом. Оборот без автобуса чи водія тоді скасовується зі штрафом за договором - спершу плануйте, потім запускайте."
  pl: "Od wybranej chwili brygady linii kursują zgodnie z planem. Brygada bez autobusu lub kierowcy wtedy wypada, z karą umowną - najpierw planuj, potem uruchamiaj."
  es: "Desde el momento que elijas, los recorridos de la línea circulan tal como están planificados. Un recorrido sin autobús o sin conductor se suprime entonces, con la penalización del contrato: primero planifica, luego inicia."
