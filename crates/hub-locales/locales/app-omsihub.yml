"The fleet is empty. Buy a new bus, one of the week's used ones, lease one for years or rent one for a few days - each is a bus installed in your OMSI.":
  nl: "Het wagenpark is leeg. Koop een nieuwe bus of een van de tweedehands bussen van de week, lease er een voor jaren of huur er een voor een paar dagen - elk is een bus die in je OMSI geïnstalleerd is."
  de: "Der Fuhrpark ist leer. Kaufe einen neuen Bus oder einen der gebrauchten der Woche, lease einen für Jahre oder miete einen für ein paar Tage - jeder ist ein in deinem OMSI installierter Bus."
  fr: "Le parc est vide. Achetez un bus neuf ou l'un des bus d'occasion de la semaine, prenez-en un en leasing pour des années ou louez-en un pour quelques jours - chacun est un bus installé dans votre OMSI."
  ru: "Парк пуст. Купите новый автобус или один из подержанных на этой неделе, возьмите в лизинг на годы или арендуйте на несколько дней - каждый из них установлен в вашем OMSI."
  uk: "Парк порожній. Купіть новий автобус або один із вживаних цього тижня, візьміть у лізинг на роки чи орендуйте на кілька днів - кожен із них установлено у вашому OMSI."
  pl: "Tabor jest pusty. Kup nowy autobus lub jeden z używanych z tego tygodnia, weź w leasing na lata albo wynajmij na kilka dni - każdy to autobus zainstalowany w twoim OMSI."
  es: "La flota está vacía. Compra un autobús nuevo, uno de los usados de la semana, coge uno en leasing durante años o alquila uno por unos días; cada uno es un autobús instalado en tu OMSI."
