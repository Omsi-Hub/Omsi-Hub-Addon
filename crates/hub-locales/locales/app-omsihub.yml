  pl: "Bez niego autobus weźmie %{file}."
  es: "Sin él, el autobús usa %{file}."
"Without it the IBIS takes none of the map's codes, and the destination displays stay blank.":
  nl: "Zonder neemt de IBIS geen enkele code van de kaart aan en blijft de bestemmingsfilm leeg."
  de: "Ohne sie nimmt das IBIS keinen Code der Karte an, und die Zielanzeigen bleiben leer."
  fr: "Sans lui, l’IBIS refuse tous les codes de la carte et les girouettes restent vides."
  ru: "Без него IBIS не примет ни одного кода карты, а указатели маршрута останутся пустыми."
  uk: "Без нього IBIS не прийме жодного коду мапи, а покажчики маршруту лишаться порожніми."
  pl: "Bez niego IBIS nie przyjmie żadnego kodu mapy, a wyświetlacze kierunkowe pozostaną puste."
  es: "Sin él, el IBIS no acepta ningún código del mapa y los indicadores de destino se quedan en blanco."
"Add %{file} beside this bus? It came with the map and knows %{n} destinations.":
  nl: "Zal ik %{file} bij deze bus neerzetten? Het kwam met de kaart mee en kent %{n} bestemmingen."
  de: "%{file} neben diesen Bus legen? Sie kam mit der Karte und kennt %{n} Ziele."
  fr: "Placer %{file} à côté de ce bus ? Il est venu avec la carte et connaît %{n} destinations."
  ru: "Положить %{file} рядом с этим автобусом? Он пришёл вместе с картой и знает %{n} конечных пунктов."
  uk: "Покласти %{file} поруч із цим автобусом? Він прийшов разом із мапою і знає %{n} кінцевих зупинок."
  pl: "Położyć %{file} obok tego autobusu? Przyszedł razem z mapą i zna %{n} kierunków."
  es: "¿Añadir %{file} junto a este autobús? Venía con el mapa y conoce %{n} destinos."
"Add %{file} beside this bus? It is the copy %{folder} carries, and knows %{n} destinations.":
  nl: "Zal ik %{file} bij deze bus neerzetten? Het is het exemplaar dat %{folder} heeft, en het kent %{n} bestemmingen."
  de: "%{file} neben diesen Bus legen? Es ist die Kopie, die %{folder} hat, und sie kennt %{n} Ziele."
  fr: "Placer %{file} à côté de ce bus ? C’est la copie qu’a %{folder}, et il connaît %{n} destinations."
  ru: "Положить %{file} рядом с этим автобусом? Это копия из %{folder}, она знает %{n} конечных пунктов."
  uk: "Покласти %{file} поруч із цим автобусом? Це копія з %{folder}, вона знає %{n} кінцевих зупинок."
  pl: "Położyć %{file} obok tego autobusu? To kopia, którą ma %{folder}, i zna %{n} kierunków."
  es: "¿Añadir %{file} junto a este autobús? Es la copia que tiene %{folder} y conoce %{n} destinos."
