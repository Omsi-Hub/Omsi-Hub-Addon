  es: "Líneas propias en cualquier mapa, libreas, el horario y los objetos del mapa."
"Make the map your own: lines of your own, liveries, the timetable and the map's objects.":
  nl: "Maak de kaart van jezelf: eigen lijnen, lakken, de dienstregeling en de objecten van de kaart."
  de: "Mach die Karte zu deiner: eigene Linien, Lackierungen, der Fahrplan und die Objekte der Karte."
  fr: "Faites de la carte la vôtre : vos lignes, les livrées, l'horaire et les objets de la carte."
  ru: "Сделайте карту своей: свои линии, окраски, расписание и объекты карты."
  uk: "Зробіть мапу своєю: власні лінії, фарбування, розклад і об’єкти мапи."
  pl: "Zrób mapę po swojemu: własne linie, malowania, rozkład jazdy i obiekty mapy."
  es: "Haz tuyo el mapa: líneas propias, libreas, el horario y los objetos del mapa."
"Click the stops in order: the way between them is found over the roads. Saved, the line is driven by you and by the timetable's buses.":
  nl: "Klik de haltes op volgorde aan: de weg ertussen wordt over de wegen gezocht. Opgeslagen rijd jij de lijn en de bussen van de dienstregeling ook."
  de: "Klicke die Haltestellen der Reihe nach an: der Weg dazwischen wird über die Straßen gesucht. Gespeichert fährst du die Linie, und die Fahrplanbusse auch."
  fr: "Cliquez les arrêts dans l'ordre : le chemin entre eux est trouvé sur les routes. Enregistrée, la ligne est conduite par vous et par les bus de l'horaire."
  ru: "Щёлкайте остановки по порядку: путь между ними прокладывается по дорогам. Сохранённую линию водите вы и автобусы расписания."
  uk: "Клацайте зупинки по черзі: шлях між ними прокладається дорогами. Збережену лінію водите ви й автобуси розкладу."
  pl: "Klikaj przystanki po kolei: droga między nimi jest wyznaczana po drogach. Zapisaną linią jeździsz ty i autobusy z rozkładu."
  es: "Haz clic en las paradas por orden: el camino entre ellas se busca por las calles. Una vez guardada, la línea la conduces tú y los autobuses del horario."
"Compose a line of your own on any map: click its stops, the way between them is found over the roads. You and the timetable's buses drive it.":
  nl: "Stel op elke kaart een eigen lijn samen: klik de haltes aan, de weg ertussen wordt over de wegen gezocht. Jij en de bussen van de dienstregeling rijden hem."
  de: "Stelle auf jeder Karte eine eigene Linie zusammen: klicke ihre Haltestellen an, der Weg dazwischen wird über die Straßen gesucht. Du und die Fahrplanbusse fahren sie."
  fr: "Composez votre propre ligne sur n'importe quelle carte : cliquez ses arrêts, le chemin est trouvé sur les routes. Vous et les bus de l'horaire la conduisez."
  ru: "Составьте свою линию на любой карте: щёлкните её остановки, путь найдётся по дорогам. Её водите вы и автобусы расписания."
  uk: "Складіть власну лінію на будь-якій мапі: клацніть її зупинки, шлях знайдеться дорогами. Її водите ви й автобуси розкладу."
  pl: "Ułóż własną linię na dowolnej mapie: kliknij jej przystanki, droga zostanie wyznaczona po drogach. Jeździsz nią ty i autobusy z rozkładu."
  es: "Crea una línea propia en cualquier mapa: haz clic en sus paradas y el camino entre ellas se busca por las calles. La conduces tú y los autobuses del horario."
"Paint a bus in colours of your own and drive it.":
  nl: "Lak een bus in je eigen kleuren en rijd ermee."
  de: "Lackiere einen Bus in deinen Farben und fahre ihn."
  fr: "Peignez un bus à vos couleurs et conduisez-le."
  ru: "Покрасьте автобус в свои цвета и водите его."
  uk: "Пофарбуйте автобус у свої кольори та водіть його."
  pl: "Pomaluj autobus we własne kolory i jeźdź nim."
  es: "Pinta un autobús con tus propios colores y condúcelo."
"The map's lines: their tours and when each trip leaves.":
  nl: "De lijnen van de kaart: hun omlopen en wanneer elke rit vertrekt."
  de: "Die Linien der Karte: ihre Umläufe und wann jede Fahrt abfährt."
  fr: "Les lignes de la carte : leurs services et le départ de chaque course."
  ru: "Линии карты: их выпуски и когда отправляется каждый рейс."
