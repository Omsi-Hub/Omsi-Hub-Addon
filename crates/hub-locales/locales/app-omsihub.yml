"Simple: buy at the list price in one click. Advanced: haggle with the dealer and sign a contract. Both stay at hand on every bus.":
  nl: "Eenvoudig: koop met één klik voor de catalogusprijs. Uitgebreid: onderhandel met de dealer en teken een contract. Beide blijven bij elke bus bereikbaar."
  de: "Einfach: zum Listenpreis mit einem Klick kaufen. Erweitert: mit dem Händler verhandeln und einen Vertrag unterschreiben. Beides bleibt bei jedem Bus erreichbar."
  fr: "Simple : achetez au prix catalogue en un clic. Avancé : négociez avec le concessionnaire et signez un contrat. Les deux restent accessibles pour chaque bus."
  ru: "Просто: покупка по прайсу в один клик. Расширенно: торг с дилером и подписание договора. Оба способа доступны для каждого автобуса."
  uk: "Просто: купівля за прайсом в один клік. Розширено: торг із дилером і підписання договору. Обидва способи доступні для кожного автобуса."
  pl: "Prosty: kup po cenie katalogowej jednym kliknięciem. Zaawansowany: negocjuj z dealerem i podpisz umowę. Oba sposoby są dostępne przy każdym autobusie."
  es: "Simple: compra al precio de lista con un clic. Avanzado: regatea con el concesionario y firma un contrato. Ambos están a mano en cada autobús."
"The day's special offers: new buses from stock at a discount, demonstrators, and fleets other operators sell. New ones come every company day.":
  nl: "De aanbiedingen van de dag: nieuwe bussen uit voorraad met korting, demonstratiebussen en vloten die andere vervoerders verkopen. Elke bedrijfsdag komen er nieuwe."
  de: "Die Angebote des Tages: neue Busse ab Lager mit Rabatt, Vorführwagen und Flotten, die andere Betriebe verkaufen. Jeden Firmentag kommen neue."
  fr: "Les offres du jour : des bus neufs en stock avec remise, des véhicules de démonstration et des flottes que d'autres exploitants vendent. De nouvelles arrivent chaque jour de l'entreprise."
  ru: "Предложения дня: новые автобусы со склада со скидкой, демонстрационные машины и парки, которые продают другие перевозчики. Каждый день компании появляются новые."
  uk: "Пропозиції дня: нові автобуси зі складу зі знижкою, демонстраційні машини та парки, які продають інші перевізники. Щодня компанії з'являються нові."
  pl: "Oferty dnia: nowe autobusy z magazynu z rabatem, egzemplarze demonstracyjne i floty sprzedawane przez innych przewoźników. Nowe pojawiają się każdego dnia firmy."
  es: "Las ofertas especiales del día: autobuses nuevos de stock con descuento, unidades de demostración y flotas que venden otros operadores. Cada día de la empresa llegan nuevas."
"No special offers today. Come back tomorrow.":
  nl: "Vandaag geen aanbiedingen. Kom morgen terug."
  de: "Heute keine Angebote. Schauen Sie morgen wieder vorbei."
  fr: "Pas d'offres aujourd'hui. Revenez demain."
  ru: "Сегодня предложений нет. Загляните завтра."
  uk: "Сьогодні пропозицій немає. Загляньте завтра."
  pl: "Dziś brak ofert. Wróć jutro."
  es: "Hoy no hay ofertas especiales. Vuelve mañana."
"The used market changes every day: each bus stays four days or until it is sold. Older models than the company's year allows new are found here.":
  nl: "De tweedehandsmarkt verandert elke dag: elke bus blijft vier dagen staan of tot hij verkocht is. Modellen die in het jaar van het bedrijf niet meer nieuw te koop zijn, vind je hier."
  de: "Der Gebrauchtmarkt ändert sich jeden Tag: Jeder Bus bleibt vier Tage oder bis er verkauft ist. Ältere Modelle, als das Jahr der Firma neu zulässt, finden sich hier."
  fr: "Le marché de l'occasion change chaque jour : chaque bus reste quatre jours ou jusqu'à sa vente. Les modèles plus anciens que l'année de l'entreprise ne permet en neuf se trouvent ici."
  ru: "Рынок подержанных меняется каждый день: автобус стоит четыре дня или до продажи. Модели старше, чем позволяет купить новыми год компании, ищите здесь."
  uk: "Ринок вживаних змінюється щодня: автобус стоїть чотири дні або до продажу. Моделі, старші ніж дозволяє купити новими рік компанії, шукайте тут."
  pl: "Rynek używanych zmienia się codziennie: każdy autobus stoi cztery dni albo do sprzedaży. Starsze modele, niż rok firmy pozwala kupić jako nowe, znajdziesz tutaj."
  es: "El mercado de usados cambia cada día: cada autobús está cuatro días o hasta que se vende. Aquí se encuentran modelos más antiguos de los que el año de la empresa permite comprar nuevos."
