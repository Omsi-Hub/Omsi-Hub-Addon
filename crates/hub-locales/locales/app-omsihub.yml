  es: "Conoce el %{percent}% de los destinos de este servicio, lo mejor de lo instalado. Sal con él o elige otro tú mismo."
"openOMSI picked it for this duty: the map's own depot runs it. Take it out, or pick one yourself.":
  nl: "openOMSI koos hem voor deze dienst: de remise van de kaart zelf rijdt ermee. Neem hem mee, of kies er zelf een."
  de: "openOMSI hat ihn für diesen Dienst gewählt: Der Betriebshof der Karte fährt ihn selbst. Nimm ihn mit, oder wähle selbst."
  fr: "openOMSI l’a choisi pour ce service : le dépôt de la carte l’utilise lui-même. Prenez-le, ou choisissez vous-même."
  ru: "openOMSI выбрал его для этой смены: на нём ездит депо самой карты. Берите его или выберите сами."
  uk: "openOMSI вибрав його для цієї зміни: на ньому їздить депо самої карти. Беріть його або виберіть самі."
  pl: "openOMSI wybrał go dla tej służby: jeździ nim zajezdnia samej mapy. Weź go albo wybierz sam."
  es: "openOMSI lo ha elegido para este servicio: la propia cochera del mapa lo usa. Sal con él o elige otro tú mismo."
