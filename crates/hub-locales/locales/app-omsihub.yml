  fr: "Un voyageur paie en moyenne %{fare} ; l'autorité organisatrice paie %{km} par kilomètre parcouru, davantage si votre réputation est meilleure."
  ru: "Пассажир в среднем платит %{fare}; заказчик платит %{km} за каждый пройденный километр, больше при лучшей репутации."
