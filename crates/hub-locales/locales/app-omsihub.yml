  nl: "%{b} bussen in %{n} omlopen (sommige alleen voor de spits), %{t} ritten"
  de: "%{b} Busse in %{n} Umläufen (einige nur für die Spitzen), %{t} Fahrten"
  fr: "%{b} bus en %{n} services (certains pour les heures de pointe seulement), %{t} courses"
