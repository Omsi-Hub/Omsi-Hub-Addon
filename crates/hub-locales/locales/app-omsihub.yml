  pl: "Kto prowadzi?"
  es: "¿Quién conduce?"
"Your duties, kilometres and level are kept per driver. Everything stays on this computer: there is nothing to sign in to.":
  nl: "Je diensten, kilometers en niveau worden per chauffeur bewaard. Alles blijft op deze computer staan: er is nergens om in te loggen."
  de: "Deine Dienste, Kilometer und deine Stufe werden je Fahrer gespeichert. Alles bleibt auf diesem Rechner: Anmelden musst du dich nirgends."
  fr: "Tes services, tes kilomètres et ton niveau sont gardés par conducteur. Tout reste sur cet ordinateur : il n’y a aucun compte à créer."
  ru: "Твои смены, километры и уровень хранятся для каждого водителя. Всё остаётся на этом компьютере: входить никуда не нужно."
  uk: "Твої зміни, кілометри й рівень зберігаються для кожного водія. Усе залишається на цьому комп’ютері: входити нікуди не треба."
  pl: "Twoje służby, kilometry i poziom są zapisywane dla każdego kierowcy. Wszystko zostaje na tym komputerze: nigdzie nie trzeba się logować."
  es: "Tus servicios, kilómetros y nivel se guardan por conductor. Todo se queda en este equipo: no hay que iniciar sesión en ningún sitio."
