  de: "Das Unternehmen kann die Linie nicht bezahlen: nimm einen Kredit auf der Seite Finanzen oder mach die Linie kleiner."
  fr: "L'entreprise ne peut pas payer la ligne : prenez un prêt sur la page Finances, ou réduisez-la."
  ru: "Компании не хватает денег на линию: возьмите кредит на странице «Финансы» или сделайте линию меньше."
  uk: "Компанії не вистачає грошей на лінію: візьміть кредит на сторінці «Фінанси» або зробіть лінію меншою."
  pl: "Firmy nie stać na linię: weź kredyt na stronie Finanse albo zmniejsz linię."
  es: "La empresa no puede pagar la línea: pide un préstamo en la página Finanzas o hazla más pequeña."
