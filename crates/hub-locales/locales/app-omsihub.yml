"Giving the leased bus back early costs %{amount} (three monthly rates).":
  nl: "De leasebus vroeg teruggeven kost %{amount} (drie maandtermijnen)."
  de: "Den Leasingbus früher zurückzugeben kostet %{amount} (drei Monatsraten)."
  fr: "Rendre le bus en leasing plus tôt coûte %{amount} (trois mensualités)."
  ru: "Досрочный возврат лизингового автобуса стоит %{amount} (три месячных платежа)."
