"Omsi-Hub's look: you set up your duty step by step on the map, with your bus in 3D.":
  nl: "De look van Omsi-Hub: je zet je dienst stap voor stap klaar op de kaart, met je bus in 3D."
  de: "Der Look von Omsi-Hub: Du stellst deinen Dienst Schritt für Schritt auf der Karte zusammen, mit deinem Bus in 3D."
  fr: "Le style d’Omsi-Hub : tu prépares ton service étape par étape sur la carte, avec ton bus en 3D."
  ru: "Стиль Omsi-Hub: смена собирается шаг за шагом на карте, а автобус виден в 3D."
  uk: "Стиль Omsi-Hub: зміна складається крок за кроком на мапі, а автобус видно в 3D."
  pl: "Wygląd Omsi-Hub: służbę układasz krok po kroku na mapie, a autobus widzisz w 3D."
  es: "El estilo de Omsi-Hub: preparas tu servicio paso a paso en el mapa, con tu autobús en 3D."
"openOMSI's own launcher: every page in one window, with the menu on the left.":
  nl: "De eigen launcher van openOMSI: elke pagina in één venster, met het menu links."
  de: "Der eigene Launcher von openOMSI: jede Seite in einem Fenster, mit dem Menü links."
  fr: "Le lanceur propre à openOMSI : chaque page dans une seule fenêtre, avec le menu à gauche."
  ru: "Собственный лаунчер openOMSI: все страницы в одном окне, меню слева."
  uk: "Власний лаунчер openOMSI: усі сторінки в одному вікні, меню ліворуч."
  pl: "Własny launcher openOMSI: każda strona w jednym oknie, z menu po lewej."
  es: "El launcher propio de openOMSI: todas las páginas en una ventana, con el menú a la izquierda."
