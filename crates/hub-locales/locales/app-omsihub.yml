  es: "Generoso: subvenciones para autobuses nuevos, más pasajeros, pocas averías, préstamos sin intereses."
"German city bus prices and wages, contracts with penalties, a margin of a few per cent.":
  nl: "Duitse prijzen en lonen voor stadsbussen, contracten met boetes, een marge van een paar procent."
  de: "Deutsche Stadtbuspreise und -löhne, Verträge mit Vertragsstrafen, eine Marge von wenigen Prozent."
  fr: "Prix et salaires des bus urbains allemands, contrats avec pénalités, une marge de quelques pour cent."
  ru: "Цены и зарплаты немецких городских автобусов, контракты со штрафами, маржа в несколько процентов."
  uk: "Ціни й зарплати німецьких міських автобусів, контракти зі штрафами, маржа кілька відсотків."
  pl: "Niemieckie ceny i płace w komunikacji miejskiej, umowy z karami, marża kilku procent."
  es: "Precios y salarios de autobús urbano alemán, contratos con penalizaciones, un margen de pocos puntos porcentuales."
"Tight: prices rise faster than the contract pays, dear loans, more breakdowns and illness.":
  nl: "Krap: prijzen stijgen sneller dan het contract betaalt, dure leningen, meer pech en ziekte."
  de: "Knapp: die Preise steigen schneller als der Vertrag zahlt, teure Kredite, mehr Pannen und Krankheit."
  fr: "Serré : les prix montent plus vite que ce que paie le contrat, prêts chers, plus de pannes et de maladies."
  ru: "Жёстко: цены растут быстрее, чем платит контракт, дорогие кредиты, больше поломок и болезней."
  uk: "Жорстко: ціни ростуть швидше, ніж платить контракт, дорогі кредити, більше поломок і хвороб."
  pl: "Ciasno: ceny rosną szybciej, niż płaci umowa, drogie kredyty, więcej awarii i chorób."
  es: "Ajustado: los precios suben más rápido de lo que paga el contrato, préstamos caros, más averías y bajas por enfermedad."
