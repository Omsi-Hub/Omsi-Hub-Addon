  ru: "Он знает %{percent}% конечных пунктов этой смены - лучший из установленных. Берите его или выберите сами."
  uk: "Він знає %{percent}% кінцевих пунктів цієї зміни - найкращий із встановлених. Беріть його або виберіть самі."
