"Your own transport company: buses, people and lines, in a time of its own.":
  nl: "Je eigen vervoersbedrijf: bussen, mensen en lijnen, in een eigen tijd."
  de: "Deine eigene Verkehrsfirma: Busse, Leute und Linien, in einer eigenen Zeit."
  fr: "Votre propre entreprise de transport : bus, personnel et lignes, dans un temps à elle."
  ru: "Ваша транспортная компания: автобусы, люди и линии, в собственном времени."
  uk: "Ваша транспортна компанія: автобуси, люди й лінії, у власному часі."
  pl: "Twoja własna firma przewozowa: autobusy, ludzie i linie, we własnym czasie."
  es: "Tu propia empresa de transporte: autobuses, personal y líneas, con su propio tiempo."
"Run your own transport company on a map: buy, lease or rent buses, hire drivers and run the map's lines or your own. The company has its own clock: simulate its time by the hour or by days, and what happens is told as it comes; what you drive yourself counts as it was driven.":
  nl: "Run je eigen vervoersbedrijf op een kaart: koop, lease of huur bussen, neem chauffeurs aan en rijd de lijnen van de kaart of je eigen. Het bedrijf heeft een eigen klok: simuleer de tijd per uur of per dag, en wat er gebeurt wordt verteld zodra het gebeurt; wat je zelf rijdt, telt zoals het gereden is."
  de: "Führe deine eigene Verkehrsfirma auf einer Karte: kaufe, lease oder miete Busse, stelle Fahrer ein und fahre die Linien der Karte oder deine eigenen. Die Firma hat ihre eigene Uhr: simuliere ihre Zeit stunden- oder tageweise, und was geschieht, wird erzählt, wie es kommt; was du selbst fährst, zählt, wie es gefahren wurde."
  fr: "Dirigez votre propre entreprise de transport sur une carte : achetez, louez en leasing ou en location des bus, embauchez des conducteurs et exploitez les lignes de la carte ou les vôtres. L'entreprise a sa propre horloge : simulez son temps à l'heure ou au jour, et ce qui arrive est raconté au fur et à mesure ; ce que vous conduisez vous-même compte tel que conduit."
  ru: "Управляйте своей транспортной компанией на карте: покупайте, берите в лизинг или аренду автобусы, нанимайте водителей и обслуживайте линии карты или свои. У компании свои часы: симулируйте её время по часам или по дням, а события рассказываются по мере того, как происходят; то, что вы проехали сами, считается как есть."
  uk: "Керуйте власною транспортною компанією на мапі: купуйте, беріть у лізинг чи оренду автобуси, наймайте водіїв і обслуговуйте лінії мапи або свої. У компанії власний годинник: симулюйте її час по годинах або по днях, а події розповідаються, щойно стаються; те, що ви проїхали самі, рахується як є."
  pl: "Prowadź własną firmę przewozową na mapie: kupuj, leasinguj lub wynajmuj autobusy, zatrudniaj kierowców i obsługuj linie mapy albo własne. Firma ma własny zegar: symuluj jej czas godzinami lub dniami, a zdarzenia są opisywane na bieżąco; to, co sam przejedziesz, liczy się tak, jak zostało przejechane."
  es: "Dirige tu propia empresa de transporte en un mapa: compra autobuses, cógelos en leasing o alquílalos, contrata conductores y opera las líneas del mapa o las tuyas. La empresa tiene su propio reloj: simula su tiempo por horas o por días, y lo que pasa se cuenta a medida que llega; lo que conduces tú cuenta tal como se condujo."
"The day runs as planned so far. \"All tours\" shows every tour leaving and coming back.":
  nl: "De dag loopt tot nu toe volgens plan. \"Alle omlopen\" toont elke omloop die vertrekt en terugkomt."
  de: "Der Tag läuft bisher nach Plan. \"Alle Umläufe\" zeigt jeden Umlauf, der ausfährt und zurückkommt."
  fr: "La journée se déroule comme prévu. « Tous les services » montre chaque service qui part et revient."
  ru: "День пока идёт по плану. «Все обороты» показывает каждый выход и возврат."
  uk: "День поки йде за планом. «Усі обороти» показує кожен вихід і повернення."
  pl: "Dzień jak dotąd idzie zgodnie z planem. „Wszystkie obiegi” pokazuje każdy wyjazd i powrót."
  es: "Por ahora el día va según lo previsto. \"Todos los recorridos\" muestra cada recorrido que sale y vuelve."
