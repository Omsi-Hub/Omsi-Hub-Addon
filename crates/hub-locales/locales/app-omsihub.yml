"openOMSI draws a picture of every bus from its own 3D model, so that you see which bus you are choosing. It does them one by one while the launcher is idle.":
  nl: "openOMSI tekent van elke bus een plaatje uit zijn eigen 3D-model, zodat je bij het kiezen ziet welke bus het is. Dat gebeurt een voor een, terwijl de launcher niets te doen heeft."
  de: "openOMSI zeichnet von jedem Bus ein Bild aus seinem eigenen 3D-Modell, damit du bei der Auswahl siehst, welcher Bus es ist. Das geschieht einer nach dem anderen, während der Launcher nichts zu tun hat."
  fr: "openOMSI dessine une image de chaque bus à partir de son propre modèle 3D, pour que vous voyiez quel bus vous choisissez. Il les fait une par une, quand le lanceur n’a rien d’autre à faire."
  ru: "openOMSI рисует картинку каждого автобуса по его собственной 3D-модели, чтобы при выборе было видно, какой это автобус. Картинки делаются по одной, пока лаунчер свободен."
  uk: "openOMSI малює зображення кожного автобуса з його власної 3D-моделі, щоб під час вибору було видно, який це автобус. Зображення робляться по одному, поки лаунчер вільний."
  pl: "openOMSI rysuje obrazek każdego autobusu z jego własnego modelu 3D, żeby przy wyborze było widać, który to autobus. Robi je po kolei, gdy launcher nie ma nic do roboty."
  es: "openOMSI dibuja una imagen de cada autobús a partir de su propio modelo 3D, para que veas qué autobús estás eligiendo. Las hace una a una mientras el launcher está inactivo."
