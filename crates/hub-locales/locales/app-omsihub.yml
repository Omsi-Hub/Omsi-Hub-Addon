  de: "Kein vollständiges OMSI 2: Es fehlt %{what}."
  fr: "Pas un OMSI 2 complet : il manque %{what}."
  ru: "Это не полный OMSI 2: не хватает %{what}."
  uk: "Це не повний OMSI 2: бракує %{what}."
  pl: "To nie jest kompletne OMSI 2: brakuje %{what}."
  es: "No es un OMSI 2 completo: le falta %{what}."
"Steam, the box version, a folder you moved yourself - all fine. openOMSI only reads it and never writes into it.":
  nl: "Steam, de doosversie, een map die je zelf hebt verplaatst - allemaal goed. openOMSI leest er alleen uit en schrijft er nooit in."
  de: "Steam, die Box-Version, ein selbst verschobener Ordner - alles recht. openOMSI liest nur daraus und schreibt nie hinein."
  fr: "Steam, la version en boîte, un dossier déplacé à la main - tout convient. openOMSI ne fait qu’y lire et n’y écrit jamais."
  ru: "Steam, коробочная версия, папка, которую ты перенёс сам, - всё подходит. openOMSI только читает её и никогда в неё не пишет."
  uk: "Steam, коробкова версія, тека, яку ти переніс сам, - усе підходить. openOMSI лише читає її й ніколи в неї не пише."
  pl: "Steam, wersja pudełkowa, folder przeniesiony samodzielnie - wszystko w porządku. openOMSI tylko z niego czyta i nigdy do niego nie zapisuje."
  es: "Steam, la versión en caja, una carpeta que moviste tú mismo: todo vale. openOMSI solo lee de ella y nunca escribe en ella."
"Type a name for your driver first.":
  nl: "Typ eerst een naam voor je chauffeur."
  de: "Gib zuerst einen Namen für deinen Fahrer ein."
  fr: "Tape d’abord un nom pour ton conducteur."
  ru: "Сначала введи имя водителя."
  uk: "Спершу введи ім’я водія."
  pl: "Najpierw wpisz imię kierowcy."
  es: "Escribe primero un nombre para tu conductor."
"The driver's name is the name of their personnel file, as in OMSI 2: the game adds every duty to it.":
  nl: "De naam van de chauffeur is de naam van zijn personeelsdossier, zoals in OMSI 2: het spel schrijft er elke dienst bij."
  de: "Der Name des Fahrers ist der Name seiner Personalakte, wie in OMSI 2: Das Spiel trägt jeden Dienst darin ein."
  fr: "Le nom du conducteur est celui de son dossier du personnel, comme dans OMSI 2 : le jeu y ajoute chaque service."
  ru: "Имя водителя — это имя его личного дела, как в OMSI 2: игра записывает туда каждую смену."
  uk: "Ім’я водія — це назва його особової справи, як в OMSI 2: гра записує туди кожну зміну."
  pl: "Imię kierowcy to nazwa jego teczki osobowej, jak w OMSI 2: gra dopisuje do niej każdą służbę."
  es: "El nombre del conductor es el nombre de su expediente, como en OMSI 2: el juego anota en él cada servicio."
"Personnel pass":
  nl: "Dienstpas"
  de: "Dienstausweis"
  fr: "Carte de service"
  ru: "Служебный пропуск"
  uk: "Службова перепустка"
  pl: "Legitymacja służbowa"
  es: "Tarjeta de empleado"
"Bus driver · level %{level}":
  nl: "Buschauffeur · niveau %{level}"
  de: "Busfahrer · Stufe %{level}"
  fr: "Conducteur de bus · niveau %{level}"
  ru: "Водитель автобуса · уровень %{level}"
  uk: "Водій автобуса · рівень %{level}"
  pl: "Kierowca autobusu · poziom %{level}"
  es: "Conductor de autobús · nivel %{level}"
"You sign on with these before every duty.":
  nl: "Hiermee meld je je aan voor elke dienst."
  de: "Damit meldest du dich vor jedem Dienst an."
  fr: "C’est avec eux que tu prends chaque service."
  ru: "С ними ты отмечаешься перед каждой сменой."
  uk: "З ними ти відмічаєшся перед кожною зміною."
  pl: "Nimi meldujesz się przed każdą służbą."
  es: "Con estos datos tomas servicio antes de cada servicio."
"Your personnel number and code are made when you first sign on for a duty.":
  nl: "Je personeelsnummer en pincode krijg je bij je eerste aanmelding voor een dienst."
  de: "Personalnummer und PIN bekommst du bei deiner ersten Anmeldung zu einem Dienst."
  fr: "Ton matricule et ton code sont créés à ta première prise de service."
  ru: "Табельный номер и код появятся при первой отметке на смену."
  uk: "Табельний номер і код з’являться під час першої відмітки на зміну."
  pl: "Numer służbowy i kod dostaniesz przy pierwszym zgłoszeniu się na służbę."
  es: "Tu número de empleado y tu código se crean la primera vez que tomas servicio."
"On this computer":
  nl: "Op deze computer"
  de: "Auf diesem Rechner"
  fr: "Sur cet ordinateur"
  ru: "На этом компьютере"
  uk: "На цьому комп’ютері"
  pl: "Na tym komputerze"
  es: "En este equipo"
"From now on openOMSI opens in its classic launcher.":
  nl: "Voortaan opent openOMSI in de klassieke launcher."
  de: "Ab jetzt öffnet sich openOMSI im klassischen Launcher."
  fr: "Désormais, openOMSI s’ouvre dans le lanceur classique."
  ru: "Отныне openOMSI открывается в классическом лаунчере."
  uk: "Відтепер openOMSI відкривається в класичному лаунчері."
  pl: "Od teraz openOMSI otwiera się w klasycznym launcherze."
  es: "A partir de ahora openOMSI se abre en su launcher clásico."
"Take the tour":
  nl: "Rondleiding volgen"
  de: "Rundgang machen"
  fr: "Faire la visite"
  ru: "Пройти экскурсию"
  uk: "Пройти екскурсію"
  pl: "Zwiedź z przewodnikiem"
  es: "Hacer la visita guiada"
"A minute along the launcher: where you set up a duty, your service record and the settings.":
  nl: "Een minuutje langs de launcher: waar je een dienst klaarzet, je staat van dienst en de instellingen."
  de: "Eine Minute durch den Launcher: wo du einen Dienst zusammenstellst, deine Dienstakte und die Einstellungen."
  fr: "Une minute dans le lanceur : où préparer un service, tes états de service et les paramètres."
  ru: "Минута по лаунчеру: где собрать смену, твой послужной список и настройки."
  uk: "Хвилина лаунчером: де скласти зміну, твій послужний список і налаштування."
  pl: "Minuta po launcherze: gdzie układasz służbę, twój przebieg służby i ustawienia."
  es: "Un minuto por el launcher: dónde preparas un servicio, tu historial de servicio y los ajustes."
"Start right away":
  nl: "Meteen beginnen"
  de: "Gleich loslegen"
  fr: "Commencer tout de suite"
  ru: "Начать сразу"
  uk: "Почати одразу"
  pl: "Zacznij od razu"
  es: "Empezar ya"
"Straight to the start: choose how you want to drive today.":
  nl: "Direct naar de start: kies hoe je vandaag wilt rijden."
  de: "Direkt zum Start: Wähle, wie du heute fahren möchtest."
  fr: "Directement au départ : choisis comment tu veux conduire aujourd’hui."
  ru: "Сразу к старту: выбери, как ты хочешь ездить сегодня."
  uk: "Одразу до старту: обери, як ти хочеш їздити сьогодні."
  pl: "Prosto do startu: wybierz, jak chcesz dziś jeździć."
  es: "Directo al inicio: elige cómo quieres conducir hoy."
"Show the welcome screen again":
  nl: "Welkomscherm opnieuw tonen"
  de: "Willkommensbildschirm erneut zeigen"
  fr: "Revoir l’écran d’accueil"
  ru: "Снова показать экран приветствия"
  uk: "Знову показати екран вітання"
  pl: "Pokaż ponownie ekran powitalny"
  es: "Volver a mostrar la pantalla de bienvenida"
"Start the tour":
  nl: "Rondleiding starten"
  de: "Rundgang starten"
  fr: "Lancer la visite guidée"
  ru: "Начать экскурсию"
  uk: "Почати екскурсію"
  pl: "Rozpocznij oprowadzanie"
  es: "Empezar la visita guiada"
"openOMSI puts real duties together from the timetables of your own OMSI maps and gets the game ready for you. In a minute you'll know where everything is.":
  nl: "openOMSI maakt echte diensten uit de dienstregelingen van je eigen OMSI-kaarten en zet het spel voor je klaar. In een minuut weet je waar alles zit."
  de: "openOMSI baut echte Dienste aus den Fahrplänen deiner eigenen OMSI-Karten und richtet das Spiel für dich ein. In einer Minute weißt du, wo alles ist."
  fr: "openOMSI crée de vrais postes à partir des horaires de tes propres cartes OMSI et prépare le jeu pour toi. En une minute, tu sauras où tout se trouve."
  ru: "openOMSI составляет настоящие смены из расписаний твоих карт OMSI и готовит для тебя игру. Через минуту ты будешь знать, где что находится."
  uk: "openOMSI складає справжні зміни з розкладів твоїх мап OMSI і готує для тебе гру. За хвилину ти знатимеш, де що є."
  pl: "openOMSI układa prawdziwe zmiany z rozkładów twoich własnych map OMSI i przygotowuje dla ciebie grę. Za minutę będziesz wiedzieć, gdzie co jest."
  es: "openOMSI monta servicios reales a partir de los horarios de tus propios mapas de OMSI y te deja el juego preparado. En un minuto sabrás dónde está todo."
"A work shift is put together from the timetable's real trips. A tour is one bus's trips on one line, as OMSI gives them. And a free drive is just a map and a bus.":
  nl: "Een dienst stelt openOMSI samen uit de echte ritten van de dienstregeling. Een omloop zijn de ritten van één bus op één lijn, zoals OMSI ze geeft. En vrij rijden is alleen een kaart en een bus."
  de: "Ein Dienst wird aus den echten Fahrten des Fahrplans zusammengestellt. Ein Umlauf sind die Fahrten eines Busses auf einer Linie, wie OMSI sie vorgibt. Und freie Fahrt ist nur eine Karte und ein Bus."
  fr: "Un poste est composé à partir des vrais trajets de l'horaire. Un service, ce sont les trajets d'un bus sur une ligne, comme OMSI les donne. Et la conduite libre, c'est juste une carte et un bus."
  ru: "Смена собирается из настоящих рейсов расписания. Выход — это рейсы одного автобуса на одной линии, как их даёт OMSI. А свободная езда — это просто карта и автобус."
  uk: "Зміна складається зі справжніх рейсів розкладу. Оборот — це рейси одного автобуса на одній лінії, як їх дає OMSI. А вільна поїздка — це лише мапа й автобус."
  pl: "Zmiana jest układana z prawdziwych kursów rozkładu. Brygada to kursy jednego autobusu na jednej linii, tak jak podaje je OMSI. A jazda swobodna to tylko mapa i autobus."
  es: "Un turno de trabajo se monta con los viajes reales del horario. Un recorrido son los viajes de un autobús en una línea, tal como los da OMSI. Y la conducción libre es solo un mapa y un autobús."
"On the left, your service record: what you have driven and how close the next level is. On the right, the way to everything else: mods, settings, controls, timetables and more.":
  nl: "Links je staat van dienst: wat je gereden hebt en hoe dicht het volgende niveau is. Rechts de weg naar al het andere: mods, instellingen, toetsen, dienstregelingen en meer."
  de: "Links deine Dienstakte: was du gefahren bist und wie nah die nächste Stufe ist. Rechts der Weg zu allem anderen: Mods, Einstellungen, Steuerung, Fahrpläne und mehr."
  fr: "À gauche, tes états de service : ce que tu as conduit et à quel point le niveau suivant est proche. À droite, le chemin vers tout le reste : mods, paramètres, commandes, horaires et plus."
  ru: "Слева — твой послужной список: что ты уже проехал и сколько осталось до следующего уровня. Справа — путь ко всему остальному: моды, настройки, управление, расписания и не только."
  uk: "Ліворуч — твій послужний список: що ти вже проїхав і скільки лишилося до наступного рівня. Праворуч — шлях до всього іншого: моди, налаштування, керування, розклади й не тільки."
  pl: "Po lewej twój przebieg służby: co już przejechałeś i jak blisko jest następny poziom. Po prawej droga do całej reszty: mody, ustawienia, sterowanie, rozkłady i więcej."
  es: "A la izquierda, tu historial de servicio: lo que has conducido y cuánto te falta para el siguiente nivel. A la derecha, el acceso a todo lo demás: mods, ajustes, controles, horarios y más."
"A flag switches the language at once; the globe beside them has all the others. The game speaks it too.":
  nl: "Met een vlag wissel je meteen van taal; achter de wereldbol ernaast staan alle andere. Het spel praat dan mee."
  de: "Eine Flagge wechselt die Sprache sofort; der Globus daneben hat alle anderen. Das Spiel spricht sie dann auch."
  fr: "Un drapeau change la langue tout de suite ; le globe à côté propose toutes les autres. Le jeu la parle aussi."
  ru: "Флаг сразу меняет язык, а под глобусом рядом — все остальные. Игра тоже заговорит на нём."
  uk: "Прапорець одразу змінює мову, а під глобусом поруч — усі інші. Гра теж говоритиме нею."
  pl: "Flaga od razu zmienia język, a pod globusem obok są wszystkie pozostałe. Gra też będzie nim mówić."
  es: "Una bandera cambia el idioma al instante; el globo de al lado tiene todos los demás. El juego también lo habla."
"Up here are the steps, in the order a driver thinks: who drives, how, where, when, what and with which bus. A step you have been to is one click away.":
  nl: "Bovenin staan de stappen, in de volgorde waarin een chauffeur denkt: wie rijdt, hoe, waar, wanneer, wat en met welke bus. Een stap waar je al was, is één klik terug."
  de: "Hier oben stehen die Schritte, in der Reihenfolge, in der ein Fahrer denkt: wer fährt, wie, wo, wann, was und mit welchem Bus. Einen Schritt, bei dem du schon warst, erreichst du mit einem Klick."
  fr: "Ici en haut, les étapes, dans l'ordre où pense un conducteur : qui conduit, comment, où, quand, quoi et avec quel bus. Une étape déjà visitée est à un clic."
  ru: "Вверху — шаги в том порядке, в каком думает водитель: кто едет, как, где, когда, что и на каком автобусе. К шагу, где ты уже был, можно вернуться одним щелчком."
  uk: "Угорі — кроки в тому порядку, в якому думає водій: хто їде, як, де, коли, що і яким автобусом. До кроку, де ти вже був, можна повернутися одним клацанням."
  pl: "U góry są kroki, w kolejności, w jakiej myśli kierowca: kto jedzie, jak, gdzie, kiedy, co i jakim autobusem. Do kroku, w którym już byłeś, wrócisz jednym kliknięciem."
  es: "Aquí arriba están los pasos, en el orden en que piensa un conductor: quién conduce, cómo, dónde, cuándo, qué y con qué autobús. Un paso por el que ya has pasado está a un clic."
"Every map you have in OMSI is here: as tiles with their picture, or as a list with the map beside it. You switch between them here.":
  nl: "Elke kaart die je in OMSI hebt, staat hier: als tegels met hun plaatje, of als lijst met de kaart ernaast. Hier wissel je tussen die twee."
  de: "Jede Karte, die du in OMSI hast, ist hier: als Kacheln mit ihrem Bild oder als Liste mit der Karte daneben. Hier wechselst du zwischen beiden."
  fr: "Toutes les cartes que tu as dans OMSI sont ici : en tuiles avec leur image, ou en liste avec la carte à côté. C'est ici que tu passes de l'une à l'autre."
  ru: "Здесь все карты, что есть у тебя в OMSI: плитками с картинкой или списком с картой рядом. Переключаешься между ними здесь."
  uk: "Тут усі мапи, які є в тебе в OMSI: плитками з картинкою або списком із мапою поруч. Перемикаєшся між ними тут."
  pl: "Tu są wszystkie mapy, które masz w OMSI: jako kafelki z obrazkiem albo jako lista z mapą obok. Tutaj przełączasz między nimi."
  es: "Aquí está cada mapa que tienes en OMSI: en mosaico con su imagen o en lista con el mapa al lado. Aquí cambias entre ambos."
"A tile shows how many tours a map has, which year it is set in and at how many places the bus can start. Click it and it's yours.":
  nl: "Op een tegel zie je hoeveel omlopen een kaart heeft, in welk jaar hij speelt en op hoeveel plekken de bus kan beginnen. Klik erop en hij is van jou."
  de: "Eine Kachel zeigt, wie viele Umläufe eine Karte hat, in welchem Jahr sie spielt und an wie vielen Orten der Bus starten kann. Klick darauf, und sie gehört dir."
  fr: "Une tuile montre combien de services compte une carte, en quelle année elle se passe et à combien d'endroits le bus peut démarrer. Clique dessus et elle est à toi."
  ru: "Плитка показывает, сколько выходов на карте, в каком году она происходит и в скольких местах может начать автобус. Нажми на неё — и она твоя."
  uk: "Плитка показує, скільки оборотів має мапа, у якому році вона відбувається і в скількох місцях може почати автобус. Клацни — і вона твоя."
  pl: "Kafelek pokazuje, ile brygad ma mapa, w którym roku się dzieje i w ilu miejscach może wystartować autobus. Kliknij, a jest twoja."
  es: "Un mosaico muestra cuántos recorridos tiene un mapa, en qué año se ambienta y en cuántos lugares puede empezar el autobús. Haz clic y es tuyo."
"On Automatic the bus is put down nearest to your duty's first stop. Or pick a place yourself: the orange marks on the map are the same places.":
  nl: "Op Automatisch wordt de bus zo dicht mogelijk bij de eerste halte van je dienst neergezet. Of kies zelf een plek: de oranje stippen op de kaart zijn dezelfde plekken."
  de: "Auf Automatisch wird der Bus möglichst nah an der ersten Haltestelle deines Dienstes abgestellt. Oder wähle selbst einen Ort: Die orangen Markierungen auf der Karte sind dieselben Orte."
  fr: "En Automatique, le bus est posé au plus près du premier arrêt de ton poste. Ou choisis toi-même un endroit : les marques orange sur la carte sont les mêmes endroits."
  ru: "В режиме «Автоматически» автобус ставится как можно ближе к первой остановке твоей смены. Или выбери место сам: оранжевые метки на карте — это те же места."
  uk: "У режимі «Автоматично» автобус ставиться якомога ближче до першої зупинки твоєї зміни. Або обери місце сам: помаранчеві позначки на мапі — це ті самі місця."
  pl: "Przy ustawieniu Automatycznie autobus stanie jak najbliżej pierwszego przystanku twojej zmiany. Albo wybierz miejsce sam: pomarańczowe znaczniki na mapie to te same miejsca."
  es: "En Automático, el autobús se coloca lo más cerca posible de la primera parada de tu servicio. O elige tú un lugar: las marcas naranjas del mapa son esos mismos lugares."
"Bottom right, on every step, is the button that takes you on. On the last step it starts the game with your duty.":
  nl: "Rechtsonder staat op elke stap de knop die je verder brengt. Op de laatste stap start hij het spel met je dienst."
  de: "Unten rechts ist auf jedem Schritt der Knopf, der dich weiterbringt. Beim letzten Schritt startet er das Spiel mit deinem Dienst."
  fr: "En bas à droite, à chaque étape, il y a le bouton qui te fait avancer. À la dernière étape, il lance le jeu avec ton poste."
  ru: "Справа внизу на каждом шаге — кнопка, которая ведёт дальше. На последнем шаге она запускает игру с твоей сменой."
  uk: "Праворуч унизу на кожному кроці — кнопка, що веде далі. На останньому кроці вона запускає гру з твоєю зміною."
  pl: "W prawym dolnym rogu, na każdym kroku, jest przycisk, który prowadzi dalej. Na ostatnim kroku uruchamia grę z twoją zmianą."
  es: "Abajo a la derecha, en cada paso, está el botón que te lleva adelante. En el último paso inicia el juego con tu servicio."
"Choose the date, the time and the weather. The timetable runs as it does on that day: on a Sunday there are often fewer buses.":
  nl: "Kies de datum, de tijd en het weer. De dienstregeling rijdt zoals op die dag: op zondag rijden er vaak minder bussen."
  de: "Wähle Datum, Uhrzeit und Wetter. Der Fahrplan läuft wie an diesem Tag: Sonntags fahren oft weniger Busse."
  fr: "Choisis la date, l'heure et la météo. L'horaire tourne comme ce jour-là : le dimanche, il y a souvent moins de bus."
  ru: "Выбери дату, время и погоду. Расписание работает как в этот день: в воскресенье автобусов часто меньше."
  uk: "Обери дату, час і погоду. Розклад працює як у цей день: у неділю автобусів часто менше."
  pl: "Wybierz datę, godzinę i pogodę. Rozkład działa jak w tym dniu: w niedzielę autobusów często jest mniej."
  es: "Elige la fecha, la hora y el clima. El horario funciona como ese día: en domingo suele haber menos autobuses."
"Say how long your shift is and in which part of the day it starts. openOMSI looks for shifts like that among the timetable's real trips.":
  nl: "Zeg hoe lang je dienst duurt en in welk deel van de dag hij begint. openOMSI zoekt zulke diensten tussen de echte ritten van de dienstregeling."
  de: "Sag, wie lang dein Dienst ist und zu welcher Tageszeit er beginnt. openOMSI sucht solche Dienste unter den echten Fahrten des Fahrplans."
  fr: "Dis combien de temps dure ton poste et à quel moment de la journée il commence. openOMSI cherche de tels postes parmi les vrais trajets de l'horaire."
  ru: "Укажи, сколько длится твоя смена и в какое время дня она начинается. openOMSI найдёт такие смены среди настоящих рейсов расписания."
  uk: "Вкажи, скільки триває твоя зміна і в яку пору дня вона починається. openOMSI знайде такі зміни серед справжніх рейсів розкладу."
  pl: "Powiedz, ile trwa twoja zmiana i o jakiej porze dnia się zaczyna. openOMSI szuka takich zmian wśród prawdziwych kursów rozkładu."
  es: "Indica cuánto dura tu turno y en qué parte del día empieza. openOMSI busca turnos así entre los viajes reales del horario."
"These are the shifts that fit. Click one to see all its trips, with the breaks in between; Find other shifts draws new ones.":
  nl: "Dit zijn de diensten die passen. Klik er een aan en je ziet al zijn ritten, met de pauzes ertussen; Andere diensten zoeken geeft je nieuwe."
  de: "Das sind die passenden Dienste. Klick einen an, um alle seine Fahrten mit den Pausen dazwischen zu sehen; Andere Dienste suchen zieht neue."
  fr: "Voici les postes qui conviennent. Clique sur l'un d'eux pour voir tous ses trajets, avec les pauses entre eux ; Chercher d'autres postes en tire de nouveaux."
  ru: "Вот подходящие смены. Нажми на любую, чтобы увидеть все её рейсы с перерывами между ними; «Найти другие смены» подберёт новые."
  uk: "Ось зміни, що підходять. Клацни будь-яку, щоб побачити всі її рейси з перервами між ними; «Знайти інші зміни» добере нові."
  pl: "To są pasujące zmiany. Kliknij jedną, a zobaczysz wszystkie jej kursy z przerwami pomiędzy; Znajdź inne zmiany losuje nowe."
  es: "Estos son los turnos que encajan. Haz clic en uno para ver todos sus viajes, con las pausas entre ellos; Buscar otros turnos saca otros nuevos."
"On the map, in blue, is where the shift you pick takes you, with every stop on the way. Drag to look around; the wheel zooms.":
  nl: "Op de kaart zie je in het blauw waar de dienst die je kiest je heen brengt, met elke halte onderweg. Sleep om rond te kijken; met het wieltje zoom je."
  de: "Auf der Karte siehst du in Blau, wohin dich der gewählte Dienst bringt, mit jeder Haltestelle unterwegs. Zieh, um dich umzusehen; das Mausrad zoomt."
  fr: "Sur la carte, en bleu, l'endroit où t'emmène le poste choisi, avec chaque arrêt en route. Fais glisser pour regarder autour ; la molette zoome."
  ru: "Синим на карте показано, куда тебя ведёт выбранная смена, со всеми остановками по пути. Перетаскивай, чтобы осмотреться; колесо мыши меняет масштаб."
  uk: "Синім на мапі показано, куди тебе веде обрана зміна, з усіма зупинками дорогою. Перетягуй, щоб роззирнутися; коліщатко змінює масштаб."
  pl: "Na mapie, na niebiesko, widać, dokąd prowadzi cię wybrana zmiana, z każdym przystankiem po drodze. Przeciągnij, by się rozejrzeć; kółko przybliża."
  es: "En el mapa, en azul, ves adónde te lleva el turno que elijas, con cada parada del camino. Arrastra para mirar alrededor; la rueda hace zoom."
"On a free drive you choose where the bus starts: at a stop where trips begin, at one on the way, or at one of the map's entry points. The traffic and the timetable's buses drive around you.":
  nl: "Bij vrij rijden kies je zelf waar de bus begint: bij een beginhalte, een halte onderweg of een ingang van de kaart. Het verkeer en de bussen uit de dienstregeling rijden om je heen."
  de: "Bei freier Fahrt wählst du, wo der Bus startet: an einer Haltestelle, an der Fahrten beginnen, an einer unterwegs oder an einem Einstiegspunkt der Karte. Der Verkehr und die Busse des Fahrplans fahren um dich herum."
  fr: "En conduite libre, tu choisis où le bus démarre : à un arrêt où commencent des trajets, à un arrêt en route ou à un point d'entrée de la carte. La circulation et les bus de l'horaire roulent autour de toi."
  ru: "При свободной езде ты сам выбираешь, где начнёт автобус: на начальной остановке, на промежуточной или в одной из точек входа карты. Вокруг ездят машины и автобусы по расписанию."
  uk: "У вільній поїздці ти сам обираєш, де почне автобус: на початковій зупинці, на проміжній або в одній із точок входу мапи. Навколо їздять машини й автобуси за розкладом."
  pl: "W jeździe swobodnej sam wybierasz, gdzie startuje autobus: na przystanku początkowym, na pośrednim albo w jednym z punktów wejścia mapy. Wokół jeździ ruch i autobusy z rozkładu."
  es: "En conducción libre eliges dónde empieza el autobús: en una parada donde empiezan viajes, en una intermedia o en uno de los puntos de entrada del mapa. El tráfico y los autobuses del horario circulan a tu alrededor."
"Want to follow a line after all? Pick it here: its route is on the map, and the navigator and the IBIS know the line. Nothing is booked.":
  nl: "Wil je toch een lijn volgen? Kies hem hier: de route staat op de kaart, en de navigatie en de IBIS kennen de lijn. Er wordt niets geboekt."
  de: "Willst du doch einer Linie folgen? Wähle sie hier: Ihre Strecke ist auf der Karte, und Navigator und IBIS kennen die Linie. Gebucht wird nichts."
  fr: "Tu veux quand même suivre une ligne ? Choisis-la ici : son itinéraire est sur la carte, et le navigateur et l'IBIS connaissent la ligne. Rien n'est réservé."
  ru: "Всё-таки хочешь ехать по линии? Выбери её здесь: маршрут появится на карте, а навигатор и IBIS будут знать линию. Ничего не бронируется."
  uk: "Усе ж хочеш їхати лінією? Обери її тут: маршрут з'явиться на мапі, а навігатор і IBIS знатимуть лінію. Нічого не бронюється."
  pl: "Chcesz jednak jechać linią? Wybierz ją tutaj: jej trasa jest na mapie, a nawigacja i IBIS znają linię. Nic nie jest rezerwowane."
  es: "¿Al final quieres seguir una línea? Elígela aquí: su ruta aparece en el mapa, y el navegador y el IBIS conocen la línea. No se registra nada."
"First the maker, then the model and the version, each with a photo. Up here you see where you are: click it to go back up. The bus that fits your duty best says so on its tile.":
  nl: "Eerst het merk, dan het model en de uitvoering, elk met een foto. Bovenaan zie je waar je bent: klik erop om terug te gaan. Op de tegel van de bus die het best bij je dienst past, staat dat erbij."
  de: "Erst der Hersteller, dann Modell und Version, jeweils mit Foto. Oben siehst du, wo du bist: Klick darauf, um zurückzugehen. Der Bus, der am besten zu deinem Dienst passt, sagt es auf seiner Kachel."
  fr: "D'abord le constructeur, puis le modèle et la version, chacun avec une photo. En haut, tu vois où tu es : clique pour remonter. Le bus qui convient le mieux à ton poste l'indique sur sa tuile."
  ru: "Сначала производитель, потом модель и версия — у каждого своё фото. Вверху видно, где ты: нажми, чтобы вернуться. Автобус, который лучше всего подходит к смене, отмечен на своей плитке."
  uk: "Спершу виробник, потім модель і версія — у кожного своє фото. Угорі видно, де ти: клацни, щоб повернутися. Автобус, що найкраще пасує до зміни, позначено на його плитці."
  pl: "Najpierw producent, potem model i wersja, każdy ze zdjęciem. U góry widać, gdzie jesteś: kliknij, by wrócić. Autobus, który najlepiej pasuje do twojej zmiany, ma to napisane na kafelku."
  es: "Primero el fabricante, luego el modelo y la versión, cada uno con foto. Aquí arriba ves dónde estás: haz clic para volver atrás. El autobús que mejor encaja con tu servicio lo indica en su mosaico."
"Your bus in the showroom: turn it with the mouse, zoom with the wheel, and choose its livery, fleet number and plate.":
  nl: "Je bus in de showroom: draai hem met de muis, zoom met het wieltje en kies zijn kleuren, wagennummer en kenteken."
  de: "Dein Bus im Showroom: Dreh ihn mit der Maus, zoom mit dem Mausrad und wähle Lackierung, Wagennummer und Kennzeichen."
  fr: "Ton bus dans le showroom : fais-le tourner à la souris, zoome avec la molette et choisis sa livrée, son numéro de parc et sa plaque."
  ru: "Твой автобус в шоуруме: крути его мышью, приближай колесом и выбирай окраску, бортовой номер и номерной знак."
  uk: "Твій автобус у шоурумі: крути його мишею, наближай коліщатком і обирай фарбування, бортовий номер і номерний знак."
  pl: "Twój autobus w salonie: obracaj go myszą, przybliżaj kółkiem i wybierz malowanie, numer taborowy i tablicę."
  es: "Tu autobús en la sala de exposición: gíralo con el ratón, haz zoom con la rueda y elige su librea, su número de flota y su matrícula."
"Shift+N switches the navigator between the map, the map with your duty board, and off. The board shows the trip you are on, the stops ahead and whether you are on time.":
  nl: "Met Shift+N wissel je de navigatie tussen de kaart, de kaart met je dienstbord, en uit. Op het dienstbord zie je je rit, de haltes die komen en of je op tijd rijdt."
  de: "Shift+N schaltet den Navigator zwischen Karte, Karte mit Diensttafel und aus. Die Tafel zeigt deine Fahrt, die kommenden Haltestellen und ob du pünktlich bist."
  fr: "Shift+N fait passer le navigateur de la carte à la carte avec ton tableau de service, puis l'éteint. Le tableau montre ton trajet, les prochains arrêts et si tu es à l'heure."
  ru: "Shift+N переключает навигатор: карта, карта с табло смены, выключен. Табло показывает текущий рейс, ближайшие остановки и идёшь ли ты по графику."
  uk: "Shift+N перемикає навігатор: мапа, мапа з табло зміни, вимкнено. Табло показує поточний рейс, найближчі зупинки і чи йдеш ти за графіком."
  pl: "Shift+N przełącza nawigację: mapa, mapa z tablicą zmiany, wyłączona. Tablica pokazuje bieżący kurs, najbliższe przystanki i czy jedziesz na czas."
  es: "Shift+N cambia el navegador entre el mapa, el mapa con tu panel de servicio y apagado. El panel muestra el viaje en el que estás, las próximas paradas y si vas puntual."
"Shift+M, or a click on the navigator, opens the city map with your route. Beside it you sign on for your duty with your personnel number and code: they are on your driver's pass, right there.":
  nl: "Shift+M, of een klik op de navigatie, opent de stadskaart met je route. Daarnaast meld je je aan voor je dienst met je personeelsnummer en code: die staan op je dienstpas, er vlak onder."
  de: "Shift+M oder ein Klick auf den Navigator öffnet den Stadtplan mit deiner Strecke. Daneben meldest du dich mit Personalnummer und Code zum Dienst an: Sie stehen gleich dort auf deinem Fahrerausweis."
  fr: "Shift+M, ou un clic sur le navigateur, ouvre le plan de la ville avec ton itinéraire. À côté, tu prends ton service avec ton matricule et ton code : ils sont juste là, sur ta carte de conducteur."
  ru: "Shift+M или щелчок по навигатору открывает карту города с твоим маршрутом. Рядом ты отмечаешься на смену табельным номером и кодом: они прямо там, на твоём удостоверении водителя."
  uk: "Shift+M або клацання по навігатору відкриває карту міста з твоїм маршрутом. Поруч ти відмічаєшся на зміну табельним номером і кодом: вони просто там, на твоєму посвідченні водія."
  pl: "Shift+M albo kliknięcie w nawigację otwiera mapę miasta z twoją trasą. Obok logujesz się na zmianę numerem służbowym i kodem: są właśnie tam, na twojej legitymacji kierowcy."
  es: "Shift+M, o un clic en el navegador, abre el plano de la ciudad con tu ruta. Al lado tomas servicio con tu número de empleado y tu código: están ahí mismo, en tu tarjeta de conductor."
"Signing on, the duty menu and the bus's screens can also be on a phone or tablet in your network. Turn it on under Settings › General › Phone & tablet; the game shows the address and the code when you drive.":
  nl: "Aanmelden, het dienstmenu en de schermen van de bus kunnen ook op een telefoon of tablet in je netwerk. Zet het aan bij Instellingen › Algemeen › Telefoon en tablet; het spel toont het adres en de code als je rijdt."
  de: "Anmelden, das Dienstmenü und die Bildschirme des Busses gehen auch auf einem Handy oder Tablet in deinem Netzwerk. Schalte es unter Einstellungen › Allgemein › Handy & Tablet ein; das Spiel zeigt Adresse und Code, wenn du fährst."
  fr: "La prise de service, le menu des postes et les écrans du bus peuvent aussi être sur un téléphone ou une tablette de ton réseau. Active-le dans Paramètres › Général › Téléphone et tablette ; le jeu affiche l'adresse et le code quand tu conduis."
  ru: "Отметка на смену, меню смен и экраны автобуса могут быть и на телефоне или планшете в твоей сети. Включи это в Настройки › Общие › Телефон и планшет; игра покажет адрес и код, когда ты поедешь."
  uk: "Відмітка на зміну, меню змін і екрани автобуса можуть бути й на телефоні чи планшеті у твоїй мережі. Увімкни це в Налаштування › Загальні › Телефон і планшет; гра покаже адресу й код, коли ти їхатимеш."
  pl: "Logowanie, menu zmian i ekrany autobusu mogą być też na telefonie lub tablecie w twojej sieci. Włącz to w Ustawienia › Ogólne › Telefon i tablet; gra pokaże adres i kod, gdy jedziesz."
  es: "La toma de servicio, el menú de servicio y las pantallas del autobús también pueden estar en un móvil o una tablet de tu red. Actívalo en Ajustes › General › Móvil y tablet; el juego muestra la dirección y el código cuando conduces."
"This question mark shows the tour again. Have a good ride!":
  nl: "Met dit vraagteken zie je de rondleiding opnieuw. Goede rit!"
  de: "Mit diesem Fragezeichen siehst du den Rundgang noch einmal. Gute Fahrt!"
  fr: "Ce point d'interrogation relance la visite. Bonne route !"
  ru: "Этот вопросительный знак покажет экскурсию снова. Счастливого пути!"
  uk: "Цей знак питання покаже екскурсію знову. Щасливої дороги!"
  pl: "Ten znak zapytania pokaże przewodnik ponownie. Szerokiej drogi!"
  es: "Este signo de interrogación vuelve a mostrar la visita guiada. ¡Buen viaje!"
"That's the tour. Have a good ride!":
  nl: "Dat was de rondleiding. Goede rit!"
  de: "Das war der Rundgang. Gute Fahrt!"
  fr: "C'était la visite. Bonne route !"
  ru: "Вот и вся экскурсия. Счастливого пути!"
  uk: "Ось і вся екскурсія. Щасливої дороги!"
  pl: "To już cały przewodnik. Szerokiej drogi!"
  es: "Esta ha sido la visita guiada. ¡Buen viaje!"
"This bus has it already: %{file}":
  nl: "Deze bus heeft het al: %{file}"
  de: "Dieser Bus hat sie schon: %{file}"
  fr: "Ce bus l’a déjà : %{file}"
  ru: "У этого автобуса он уже есть: %{file}"
  uk: "У цього автобуса він уже є: %{file}"
  pl: "Ten autobus już go ma: %{file}"
  es: "Este autobús ya lo tiene: %{file}"
"A file called %{file} lies beside this bus already, and is never written over":
  nl: "Naast deze bus ligt al een bestand %{file}, en dat wordt nooit overschreven"
  de: "Neben diesem Bus liegt schon eine Datei %{file}, und sie wird nie überschrieben"
  fr: "Un fichier %{file} se trouve déjà à côté de ce bus, et il n’est jamais écrasé"
  ru: "Рядом с этим автобусом уже лежит файл %{file}, и он никогда не перезаписывается"
  uk: "Поруч із цим автобусом уже лежить файл %{file}, і його ніколи не буде перезаписано"
  pl: "Obok tego autobusu leży już plik %{file} i nigdy nie jest nadpisywany"
  es: "Junto a este autobús ya hay un archivo llamado %{file}, y nunca se sobrescribe"
"No copy of it on this computer":
  nl: "Er staat geen exemplaar van op deze computer"
  de: "Auf diesem Rechner gibt es keine Kopie davon"
  fr: "Aucune copie sur cet ordinateur"
  ru: "На этом компьютере нет его копии"
  uk: "На цьому комп’ютері немає його копії"
  pl: "Na tym komputerze nie ma jego kopii"
  es: "No hay ninguna copia en este equipo"
"openOMSI has no folder of its own to put it in":
  nl: "openOMSI heeft geen eigen map om het in te zetten"
  de: "openOMSI hat keinen eigenen Ordner, um sie abzulegen"
  fr: "openOMSI n’a pas de dossier à lui où le placer"
  ru: "У openOMSI нет собственной папки, куда его положить"
  uk: "openOMSI не має власної теки, куди його покласти"
  pl: "openOMSI nie ma własnego folderu, w którym mógłby go umieścić"
  es: "openOMSI no tiene una carpeta propia donde ponerlo"
"That would be in the OMSI 2 folder, which openOMSI does not write to":
  nl: "Dat zou in de map van OMSI 2 zijn, en daarin schrijft openOMSI niet"
  de: "Das wäre im OMSI-2-Ordner, in den openOMSI nicht schreibt"
  fr: "Ce serait dans le dossier d’OMSI 2, où openOMSI n’écrit pas"
  ru: "Это была бы папка OMSI 2, а openOMSI в неё не пишет"
  uk: "Це була б тека OMSI 2, а openOMSI в неї не пише"
  pl: "To byłby folder OMSI 2, do którego openOMSI nie zapisuje"
  es: "Estaría en la carpeta de OMSI 2, en la que openOMSI no escribe"
"The copy found cannot be read: %{why}":
  nl: "Het gevonden exemplaar is niet te lezen: %{why}"
  de: "Die gefundene Kopie lässt sich nicht lesen: %{why}"
  fr: "La copie trouvée est illisible : %{why}"
  ru: "Найденную копию не удаётся прочитать: %{why}"
  uk: "Знайдену копію не вдається прочитати: %{why}"
  pl: "Znalezionej kopii nie da się odczytać: %{why}"
  es: "La copia encontrada no se puede leer: %{why}"
"Writing it failed: %{why}":
  nl: "Wegschrijven lukte niet: %{why}"
  de: "Das Schreiben ist fehlgeschlagen: %{why}"
  fr: "L’écriture a échoué : %{why}"
  ru: "Не удалось записать: %{why}"
  uk: "Не вдалося записати: %{why}"
  pl: "Zapis się nie powiódł: %{why}"
  es: "No se ha podido escribir: %{why}"
"%{file} added beside %{bus}":
  nl: "%{file} staat nu bij de %{bus}"
  de: "%{file} liegt jetzt neben %{bus}"
  fr: "%{file} placé à côté de %{bus}"
  ru: "%{file} добавлен к %{bus}"
  uk: "%{file} додано до %{bus}"
  pl: "Dodano %{file} obok %{bus}"
  es: "%{file} añadido junto a %{bus}"
"Not added: %{why}":
  nl: "Niet toegevoegd: %{why}"
  de: "Nicht hinzugefügt: %{why}"
  fr: "Non ajouté : %{why}"
  ru: "Не добавлено: %{why}"
  uk: "Не додано: %{why}"
  pl: "Nie dodano: %{why}"
  es: "No añadido: %{why}"
"Or take one of its own":
  nl: "Of neem er een van hemzelf"
  de: "Oder nimm eine eigene"
  fr: "Ou prenez l’un des siens"
  ru: "Или возьмите один из его собственных"
  uk: "Або візьміть один із його власних"
  pl: "Albo weź jeden z jego własnych"
  es: "O coge uno de los suyos"
"Choose a depot file":
  nl: "Hof-bestand kiezen"
  de: "Hofdatei wählen"
  fr: "Choisir un fichier de dépôt"
  ru: "Выбрать файл депо"
  uk: "Вибрати файл депо"
  pl: "Wybierz plik zajezdni"
  es: "Elegir un archivo de cochera"
"This bus does not know this map":
  nl: "Deze bus kent deze kaart niet"
  de: "Dieser Bus kennt diese Karte nicht"
  fr: "Ce bus ne connaît pas cette carte"
  ru: "Этот автобус не знает эту карту"
  uk: "Цей автобус не знає цієї мапи"
  pl: "Ten autobus nie zna tej mapy"
  es: "Este autobús no conoce este mapa"
"%{bus} does not carry %{hof}, the depot file of %{map}. A bus's IBIS and destination displays know only the codes and destinations of the depot files beside it.":
  nl: "De %{bus} heeft %{hof} niet bij zich, het hof-bestand van %{map}. De IBIS en de bestemmingsfilm van een bus kennen alleen de codes en bestemmingen van de hof-bestanden die naast hem liggen."
  de: "%{bus} hat %{hof} nicht dabei, die Hofdatei von %{map}. IBIS und Zielanzeigen eines Busses kennen nur die Codes und Ziele der Hofdateien, die neben ihm liegen."
  fr: "%{bus} n’a pas %{hof}, le fichier de dépôt de %{map}. L’IBIS et les girouettes d’un bus ne connaissent que les codes et destinations des fichiers de dépôt placés à côté de lui."
  ru: "У %{bus} нет %{hof} — файла депо карты %{map}. IBIS и указатели маршрута автобуса знают только коды и конечные пункты из файлов депо, лежащих рядом с ним."
  uk: "У %{bus} немає %{hof} — файлу депо мапи %{map}. IBIS і покажчики маршруту автобуса знають лише коди й кінцеві зупинки з файлів депо, що лежать поруч із ним."
  pl: "%{bus} nie ma przy sobie %{hof}, pliku zajezdni mapy %{map}. IBIS i wyświetlacze kierunkowe autobusu znają tylko kody i kierunki z plików zajezdni, które leżą obok niego."
  es: "%{bus} no lleva %{hof}, el archivo de cochera de %{map}. El IBIS y los indicadores de destino de un autobús solo conocen los códigos y destinos de los archivos de cochera que tiene al lado."
"Add the map's depot file":
  nl: "Hof-bestand van de kaart toevoegen"
  de: "Hofdatei der Karte hinzufügen"
  fr: "Ajouter le fichier de dépôt de la carte"
  ru: "Добавить файл депо карты"
  uk: "Додати файл депо мапи"
  pl: "Dodaj plik zajezdni mapy"
  es: "Añadir el archivo de cochera del mapa"
"%{hof} is the depot file of %{map}: with it beside the bus, its IBIS and destination displays know the map's codes and destinations.":
  nl: "%{hof} is het hof-bestand van %{map}. Ligt het naast de bus, dan kennen zijn IBIS en bestemmingsfilm de codes en bestemmingen van de kaart."
  de: "%{hof} ist die Hofdatei von %{map}: Liegt sie neben dem Bus, kennen sein IBIS und seine Zielanzeigen die Codes und Ziele der Karte."
  fr: "%{hof} est le fichier de dépôt de %{map} : placé à côté du bus, son IBIS et ses girouettes connaissent les codes et destinations de la carte."
  ru: "%{hof} — файл депо карты %{map}: если он лежит рядом с автобусом, его IBIS и указатели знают коды и конечные пункты карты."
  uk: "%{hof} — файл депо мапи %{map}: якщо він лежить поруч з автобусом, його IBIS і покажчики знають коди й кінцеві зупинки мапи."
  pl: "%{hof} to plik zajezdni mapy %{map}: gdy leży obok autobusu, jego IBIS i wyświetlacze znają kody i kierunki tej mapy."
  es: "%{hof} es el archivo de cochera de %{map}: si está junto al autobús, su IBIS y sus indicadores de destino conocen los códigos y destinos del mapa."
"For this drive openOMSI borrows it from %{folder}, which carries it. Beside this bus it is the bus's own, in its list of depot files.":
  nl: "Voor deze rit leent openOMSI het van %{folder}, die het wel heeft. Naast deze bus wordt het van de bus zelf, in zijn lijst met hof-bestanden."
  de: "Für diese Fahrt leiht openOMSI sie von %{folder}, der sie hat. Neben diesem Bus gehört sie dem Bus selbst, in seiner Liste der Hofdateien."
  fr: "Pour ce trajet, openOMSI l’emprunte à %{folder}, qui l’a. À côté de ce bus, il devient le sien, dans sa liste de fichiers de dépôt."
  ru: "В этой поездке openOMSI берёт его у %{folder}, у которого он есть. Рядом с этим автобусом он станет его собственным, в его списке файлов депо."
  uk: "У цій поїздці openOMSI позичає його в %{folder}, де він є. Поруч із цим автобусом він стане його власним, у його списку файлів депо."
  pl: "Na tę jazdę openOMSI pożycza go od %{folder}, który go ma. Obok tego autobusu stanie się jego własnym, na jego liście plików zajezdni."
  es: "Para esta conducción, openOMSI lo toma prestado de %{folder}, que lo tiene. Junto a este autobús pasa a ser del propio autobús, en su lista de archivos de cochera."
"Without it the bus takes %{file}, which knows %{known} of the %{total} destinations here.":
  nl: "Zonder neemt de bus %{file}, en dat kent %{known} van de %{total} bestemmingen hier."
  de: "Ohne sie nimmt der Bus %{file}, die %{known} der %{total} Ziele hier kennt."
  fr: "Sans lui, le bus prend %{file}, qui connaît %{known} des %{total} destinations d’ici."
  ru: "Без него автобус возьмёт %{file}, который знает %{known} из %{total} конечных пунктов здесь."
  uk: "Без нього автобус візьме %{file}, що знає %{known} із %{total} кінцевих зупинок тут."
  pl: "Bez niego autobus weźmie %{file}, który zna %{known} z %{total} kierunków tutaj."
  es: "Sin él, el autobús usa %{file}, que conoce %{known} de los %{total} destinos de aquí."
"Without it the bus takes %{file}.":
