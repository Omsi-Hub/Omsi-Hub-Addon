  es: "Las líneas del mapa: sus recorridos y cuándo sale cada viaje."
"The game's object editor on a map: move, turn, add and delete its objects and shape the ground. The game starts with the editor on.":
  nl: "De objecteditor van het spel op een kaart: objecten verplaatsen, draaien, toevoegen en verwijderen en het terrein vormen. Het spel start met de editor aan."
  de: "Der Objekteditor des Spiels auf einer Karte: Objekte verschieben, drehen, hinzufügen und löschen und das Gelände formen. Das Spiel startet mit eingeschaltetem Editor."
  fr: "L'éditeur d'objets du jeu sur une carte : déplacer, tourner, ajouter et supprimer des objets et modeler le terrain. Le jeu démarre avec l'éditeur actif."
  ru: "Редактор объектов игры на карте: двигайте, поворачивайте, добавляйте и удаляйте объекты и меняйте рельеф. Игра запускается с включённым редактором."
  uk: "Редактор об’єктів гри на мапі: пересувайте, повертайте, додавайте й видаляйте об’єкти та змінюйте рельєф. Гра запускається з увімкненим редактором."
  pl: "Edytor obiektów gry na mapie: przesuwaj, obracaj, dodawaj i usuwaj obiekty oraz kształtuj teren. Gra startuje z włączonym edytorem."
