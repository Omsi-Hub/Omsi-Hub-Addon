"The livery studio needs a computer: open the launcher on your PC to paint a bus.":
  nl: "De lakstudio heeft een computer nodig: open de launcher op je pc om een bus te lakken."
  de: "Das Lackierstudio braucht einen Computer: Öffne den Launcher auf deinem PC, um einen Bus zu lackieren."
  fr: "L'atelier de livrées demande un ordinateur : ouvre le lanceur sur ton PC pour peindre un bus."
