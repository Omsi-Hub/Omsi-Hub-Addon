  uk: "До дилера"
  pl: "Do dealera"
  es: "Al concesionario"
"No price now: the rate is booked at every month's end, and the bus goes back when the term ends. Insurance is the company's. A lease with a haggled rate comes with the dealer's contract.":
  nl: "Nu geen prijs: de termijn wordt elk einde van de maand geboekt en de bus gaat terug als de looptijd afloopt. De verzekering is voor het bedrijf. Een lease met een uitonderhandelde termijn krijg je via het contract van de dealer."
  de: "Jetzt kein Preis: Die Rate wird zu jedem Monatsende gebucht, und der Bus geht am Ende der Laufzeit zurück. Die Versicherung trägt die Firma. Ein Leasing mit verhandelter Rate gibt es mit dem Vertrag des Händlers."
  fr: "Pas de prix maintenant : la mensualité est comptabilisée à chaque fin de mois et le bus repart à la fin de la durée. L'assurance est à la charge de l'entreprise. Un leasing à mensualité négociée passe par le contrat du concessionnaire."
  ru: "Сейчас платить не нужно: платёж проводится в конце каждого месяца, автобус возвращается по окончании срока. Страховка за компанией. Лизинг с выторгованным платежом - через договор дилера."
  uk: "Зараз платити не треба: платіж проводиться наприкінці кожного місяця, автобус повертається після закінчення строку. Страховка за компанією. Лізинг із виторгуваним платежем - через договір дилера."
  pl: "Teraz bez ceny: rata jest księgowana na koniec każdego miesiąca, a autobus wraca po zakończeniu okresu. Ubezpieczenie po stronie firmy. Leasing z wynegocjowaną ratą - przez umowę z dealerem."
  es: "Ahora no hay precio: la cuota se contabiliza a final de cada mes y el autobús se devuelve cuando termina el plazo. El seguro corre a cargo de la empresa. Un leasing con una cuota negociada viene con el contrato del concesionario."
"Its year decides the buses: models no longer built then are sold second-hand only, models not built yet are not sold.":
  nl: "Het jaar bepaalt de bussen: modellen die dan niet meer gebouwd worden zijn alleen tweedehands te koop, modellen die nog niet gebouwd worden niet."
  de: "Das Jahr bestimmt die Busse: Damals nicht mehr gebaute Modelle gibt es nur gebraucht, noch nicht gebaute gar nicht."
  fr: "Son année décide des bus : les modèles qui ne sont plus construits ne se vendent qu'en occasion, ceux pas encore construits ne se vendent pas."
  ru: "Год определяет автобусы: снятые с производства модели продаются только подержанными, ещё не выпущенные - не продаются."
  uk: "Рік визначає автобуси: зняті з виробництва моделі продаються лише вживаними, ще не випущені - не продаються."
  pl: "Rok decyduje o autobusach: modele już nieprodukowane są tylko używane, jeszcze nieprodukowanych nie ma."
  es: "Su año decide los autobuses: los modelos que ya no se fabrican entonces solo se venden de segunda mano, y los que aún no se fabrican no se venden."
