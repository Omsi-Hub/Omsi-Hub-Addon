  fr: "%{time}  Le bus %{bus} est en panne"
  ru: "%{time}  Автобус %{bus} сломался"
  uk: "%{time}  Автобус %{bus} зламався"
  pl: "%{time}  Autobus %{bus} ma awarię"
  es: "%{time}  El autobús %{bus} se ha averiado"
"It was on line %{n}; it goes to the workshop. A rental bus can take over its trips from %{time} for %{amount}; else its trips are dropped for the rest of the day, with the contract's penalty.":
  nl: "Hij reed op lijn %{n}; hij gaat naar de werkplaats. Een huurbus kan zijn ritten vanaf %{time} overnemen voor %{amount}; anders vallen zijn ritten de rest van de dag uit, met de boete uit het contract."
  de: "Er fuhr auf Linie %{n}; er kommt in die Werkstatt. Ein Mietbus kann seine Fahrten ab %{time} für %{amount} übernehmen; sonst fallen seine Fahrten für den Rest des Tages aus, mit der Vertragsstrafe."
  fr: "Il roulait sur la ligne %{n} ; il part à l'atelier. Un bus de location peut reprendre ses courses à partir de %{time} pour %{amount} ; sinon ses courses sont supprimées pour le reste de la journée, avec la pénalité du contrat."
  ru: "Он был на линии %{n}; он едет в мастерскую. Арендный автобус может взять его рейсы с %{time} за %{amount}; иначе его рейсы до конца дня отменяются, со штрафом по договору."
  uk: "Він був на лінії %{n}; він їде до майстерні. Орендований автобус може взяти його рейси з %{time} за %{amount}; інакше його рейси до кінця дня скасовуються, зі штрафом за договором."
  pl: "Jechał na linii %{n}; trafia do warsztatu. Autobus z wypożyczalni może przejąć jego kursy od %{time} za %{amount}; w przeciwnym razie jego kursy do końca dnia przepadają, z karą z umowy."
  es: "Iba en la línea %{n}; va al taller. Un autobús de alquiler puede hacerse cargo de sus viajes desde las %{time} por %{amount}; si no, sus viajes se suprimen el resto del día, con la penalización del contrato."
