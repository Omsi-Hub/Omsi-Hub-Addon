"New applicants come on %{date}. Skills: driving · punctuality · service; a driver of little experience is a warning on an articulated bus or a double-decker.":
  nl: "Nieuwe sollicitanten komen op %{date}. Vaardigheden: rijden · stiptheid · service; een chauffeur met weinig ervaring is een waarschuwing op een gelede bus of dubbeldekker."
  de: "Neue Bewerber kommen am %{date}. Fähigkeiten: Fahren · Pünktlichkeit · Service; ein Fahrer mit wenig Erfahrung ist auf einem Gelenkbus oder Doppeldecker eine Warnung."
  fr: "De nouveaux candidats arrivent le %{date}. Compétences : conduite · ponctualité · service ; un conducteur peu expérimenté est un avertissement sur un bus articulé ou une impériale."
  ru: "Новые соискатели появятся %{date}. Навыки: вождение · пунктуальность · сервис; малоопытный водитель на сочленённом или двухэтажном автобусе - это предупреждение."
  uk: "Нові кандидати з'являться %{date}. Навички: водіння · пунктуальність · сервіс; малодосвідчений водій на зчленованому чи двоповерховому автобусі - це попередження."
  pl: "Nowi kandydaci pojawią się %{date}. Umiejętności: jazda · punktualność · obsługa; mało doświadczony kierowca w autobusie przegubowym lub piętrowym to ostrzeżenie."
  es: "Llegan nuevos candidatos el %{date}. Habilidades: conducción · puntualidad · trato; un conductor con poca experiencia es un aviso en un autobús articulado o de dos pisos."
"A driver works five days a week and has holidays and ill days: count about one and a half drivers for every duty of the day.":
  nl: "Een chauffeur werkt vijf dagen per week en heeft vakantie- en ziektedagen: reken op ongeveer anderhalve chauffeur per dienst van de dag."
  de: "Ein Fahrer arbeitet fünf Tage die Woche und hat Urlaubs- und Krankheitstage: rechne mit etwa anderthalb Fahrern je Dienst des Tages."
  fr: "Un conducteur travaille cinq jours par semaine et a des congés et des jours de maladie : comptez environ un conducteur et demi par poste de la journée."
  ru: "Водитель работает пять дней в неделю, у него бывают отпуск и больничные: рассчитывайте примерно на полтора водителя на каждую смену дня."
  uk: "Водій працює п'ять днів на тиждень, у нього бувають відпустка й лікарняні: розраховуйте приблизно на півтора водія на кожну зміну дня."
  pl: "Kierowca pracuje pięć dni w tygodniu, ma urlop i dni chorobowe: licz około półtora kierowcy na każdą zmianę dnia."
  es: "Un conductor trabaja cinco días a la semana y tiene vacaciones y días de baja: cuenta con un conductor y medio por cada servicio del día."
"Nobody works here yet. Every duty of a tour needs a driver: hire some among the week's applicants.":
  nl: "Er werkt hier nog niemand. Elke dienst van een omloop heeft een chauffeur nodig: neem er een paar aan uit de sollicitanten van de week."
  de: "Hier arbeitet noch niemand. Jeder Dienst eines Umlaufs braucht einen Fahrer: stelle einige der Bewerber der Woche ein."
  fr: "Personne ne travaille encore ici. Chaque poste d'un service a besoin d'un conducteur : embauchez-en parmi les candidats de la semaine."
  ru: "Здесь пока никто не работает. Каждой смене выхода нужен водитель: наймите кого-нибудь из соискателей недели."
  uk: "Тут поки ніхто не працює. Кожній зміні обороту потрібен водій: найміть когось із кандидатів тижня."
  pl: "Nikt tu jeszcze nie pracuje. Każda zmiana brygady potrzebuje kierowcy: zatrudnij kilku kandydatów z tego tygodnia."
  es: "Aún no trabaja nadie aquí. Cada servicio de un recorrido necesita un conductor: contrata a algunos entre los candidatos de la semana."
