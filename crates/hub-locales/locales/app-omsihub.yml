"Generous: grants on new buses, more passengers, few breakdowns, loans without interest.":
  nl: "Royaal: subsidie op nieuwe bussen, meer reizigers, weinig pech, leningen zonder rente."
  de: "Großzügig: Zuschüsse für neue Busse, mehr Fahrgäste, wenige Pannen, Kredite ohne Zinsen."
  fr: "Généreux : subventions sur les bus neufs, plus de voyageurs, peu de pannes, prêts sans intérêts."
