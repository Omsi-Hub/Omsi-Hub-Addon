"A model, a number, the list price: the buses are yours at once.":
  nl: "Een model, een aantal, de catalogusprijs: de bussen zijn meteen van jou."
  de: "Ein Modell, eine Anzahl, der Listenpreis: Die Busse gehören sofort Ihnen."
  fr: "Un modèle, un nombre, le prix catalogue : les bus sont à vous tout de suite."
  ru: "Модель, количество, цена по прайсу: автобусы сразу ваши."
  uk: "Модель, кількість, ціна за прайсом: автобуси одразу ваші."
  pl: "Model, liczba, cena katalogowa: autobusy są od razu twoje."
  es: "Un modelo, una cantidad, el precio de lista: los autobuses son tuyos al momento."
"Haggle with the dealer, agree on extras and sign a contract; new buses are delivered.":
  nl: "Onderhandel met de dealer, spreek extra's af en teken een contract; nieuwe bussen worden geleverd."
  de: "Mit dem Händler verhandeln, Extras vereinbaren und einen Vertrag unterschreiben; neue Busse werden geliefert."
  fr: "Négociez avec le concessionnaire, convenez des extras et signez un contrat ; les bus neufs sont livrés."
  ru: "Торгуйтесь с дилером, договаривайтесь о дополнениях и подписывайте договор; новые автобусы доставляются."
  uk: "Торгуйтеся з дилером, домовляйтеся про доповнення й підписуйте договір; нові автобуси доставляються."
  pl: "Negocjuj z dealerem, uzgadniaj dodatki i podpisuj umowę; nowe autobusy są dostarczane."
  es: "Regatea con el concesionario, acuerda extras y firma un contrato; los autobuses nuevos se entregan."
