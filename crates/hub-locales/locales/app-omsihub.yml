  nl: "openOMSI rijdt op de kaarten en met de bussen van het originele OMSI 2. Wijs eenmaal de map aan waaruit je speelt."
  de: "openOMSI fährt auf den Karten und mit den Bussen des originalen OMSI 2. Zeig einmal auf den Ordner, aus dem du spielst."
  fr: "openOMSI roule sur les cartes et avec les bus de l’OMSI 2 d’origine. Indique une fois le dossier depuis lequel tu joues."
  ru: "openOMSI ездит по картам и на автобусах оригинального OMSI 2. Один раз укажи папку, из которой ты играешь."
  uk: "openOMSI їздить мапами й автобусами оригінального OMSI 2. Один раз вкажи теку, з якої ти граєш."
  pl: "openOMSI jeździ po mapach i autobusami oryginalnego OMSI 2. Wskaż raz folder, z którego grasz."
  es: "openOMSI usa los mapas y autobuses del OMSI 2 original. Indica una vez la carpeta desde la que juegas."
