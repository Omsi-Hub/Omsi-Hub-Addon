  pl: "%{b} autobusów w %{n} obiegach (niektóre tylko w szczycie), %{t} kursów"
  es: "%{b} autobuses en %{n} recorridos (algunos solo para las horas punta), %{t} viajes"
"Each group of days becomes tours of its own; the buses go back and forth, each standing at the end for at least as long as set. With time bands the buses added for the rush hours go back to the depot after them.":
  nl: "Elke groep dagen krijgt eigen omlopen; de bussen rijden heen en weer en staan aan het eind minstens zo lang als ingesteld. Met tijdvakken gaan de extra spitsbussen daarna terug naar de remise."
  de: "Jede Gruppe von Tagen bekommt eigene Umläufe; die Busse pendeln und stehen am Ende mindestens so lange wie eingestellt. Mit Zeitbändern fahren die Verstärker der Spitzen danach zurück in den Betriebshof."
  fr: "Chaque groupe de jours a ses propres services ; les bus font la navette et stationnent au terminus au moins le temps réglé. Avec des plages horaires, les bus ajoutés aux heures de pointe rentrent ensuite au dépôt."
  ru: "Каждая группа дней получает свои обороты; автобусы ходят туда и обратно и стоят на конечной не меньше заданного. С временными интервалами автобусы, добавленные на час пик, потом возвращаются в депо."
  uk: "Кожна група днів має свої обороти; автобуси курсують туди й назад і стоять на кінцевій не менше заданого. З часовими проміжками автобуси, додані на годину пік, потім повертаються в депо."
  pl: "Każda grupa dni ma własne obiegi; autobusy jeżdżą tam i z powrotem, stojąc na końcu co najmniej tyle, ile ustawiono. Z przedziałami czasu autobusy dodane na szczyt wracają potem do zajezdni."
  es: "Cada grupo de días tiene sus propios recorridos; los autobuses van y vuelven, y cada uno espera en la cabecera al menos el tiempo fijado. Con franjas horarias, los autobuses añadidos para las horas punta vuelven después a la cochera."
