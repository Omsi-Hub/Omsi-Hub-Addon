"Each part of the bus is checked and dealt with: replace it, adjust it, top it up, or leave it as it is. Read what the check finds - and mind the time. The better the work, the more it saves; a service done badly sends the bus to the workshop after all.":
  nl: "Elk onderdeel van de bus wordt gecontroleerd en behandeld: vervangen, afstellen, bijvullen of laten zoals het is. Lees wat de controle vindt - en let op de tijd. Hoe beter het werk, hoe meer het bespaart; een slecht uitgevoerde beurt stuurt de bus alsnog naar de werkplaats."
  de: "Jedes Teil des Busses wird geprüft und behandelt: tauschen, einstellen, nachfüllen oder so lassen. Lies, was die Prüfung findet - und achte auf die Zeit. Je besser die Arbeit, desto mehr spart sie; eine schlecht gemachte Wartung schickt den Bus doch in die Werkstatt."
  fr: "Chaque pièce du bus est contrôlée et traitée : la remplacer, la régler, faire l'appoint ou la laisser telle quelle. Lis ce que le contrôle trouve - et surveille le temps. Plus le travail est bon, plus il fait économiser ; un entretien bâclé envoie quand même le bus à l'atelier."
  ru: "Каждую деталь автобуса проверяют и обслуживают: заменить, отрегулировать, долить или оставить как есть. Читайте, что показала проверка, и следите за временем. Чем лучше работа, тем больше экономия; плохо сделанное ТО всё равно отправит автобус в мастерскую."
  uk: "Кожну деталь автобуса перевіряють і обслуговують: замінити, відрегулювати, долити або залишити як є. Читайте, що показала перевірка, і стежте за часом. Що краща робота, то більша економія; погано зроблене ТО все одно відправить автобус до майстерні."
  pl: "Każdą część autobusu sprawdza się i obsługuje: wymienić, wyregulować, uzupełnić albo zostawić. Czytaj, co wykazała kontrola - i pilnuj czasu. Im lepsza praca, tym większa oszczędność; źle zrobiony przegląd i tak wyśle autobus do warsztatu."
  es: "Se revisa cada pieza del autobús y se actúa: cambiarla, ajustarla, rellenarla o dejarla como está. Lee lo que encuentra la revisión, y vigila el tiempo. Cuanto mejor sea el trabajo, más se ahorra; un mantenimiento mal hecho manda el autobús al taller de todas formas."
