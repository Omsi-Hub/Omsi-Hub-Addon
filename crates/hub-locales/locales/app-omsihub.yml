  fr: "L'éditeur de lignes demande une fenêtre plus large : ouvrez-le sur un ordinateur. Vos lignes de cette carte :"
  ru: "Редактору линий нужно более широкое окно: откройте его на компьютере. Ваши линии этой карты:"
