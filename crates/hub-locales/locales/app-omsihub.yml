"Each group of days becomes tours of its own; the buses go back and forth, each standing at the end for at least as long as set.":
  nl: "Elke groep dagen krijgt eigen omlopen; de bussen rijden heen en weer en staan aan het eind minstens zo lang als ingesteld."
  de: "Jede Tagesgruppe bekommt eigene Umläufe; die Busse pendeln und stehen am Ende mindestens so lange wie eingestellt."
  fr: "Chaque groupe de jours a ses propres services ; les bus font des allers-retours et stationnent au terminus au moins le temps réglé."
  ru: "Каждая группа дней получает свои выпуски; автобусы ходят туда и обратно и стоят на конечной не меньше заданного."
  uk: "Кожна група днів отримує свої випуски; автобуси ходять туди й назад і стоять на кінцевій не менше заданого."
  pl: "Każda grupa dni ma własne brygady; autobusy kursują tam i z powrotem i stoją na pętli co najmniej tyle, ile ustawiono."
  es: "Cada grupo de días tiene sus propios recorridos; los autobuses van y vienen, y cada uno espera en la cabecera al menos el tiempo fijado."
