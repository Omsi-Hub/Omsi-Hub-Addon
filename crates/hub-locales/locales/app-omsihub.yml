"The fleet is empty. Buy buses at the dealer - new, second-hand or one of the day's offers - or lease one for years or rent one for a few days: each is a bus installed in your OMSI.":
  nl: "De vloot is leeg. Koop bussen bij de dealer - nieuw, tweedehands of een aanbieding van de dag - of lease er een voor jaren of huur er een voor een paar dagen: elk is een bus die in je OMSI geïnstalleerd is."
  de: "Die Flotte ist leer. Kaufen Sie Busse beim Händler - neu, gebraucht oder ein Angebot des Tages - oder leasen Sie einen für Jahre oder mieten Sie einen für ein paar Tage: Jeder ist ein Bus, der in Ihrem OMSI installiert ist."
  fr: "Le parc est vide. Achetez des bus chez le concessionnaire - neufs, d'occasion ou une offre du jour - ou louez-en un pour des années en leasing ou quelques jours en location : chacun est un bus installé dans votre OMSI."
  ru: "Парк пуст. Покупайте автобусы у дилера - новые, подержанные или по предложению дня - или возьмите в лизинг на годы или в аренду на несколько дней: каждый - автобус, установленный в вашем OMSI."
  uk: "Парк порожній. Купуйте автобуси в дилера - нові, вживані або за пропозицією дня - або візьміть у лізинг на роки чи в оренду на кілька днів: кожен - автобус, встановлений у вашому OMSI."
  pl: "Flota jest pusta. Kupuj autobusy u dealera - nowe, używane lub z oferty dnia - albo weź jeden w leasing na lata lub wynajmij na kilka dni: każdy to autobus zainstalowany w twoim OMSI."
  es: "La flota está vacía. Compra autobuses en el concesionario - nuevos, de segunda mano o una de las ofertas del día - o coge uno en leasing por años o alquila uno por unos días: cada uno es un autobús instalado en tu OMSI."
