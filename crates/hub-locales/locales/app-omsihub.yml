"The best score wins a tender: the price counts 60 %, quality 40 % - yours is %{q} of 100, from your reputation and punctuality.":
  nl: "De beste score wint een aanbesteding: de prijs telt 60 %, kwaliteit 40 % - de jouwe is %{q} van 100, uit je reputatie en stiptheid."
  de: "Die beste Wertung gewinnt eine Ausschreibung: der Preis zählt 60 %, die Qualität 40 % - deine ist %{q} von 100, aus Ruf und Pünktlichkeit."
  fr: "Le meilleur score remporte un appel d'offres : le prix compte pour 60 %, la qualité pour 40 % - la vôtre est de %{q} sur 100, selon votre réputation et votre ponctualité."
  ru: "Тендер выигрывает лучший балл: цена весит 60 %, качество 40 % - ваше %{q} из 100, по репутации и пунктуальности."
  uk: "Тендер виграє найкращий бал: ціна важить 60 %, якість 40 % - ваша %{q} зі 100, за репутацією та пунктуальністю."
  pl: "Przetarg wygrywa najlepszy wynik: cena liczy się w 60 %, jakość w 40 % - twoja to %{q} na 100, z reputacji i punktualności."
  es: "La mejor puntuación gana una licitación: el precio cuenta un 60 %, la calidad un 40 % - la tuya es %{q} de 100, según tu reputación y tu puntualidad."
