"Paint on the bus with the left button. E switches between the brush and the eraser, [ and ] make it smaller and larger. The strokes are kept as lines on the bus: they stay sharp at any size.":
  nl: "Schilder met de linkerknop op de bus. E wisselt tussen penseel en gum, [ en ] maken hem kleiner en groter. De streken worden als lijnen op de bus bewaard: ze blijven op elke maat scherp."
