"A single ticket of the fare association costs %{single} (a passenger pays %{fare} on average, with day and season tickets); the authority pays %{km} for every kilometre run, more the better your reputation.":
  nl: "Een enkeltje van het tariefverbond kost %{single} (een reiziger betaalt gemiddeld %{fare}, met dag- en abonnementen); de overheid betaalt %{km} voor elke gereden kilometer, meer naarmate je reputatie beter is."
  de: "Ein Einzelfahrschein des Verkehrsverbunds kostet %{single} (ein Fahrgast zahlt im Schnitt %{fare}, mit Tages- und Zeitkarten); der Aufgabenträger zahlt %{km} für jeden gefahrenen Kilometer, mehr je besser Ihr Ruf."
  fr: "Un ticket unitaire de la communauté tarifaire coûte %{single} (un voyageur paie en moyenne %{fare}, avec les titres journaliers et les abonnements) ; l'autorité paie %{km} par kilomètre parcouru, davantage si votre réputation est meilleure."
  ru: "Разовый билет тарифного союза стоит %{single} (в среднем пассажир платит %{fare}, с дневными и проездными); заказчик платит %{km} за каждый пройденный километр, больше при лучшей репутации."
  uk: "Разовий квиток тарифного союзу коштує %{single} (у середньому пасажир платить %{fare}, з денними і проїзними); замовник платить %{km} за кожен пройдений кілометр, більше за кращої репутації."
  pl: "Bilet jednorazowy związku taryfowego kosztuje %{single} (pasażer płaci średnio %{fare}, z biletami dobowymi i okresowymi); organizator płaci %{km} za każdy przejechany kilometr, więcej przy lepszej reputacji."
  es: "Un billete sencillo del consorcio tarifario cuesta %{single} (un pasajero paga %{fare} de media, con abonos diarios y de temporada); la autoridad de transporte paga %{km} por cada kilómetro recorrido, más cuanto mejor sea tu reputación."
"The company runs no line yet. Add one of the map's lines, or one of your own from the line editor: every tour it has on a day is then the company's to plan and run.":
  nl: "Het bedrijf rijdt nog geen lijn. Voeg een lijn van de kaart toe, of een eigen lijn uit de lijneditor: elke omloop die ze op een dag heeft, plant en rijdt het bedrijf dan."
  de: "Die Firma betreibt noch keine Linie. Fügen Sie eine Linie der Karte hinzu oder eine eigene aus dem Linieneditor: Jeden Umlauf, den sie an einem Tag hat, plant und fährt dann die Firma."
  fr: "L'entreprise n'exploite encore aucune ligne. Ajoutez une ligne de la carte, ou une des vôtres depuis l'éditeur de lignes : chaque service qu'elle a dans la journée est alors à planifier et assurer par l'entreprise."
  ru: "У компании ещё нет линий. Добавьте линию карты или свою из редактора линий: каждый её оборот за день компания затем планирует и выполняет."
  uk: "У компанії ще немає ліній. Додайте лінію карти або свою з редактора ліній: кожен її оборот за день компанія потім планує і виконує."
  pl: "Firma nie obsługuje jeszcze żadnej linii. Dodaj linię z mapy albo własną z edytora linii: każdą jej brygadę danego dnia firma potem planuje i obsługuje."
  es: "La empresa aún no opera ninguna línea. Añade una de las líneas del mapa o una propia desde el editor de líneas: cada recorrido que tenga en un día pasa a ser de la empresa para planificarlo y realizarlo."
