  pl: "Wcześniejszy zwrot autobusu z leasingu kosztuje %{amount} (trzy raty miesięczne)."
  es: "Devolver antes el autobús en leasing cuesta %{amount} (tres cuotas mensuales)."
"The rented bus goes back today; the days rented are paid.":
  nl: "De huurbus gaat vandaag terug; de gehuurde dagen zijn betaald."
  de: "Der Mietbus geht heute zurück; die gemieteten Tage sind bezahlt."
  fr: "Le bus loué est rendu aujourd'hui ; les jours de location sont payés."
  ru: "Арендованный автобус возвращается сегодня; дни аренды оплачены."
  uk: "Орендований автобус повертається сьогодні; дні оренди оплачено."
  pl: "Wynajęty autobus wraca dziś; dni najmu są opłacone."
  es: "El autobús alquilado se devuelve hoy; se pagan los días alquilados."
"%{name} works %{days} more days (the notice) and then leaves.":
  nl: "%{name} werkt nog %{days} dagen (de opzegtermijn) en vertrekt dan."
  de: "%{name} arbeitet noch %{days} Tage (die Kündigungsfrist) und geht dann."
  fr: "%{name} travaille encore %{days} jours (le préavis) puis part."
  ru: "%{name} отработает ещё %{days} дней (срок уведомления) и уйдёт."
  uk: "%{name} відпрацює ще %{days} днів (строк попередження) і піде."
  pl: "%{name} pracuje jeszcze %{days} dni (okres wypowiedzenia) i odchodzi."
  es: "%{name} trabaja %{days} días más (el preaviso) y luego se marcha."
"They are paid half a month's wage for every year they worked here.":
  nl: "Er wordt een half maandloon betaald voor elk jaar dat iemand hier werkte."
  de: "Für jedes Jahr hier wird ein halber Monatslohn als Abfindung gezahlt."
  fr: "Une indemnité d'un demi-mois de salaire par année travaillée ici est versée."
  ru: "Выплачивается половина месячной зарплаты за каждый отработанный здесь год."
  uk: "Виплачується половина місячної зарплати за кожен відпрацьований тут рік."
  pl: "Wypłacana jest połowa miesięcznej pensji za każdy przepracowany tu rok."
  es: "Recibe medio mes de sueldo por cada año que haya trabajado aquí."
