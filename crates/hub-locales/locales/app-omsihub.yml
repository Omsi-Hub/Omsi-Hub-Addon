"Screens slide in, tiles rise under the mouse and a bus drives between the menus.":
  nl: "Schermen schuiven binnen, tegels komen omhoog onder de muis en er rijdt een bus tussen de menu's."
  de: "Bildschirme gleiten herein, Kacheln heben sich unter der Maus und ein Bus fährt zwischen den Menüs."
  fr: "Les écrans glissent, les tuiles se soulèvent sous la souris et un bus roule entre les menus."
  ru: "Экраны выезжают, плитки приподнимаются под мышью, а между меню проезжает автобус."
  uk: "Екрани виїжджають, плитки підіймаються під мишею, а між меню проїжджає автобус."
  pl: "Ekrany się wsuwają, kafelki unoszą się pod myszą, a między menu przejeżdża autobus."
  es: "Las pantallas se deslizan, los mosaicos se elevan bajo el ratón y un autobús circula entre los menús."
"Everything stands still and each screen is there at once: calmer, and lighter for an older computer.":
  nl: "Alles staat stil en elk scherm is er meteen: rustiger, en lichter voor een oudere computer."
  de: "Alles steht still und jeder Bildschirm ist sofort da: ruhiger und leichter für einen älteren Rechner."
  fr: "Tout reste immobile et chaque écran s’affiche aussitôt : plus calme, et plus léger pour un ordinateur ancien."
  ru: "Всё неподвижно, и каждый экран появляется сразу: спокойнее и легче для старого компьютера."
  uk: "Усе нерухоме, і кожен екран з’являється одразу: спокійніше й легше для старого комп’ютера."
  pl: "Wszystko stoi w miejscu, a każdy ekran pojawia się od razu: spokojniej i lżej dla starszego komputera."
  es: "Todo está quieto y cada pantalla aparece al instante: más tranquilo y más ligero para un equipo antiguo."
"A complete OMSI 2: the maps, the buses and everything the game needs are there.":
  nl: "Een complete OMSI 2: de kaarten, de bussen en alles wat het spel nodig heeft, staan erin."
  de: "Ein vollständiges OMSI 2: Karten, Busse und alles, was das Spiel braucht, sind da."
  fr: "Un OMSI 2 complet : les cartes, les bus et tout ce dont le jeu a besoin sont là."
  ru: "Полный OMSI 2: карты, автобусы и всё, что нужно игре, на месте."
  uk: "Повний OMSI 2: мапи, автобуси й усе, що потрібно грі, на місці."
  pl: "Kompletne OMSI 2: mapy, autobusy i wszystko, czego potrzebuje gra, jest na miejscu."
  es: "Un OMSI 2 completo: están los mapas, los autobuses y todo lo que necesita el juego."
