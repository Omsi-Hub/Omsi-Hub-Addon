"Lines of your own on any map, liveries, the timetable and the map's objects.":
  nl: "Eigen lijnen op elke kaart, lakken, de dienstregeling en de objecten van de kaart."
  de: "Eigene Linien auf jeder Karte, Lackierungen, der Fahrplan und die Objekte der Karte."
  fr: "Vos propres lignes sur n'importe quelle carte, les livrées, l'horaire et les objets de la carte."
  ru: "Свои линии на любой карте, окраски, расписание и объекты карты."
  uk: "Власні лінії на будь-якій мапі, фарбування, розклад і об’єкти мапи."
