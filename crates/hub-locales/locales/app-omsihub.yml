"No shift chosen yet. Pick one of the shifts on the left: its trips, and where it goes on with another line, are shown here.":
  nl: "Nog geen dienst gekozen. Kies links een van de diensten: de ritten, en waar hij verdergaat met een andere lijn, staan dan hier."
  de: "Noch kein Dienst gewählt. Wähle links einen der Dienste: seine Fahrten, und wo er mit einer anderen Linie weitergeht, stehen dann hier."
  fr: "Aucun poste choisi. Choisis-en un à gauche : ses trajets, et où il continue avec une autre ligne, s'affichent ici."
  ru: "Смена ещё не выбрана. Выберите одну из смен слева: здесь появятся её рейсы и место, где она продолжается другой линией."
  uk: "Зміну ще не вибрано. Виберіть одну зі змін ліворуч: тут з'являться її рейси і місце, де вона продовжується іншою лінією."
  pl: "Nie wybrano jeszcze zmiany. Wybierz jedną ze zmian po lewej: tu pojawią się jej kursy i miejsce, gdzie przechodzi na inną linię."
  es: "Aún no has elegido turno. Elige uno de los turnos de la izquierda: aquí verás sus viajes y dónde continúa con otra línea."
