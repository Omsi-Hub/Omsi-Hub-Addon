  fr: "Aucune copie de %{hof} n’a été trouvée sur cet ordinateur : aucun autre bus ne l’a, et le dossier de la carte non plus."
  ru: "На этом компьютере не найдено ни одной копии %{hof}: её нет ни у другого автобуса, ни в папке карты."
