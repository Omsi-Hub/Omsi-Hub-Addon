  fr: "Ses services roulent dès le moment choisi, tels qu'ils sont planifiés ; ce qui n'est pas couvert est alors supprimé avec la pénalité du contrat"
  ru: "Её обороты работают с выбранного момента, как запланировано; необеспеченное отменяется со штрафом по договору"
