"Click a layer on the bus to change it, drag it to move it. Right-drag turns the bus, the wheel zooms, 1-6 are the views, F fits, O held shows the livery before.":
  nl: "Klik op een laag op de bus om hem aan te passen, sleep om hem te verplaatsen. Rechts slepen draait de bus, het wiel zoomt, 1-6 zijn de aanzichten, F past in, O ingedrukt toont de lak van ervoor."
  de: "Klicke eine Ebene auf dem Bus an, um sie zu ändern, ziehe sie zum Verschieben. Rechts ziehen dreht den Bus, das Rad zoomt, 1-6 sind die Ansichten, F passt ein, O gedrückt zeigt den Lack von vorher."
  fr: "Clique sur un calque du bus pour le modifier, fais-le glisser pour le déplacer. Clic droit glissé : tourner le bus, molette : zoom, 1-6 : vues, F : cadrer, O maintenu : la livrée d'avant."
  ru: "Щёлкните слой на автобусе, чтобы изменить его, перетащите, чтобы сдвинуть. Правая кнопка вращает автобус, колесо приближает, 1-6 — виды, F — вписать, удерживая O — окраска до."
  uk: "Клацніть шар на автобусі, щоб змінити його, перетягніть, щоб посунути. Права кнопка обертає автобус, коліщатко наближає, 1-6 — види, F — вписати, утримуючи O — ліврея до."
  pl: "Kliknij warstwę na autobusie, by ją zmienić, przeciągnij, by przesunąć. Prawy przycisk obraca autobus, kółko przybliża, 1-6 to widoki, F dopasowuje, przytrzymane O pokazuje lakier sprzed zmian."
  es: "Haz clic en una capa del autobús para cambiarla y arrástrala para moverla. Arrastrar con el botón derecho gira el autobús, la rueda hace zoom, 1-6 son las vistas, F encuadra y mantener O muestra la librea de antes."
"Click a colour on the bus: all of that colour takes the new one. Rubbers, lamps and windows keep theirs.":
  nl: "Klik op een kleur op de bus: alles in die kleur krijgt de nieuwe. Rubbers, lampen en ramen houden de hunne."
  de: "Klicke eine Farbe auf dem Bus an: Alles in dieser Farbe bekommt die neue. Gummis, Lampen und Fenster behalten ihre."
  fr: "Clique sur une couleur du bus : tout ce qui a cette couleur prend la nouvelle. Joints, feux et vitres gardent la leur."
  ru: "Щёлкните цвет на автобусе: всё этого цвета получит новый. Резина, фары и стёкла сохранят свой."
  uk: "Клацніть колір на автобусі: усе цього кольору отримає новий. Гума, фари й вікна збережуть свій."
  pl: "Kliknij kolor na autobusie: wszystko w tym kolorze dostanie nowy. Uszczelki, lampy i szyby zachowają swój."
  es: "Haz clic en un color del autobús: todo lo que tenga ese color toma el nuevo. Gomas, faros y ventanas conservan el suyo."
"Paint the whole bus":
  nl: "De hele bus lakken"
  de: "Den ganzen Bus lackieren"
  fr: "Peindre tout le bus"
  ru: "Покрасить весь автобус"
  uk: "Пофарбувати весь автобус"
  pl: "Pomaluj cały autobus"
  es: "Pintar todo el autobús"
"Choose a stripe: it is laid round the bus at the height of its windows. Drag its edges on the bus afterwards.":
  nl: "Kies een strook: hij komt rond de bus op de hoogte van de ramen. Sleep daarna de randen op de bus."
  de: "Wähle einen Streifen: Er wird in Höhe der Fenster um den Bus gelegt. Ziehe danach seine Kanten auf dem Bus."
  fr: "Choisis une bande : elle fait le tour du bus à hauteur des vitres. Fais ensuite glisser ses bords sur le bus."
  ru: "Выберите полосу: она ляжет вокруг автобуса на высоте окон. Потом перетаскивайте её края на автобусе."
  uk: "Виберіть смугу: вона ляже навколо автобуса на висоті вікон. Потім перетягуйте її краї на автобусі."
  pl: "Wybierz pas: obiegnie autobus na wysokości okien. Potem przeciągaj jego krawędzie na autobusie."
  es: "Elige una franja: se coloca alrededor del autobús a la altura de las ventanas. Después arrastra sus bordes sobre el autobús."
"Type the text, then click on the bus where it goes.":
  nl: "Typ de tekst en klik dan op de bus waar hij moet komen."
  de: "Tippe den Text und klicke dann auf den Bus, wo er hin soll."
  fr: "Tape le texte, puis clique sur le bus à l'endroit voulu."
  ru: "Введите текст, затем щёлкните место на автобусе."
  uk: "Введіть текст, потім клацніть місце на автобусі."
  pl: "Wpisz tekst, a potem kliknij na autobusie, gdzie ma być."
  es: "Escribe el texto y luego haz clic en el autobús donde debe ir."
