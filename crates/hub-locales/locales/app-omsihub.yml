"Tour: the trips of one bus on one line, as OMSI's timetable gives them. Work shift: a shift of the length you want, its trips following each other at the termini - on with another line where lines meet. Free drive: no line of your own.":
  nl: "Omloop: de ritten van één bus op één lijn, zoals de dienstregeling van OMSI ze geeft. Dienst: een dienst van de lengte die je wilt, met ritten die op de eindpunten op elkaar aansluiten - verder met een andere lijn waar lijnen elkaar raken. Vrij rijden: geen eigen lijn."
  de: "Umlauf: die Fahrten eines Busses auf einer Linie, wie OMSIs Fahrplan sie vorgibt. Dienst: ein Dienst der gewünschten Länge, dessen Fahrten an den Endhaltestellen aneinander anschließen - weiter mit einer anderen Linie, wo sich Linien treffen. Freie Fahrt: keine eigene Linie."
  fr: "Service : les trajets d'un bus sur une ligne, comme l'horaire d'OMSI les donne. Poste : une journée de la durée voulue, dont les trajets se suivent aux terminus - avec une autre ligne là où les lignes se croisent. Conduite libre : pas de ligne à soi."
  ru: "Выход: рейсы одного автобуса на одной линии, как их даёт расписание OMSI. Смена: смена нужной длительности, рейсы которой следуют друг за другом на конечных - с переходом на другую линию там, где линии встречаются. Свободная езда: без своей линии."
  uk: "Оборот: рейси одного автобуса на одній лінії, як їх дає розклад OMSI. Зміна: зміна потрібної тривалості, рейси якої йдуть один за одним на кінцевих - з переходом на іншу лінію там, де лінії зустрічаються. Вільна поїздка: без своєї лінії."
  pl: "Brygada: kursy jednego autobusu na jednej linii, jak podaje je rozkład OMSI. Zmiana: służba wybranej długości, której kursy następują po sobie na pętlach - z przejściem na inną linię tam, gdzie linie się spotykają. Jazda swobodna: bez własnej linii."
  es: "Recorrido: los viajes de un autobús en una línea, tal como los da el horario de OMSI. Turno de trabajo: un turno de la duración que quieras, con sus viajes enlazados en las cabeceras - y continuando con otra línea donde se cruzan las líneas. Conducción libre: sin línea propia."
