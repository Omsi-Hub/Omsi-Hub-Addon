"A test is one trip to a timetable with a bus of its kind: driven to the end, on average within three minutes, at most five rough moments, and no red light, camera or collision.":
  nl: "Een examen is één rit volgens dienstregeling met een bus van die soort: tot het eind gereden, gemiddeld binnen drie minuten, hooguit vijf ruwe momenten, en geen rood licht, flitser of aanrijding."
  de: "Eine Prüfung ist eine Fahrt nach Fahrplan mit einem Bus dieser Art: bis zum Ende gefahren, im Schnitt innerhalb von drei Minuten, höchstens fünf ruppige Momente und kein Rotlicht, kein Blitzer, kein Zusammenstoß."
  fr: "Un examen est un trajet selon l'horaire avec un bus de ce type : mené jusqu'au bout, en moyenne à moins de trois minutes, au plus cinq moments brusques, et ni feu rouge, ni radar, ni collision."
  ru: "Экзамен — один рейс по расписанию на автобусе этого типа: до конца, в среднем в пределах трёх минут, не больше пяти резких моментов и ни одного красного света, камеры или столкновения."
  uk: "Іспит — один рейс за розкладом на автобусі цього типу: до кінця, у середньому в межах трьох хвилин, не більше п'яти різких моментів і жодного червоного світла, камери чи зіткнення."
  pl: "Egzamin to jeden kurs według rozkładu autobusem tego typu: do końca, średnio w granicach trzech minut, najwyżej pięć gwałtownych chwil i żadnego czerwonego światła, fotoradaru ani kolizji."
  es: "Un examen es un viaje con horario en un autobús de ese tipo: conducido hasta el final, de media con menos de tres minutos de desvío, como mucho cinco momentos bruscos, y sin semáforo en rojo, radar ni colisión."
"The %{class} test is booked: your next trip to a timetable with such a bus is the test.":
  nl: "Het examen voor de %{class} is gepland: je volgende rit volgens dienstregeling met zo'n bus is het examen."
  de: "Die Prüfung für den %{class} ist angemeldet: deine nächste Fahrt nach Fahrplan mit so einem Bus ist die Prüfung."
  fr: "L'examen %{class} est réservé : ton prochain trajet selon l'horaire avec un tel bus est l'examen."
  ru: "Экзамен на %{class} назначен: ваш следующий рейс по расписанию на таком автобусе и есть экзамен."
  uk: "Іспит на %{class} призначено: ваш наступний рейс за розкладом на такому автобусі і є іспитом."
  pl: "Egzamin na %{class} zapisany: twój następny kurs według rozkładu takim autobusem jest egzaminem."
