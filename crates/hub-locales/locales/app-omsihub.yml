  es: "Licitaciones"
"On an easy economy the map's lines are taken on directly on the Lines page and their concessions renew by themselves; tenders are offered all the same, for the practice.":
  nl: "In een makkelijke economie neem je de lijnen van de kaart direct over op de pagina Lijnen en verlengen de concessies vanzelf; aanbestedingen zijn er toch, om te oefenen."
  de: "In einer leichten Wirtschaft übernimmst du die Linien der Karte direkt auf der Seite Linien, und die Konzessionen verlängern sich von selbst; Ausschreibungen gibt es trotzdem, zum Üben."
  fr: "En économie facile, les lignes de la carte se reprennent directement sur la page Lignes et leurs concessions se renouvellent d'elles-mêmes ; les appels d'offres restent proposés, pour s'exercer."
  ru: "В лёгкой экономике линии карты берутся прямо на странице «Линии», а концессии продлеваются сами; тендеры всё равно предлагаются, для практики."
  uk: "У легкій економіці лінії мапи беруться прямо на сторінці «Лінії», а концесії подовжуються самі; тендери все одно пропонуються, для практики."
  pl: "W łatwej ekonomii linie mapy przejmuje się od razu na stronie Linie, a koncesje odnawiają się same; przetargi i tak są ogłaszane, dla wprawy."
  es: "Con una economía fácil, las líneas del mapa se asumen directamente en la página Líneas y sus concesiones se renuevan solas; las licitaciones se ofrecen igualmente, para practicar."
"No line is out to tender now. A new round comes every four weeks; a line of the map can also be applied for on the Lines page.":
  nl: "Er is nu geen lijn in aanbesteding. Elke vier weken komt er een nieuwe ronde; op een lijn van de kaart kun je ook inschrijven op de pagina Lijnen."
  de: "Gerade ist keine Linie ausgeschrieben. Alle vier Wochen kommt eine neue Runde; auf eine Linie der Karte kannst du dich auch auf der Seite Linien bewerben."
  fr: "Aucune ligne n'est en appel d'offres. Une nouvelle série arrive toutes les quatre semaines ; une ligne de la carte peut aussi être demandée sur la page Lignes."
  ru: "Сейчас линий на тендере нет. Новый раунд каждые четыре недели; на линию карты можно подать заявку и на странице «Линии»."
  uk: "Зараз ліній на тендері немає. Новий раунд щочотири тижні; на лінію мапи можна подати заявку й на сторінці «Лінії»."
  pl: "Teraz żadna linia nie jest w przetargu. Nowa runda co cztery tygodnie; o linię mapy można też wystąpić na stronie Linie."
  es: "Ahora no hay ninguna línea en licitación. Cada cuatro semanas llega una nueva ronda; también puedes solicitar una línea del mapa en la página Líneas."
