"Fix in the roster what the dispatcher would take: free buses, and free drivers by the working-time rules. Only what is planned runs.":
  nl: "Leg in het rooster vast wat de planner zou nemen: vrije bussen, en vrije chauffeurs volgens de arbeidstijdregels. Alleen wat gepland is, rijdt."
  de: "Im Dienstplan festlegen, was der Disponent nehmen würde: freie Busse und freie Fahrer nach den Arbeitszeitregeln. Nur was geplant ist, fährt."
  fr: "Fixer au planning ce que le régulateur prendrait : bus libres, et conducteurs libres selon les règles du temps de travail. Seul ce qui est planifié roule."
  ru: "Закрепить в графике то, что взял бы диспетчер: свободные автобусы и свободных водителей по правилам рабочего времени. Работает только запланированное."
  uk: "Закріпити в графіку те, що взяв би диспетчер: вільні автобуси і вільних водіїв за правилами робочого часу. Працює лише заплановане."
  pl: "Ustal w grafiku to, co wziąłby dyspozytor: wolne autobusy i wolnych kierowców wg zasad czasu pracy. Kursuje tylko to, co zaplanowane."
  es: "Fija en el cuadrante lo que tomaría el planificador: autobuses libres y conductores libres según las normas de tiempo de trabajo. Solo circula lo que está planificado."
