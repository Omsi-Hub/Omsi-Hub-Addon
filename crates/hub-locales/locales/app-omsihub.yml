"Run your own transport company on a map: buy, lease or rent buses, hire drivers and run the map's lines or your own. Every day of the company is settled with \"Close the day\"; what you drive yourself counts as it was driven.":
  nl: "Run je eigen vervoersbedrijf op een kaart: koop, lease of huur bussen, neem chauffeurs aan en rijd de lijnen van de kaart of je eigen lijnen. Elke bedrijfsdag wordt afgerekend met \"Dag afsluiten\"; wat je zelf rijdt, telt zoals het gereden is."
  de: "Führe dein eigenes Verkehrsunternehmen auf einer Karte: Busse kaufen, leasen oder mieten, Fahrer einstellen und die Linien der Karte oder deine eigenen betreiben. Jeder Betriebstag wird mit \"Tag abschließen\" abgerechnet; was du selbst fährst, zählt so, wie es gefahren wurde."
  fr: "Dirigez votre propre entreprise de transport sur une carte : achetez, louez en leasing ou louez des bus, embauchez des conducteurs et exploitez les lignes de la carte ou les vôtres. Chaque journée est réglée avec « Clôturer la journée » ; ce que vous conduisez vous-même compte tel que vous l'avez conduit."
  ru: "Управляйте своим транспортным предприятием на карте: покупайте, берите в лизинг или арендуйте автобусы, нанимайте водителей и обслуживайте линии карты или свои собственные. Каждый день предприятия рассчитывается кнопкой «Закрыть день»; то, что вы проехали сами, засчитывается так, как было проехано."
  uk: "Керуйте власним транспортним підприємством на карті: купуйте, беріть у лізинг або орендуйте автобуси, наймайте водіїв і обслуговуйте лінії карти або власні. Кожен день підприємства розраховується кнопкою «Закрити день»; те, що ви проїхали самі, зараховується так, як було проїхано."
  pl: "Prowadź własne przedsiębiorstwo przewozowe na mapie: kupuj, leasinguj lub wynajmuj autobusy, zatrudniaj kierowców i obsługuj linie mapy lub własne. Każdy dzień przedsiębiorstwa rozlicza się przyciskiem „Zamknij dzień”; to, co przejedziesz sam, liczy się tak, jak zostało przejechane."
  es: "Dirige tu propia empresa de transporte en un mapa: compra, alquila a largo plazo o alquila autobuses, contrata conductores y opera las líneas del mapa o las tuyas. Cada día de la empresa se liquida con \"Cerrar el día\"; lo que conduces tú cuenta tal como se condujo."
