  de: "Das Unternehmen betreibt noch keine Linie. Füge eine Linie der Karte hinzu oder eine eigene aus dem Linieneditor: jeden Umlauf, den sie an einem Tag hat, fährt dann das Unternehmen."
  fr: "L'entreprise n'exploite encore aucune ligne. Ajoutez une ligne de la carte, ou l'une des vôtres depuis l'éditeur de lignes : chaque service qu'elle a dans la journée revient alors à l'entreprise."
  ru: "Предприятие пока не обслуживает ни одной линии. Добавьте линию карты или свою из редактора линий: каждый её выход за день будет обслуживать предприятие."
  uk: "Підприємство ще не обслуговує жодної лінії. Додайте лінію карти або власну з редактора ліній: кожен її оборот за день обслуговуватиме підприємство."
  pl: "Przedsiębiorstwo nie obsługuje jeszcze żadnej linii. Dodaj linię mapy lub własną z edytora linii: każdą brygadę, którą ma danego dnia, obsłuży wtedy przedsiębiorstwo."
  es: "La empresa aún no opera ninguna línea. Añade una de las líneas del mapa, o una tuya del editor de líneas: entonces cada recorrido que tenga en un día lo tiene que hacer la empresa."
