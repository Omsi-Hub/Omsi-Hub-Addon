  de: "Alles, was in diesen Ordner gelegt wird, wird von selbst installiert, sobald es fertig kopiert ist."
  fr: "Tout ce qui est placé dans ce dossier s'installe de lui-même une fois la copie terminée."
  ru: "Всё, что положено в эту папку, устанавливается само, как только копирование завершено."
  uk: "Усе, що покладено в цю теку, встановлюється саме, щойно копіювання завершено."
  pl: "Wszystko, co trafi do tego folderu, instaluje się samo po zakończeniu kopiowania."
  es: "Todo lo que se ponga en esta carpeta se instala solo en cuanto termina de copiarse."
"Sign on, the duty menu and the bus's screens on a phone or tablet in your network. The game shows the address and the pairing code when you drive.":
  nl: "Aanmelden, het dienstmenu en de schermen van de bus op een telefoon of tablet in je netwerk. Het spel toont het adres en de koppelcode als je rijdt."
  de: "Anmelden, das Dienstmenü und die Bildschirme des Busses auf einem Telefon oder Tablet in deinem Netzwerk. Das Spiel zeigt die Adresse und den Kopplungscode, wenn du fährst."
  fr: "La prise de service, le menu du service et les écrans du bus sur un téléphone ou une tablette de votre réseau. Le jeu affiche l'adresse et le code d'appairage pendant la conduite."
  ru: "Регистрация, меню смены и экраны автобуса на телефоне или планшете в вашей сети. Игра показывает адрес и код сопряжения, когда вы едете."
  uk: "Реєстрація, меню зміни та екрани автобуса на телефоні або планшеті у вашій мережі. Гра показує адресу й код сполучення, коли ви їдете."
  pl: "Zgłoszenie, menu służby i ekrany autobusu na telefonie lub tablecie w twojej sieci. Gra pokazuje adres i kod parowania podczas jazdy."
  es: "La toma de servicio, el menú de servicio y las pantallas del autobús en un móvil o una tablet de tu red. El juego muestra la dirección y el código de emparejamiento cuando conduces."
