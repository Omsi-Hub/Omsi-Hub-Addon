  pl: "Niektóre brygady linii nie mają autobusu lub kierowcy: wypadłyby, każda z karą umowną."
  es: "Algunos recorridos de la línea no tienen autobús o conductor: se suprimirían, cada uno con la penalización del contrato."
"Give them buses and drivers on the planning (\"Fill the roster\" does it for you) - or choose to start with the gaps.":
  nl: "Geef ze bussen en chauffeurs in de planning (\"Rooster vullen\" doet het voor je) - of kies om met de gaten te starten."
  de: "Geben Sie ihnen Busse und Fahrer in der Planung („Dienstplan füllen“ macht es für Sie) - oder starten Sie bewusst mit den Lücken."
  fr: "Donnez-leur bus et conducteurs dans le planning (« Remplir le planning » le fait pour vous) - ou choisissez de lancer avec les trous."
  ru: "Дайте им автобусы и водителей в планировании («Заполнить график» сделает это за вас) - или запустите с пробелами."
  uk: "Дайте їм автобуси і водіїв у плануванні («Заповнити графік» зробить це за вас) - або запустіть із прогалинами."
  pl: "Daj im autobusy i kierowców w planowaniu („Wypełnij grafik” zrobi to za ciebie) - albo uruchom z lukami."
  es: "Dales autobuses y conductores en la planificación («Rellenar el cuadrante» lo hace por ti), o elige iniciar con los huecos."
