"Ready to place: %{w} × %{h} pixels. Click on the bus.":
  nl: "Klaar om te plaatsen: %{w} × %{h} pixels. Klik op de bus."
  de: "Bereit zum Platzieren: %{w} × %{h} Pixel. Klicke auf den Bus."
  fr: "Prête à placer : %{w} × %{h} pixels. Clique sur le bus."
  ru: "Готово к размещению: %{w} × %{h} пикселей. Щёлкните по автобусу."
  uk: "Готово до розміщення: %{w} × %{h} пікселів. Клацніть по автобусу."
  pl: "Gotowe do umieszczenia: %{w} × %{h} pikseli. Kliknij na autobusie."
  es: "Lista para colocar: %{w} × %{h} píxeles. Haz clic en el autobús."
"Choose a shape, then click on the bus where it goes. With the pen you draw shapes of your own.":
  nl: "Kies een vorm en klik dan op de bus waar hij moet komen. Met de pen teken je eigen vormen."
  de: "Wähle eine Form und klicke dann auf den Bus, wo sie hin soll. Mit dem Stift zeichnest du eigene Formen."
  fr: "Choisis une forme, puis clique sur le bus à l'endroit voulu. Avec la plume, tu dessines tes propres formes."
  ru: "Выберите фигуру, затем щёлкните место на автобусе. Пером можно рисовать свои фигуры."
  uk: "Виберіть фігуру, потім клацніть місце на автобусі. Пером можна малювати власні фігури."
  pl: "Wybierz kształt, a potem kliknij na autobusie, gdzie ma być. Piórem narysujesz własne kształty."
  es: "Elige una forma y luego haz clic en el autobús donde debe ir. Con la pluma dibujas tus propias formas."
"Click the corners of your shape on the bus. Hold the button and drag to bend the line into a curve. Click the first corner again or press Enter to finish; Escape lets go.":
  nl: "Klik de hoeken van je vorm op de bus. Houd de knop vast en sleep om de lijn tot een bocht te buigen. Klik weer op de eerste hoek of druk op Enter om af te ronden; Escape laat los."
  de: "Klicke die Ecken deiner Form auf den Bus. Halte die Taste und ziehe, um die Linie zu einer Kurve zu biegen. Klicke erneut die erste Ecke oder drücke Enter zum Abschließen; Escape bricht ab."
  fr: "Clique les coins de ta forme sur le bus. Maintiens le bouton et fais glisser pour courber le trait. Clique de nouveau sur le premier coin ou appuie sur Entrée pour finir ; Échap abandonne."
  ru: "Щёлкайте углы фигуры на автобусе. Удерживайте кнопку и тяните, чтобы изогнуть линию. Щёлкните первый угол снова или нажмите Enter, чтобы закончить; Escape — отмена."
  uk: "Клацайте кути фігури на автобусі. Утримуйте кнопку й тягніть, щоб вигнути лінію. Клацніть перший кут знову або натисніть Enter, щоб завершити; Escape — скасувати."
  pl: "Klikaj narożniki kształtu na autobusie. Przytrzymaj przycisk i przeciągnij, by wygiąć linię w łuk. Kliknij znów pierwszy narożnik lub naciśnij Enter, by skończyć; Escape przerywa."
  es: "Haz clic en las esquinas de tu forma sobre el autobús. Mantén el botón y arrastra para curvar la línea. Vuelve a hacer clic en la primera esquina o pulsa Enter para terminar; Escape la descarta."
