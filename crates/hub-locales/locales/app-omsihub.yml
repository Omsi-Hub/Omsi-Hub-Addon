  nl: "Hoe wil je vandaag rijden?"
  de: "Wie möchtest du heute fahren?"
  fr: "Comment veux-tu conduire aujourd'hui ?"
  ru: "Как вы хотите ездить сегодня?"
  uk: "Як ви хочете їздити сьогодні?"
  pl: "Jak chcesz dziś jeździć?"
  es: "¿Cómo quieres conducir hoy?"
"Choose how long you want to drive and when: openOMSI puts a shift together from the timetable's real trips, on with another line where lines meet.":
  nl: "Kies zelf hoe lang je wilt rijden en wanneer: openOMSI stelt een dienst samen uit echte ritten van de dienstregeling, verder met een andere lijn waar lijnen elkaar raken."
  de: "Wähle selbst, wie lange und wann du fahren willst: openOMSI stellt aus echten Fahrten des Fahrplans einen Dienst zusammen, weiter mit einer anderen Linie, wo sich Linien treffen."
  fr: "Choisis combien de temps et quand tu veux conduire : openOMSI compose un poste à partir des vrais trajets de l'horaire, avec une autre ligne là où les lignes se croisent."
  ru: "Выберите, как долго и когда вы хотите ездить: openOMSI составит смену из настоящих рейсов расписания, с переходом на другую линию там, где линии встречаются."
  uk: "Виберіть, як довго і коли ви хочете їздити: openOMSI складе зміну зі справжніх рейсів розкладу, з переходом на іншу лінію там, де лінії зустрічаються."
  pl: "Wybierz, jak długo i kiedy chcesz jeździć: openOMSI ułoży zmianę z prawdziwych kursów rozkładu, z przejściem na inną linię tam, gdzie linie się spotykają."
  es: "Elige cuánto tiempo quieres conducir y cuándo: openOMSI monta un turno con viajes reales del horario, continuando con otra línea donde se cruzan las líneas."
"One bus's trips on one line, as OMSI's timetable dialog gives them: pick the line, the tour and the trip to start with.":
  nl: "De ritten van één bus op één lijn, zoals de dienstregeling van OMSI ze geeft: kies de lijn, de omloop en de rit waarmee je begint."
  de: "Die Fahrten eines Busses auf einer Linie, wie OMSIs Fahrplan sie vorgibt: wähle Linie, Umlauf und die erste Fahrt."
  fr: "Les trajets d'un bus sur une ligne, comme l'horaire d'OMSI les donne : choisis la ligne, le service et le trajet de départ."
  ru: "Рейсы одного автобуса на одной линии, как их даёт расписание OMSI: выберите линию, выход и первый рейс."
  uk: "Рейси одного автобуса на одній лінії, як їх дає розклад OMSI: виберіть лінію, оборот і перший рейс."
  pl: "Kursy jednego autobusu na jednej linii, jak podaje je rozkład OMSI: wybierz linię, brygadę i pierwszy kurs."
  es: "Los viajes de un autobús en una línea, tal como los da el diálogo de horarios de OMSI: elige la línea, el recorrido y el viaje con el que empezar."
"Only a map and a bus. The traffic and the timetable's buses drive around you; nothing is booked.":
  nl: "Alleen een kaart en een bus. Het verkeer en de bussen van de dienstregeling rijden om je heen; er wordt niets geboekt."
  de: "Nur eine Karte und ein Bus. Der Verkehr und die Fahrplanbusse fahren um dich herum; nichts wird gebucht."
  fr: "Juste une carte et un bus. La circulation et les bus de l'horaire roulent autour de toi ; rien n'est enregistré."
  ru: "Только карта и автобус. Вокруг ездят машины и автобусы по расписанию; ничего не учитывается."
  uk: "Лише карта й автобус. Довкола їздять машини й автобуси за розкладом; нічого не враховується."
  pl: "Tylko mapa i autobus. Wokół jeździ ruch i autobusy z rozkładu; nic nie jest zapisywane."
  es: "Solo un mapa y un autobús. El tráfico y los autobuses del horario circulan a tu alrededor; no se registra nada."
