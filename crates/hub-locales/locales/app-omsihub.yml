"%{n} things fell out this morning: drivers late, buses that did not start. The central fills them as it can; the planning shows them and lets you choose.":
  nl: "Vanochtend viel er %{n} keer iets uit: chauffeurs te laat, bussen die niet startten. De centrale vult het in waar ze kan; de planning toont het en laat je kiezen."
  de: "Heute Morgen ist %{n}-mal etwas ausgefallen: Fahrer zu spät, Busse, die nicht ansprangen. Die Zentrale füllt es, so gut sie kann; die Planung zeigt es und lässt dich wählen."
