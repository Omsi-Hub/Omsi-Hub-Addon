"Your bus starts at the entry point nearest to %{stop}, the route's first stop. Nothing is booked: drive the line as you like.":
  nl: "Je bus begint bij het inzetpunt het dichtst bij %{stop}, de eerste halte van de route. Er wordt niets geboekt: rijd de lijn zoals je wilt."
  de: "Dein Bus beginnt am Einsetzpunkt, der %{stop} am nächsten liegt, der ersten Haltestelle der Route. Gebucht wird nichts: fahr die Linie, wie du willst."
  fr: "Votre bus part du point d’entrée le plus proche de %{stop}, premier arrêt de l’itinéraire. Rien n’est réservé : conduisez la ligne comme vous voulez."
  ru: "Ваш автобус начинает с точки появления, ближайшей к %{stop}, первой остановке маршрута. Ничего не бронируется: ездите по линии как хотите."
  uk: "Ваш автобус починає з точки появи, найближчої до %{stop}, першої зупинки маршруту. Нічого не бронюється: їздіть лінією як хочете."
  pl: "Twój autobus zaczyna w punkcie wjazdu najbliższym %{stop}, pierwszego przystanku trasy. Nic nie jest rezerwowane: jedź linią, jak chcesz."
  es: "Tu autobús empieza en el punto de entrada más cercano a %{stop}, la primera parada de la ruta. No se registra nada: recorre la línea como quieras."
"Choose a line, then the way it goes: the bus starts at its first stop.":
  nl: "Kies een lijn en dan de richting: de bus begint bij de eerste halte."
  de: "Wähle eine Linie, dann ihre Richtung: Der Bus beginnt an der ersten Haltestelle."
  fr: "Choisissez une ligne, puis sa direction : le bus part de son premier arrêt."
  ru: "Выберите линию, затем направление: автобус начнёт с первой остановки."
  uk: "Оберіть лінію, потім напрямок: автобус почне з першої зупинки."
  pl: "Wybierz linię, potem kierunek: autobus zacznie na pierwszym przystanku."
  es: "Elige una línea y luego su sentido: el autobús empieza en su primera parada."
"Your bus stands at %{entry}, the entry point nearest to %{stop} (%{distance} away).":
