"Nothing happened yet. Simulate the company's time at the top: by the hour, to the morning, to tomorrow or days at once; what happens is told here.":
  nl: "Er is nog niets gebeurd. Simuleer de tijd van het bedrijf bovenaan: per uur, tot de ochtend, tot morgen of dagen tegelijk; wat er gebeurt, staat hier."
  de: "Noch ist nichts geschehen. Simuliere die Zeit der Firma oben: stundenweise, bis zum Morgen, bis morgen oder mehrere Tage; was geschieht, steht hier."
  fr: "Rien ne s'est encore passé. Simulez le temps de l'entreprise en haut : à l'heure, jusqu'au matin, jusqu'à demain ou plusieurs jours ; ce qui arrive s'affiche ici."
  ru: "Пока ничего не произошло. Симулируйте время компании вверху: по часу, до утра, до завтра или сразу несколько дней; события появятся здесь."
  uk: "Поки нічого не сталося. Симулюйте час компанії вгорі: по годині, до ранку, до завтра або одразу кілька днів; події з'являться тут."
  pl: "Na razie nic się nie wydarzyło. Symuluj czas firmy u góry: godzinami, do rana, do jutra albo kilka dni naraz; zdarzenia pojawią się tutaj."
  es: "Aún no ha pasado nada. Simula el tiempo de la empresa arriba: por horas, hasta la mañana, hasta mañana o varios días de golpe; aquí se cuenta lo que pasa."
"%{time}  Bus %{bus} broke down":
  nl: "%{time}  Bus %{bus} heeft pech"
