"What the bank still lends, of all it would lend the company: its base, a share of the fleet's value and six months of the result, less what is owed.":
  nl: "Wat de bank nog leent van alles wat ze het bedrijf zou lenen: de basis, een deel van de vlootwaarde en zes maanden resultaat, min wat al geleend is."
  de: "Was die Bank noch leiht von allem, was sie der Firma leihen würde: die Basis, ein Teil des Flottenwerts und sechs Monate Ergebnis, abzüglich der Schulden."
  fr: "Ce que la banque prête encore sur tout ce qu'elle prêterait à l'entreprise : la base, une part de la valeur du parc et six mois de résultat, moins ce qui est dû."
  ru: "Сколько банк ещё даст из всего, что он дал бы компании: база, доля стоимости парка и шесть месяцев результата, минус долги."
  uk: "Скільки банк ще дасть із усього, що він дав би компанії: база, частка вартості парку і шість місяців результату, мінус борги."
  pl: "Ile bank jeszcze pożyczy z tego, co pożyczyłby firmie: podstawa, część wartości floty i sześć miesięcy wyniku, minus długi."
  es: "Lo que el banco aún presta, de todo lo que prestaría a la empresa: su base, una parte del valor de la flota y seis meses del resultado, menos lo que se debe."
