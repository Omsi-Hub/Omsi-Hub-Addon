  fr: "Peignez sur le bus avec le bouton gauche. E passe du pinceau à la gomme, [ et ] le rendent plus petit ou plus grand. Les traits sont gardés comme des lignes sur le bus : ils restent nets à toute taille."
  ru: "Рисуйте на автобусе левой кнопкой. E переключает кисть и ластик, [ и ] уменьшают и увеличивают их. Мазки хранятся как линии на автобусе и остаются чёткими при любом размере."
  uk: "Малюйте на автобусі лівою кнопкою. E перемикає пензель і гумку, [ і ] зменшують і збільшують їх. Мазки зберігаються як лінії на автобусі й лишаються чіткими за будь-якого розміру."
  pl: "Maluj na autobusie lewym przyciskiem. E przełącza pędzel i gumkę, [ i ] zmniejszają i powiększają je. Pociągnięcia są zapisywane jako linie na autobusie: pozostają ostre w każdym rozmiarze."
  es: "Pinta sobre el autobús con el botón izquierdo. E cambia entre el pincel y el borrador; [ y ] lo hacen más pequeño y más grande. Los trazos se guardan como líneas sobre el autobús: se mantienen nítidos a cualquier tamaño."
