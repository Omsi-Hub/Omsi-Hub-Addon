"Your own line: its fare is yours to set, from %{lo} to %{hi}. The fare association's single ticket is %{p0}.":
  nl: "Je eigen lijn: het tarief bepaal je zelf, van %{lo} tot %{hi}. Het enkeltje van het tariefverbond kost %{p0}."
  de: "Ihre eigene Linie: Den Fahrpreis legen Sie selbst fest, von %{lo} bis %{hi}. Der Einzelfahrschein des Verkehrsverbunds kostet %{p0}."
  fr: "Votre propre ligne : vous fixez son tarif, de %{lo} à %{hi}. Le ticket unitaire de la communauté tarifaire coûte %{p0}."
  ru: "Ваша собственная линия: тариф устанавливаете вы, от %{lo} до %{hi}. Разовый билет тарифного союза стоит %{p0}."
  uk: "Ваша власна лінія: тариф встановлюєте ви, від %{lo} до %{hi}. Разовий квиток тарифного союзу коштує %{p0}."
  pl: "Twoja własna linia: taryfę ustalasz sam, od %{lo} do %{hi}. Bilet jednorazowy związku taryfowego kosztuje %{p0}."
  es: "Tu propia línea: la tarifa la fijas tú, de %{lo} a %{hi}. El billete sencillo del consorcio cuesta %{p0}."
"A concession line: the fare association allows %{lo} to %{hi} round its single ticket of %{p0}.":
  nl: "Een concessielijn: het tariefverbond staat %{lo} tot %{hi} toe rond zijn enkeltje van %{p0}."
  de: "Eine Konzessionslinie: Der Verkehrsverbund erlaubt %{lo} bis %{hi} um seinen Einzelfahrschein von %{p0}."
  fr: "Une ligne en concession : la communauté tarifaire autorise de %{lo} à %{hi} autour de son ticket unitaire de %{p0}."
  ru: "Линия по концессии: тарифный союз разрешает от %{lo} до %{hi} вокруг своего разового билета за %{p0}."
  uk: "Лінія за концесією: тарифний союз дозволяє від %{lo} до %{hi} навколо свого разового квитка за %{p0}."
  pl: "Linia koncesyjna: związek taryfowy pozwala na %{lo} do %{hi} wokół swojego biletu jednorazowego za %{p0}."
  es: "Una línea en concesión: el consorcio tarifario permite de %{lo} a %{hi} en torno a su billete sencillo de %{p0}."
"Single ticket":
  nl: "Enkeltje"
  de: "Einzelfahrschein"
  fr: "Ticket unitaire"
  ru: "Разовый билет"
  uk: "Разовий квиток"
  pl: "Bilet jednorazowy"
  es: "Billete sencillo"
"At %{fare}: about %{pax} passengers a day (%{dp} against the association's fare) and %{rev} of fares a day (%{dr}), once they have got used to it - a few weeks. The first days: about %{first} passengers.":
  nl: "Bij %{fare}: zo'n %{pax} reizigers per dag (%{dp} tegenover het tarief van het tariefverbond) en %{rev} aan kaartopbrengst per dag (%{dr}), als ze eraan gewend zijn - een paar weken. De eerste dagen: zo'n %{first} reizigers."
  de: "Bei %{fare}: etwa %{pax} Fahrgäste am Tag (%{dp} gegenüber dem Verbundpreis) und %{rev} Fahrgeld am Tag (%{dr}), sobald sie sich daran gewöhnt haben - ein paar Wochen. Die ersten Tage: etwa %{first} Fahrgäste."
  fr: "À %{fare} : environ %{pax} voyageurs par jour (%{dp} par rapport au tarif de la communauté) et %{rev} de recettes par jour (%{dr}), une fois habitués - quelques semaines. Les premiers jours : environ %{first} voyageurs."
  ru: "При %{fare}: около %{pax} пассажиров в день (%{dp} к тарифу союза) и %{rev} выручки в день (%{dr}), когда привыкнут - через несколько недель. В первые дни: около %{first} пассажиров."
  uk: "За %{fare}: близько %{pax} пасажирів на день (%{dp} до тарифу союзу) і %{rev} виручки на день (%{dr}), коли звикнуть - за кілька тижнів. Перші дні: близько %{first} пасажирів."
  pl: "Przy %{fare}: około %{pax} pasażerów dziennie (%{dp} wobec taryfy związku) i %{rev} wpływów dziennie (%{dr}), gdy się przyzwyczają - kilka tygodni. Pierwsze dni: około %{first} pasażerów."
  es: "A %{fare}: unos %{pax} pasajeros al día (%{dp} frente a la tarifa del consorcio) y %{rev} de tarifas al día (%{dr}), una vez que se hayan acostumbrado - unas semanas. Los primeros días: unos %{first} pasajeros."
"The line has no tour today: what the fare does is shown on a day it runs.":
  nl: "De lijn heeft vandaag geen omloop: wat het tarief doet zie je op een dag dat ze rijdt."
  de: "Die Linie hat heute keinen Umlauf: Was der Fahrpreis bewirkt, sehen Sie an einem Tag, an dem sie fährt."
  fr: "La ligne n'a aucun service aujourd'hui : l'effet du tarif se voit un jour où elle roule."
  ru: "Сегодня у линии нет оборотов: действие тарифа видно в день, когда она работает."
  uk: "Сьогодні в лінії немає оборотів: дію тарифу видно в день, коли вона працює."
  pl: "Linia nie ma dziś brygad: działanie taryfy widać w dniu, w którym kursuje."
  es: "La línea no tiene ningún recorrido hoy: lo que hace la tarifa se muestra un día en que circule."
"Far above the association's fare: every day of it costs reputation as well.":
  nl: "Ver boven het tarief van het tariefverbond: elke dag kost het ook reputatie."
  de: "Weit über dem Verbundpreis: Jeder Tag kostet auch Ansehen."
  fr: "Bien au-dessus du tarif de la communauté : chaque jour coûte aussi de la réputation."
  ru: "Намного выше тарифа союза: каждый такой день стоит и репутации."
  uk: "Набагато вище тарифу союзу: кожен такий день коштує й репутації."
  pl: "Znacznie powyżej taryfy związku: każdy dzień kosztuje też reputację."
  es: "Muy por encima de la tarifa del consorcio: cada día así también cuesta reputación."
"Its passengers now: %{p} of what the association's fare would bring.":
  nl: "Haar reizigers nu: %{p} van wat het tarief van het tariefverbond zou opleveren."
  de: "Ihre Fahrgäste jetzt: %{p} dessen, was der Verbundpreis brächte."
  fr: "Ses voyageurs aujourd'hui : %{p} de ce qu'apporterait le tarif de la communauté."
