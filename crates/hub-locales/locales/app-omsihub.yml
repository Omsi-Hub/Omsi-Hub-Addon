  de: "Pro Tag bei jedem Tagesabschluss bezahlt; der Bus geht nach dem letzten Tag zurück. Ein Mietbus ist ein paar Jahre alt und gut gepflegt."
  fr: "Payé à la journée à chaque clôture ; le bus est rendu après le dernier jour. Un bus loué a quelques années et est bien entretenu."
  ru: "Оплачивается за каждый день при его закрытии; после последнего дня автобус возвращается. Арендованному автобусу несколько лет, он в хорошем состоянии."
  uk: "Оплачується за кожен день під час його закриття; після останнього дня автобус повертається. Орендованому автобусу кілька років, він у доброму стані."
  pl: "Płatne za dzień przy każdym zamknięciu dnia; autobus wraca po ostatnim dniu. Wynajęty autobus ma kilka lat i jest dobrze utrzymany."
