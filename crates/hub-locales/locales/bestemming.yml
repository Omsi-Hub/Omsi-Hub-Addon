  pl: "Obraz tablicy rolkowej"
  es: "Imagen de la cortinilla"
"The picture of a roller-blind sign (a .tga file): only buses with a roller blind read it.":
  nl: "De afbeelding van een rolfilmbord (een .tga-bestand): alleen bussen met een rolfilm lezen het."
  de: "Das Bild einer Rollbandanzeige (eine .tga-Datei): nur Busse mit Rollband lesen es."
  fr: "L’image d’une girouette à film déroulant (un fichier .tga) : seuls les bus qui en ont une la lisent."
  ru: "Изображение роликового указателя (файл .tga): его читают только автобусы с таким указателем."
  uk: "Зображення роликового покажчика (файл .tga): його читають лише автобуси з таким покажчиком."
  pl: "Obraz tablicy rolkowej (plik .tga): czytają go tylko autobusy z tablicą rolkową."
  es: "La imagen de un letrero de cortinilla (un archivo .tga): solo la leen los autobuses con cortinilla."
"Plug-in sign":
  nl: "Insteekbord"
  de: "Steckschild"
  fr: "Panneau amovible"
  ru: "Вставная табличка"
  uk: "Вставна табличка"
  pl: "Tabliczka wtykana"
  es: "Cartel de quita y pon"
"A sign behind the windscreen, by its number. Empty: none.":
  nl: "Een bord achter de voorruit, op nummer. Leeg: geen."
  de: "Ein Schild hinter der Frontscheibe, nach seiner Nummer. Leer: keins."
  fr: "Un panneau derrière le pare-brise, par son numéro. Vide : aucun."
  ru: "Табличка за лобовым стеклом, по её номеру. Пусто: нет."
  uk: "Табличка за лобовим склом, за її номером. Порожньо: немає."
  pl: "Tabliczka za przednią szybą, według numeru. Puste: brak."
  es: "Un cartel detrás del parabrisas, por su número. Vacío: ninguno."
"Picture on LED signs":
  nl: "Afbeelding op ledborden"
  de: "Bild auf LED-Anzeigen"
  fr: "Image sur les girouettes LED"
  ru: "Картинка на светодиодных табло"
  uk: "Зображення на світлодіодних табло"
  pl: "Obraz na tablicach LED"
  es: "Imagen en letreros LED"
"A picture a Krüger LED sign shows instead of the text (a .bmp file). Empty: the text is shown.":
  nl: "Een afbeelding die een Krüger-ledbord toont in plaats van de tekst (een .bmp-bestand). Leeg: de tekst wordt getoond."
  de: "Ein Bild, das eine Krüger-LED-Anzeige statt des Textes zeigt (eine .bmp-Datei). Leer: der Text wird gezeigt."
  fr: "Une image qu’une girouette LED Krüger affiche à la place du texte (un fichier .bmp). Vide : le texte s’affiche."
  ru: "Картинка, которую светодиодное табло Krüger показывает вместо текста (файл .bmp). Пусто: показывается текст."
  uk: "Зображення, яке світлодіодне табло Krüger показує замість тексту (файл .bmp). Порожньо: показується текст."
  pl: "Obraz, który tablica LED Krüger pokazuje zamiast tekstu (plik .bmp). Puste: pokazywany jest tekst."
  es: "Una imagen que muestra un letrero LED de Krüger en lugar del texto (un archivo .bmp). Vacío: se muestra el texto."
"Special trip mark":
  nl: "Markering speciale rit"
  de: "Sonderfahrt-Kennung"
  fr: "Marque de course spéciale"
  ru: "Отметка спецрейса"
  uk: "Позначка спецрейсу"
  pl: "Oznaczenie kursu specjalnego"
  es: "Marca de viaje especial"
"Anything written here makes it a special trip: the sign shows no line number. Leave it empty for a line.":
  nl: "Alles wat hier staat, maakt er een speciale rit van: het bord toont geen lijnnummer. Laat het leeg voor een lijn."
  de: "Alles, was hier steht, macht sie zur Sonderfahrt: die Anzeige zeigt keine Liniennummer. Für eine Linie leer lassen."
  fr: "Tout texte ici en fait une course spéciale : la girouette n’affiche aucun numéro de ligne. Laissez vide pour une ligne."
  ru: "Любой текст здесь делает рейс специальным: табло не показывает номер маршрута. Для линии оставьте пустым."
  uk: "Будь-який текст тут робить рейс спеціальним: табло не показує номер маршруту. Для лінії залиште порожнім."
  pl: "Cokolwiek tu wpisane czyni z tego kurs specjalny: tablica nie pokazuje numeru linii. Dla linii zostaw puste."
  es: "Cualquier cosa escrita aquí lo convierte en viaje especial: el letrero no muestra número de línea. Déjalo vacío para una línea."
"Rear sign":
  nl: "Achterbord"
  de: "Heckanzeige"
  fr: "Girouette arrière"
  ru: "Заднее табло"
  uk: "Заднє табло"
  pl: "Tablica tylna"
  es: "Letrero trasero"
"The small sign at the back, on some buses only.":
  nl: "Het kleine bord achterop, alleen bij sommige bussen."
  de: "Die kleine Anzeige hinten, nur bei manchen Bussen."
  fr: "La petite girouette à l’arrière, sur certains bus seulement."
  ru: "Маленькое табло сзади, только у некоторых автобусов."
  uk: "Маленьке табло ззаду, лише в деяких автобусів."
  pl: "Mała tablica z tyłu, tylko w niektórych autobusach."
  es: "El letrero pequeño de detrás, solo en algunos autobuses."
"For some buses only":
  nl: "Alleen voor sommige bussen"
  de: "Nur für manche Busse"
  fr: "Pour certains bus seulement"
  ru: "Только для некоторых автобусов"
  uk: "Лише для деяких автобусів"
  pl: "Tylko dla niektórych autobusów"
  es: "Solo para algunos autobuses"
"Read only by some buses' signs; when it is empty, they show “%{text}” instead.":
  nl: "Alleen de borden van sommige bussen lezen dit; is het leeg, dan tonen ze “%{text}”."
  de: "Nur die Anzeigen mancher Busse lesen das; ist es leer, zeigen sie stattdessen „%{text}“."
  fr: "Lu seulement par les girouettes de certains bus ; s’il est vide, elles affichent « %{text} » à la place."
  ru: "Читается только табло некоторых автобусов; если пусто, они показывают вместо этого «%{text}»."
  uk: "Читається лише табло деяких автобусів; якщо порожньо, вони показують замість цього «%{text}»."
  pl: "Czytane tylko przez tablice niektórych autobusów; gdy puste, pokazują zamiast tego „%{text}”."
  es: "Solo lo leen los letreros de algunos autobuses; si está vacío, muestran “%{text}” en su lugar."
"Only the depot file says what this is for (below); most buses do not read it.":
  nl: "Alleen het hof-bestand zegt waarvoor dit is (hieronder); de meeste bussen lezen het niet."
  de: "Nur die Hofdatei sagt, wofür das ist (unten); die meisten Busse lesen es nicht."
  fr: "Seul le fichier de dépôt dit à quoi il sert (ci-dessous) ; la plupart des bus ne le lisent pas."
  ru: "Только файл депо говорит, для чего это (ниже); большинство автобусов это не читает."
  uk: "Лише файл депо каже, для чого це (нижче); більшість автобусів цього не читає."
  pl: "Tylko plik zajezdni mówi, do czego to służy (poniżej); większość autobusów tego nie czyta."
  es: "Solo el archivo de cochera dice para qué sirve esto (abajo); la mayoría de los autobuses no lo leen."
"The depot file does not say what this text is for, and most buses do not read it: empty is safe.":
  nl: "Het hof-bestand zegt niet waarvoor deze tekst is, en de meeste bussen lezen hem niet: leeg is veilig."
  de: "Die Hofdatei sagt nicht, wofür dieser Text ist, und die meisten Busse lesen ihn nicht: leer ist sicher."
  fr: "Le fichier de dépôt ne dit pas à quoi sert ce texte, et la plupart des bus ne le lisent pas : vide, c’est sans risque."
  ru: "Файл депо не говорит, для чего этот текст, и большинство автобусов его не читает: пустым оставлять безопасно."
  uk: "Файл депо не каже, для чого цей текст, і більшість автобусів його не читає: порожнім залишати безпечно."
  pl: "Plik zajezdni nie mówi, do czego służy ten tekst, a większość autobusów go nie czyta: puste jest bezpieczne."
  es: "El archivo de cochera no dice para qué sirve este texto, y la mayoría de los autobuses no lo leen: dejarlo vacío es seguro."
"Side: %{side} · IBIS: %{ibis}":
  nl: "Zijkant: %{side} · IBIS: %{ibis}"
  de: "Seite: %{side} · IBIS: %{ibis}"
  fr: "Côté : %{side} · IBIS : %{ibis}"
  ru: "Сбоку: %{side} · IBIS: %{ibis}"
  uk: "Збоку: %{side} · IBIS: %{ibis}"
  pl: "Bok: %{side} · IBIS: %{ibis}"
  es: "Lateral: %{side} · IBIS: %{ibis}"
"%{name} is in the depot file: the buses show its own texts.":
  nl: "%{name} staat in het hof-bestand: de bussen tonen de eigen teksten ervan."
  de: "%{name} steht in der Hofdatei: die Busse zeigen ihre eigenen Texte."
  fr: "%{name} figure dans le fichier de dépôt : les bus affichent ses propres textes."
  ru: "%{name} есть в файле депо: автобусы показывают его собственные тексты."
  uk: "%{name} є у файлі депо: автобуси показують його власні тексти."
  pl: "%{name} jest w pliku zajezdni: autobusy pokazują jego własne teksty."
  es: "%{name} está en el archivo de cochera: los autobuses muestran sus propios textos."
"Some texts are your own (Advanced); the others are made from this destination.":
  nl: "Sommige teksten zijn van jezelf (Uitgebreid); de andere worden uit deze bestemming gemaakt."
  de: "Einige Texte sind deine eigenen (Erweitert); die anderen werden aus diesem Ziel gebildet."
  fr: "Certains textes sont les vôtres (Avancé) ; les autres sont tirés de cette destination."
  ru: "Некоторые тексты ваши (Расширенно); остальные составлены из этого пункта назначения."
  uk: "Деякі тексти ваші (Розширено); решта складена з цього пункту призначення."
  pl: "Niektóre teksty są twoje (Zaawansowany); pozostałe powstają z tego celu."
  es: "Algunos textos son tuyos (Avanzado); los demás se crean a partir de este destino."
"Every display of the bus is filled from this destination. Advanced: each text on its own, the IBIS route and the stops' names.":
  nl: "Elk display van de bus wordt uit deze bestemming gevuld. Uitgebreid: elke tekst apart, de IBIS-route en de haltenamen."
  de: "Jede Anzeige des Busses wird aus diesem Ziel gefüllt. Erweitert: jeder Text einzeln, die IBIS-Route und die Haltestellennamen."
  fr: "Chaque affichage du bus est rempli à partir de cette destination. Avancé : chaque texte à part, l’itinéraire IBIS et les noms des arrêts."
  ru: "Все табло автобуса заполняются из этого пункта назначения. Расширенно: каждый текст отдельно, маршрут IBIS и названия остановок."
  uk: "Усі табло автобуса заповнюються з цього пункту призначення. Розширено: кожен текст окремо, маршрут IBIS і назви зупинок."
  pl: "Każdy wyświetlacz autobusu jest wypełniany z tego celu. Zaawansowany: każdy tekst osobno, trasa IBIS i nazwy przystanków."
  es: "Todas las pantallas del autobús se rellenan a partir de este destino. Avanzado: cada texto por separado, la ruta del IBIS y los nombres de las paradas."
"The depot file knows it as %{name}":
  nl: "Het hof-bestand kent dit als %{name}"
  de: "Die Hofdatei kennt es als %{name}"
  fr: "Le fichier de dépôt la connaît sous le nom %{name}"
  ru: "В файле депо это %{name}"
  uk: "У файлі депо це %{name}"
  pl: "Plik zajezdni zna to jako %{name}"
  es: "El archivo de cochera lo conoce como %{name}"
