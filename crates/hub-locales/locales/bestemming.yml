  nl: "Gebruiken"
  de: "Übernehmen"
  fr: "L’utiliser"
  ru: "Использовать"
  uk: "Використати"
  pl: "Użyj"
  es: "Usarlo"
"Too long for the sign, so it is shortened. Advanced: write each row yourself.":
  nl: "Te lang voor het bord, dus ingekort. Uitgebreid: schrijf elke regel zelf."
  de: "Zu lang für die Anzeige, daher gekürzt. Erweitert: schreib jede Zeile selbst."
  fr: "Trop long pour la girouette, donc raccourci. Avancé : écrivez chaque ligne vous-même."
  ru: "Слишком длинно для табло, поэтому сокращено. Расширенно: напишите каждую строку сами."
  uk: "Задовго для табло, тому скорочено. Розширено: напишіть кожен рядок самі."
  pl: "Za długie na tablicę, więc skrócone. Zaawansowany: napisz każdy wiersz sam."
  es: "Demasiado largo para el letrero, así que se acorta. Avanzado: escribe tú mismo cada fila."
"Choose one the buses know":
  nl: "Kies er een die de bussen kennen"
  de: "Eins wählen, das die Busse kennen"
  fr: "En choisir une que les bus connaissent"
  ru: "Выбрать известный автобусам"
  uk: "Вибрати відомий автобусам"
  pl: "Wybierz taki, który autobusy znają"
  es: "Elige uno que conozcan los autobuses"
"Depot file: “%{note}”":
  nl: "Hof-bestand: “%{note}”"
  de: "Hofdatei: „%{note}“"
  fr: "Fichier de dépôt : « %{note} »"
  ru: "Файл депо: «%{note}»"
  uk: "Файл депо: «%{note}»"
  pl: "Plik zajezdni: „%{note}”"
  es: "Archivo de cochera: “%{note}”"
"Each field is one text of the depot file; the bus reads each one for one display. Empty: the grey text made from the destination. Another destination makes them again.":
  nl: "Elk veld is één tekst van het hof-bestand; de bus leest elke tekst voor één display. Leeg: de grijze tekst die uit de bestemming gemaakt is. Een andere bestemming maakt ze opnieuw."
  de: "Jedes Feld ist ein Text der Hofdatei; der Bus liest jeden für eine Anzeige. Leer: der graue Text, aus dem Ziel gebildet. Ein anderes Ziel bildet sie neu."
  fr: "Chaque champ est un texte du fichier de dépôt ; le bus lit chacun pour un affichage. Vide : le texte grisé tiré de la destination. Une autre destination les refait."
  ru: "Каждое поле — один текст файла депо; автобус читает каждый для одного табло. Пусто: серый текст, составленный из пункта назначения. Другой пункт назначения составляет их заново."
  uk: "Кожне поле — один текст файлу депо; автобус читає кожен для одного табло. Порожньо: сірий текст, складений з пункту призначення. Інший пункт призначення складає їх заново."
  pl: "Każde pole to jeden tekst pliku zajezdni; autobus czyta każdy dla jednego wyświetlacza. Puste: szary tekst utworzony z celu. Inny cel tworzy je od nowa."
  es: "Cada campo es un texto del archivo de cochera; el autobús lee cada uno para una pantalla. Vacío: el texto gris creado a partir del destino. Otro destino los vuelve a crear."
"These are the depot file's own texts for %{name}: change them in a depot file of your own (depot editor).":
  nl: "Dit zijn de eigen teksten van het hof-bestand voor %{name}: wijzig ze in een eigen hof-bestand (hof-editor)."
  de: "Das sind die eigenen Texte der Hofdatei für %{name}: ändere sie in einer eigenen Hofdatei (Hofdatei-Editor)."
  fr: "Ce sont les propres textes du fichier de dépôt pour %{name} : modifiez-les dans un fichier de dépôt à vous (éditeur de dépôt)."
  ru: "Это собственные тексты файла депо для %{name}: измените их в своём файле депо (редактор депо)."
  uk: "Це власні тексти файлу депо для %{name}: змініть їх у власному файлі депо (редактор депо)."
  pl: "To własne teksty pliku zajezdni dla %{name}: zmień je we własnym pliku zajezdni (edytor zajezdni)."
  es: "Estos son los textos propios del archivo de cochera para %{name}: cámbialos en un archivo de cochera tuyo (editor de cocheras)."
"Hide the stops":
  nl: "Haltes verbergen"
  de: "Haltestellen ausblenden"
  fr: "Masquer les arrêts"
  ru: "Скрыть остановки"
  uk: "Сховати зупинки"
  pl: "Ukryj przystanki"
  es: "Ocultar las paradas"
"Show the %{n} stops":
  nl: "De %{n} haltes tonen"
  de: "Die %{n} Haltestellen zeigen"
  fr: "Afficher les %{n} arrêts"
  ru: "Показать остановки (%{n})"
  uk: "Показати зупинки (%{n})"
  pl: "Pokaż przystanki (%{n})"
  es: "Mostrar las %{n} paradas"
"Hide the texts for other kinds of sign":
  nl: "De teksten voor andere soorten borden verbergen"
  de: "Die Texte für andere Anzeigearten ausblenden"
  fr: "Masquer les textes des autres types de girouettes"
  ru: "Скрыть тексты для других видов табло"
  uk: "Сховати тексти для інших видів табло"
  pl: "Ukryj teksty dla innych rodzajów tablic"
  es: "Ocultar los textos para otros tipos de letrero"
"%{n} more texts, for other kinds of sign":
  nl: "Nog %{n} teksten, voor andere soorten borden"
  de: "%{n} weitere Texte, für andere Anzeigearten"
  fr: "%{n} textes de plus, pour d’autres types de girouettes"
  ru: "Ещё текстов: %{n}, для других видов табло"
  uk: "Ще текстів: %{n}, для інших видів табло"
  pl: "Jeszcze %{n} tekstów, dla innych rodzajów tablic"
  es: "%{n} textos más, para otros tipos de letrero"
"The number the driver types into the IBIS for this direction: the line's number and two digits. Empty: one is given when the line is saved.":
  nl: "Het nummer dat de chauffeur voor deze richting in de IBIS intikt: het lijnnummer en twee cijfers. Leeg: er wordt er een gegeven bij het opslaan van de lijn."
  de: "Die Nummer, die der Fahrer für diese Richtung ins IBIS tippt: die Liniennummer und zwei Ziffern. Leer: beim Speichern der Linie wird eine vergeben."
  fr: "Le numéro que le conducteur tape dans l’IBIS pour ce sens : le numéro de la ligne et deux chiffres. Vide : un numéro est attribué à l’enregistrement de la ligne."
  ru: "Номер, который водитель набирает в IBIS для этого направления: номер маршрута и две цифры. Пусто: номер назначается при сохранении линии."
  uk: "Номер, який водій набирає в IBIS для цього напрямку: номер маршруту і дві цифри. Порожньо: номер призначається під час збереження лінії."
  pl: "Numer, który kierowca wpisuje w IBIS dla tego kierunku: numer linii i dwie cyfry. Puste: numer zostanie nadany przy zapisie linii."
  es: "El número que el conductor teclea en el IBIS para este sentido: el número de la línea y dos cifras. Vacío: se asigna uno al guardar la línea."
"What the IBIS and the passenger displays call each stop. Empty: the depot file's name for it (grey).":
  nl: "Hoe de IBIS en de reizigersdisplays elke halte noemen. Leeg: de naam uit het hof-bestand (grijs)."
  de: "Wie das IBIS und die Fahrgastanzeigen jede Haltestelle nennen. Leer: der Name aus der Hofdatei (grau)."
  fr: "Le nom que l’IBIS et les affichages voyageurs donnent à chaque arrêt. Vide : le nom du fichier de dépôt (grisé)."
  ru: "Как IBIS и табло для пассажиров называют каждую остановку. Пусто: название из файла депо (серым)."
  uk: "Як IBIS і табло для пасажирів називають кожну зупинку. Порожньо: назва з файлу депо (сірим)."
  pl: "Jak IBIS i wyświetlacze dla pasażerów nazywają każdy przystanek. Puste: nazwa z pliku zajezdni (szara)."
  es: "Cómo llaman el IBIS y las pantallas de pasajeros a cada parada. Vacío: el nombre del archivo de cochera (gris)."
"Names for the buses to know besides the depot file's: each one kept is in the destination list of every line of this map.":
  nl: "Namen die de bussen naast die uit het hof-bestand moeten kennen: elke bewaarde staat in de bestemmingslijst van elke lijn op deze kaart."
  de: "Namen, die die Busse neben denen der Hofdatei kennen sollen: jeder aufbewahrte steht in der Zielliste jeder Linie dieser Karte."
  fr: "Des noms que les bus doivent connaître en plus de ceux du fichier de dépôt : chacun gardé figure dans la liste des destinations de chaque ligne de cette carte."
  ru: "Названия, которые автобусы должны знать помимо названий из файла депо: каждое сохранённое есть в списке пунктов назначения каждой линии этой карты."
  uk: "Назви, які автобуси мають знати, окрім назв із файлу депо: кожна збережена є в списку пунктів призначення кожної лінії цієї мапи."
  pl: "Nazwy, które autobusy mają znać oprócz tych z pliku zajezdni: każda zachowana jest na liście celów każdej linii tej mapy."
  es: "Nombres que deben conocer los autobuses además de los del archivo de cochera: cada uno que se guarde está en la lista de destinos de todas las líneas de este mapa."
