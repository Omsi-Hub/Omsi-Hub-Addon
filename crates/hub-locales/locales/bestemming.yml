_version: 2
# The line editor's destination and displays: one destination field, the Simple and the
# Advanced view of the Displays tab, and what each text of a depot file is for (also the
# depot editor's labels).
"What the driver's IBIS shows as the destination, in capitals.":
  nl: "Wat de IBIS van de chauffeur als bestemming toont, in hoofdletters."
  de: "Was das IBIS des Fahrers als Ziel zeigt, in Großbuchstaben."
  fr: "Ce que l’IBIS du conducteur affiche comme destination, en majuscules."
  ru: "Что IBIS водителя показывает как пункт назначения, заглавными буквами."
  uk: "Що IBIS водія показує як пункт призначення, великими літерами."
  pl: "To, co IBIS kierowcy pokazuje jako cel, wielkimi literami."
  es: "Lo que el IBIS del conductor muestra como destino, en mayúsculas."
"Front sign, top row":
  nl: "Frontbord, bovenste regel"
  de: "Frontanzeige, obere Zeile"
  fr: "Girouette avant, ligne du haut"
  ru: "Переднее табло, верхняя строка"
  uk: "Переднє табло, верхній рядок"
  pl: "Tablica przednia, górny wiersz"
  es: "Letrero frontal, fila superior"
"The top row of the destination sign over the windscreen. A name that fits stays on this row alone.":
  nl: "De bovenste regel van het bestemmingsbord boven de voorruit. Een naam die past, staat alleen op deze regel."
  de: "Die obere Zeile der Zielanzeige über der Frontscheibe. Ein Name, der passt, steht allein in dieser Zeile."
  fr: "La ligne du haut de la girouette au-dessus du pare-brise. Un nom qui tient reste seul sur cette ligne."
  ru: "Верхняя строка маршрутного табло над лобовым стеклом. Название, которое помещается, стоит только в этой строке."
  uk: "Верхній рядок маршрутного табло над лобовим склом. Назва, що вміщається, стоїть лише в цьому рядку."
  pl: "Górny wiersz tablicy kierunkowej nad przednią szybą. Nazwa, która się mieści, zostaje sama w tym wierszu."
  es: "La fila superior del letrero de destino sobre el parabrisas. Un nombre que cabe se queda solo en esta fila."
"The top row of the destination sign over the windscreen, for a name of two rows. This depot file writes a shorter name on the bottom row alone; the buses move it up.":
  nl: "De bovenste regel van het bestemmingsbord boven de voorruit, voor een naam van twee regels. Dit hof-bestand zet een kortere naam alleen op de onderste regel; de bussen schuiven die omhoog."
  de: "Die obere Zeile der Zielanzeige über der Frontscheibe, für einen Namen in zwei Zeilen. Diese Hofdatei schreibt einen kürzeren Namen allein in die untere Zeile; die Busse rücken ihn nach oben."
  fr: "La ligne du haut de la girouette au-dessus du pare-brise, pour un nom sur deux lignes. Ce fichier de dépôt écrit un nom plus court seul sur la ligne du bas ; les bus le remontent."
  ru: "Верхняя строка маршрутного табло над лобовым стеклом — для названия в две строки. Этот файл депо пишет более короткое название только в нижней строке; автобусы поднимают его наверх."
  uk: "Верхній рядок маршрутного табло над лобовим склом — для назви у два рядки. Цей файл депо пише коротшу назву лише в нижньому рядку; автобуси піднімають її вгору."
  pl: "Górny wiersz tablicy kierunkowej nad przednią szybą, dla nazwy w dwóch wierszach. Ten plik zajezdni wpisuje krótszą nazwę sam w dolny wiersz; autobusy przesuwają ją w górę."
  es: "La fila superior del letrero de destino sobre el parabrisas, para un nombre de dos filas. Este archivo de cochera escribe un nombre más corto solo en la fila inferior; los autobuses lo suben."
"Front sign, bottom row":
  nl: "Frontbord, onderste regel"
  de: "Frontanzeige, untere Zeile"
  fr: "Girouette avant, ligne du bas"
  ru: "Переднее табло, нижняя строка"
  uk: "Переднє табло, нижній рядок"
  pl: "Tablica przednia, dolny wiersz"
  es: "Letrero frontal, fila inferior"
"The second row of the front sign, for a name too long for one. Empty: the top row is shown alone.":
  nl: "De tweede regel van het frontbord, voor een naam die te lang is voor één regel. Leeg: de bovenste regel staat er alleen."
  de: "Die zweite Zeile der Frontanzeige, für einen Namen, der für eine zu lang ist. Leer: die obere Zeile steht allein."
  fr: "La deuxième ligne de la girouette avant, pour un nom trop long pour une seule. Vide : la ligne du haut s’affiche seule."
  ru: "Вторая строка переднего табло — для названия, слишком длинного для одной. Пусто: показывается только верхняя строка."
  uk: "Другий рядок переднього табло — для назви, задовгої для одного. Порожньо: показується лише верхній рядок."
  pl: "Drugi wiersz tablicy przedniej, dla nazwy za długiej na jeden. Puste: górny wiersz jest pokazany sam."
  es: "La segunda fila del letrero frontal, para un nombre demasiado largo para una sola. Vacía: se muestra solo la fila superior."
"The second row of the front sign. This depot file writes a name that fits on this row alone, and the buses move it up; a longer one is split over both rows.":
  nl: "De tweede regel van het frontbord. Dit hof-bestand zet een naam die past alleen op deze regel, en de bussen schuiven die omhoog; een langere wordt over beide regels verdeeld."
  de: "Die zweite Zeile der Frontanzeige. Diese Hofdatei schreibt einen Namen, der passt, allein in diese Zeile, und die Busse rücken ihn nach oben; ein längerer wird auf beide Zeilen verteilt."
  fr: "La deuxième ligne de la girouette avant. Ce fichier de dépôt écrit un nom qui tient seul sur cette ligne, et les bus le remontent ; un nom plus long est réparti sur les deux lignes."
  ru: "Вторая строка переднего табло. Этот файл депо пишет название, которое помещается, только в этой строке, и автобусы поднимают его наверх; более длинное делится на обе строки."
  uk: "Другий рядок переднього табло. Цей файл депо пише назву, що вміщається, лише в цьому рядку, і автобуси піднімають її вгору; довша ділиться на обидва рядки."
  pl: "Drugi wiersz tablicy przedniej. Ten plik zajezdni wpisuje nazwę, która się mieści, sam w ten wiersz, a autobusy przesuwają ją w górę; dłuższa jest dzielona na oba wiersze."
  es: "La segunda fila del letrero frontal. Este archivo de cochera escribe aquí solo un nombre que cabe en esta fila, y los autobuses lo suben; uno más largo se reparte entre ambas filas."
"Side sign":
  nl: "Zijbord"
  de: "Seitenanzeige"
  fr: "Girouette latérale"
  ru: "Боковое табло"
  uk: "Бокове табло"
  pl: "Tablica boczna"
  es: "Letrero lateral"
"The one-row sign by the doors (on some buses at the back too).":
  nl: "Het bord van één regel bij de deuren (bij sommige bussen ook achterop)."
  de: "Die einzeilige Anzeige an den Türen (bei manchen Bussen auch hinten)."
  fr: "La girouette d’une ligne près des portes (sur certains bus aussi à l’arrière)."
  ru: "Однострочное табло у дверей (у некоторых автобусов и сзади)."
  uk: "Однорядкове табло біля дверей (у деяких автобусів і ззаду)."
  pl: "Jednowierszowa tablica przy drzwiach (w niektórych autobusach także z tyłu)."
  es: "El letrero de una fila junto a las puertas (en algunos autobuses también detrás)."
"Passenger display":
  nl: "Reizigersdisplay"
  de: "Fahrgastanzeige"
  fr: "Affichage voyageurs"
  ru: "Табло для пассажиров"
  uk: "Табло для пасажирів"
  pl: "Wyświetlacz dla pasażerów"
  es: "Pantalla de pasajeros"
"The destination as it is written, for the IBIS 2, the ticket printer and the screens inside the bus.":
  nl: "De bestemming zoals ze geschreven wordt, voor de IBIS 2, de kaartjesprinter en de schermen in de bus."
  de: "Das Ziel, wie es geschrieben wird, für das IBIS 2, den Fahrscheindrucker und die Bildschirme im Bus."
  fr: "La destination telle qu’elle s’écrit, pour l’IBIS 2, l’imprimante à billets et les écrans dans le bus."
  ru: "Пункт назначения в обычном написании — для IBIS 2, принтера билетов и экранов в салоне."
  uk: "Пункт призначення у звичайному написанні — для IBIS 2, принтера квитків і екранів у салоні."
  pl: "Cel zapisany normalnie, dla IBIS 2, drukarki biletów i ekranów w autobusie."
  es: "El destino tal como se escribe, para el IBIS 2, la impresora de billetes y las pantallas del interior del autobús."
"Roller blind picture":
  nl: "Rolfilmafbeelding"
  de: "Rollbandbild"
  fr: "Image du film déroulant"
  ru: "Изображение роликового указателя"
