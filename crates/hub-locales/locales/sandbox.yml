"The game as it is: earn your money, climb the levels, research and win your tenders.":
  de: "Das Spiel, wie es ist: Geld verdienen, Stufen aufsteigen, forschen und Ausschreibungen gewinnen."
  fr: "Le jeu tel quel : gagnez votre argent, montez de niveau, faites de la recherche et remportez vos appels d'offres."
  nl: "Het spel zoals het is: verdien je geld, stijg in niveau, doe onderzoek en win je aanbestedingen."
  pl: "Gra taka, jaka jest: zarabiaj pieniądze, awansuj na kolejne poziomy, prowadź badania i wygrywaj przetargi."
  es: "El juego tal cual: gana tu dinero, sube de nivel, investiga y gana tus licitaciones."
  ru: "Игра как есть: зарабатывайте деньги, поднимайтесь по уровням, ведите исследования и выигрывайте тендеры."
  uk: "Гра як є: заробляйте гроші, підіймайтеся рівнями, ведіть дослідження й вигравайте тендери."
"Set the rules yourself: money, unlocks, prices, wages, disruptions and staff, each on the Sandbox page.":
  de: "Lege die Regeln selbst fest: Geld, Freischaltungen, Preise, Löhne, Störungen und Personal, alles auf der Sandbox-Seite."
  fr: "Fixez vous-même les règles : argent, déblocages, prix, salaires, perturbations et personnel, chacun sur la page Bac à sable."
  nl: "Bepaal zelf de regels: geld, ontgrendelingen, prijzen, lonen, verstoringen en personeel, elk op de Sandbox-pagina."
  pl: "Ustal zasady sam: pieniądze, odblokowania, ceny, płace, zakłócenia i personel, każde na stronie Piaskownicy."
  es: "Pon tú las reglas: dinero, desbloqueos, precios, salarios, incidencias y personal, cada uno en la página Modo libre."
  ru: "Задайте правила сами: деньги, открытия, цены, зарплаты, сбои и персонал — всё на странице «Песочница»."
  uk: "Встановіть правила самі: гроші, відкриття, ціни, зарплати, збої та персонал — усе на сторінці «Пісочниця»."
