"Pay, hours, stress and refused holidays move how content people are, and the unhappy may resign. Off: everyone stays content and calm, and nobody resigns.":
  de: "Lohn, Arbeitszeit, Stress und abgelehnter Urlaub bestimmen, wie zufrieden die Leute sind, und Unzufriedene können kündigen. Aus: Alle bleiben zufrieden und ruhig, und niemand kündigt."
  fr: "Le salaire, les horaires, le stress et les congés refusés font varier la satisfaction, et les mécontents peuvent démissionner. Désactivé : tout le monde reste satisfait et calme, et personne ne démissionne."
  nl: "Loon, uren, stress en geweigerde vakanties bepalen hoe tevreden mensen zijn, en ontevredenen kunnen ontslag nemen. Uit: iedereen blijft tevreden en rustig, en niemand neemt ontslag."
  pl: "Płaca, godziny, stres i odrzucone urlopy wpływają na zadowolenie ludzi, a niezadowoleni mogą odejść. Wyłączone: wszyscy pozostają zadowoleni i spokojni, nikt nie odchodzi."
  es: "El sueldo, las horas, el estrés y las vacaciones denegadas cambian lo contenta que está la gente, y los descontentos pueden dimitir. Desactivado: todos siguen contentos y tranquilos, y nadie dimite."
  ru: "Зарплата, часы, стресс и отказы в отпуске влияют на довольство людей, и недовольные могут уволиться. Выкл.: все остаются довольными и спокойными, никто не увольняется."
  uk: "Зарплата, години, стрес і відмови у відпустці впливають на задоволеність людей, і незадоволені можуть звільнитися. Вимк.: усі лишаються задоволеними й спокійними, ніхто не звільняється."
