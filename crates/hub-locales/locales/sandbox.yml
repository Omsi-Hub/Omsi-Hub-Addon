  uk: "Перетворити %{name} на пісочницю?"
"The company becomes a sandbox for good: you set its rules yourself on the Sandbox page - money, unlocks, prices, wages, disruptions and staff. Its buses, people, lines, money and history stay as they are, and every rule starts as it is now. A sandbox cannot be turned back into a career.":
  de: "Das Unternehmen wird dauerhaft zur Sandbox: Du legst seine Regeln selbst auf der Sandbox-Seite fest – Geld, Freischaltungen, Preise, Löhne, Störungen und Personal. Busse, Leute, Linien, Geld und Verlauf bleiben, wie sie sind, und jede Regel beginnt so, wie sie jetzt ist. Eine Sandbox kann nicht wieder zur Karriere werden."
  fr: "L'entreprise devient un bac à sable pour de bon : vous fixez vous-même ses règles sur la page Bac à sable – argent, déblocages, prix, salaires, perturbations et personnel. Ses bus, son personnel, ses lignes, son argent et son historique restent tels quels, et chaque règle commence comme elle est maintenant. Un bac à sable ne peut pas redevenir une carrière."
  nl: "Het bedrijf wordt voorgoed een sandbox: je bepaalt de regels zelf op de Sandbox-pagina – geld, ontgrendelingen, prijzen, lonen, verstoringen en personeel. Bussen, mensen, lijnen, geld en geschiedenis blijven zoals ze zijn, en elke regel begint zoals hij nu is. Een sandbox kan niet terug naar een carrière."
  pl: "Firma na stałe staje się piaskownicą: jej zasady ustalasz sam na stronie Piaskownicy – pieniądze, odblokowania, ceny, płace, zakłócenia i personel. Autobusy, ludzie, linie, pieniądze i historia pozostają bez zmian, a każda zasada zaczyna się taka, jaka jest teraz. Piaskownicy nie można z powrotem zamienić w karierę."
  es: "La empresa pasa a modo libre para siempre: pones tú sus reglas en la página Modo libre - dinero, desbloqueos, precios, salarios, incidencias y personal. Sus autobuses, su gente, sus líneas, su dinero y su historial se quedan como están, y cada regla empieza como está ahora. Una empresa en modo libre no puede volver a ser de carrera."
  ru: "Компания навсегда становится песочницей: вы сами задаёте её правила на странице «Песочница» — деньги, открытия, цены, зарплаты, сбои и персонал. Автобусы, люди, линии, деньги и история остаются как есть, и каждое правило начинается таким, какое оно сейчас. Песочницу нельзя снова превратить в карьеру."
  uk: "Компанія назавжди стає пісочницею: ви самі задаєте її правила на сторінці «Пісочниця» — гроші, відкриття, ціни, зарплати, збої та персонал. Автобуси, люди, лінії, гроші та історія лишаються як є, і кожне правило починається таким, яким воно є зараз. Пісочницю не можна знову перетворити на кар'єру."
"The company is a sandbox now: set its rules on the Sandbox page.":
  de: "Das Unternehmen ist jetzt eine Sandbox: Lege seine Regeln auf der Sandbox-Seite fest."
  fr: "L'entreprise est maintenant un bac à sable : fixez ses règles sur la page Bac à sable."
  nl: "Het bedrijf is nu een sandbox: bepaal de regels op de Sandbox-pagina."
  pl: "Firma jest teraz piaskownicą: ustal jej zasady na stronie Piaskownicy."
  es: "La empresa está ahora en modo libre: pon sus reglas en la página Modo libre."
  ru: "Компания теперь песочница: задайте её правила на странице «Песочница»."
  uk: "Компанія тепер пісочниця: задайте її правила на сторінці «Пісочниця»."
"Every rule starts as a career company has it: set them on the Sandbox page once the company is founded.":
  de: "Jede Regel beginnt wie bei einem Karriere-Unternehmen: Lege sie auf der Sandbox-Seite fest, sobald das Unternehmen gegründet ist."
  fr: "Chaque règle commence comme dans une carrière : réglez-les sur la page Bac à sable une fois l'entreprise fondée."
  nl: "Elke regel begint zoals bij een carrièrebedrijf: stel ze in op de Sandbox-pagina zodra het bedrijf is opgericht."
  pl: "Każda zasada zaczyna się jak w karierze: ustal je na stronie Piaskownicy po założeniu firmy."
  es: "Cada regla empieza como la tiene una empresa de carrera: ajústalas en la página Modo libre una vez fundada la empresa."
  ru: "Каждое правило начинается как в карьере: задайте их на странице «Песочница», когда компания будет основана."
  uk: "Кожне правило починається як у кар'єрі: задайте їх на сторінці «Пісочниця», коли компанію буде засновано."
"A career can be turned into a sandbox later in the company's settings, but not back.":
