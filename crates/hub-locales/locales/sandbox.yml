"Prices rise over the years, and the contract's payment with them. Off: prices stand still.":
  de: "Die Preise steigen über die Jahre, und die Vertragszahlung mit ihnen. Aus: Die Preise bleiben stehen."
  fr: "Les prix augmentent au fil des ans, et le paiement du contrat avec eux. Désactivé : les prix restent fixes."
  nl: "De prijzen stijgen door de jaren heen, en de contractbetaling mee. Uit: de prijzen staan stil."
  pl: "Ceny rosną z biegiem lat, a wraz z nimi płatność z umowy. Wyłączone: ceny stoją w miejscu."
  es: "Los precios suben con los años, y el pago del contrato con ellos. Desactivado: los precios no cambian."
  ru: "Цены растут с годами, а вместе с ними и оплата по контракту. Выкл.: цены стоят на месте."
  uk: "Ціни зростають з роками, а разом із ними й оплата за контрактом. Вимк.: ціни стоять на місці."
