"Spending never fails and the balance shows ∞. The books still count every euro.":
  de: "Ausgaben scheitern nie, und der Kontostand zeigt ∞. Die Buchhaltung zählt trotzdem jeden Euro."
  fr: "Les dépenses ne sont jamais refusées et le solde affiche ∞. Les comptes notent tout de même chaque euro."
  nl: "Uitgaven lukken altijd en het saldo toont ∞. De boekhouding telt nog steeds elke euro."
  pl: "Wydatki nigdy nie są odrzucane, a saldo pokazuje ∞. Księgi nadal liczą każde euro."
  es: "Los gastos nunca fallan y el saldo muestra ∞. La contabilidad sigue contando cada euro."
  ru: "Траты всегда проходят, а баланс показывает ∞. Бухгалтерия по-прежнему учитывает каждый евро."
  uk: "Витрати завжди проходять, а баланс показує ∞. Бухгалтерія все одно враховує кожен євро."
"Never go broke":
  de: "Nie pleite"
  fr: "Jamais en faillite"
  nl: "Nooit failliet"
  pl: "Nigdy nie zbankrutuj"
  es: "Nunca en bancarrota"
  ru: "Никогда не разориться"
  uk: "Ніколи не збанкрутувати"
"Spending may take the balance below zero, and nothing warns of the company being in the red.":
  de: "Ausgaben dürfen den Kontostand unter null bringen, und nichts warnt davor, dass das Unternehmen im Minus ist."
  fr: "Les dépenses peuvent faire passer le solde sous zéro, et rien n'avertit que l'entreprise est dans le rouge."
  nl: "Uitgaven mogen het saldo onder nul brengen, en niets waarschuwt dat het bedrijf rood staat."
  pl: "Wydatki mogą sprowadzić saldo poniżej zera i nic nie ostrzega, że firma jest na minusie."
  es: "Los gastos pueden dejar el saldo por debajo de cero, y nada avisa de que la empresa está en números rojos."
  ru: "Траты могут увести баланс ниже нуля, и ничто не предупреждает, что компания в минусе."
  uk: "Витрати можуть опустити баланс нижче нуля, і ніщо не попереджає, що компанія в мінусі."
"Loans without interest":
  de: "Kredite ohne Zinsen"
  fr: "Prêts sans intérêts"
  nl: "Leningen zonder rente"
  pl: "Kredyty bez odsetek"
  es: "Préstamos sin intereses"
  ru: "Кредиты без процентов"
  uk: "Кредити без відсотків"
"The bank charges no interest and no fee for paying back early, on new loans and on those running.":
  de: "Die Bank verlangt keine Zinsen und keine Gebühr für vorzeitige Rückzahlung, bei neuen und bei laufenden Krediten."
  fr: "La banque ne prend ni intérêts ni frais de remboursement anticipé, sur les nouveaux prêts comme sur ceux en cours."
  nl: "De bank rekent geen rente en geen boete voor vervroegd aflossen, op nieuwe en op lopende leningen."
  pl: "Bank nie pobiera odsetek ani opłaty za wcześniejszą spłatę, ani od nowych, ani od bieżących kredytów."
  es: "El banco no cobra intereses ni comisión por amortización anticipada, ni en los préstamos nuevos ni en los vigentes."
  ru: "Банк не берёт процентов и платы за досрочное погашение — ни по новым, ни по текущим кредитам."
  uk: "Банк не бере відсотків і плати за дострокове погашення — ні за новими, ні за поточними кредитами."
"Everything unlocked":
  de: "Alles freigeschaltet"
  fr: "Tout débloqué"
  nl: "Alles ontgrendeld"
  pl: "Wszystko odblokowane"
  es: "Todo desbloqueado"
  ru: "Всё открыто"
  uk: "Усе відкрито"
"Every company level's features and courses, all research, every bus size at the dealers, as many concessions as you like, the map's lines without a tender, and every driver qualified for every bus.":
  de: "Alle Funktionen und Kurse jeder Unternehmensstufe, alle Forschung, jede Busgröße bei den Händlern, so viele Konzessionen wie gewünscht, die Linien der Karte ohne Ausschreibung, und jeder Fahrer darf jeden Bus fahren."
  fr: "Toutes les fonctions et formations de chaque niveau, toute la recherche, toutes les tailles de bus chez les concessionnaires, autant de concessions que vous voulez, les lignes de la carte sans appel d'offres, et chaque conducteur qualifié pour chaque bus."
  nl: "Alle functies en cursussen van elk bedrijfsniveau, al het onderzoek, elke busgrootte bij de dealers, zoveel concessies als je wilt, de lijnen van de kaart zonder aanbesteding, en elke chauffeur bevoegd voor elke bus."
  pl: "Wszystkie funkcje i kursy każdego poziomu firmy, wszystkie badania, każdy rozmiar autobusu u dealerów, dowolnie wiele koncesji, linie mapy bez przetargu i każdy kierowca uprawniony do każdego autobusu."
  es: "Las funciones y cursos de cada nivel de empresa, toda la investigación, todos los tamaños de autobús en los concesionarios, tantas concesiones como quieras, las líneas del mapa sin licitación y todos los conductores habilitados para todos los autobuses."
  ru: "Все функции и курсы каждого уровня компании, все исследования, автобусы любого размера у дилеров, сколько угодно концессий, линии карты без тендера и каждый водитель допущен к любому автобусу."
  uk: "Усі функції та курси кожного рівня компанії, усі дослідження, автобуси будь-якого розміру в дилерів, скільки завгодно концесій, лінії мапи без тендеру й кожен водій допущений до будь-якого автобуса."
