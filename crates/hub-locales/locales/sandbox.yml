"Twice as many applicants, free job adverts, and a role whose applicants are all hired gets new ones at once.":
  de: "Doppelt so viele Bewerber, kostenlose Stellenanzeigen, und für eine Rolle, deren Bewerber alle eingestellt sind, kommen sofort neue."
  fr: "Deux fois plus de candidats, des annonces gratuites, et un poste dont tous les candidats sont embauchés en reçoit aussitôt de nouveaux."
  nl: "Twee keer zoveel sollicitanten, gratis vacatures, en een functie waarvan alle sollicitanten zijn aangenomen krijgt meteen nieuwe."
  pl: "Dwa razy więcej kandydatów, darmowe ogłoszenia, a stanowisko, na które zatrudniono wszystkich kandydatów, od razu dostaje nowych."
  es: "El doble de candidatos, ofertas de empleo gratis, y un puesto cuyos candidatos se han contratado todos recibe nuevos al instante."
  ru: "Вдвое больше кандидатов, бесплатные объявления, а на должность, где всех кандидатов уже наняли, сразу приходят новые."
  uk: "Удвічі більше кандидатів, безкоштовні оголошення, а на посаду, де всіх кандидатів уже найнято, одразу приходять нові."
