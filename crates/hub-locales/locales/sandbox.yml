  nl: "Stel de regels van het bedrijf in zoals jij wilt. Elke instelling begint zoals bij een carrièrebedrijf; verander die hier wanneer je wilt."
  pl: "Ustal zasady firmy tak, jak chcesz. Każde ustawienie zaczyna się jak w firmie w trybie kariery; zmieniaj je tutaj w dowolnej chwili."
