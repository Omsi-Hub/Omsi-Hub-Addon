"Only devices in your own network reach it, and only with a pairing code.":
  de: "Nur Geräte in deinem eigenen Netzwerk erreichen es, und nur mit einem Kopplungscode."
  fr: "Seuls les appareils de votre propre réseau y accèdent, et seulement avec un code d'appairage."
  nl: "Alleen apparaten in je eigen netwerk bereiken het, en alleen met een koppelcode."
  pl: "Dostęp mają tylko urządzenia z twojej sieci i tylko z kodem parowania."
  es: "Solo los dispositivos de tu propia red llegan a él, y solo con un código de emparejamiento."
  ru: "Доступ есть только у устройств вашей сети и только с кодом сопряжения."
  uk: "Доступ мають лише пристрої вашої мережі й лише з кодом з'єднання."
