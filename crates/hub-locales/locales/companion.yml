"Scan the code with the phone's camera, or open the address in its browser and type the pairing code:":
  de: "Scanne den Code mit der Kamera des Handys, oder öffne die Adresse in seinem Browser und gib den Kopplungscode ein:"
  fr: "Scannez le code avec l'appareil photo du téléphone, ou ouvrez l'adresse dans son navigateur et saisissez le code d'appairage :"
  nl: "Scan de code met de camera van de telefoon, of open het adres in de browser en typ de koppelcode:"
  pl: "Zeskanuj kod aparatem telefonu albo otwórz adres w jego przeglądarce i wpisz kod parowania:"
  es: "Escanea el código con la cámara del móvil, o abre la dirección en su navegador y escribe el código de emparejamiento:"
  ru: "Отсканируйте код камерой телефона или откройте адрес в его браузере и введите код сопряжения:"
  uk: "Відскануйте код камерою телефона або відкрийте адресу в його браузері та введіть код з'єднання:"
