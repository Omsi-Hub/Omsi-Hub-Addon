"Windows asks whether Omsi-Hub may let phones in: choose Yes.":
  de: "Windows fragt, ob Omsi-Hub Handys zulassen darf: Wähle Ja."
  fr: "Windows demande si Omsi-Hub peut autoriser les téléphones : choisissez Oui."
  nl: "Windows vraagt of Omsi-Hub telefoons mag toelaten: kies Ja."
  pl: "Windows pyta, czy Omsi-Hub może wpuścić telefony: wybierz Tak."
  es: "Windows pregunta si Omsi-Hub puede dejar entrar a los móviles: elige Sí."
  ru: "Windows спрашивает, можно ли Omsi-Hub пускать телефоны: выберите «Да»."
  uk: "Windows запитує, чи може Omsi-Hub пускати телефони: виберіть «Так»."
