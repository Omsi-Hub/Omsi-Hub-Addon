  pl: "Windows jeszcze nie pozwala telefonom łączyć się z Omsi-Hub."
  es: "Windows aún no deja que los móviles lleguen a Omsi-Hub."
  ru: "Windows пока не пускает телефоны к Omsi-Hub."
  uk: "Windows поки не пускає телефони до Omsi-Hub."
