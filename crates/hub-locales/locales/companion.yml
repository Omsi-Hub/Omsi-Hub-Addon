_version: 2
# The phone and tablet companion on the Settings page (General › Phone & tablet): the web app
# Omsi-Hub serves (or the Omsi-Hub Companion app) paired by its QR code or address and code
# (ui/js/hub/companion.js, crates/hub-api/src/companion.rs).
"Sign on, see your duty, the route and the control room's messages, and work the bus's IBIS and ticket printer on a phone or tablet in your network: in its browser, no app needed.":
  de: "Melde dich an, sieh deinen Dienst, die Route und die Nachrichten der Leitstelle und bediene IBIS und Fahrscheindrucker des Busses auf einem Handy oder Tablet in deinem Netzwerk: im Browser, ohne App."
  fr: "Prenez votre service, voyez votre service, l'itinéraire et les messages du poste de contrôle, et utilisez l'IBIS et l'imprimante à billets du bus sur un téléphone ou une tablette de votre réseau : dans son navigateur, sans app."
  nl: "Meld je aan, zie je dienst, de route en de berichten van de verkeersleiding, en bedien de IBIS en de kaartautomaat van de bus op een telefoon of tablet in je netwerk: in de browser, zonder app."
  pl: "Zaloguj się, zobacz służbę, trasę i wiadomości dyspozytorni oraz obsługuj IBIS i drukarkę biletów autobusu na telefonie lub tablecie w twojej sieci: w przeglądarce, bez aplikacji."
  es: "Toma servicio, consulta tu servicio, la ruta y los mensajes del puesto de control, y maneja el IBIS y la impresora de billetes del autobús en un móvil o tableta de tu red: en su navegador, sin necesidad de app."
  ru: "Отмечайтесь, смотрите наряд, маршрут и сообщения диспетчерской и управляйте IBIS и билетным принтером автобуса на телефоне или планшете в вашей сети: в браузере, без приложения."
  uk: "Відмічайтеся, дивіться наряд, маршрут і повідомлення диспетчерської та керуйте IBIS і квитковим принтером автобуса на телефоні чи планшеті у вашій мережі: у браузері, без застосунку."
"QR code for pairing":
  de: "QR-Code zum Koppeln"
  fr: "QR code d'appairage"
  nl: "QR-code om te koppelen"
