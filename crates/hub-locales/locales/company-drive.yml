"The planning gives the duty its bus, in the company's livery: it is not chosen here.":
  de: "Die Planung gibt dem Dienst seinen Bus in der Lackierung des Unternehmens: Er wird hier nicht gewählt."
  fr: "La planification donne au service son bus, aux couleurs de l'entreprise : il ne se choisit pas ici."
  nl: "De planning geeft de dienst zijn bus, in de huisstijl van het bedrijf: die kies je hier niet."
  pl: "Planowanie przydziela służbie autobus w malowaniu firmy: nie wybiera się go tutaj."
  es: "La planificación asigna al servicio su autobús, con la librea de la empresa: no se elige aquí."
  ru: "Планирование назначает смене автобус в фирменной окраске: здесь он не выбирается."
  uk: "Планування призначає зміні автобус у фірмовому фарбуванні: тут він не обирається."
