"The day's timetable no longer has this duty's trips as planned. Plan the day again in RosterFlow.":
  de: "Der Fahrplan des Tages hat die Fahrten dieses Dienstes nicht mehr wie geplant. Planen Sie den Tag in RosterFlow neu."
  fr: "L'horaire du jour n'a plus les courses de ce service telles que prévues. Replanifiez la journée dans RosterFlow."
  nl: "De dienstregeling van de dag heeft de ritten van deze dienst niet meer zoals gepland. Plan de dag opnieuw in RosterFlow."
  pl: "Rozkład dnia nie ma już kursów tej służby zgodnie z planem. Zaplanuj dzień ponownie w RosterFlow."
  es: "El horario del día ya no tiene los viajes de este servicio tal como se planificaron. Vuelve a planificar el día en RosterFlow."
  ru: "В расписании дня больше нет рейсов этой смены по плану. Спланируйте день заново в RosterFlow."
  uk: "У розкладі дня більше немає рейсів цієї зміни за планом. Сплануйте день заново в RosterFlow."
"The AI drove the rest of this duty":
  de: "Die KI ist den Rest dieses Dienstes gefahren"
  fr: "L'IA a conduit le reste de ce service"
  nl: "De AI heeft de rest van deze dienst gereden"
  pl: "SI przejechała resztę tej służby"
  es: "La IA condujo el resto de este servicio"
  ru: "Остаток этой смены провёл ИИ"
  uk: "Решту цієї зміни провів ШІ"
"Your game ended before the duty did: the trips you drove are yours, the AI drove the others. Choose another duty of yours in RosterFlow.":
  de: "Dein Spiel endete vor dem Dienst: Die Fahrten, die du gefahren bist, sind deine, die anderen fuhr die KI. Wähle in RosterFlow einen anderen deiner Dienste."
  fr: "Votre jeu s'est arrêté avant la fin du service : les courses que vous avez conduites sont les vôtres, l'IA a conduit les autres. Choisissez un autre de vos services dans RosterFlow."
  nl: "Je game stopte voordat de dienst klaar was: de ritten die je reed zijn van jou, de AI reed de rest. Kies een andere dienst van jou in RosterFlow."
  pl: "Twoja gra skończyła się przed końcem służby: kursy, które przejechałeś, są twoje, resztę przejechała SI. Wybierz inną swoją służbę w RosterFlow."
  es: "Tu juego terminó antes que el servicio: los viajes que condujiste son tuyos, la IA condujo los demás. Elige otro de tus servicios en RosterFlow."
  ru: "Игра закончилась раньше смены: рейсы, которые вы провели, ваши, остальные провёл ИИ. Выберите другую свою смену в RosterFlow."
  uk: "Гра закінчилася раніше за зміну: рейси, які ви провели, ваші, решту провів ШІ. Оберіть іншу свою зміну в RosterFlow."
"Take the bus over":
  de: "Bus übernehmen"
  fr: "Reprendre le bus"
  nl: "Bus overnemen"
  pl: "Przejmij autobus"
  es: "Tomar el autobús"
  ru: "Принять автобус"
  uk: "Прийняти автобус"
"Take over this bus":
  de: "Diesen Bus übernehmen"
  fr: "Reprendre ce bus"
  nl: "Deze bus overnemen"
  pl: "Przejmij ten autobus"
  es: "Tomar este autobús"
  ru: "Принять этот автобус"
  uk: "Прийняти цей автобус"
"Take it back from the AI":
  de: "Von der KI zurücknehmen"
  fr: "La reprendre à l'IA"
  nl: "Terugnemen van de AI"
  pl: "Odbierz od SI"
  es: "Recuperarlo de la IA"
  ru: "Забрать у ИИ"
  uk: "Забрати у ШІ"
"Go on with the duty":
  de: "Dienst fortsetzen"
  fr: "Poursuivre le service"
  nl: "Verder met de dienst"
  pl: "Kontynuuj służbę"
  es: "Seguir con el servicio"
  ru: "Продолжить смену"
  uk: "Продовжити зміну"
"AI driver":
  de: "KI-Fahrer"
  fr: "Conducteur IA"
  nl: "AI-chauffeur"
  pl: "Kierowca SI"
  es: "Conductor IA"
  ru: "Водитель-ИИ"
  uk: "Водій-ШІ"
"Your game ended at %{time} before the duty did: the trips you drove (%{driven}) are yours, the AI drives the rest since.":
  de: "Dein Spiel endete um %{time} vor dem Dienst: Die Fahrten, die du gefahren bist (%{driven}), sind deine, den Rest fährt seitdem die KI."
  fr: "Votre jeu s'est arrêté à %{time} avant la fin du service : les courses que vous avez conduites (%{driven}) sont les vôtres, l'IA conduit le reste depuis."
  nl: "Je game stopte om %{time} voordat de dienst klaar was: de ritten die je reed (%{driven}) zijn van jou, sindsdien rijdt de AI de rest."
  pl: "Twoja gra skończyła się o %{time} przed końcem służby: przejechane kursy (%{driven}) są twoje, od tej pory resztę jedzie SI."
  es: "Tu juego terminó a las %{time} antes que el servicio: los viajes que condujiste (%{driven}) son tuyos, desde entonces la IA conduce el resto."
  ru: "Игра закончилась в %{time} раньше смены: проведённые рейсы (%{driven}) ваши, остальное с тех пор ведёт ИИ."
  uk: "Гра закінчилася о %{time} раніше за зміну: проведені рейси (%{driven}) ваші, решту відтоді веде ШІ."
"Its driver drives the bus now: you take it over from them.":
  de: "Der Bus wird gerade von seinem Fahrer gefahren: Du übernimmst ihn."
  fr: "Son conducteur conduit le bus en ce moment : vous le reprenez."
  nl: "De bus wordt nu door zijn chauffeur gereden: jij neemt hem over."
  pl: "Autobusem jedzie teraz jego kierowca: przejmujesz go."
  es: "Ahora conduce el autobús su conductor: tú lo tomas."
  ru: "Сейчас автобус ведёт его водитель: вы принимаете его."
  uk: "Зараз автобус веде його водій: ви приймаєте його."
"You drove %{driven} trips of it: it goes on from the first you did not.":
  de: "Du bist %{driven} Fahrten davon gefahren: Es geht weiter mit der ersten, die du nicht gefahren bist."
  fr: "Vous en avez conduit %{driven} courses : on reprend à la première que vous n'avez pas conduite."
  nl: "Je reed er %{driven} ritten van: hij gaat verder vanaf de eerste die je niet reed."
  pl: "Przejechałeś %{driven} kursów: dalej od pierwszego, którego nie przejechałeś."
  es: "Condujiste %{driven} viajes: sigue desde el primero que no condujiste."
  ru: "Вы провели %{driven} рейсов: продолжение с первого непроведённого."
  uk: "Ви провели %{driven} рейсів: продовження з першого непроведеного."
"The game starts at %{time}, the company's clock, on trip %{n} (the %{dep}), with the bus where it is on its way: everything typed in, you drive on.":
  de: "Das Spiel startet um %{time} nach der Uhr des Unternehmens auf Fahrt %{n} (die um %{dep}), mit dem Bus dort, wo er gerade unterwegs ist: alles eingegeben, du fährst weiter."
  fr: "Le jeu démarre à %{time}, l'heure de l'entreprise, sur la course %{n} (celle de %{dep}), avec le bus là où il se trouve en route : tout est saisi, vous continuez."
  nl: "De game start om %{time} op de klok van het bedrijf, op rit %{n} (die van %{dep}), met de bus op de plek waar hij onderweg is: alles is al ingevoerd, je rijdt zo verder."
  pl: "Gra startuje o %{time} według zegara firmy, na kursie %{n} (o %{dep}), z autobusem tam, gdzie jest w trasie: wszystko wpisane, jedziesz dalej."
  es: "El juego empieza a las %{time}, la hora de la empresa, en el viaje %{n} (el de las %{dep}), con el autobús donde va en su recorrido: todo introducido, sigues conduciendo."
  ru: "Игра начнётся в %{time} по часам компании, на рейсе %{n} (в %{dep}), с автобусом там, где он сейчас на маршруте: всё введено, вы едете дальше."
  uk: "Гра почнеться о %{time} за годинником компанії, на рейсі %{n} (о %{dep}), з автобусом там, де він зараз на маршруті: усе введено, ви їдете далі."
"You take it up with trip %{n} (the %{dep}).":
  de: "Du übernimmst ab Fahrt %{n} (die um %{dep})."
  fr: "Vous reprenez à la course %{n} (celle de %{dep})."
  nl: "Je neemt het over vanaf rit %{n} (die van %{dep})."
  pl: "Przejmujesz od kursu %{n} (o %{dep})."
  es: "Lo retomas con el viaje %{n} (el de las %{dep})."
  ru: "Вы продолжаете с рейса %{n} (в %{dep})."
  uk: "Ви продовжуєте з рейсу %{n} (о %{dep})."
"The game stopped at %{time} before your duty was done: the %{n} trips you drove count, the AI drives the rest from there. Start the duty again to take it back where its bus is.":
  de: "Das Spiel hat um %{time} vor dem Ende deines Dienstes aufgehört: Die %{n} gefahrenen Fahrten zählen, den Rest fährt ab dort die KI. Starte den Dienst erneut, um ihn dort zurückzunehmen, wo sein Bus ist."
  fr: "Le jeu s'est arrêté à %{time} avant la fin de votre service : les %{n} courses conduites comptent, l'IA conduit le reste à partir de là. Relancez le service pour le reprendre là où se trouve son bus."
  nl: "De game stopte om %{time} voordat je dienst klaar was: de %{n} ritten die je reed tellen, de AI rijdt de rest vanaf daar. Start de dienst opnieuw om hem terug te nemen waar zijn bus is."
  pl: "Gra zatrzymała się o %{time} przed końcem twojej służby: liczą się %{n} przejechane kursy, resztę od tego miejsca jedzie SI. Uruchom służbę ponownie, aby przejąć ją tam, gdzie jest jej autobus."
  es: "El juego se detuvo a las %{time} antes de que terminara tu servicio: cuentan los %{n} viajes que condujiste, la IA conduce el resto desde ahí. Vuelve a iniciar el servicio para recuperarlo donde está su autobús."
  ru: "Игра остановилась в %{time} до конца вашей смены: проведённые рейсы (%{n}) засчитаны, дальше едет ИИ. Запустите смену снова, чтобы забрать её там, где сейчас автобус."
  uk: "Гра зупинилася о %{time} до кінця вашої зміни: проведені рейси (%{n}) зараховано, далі їде ШІ. Запустіть зміну знову, щоб забрати її там, де зараз автобус."
"Your game ended at %{time} before your duty was done: the %{n} trips you drove count, the AI drives the rest from there. Start the duty again to take it back where its bus is.":
  de: "Dein Spiel endete um %{time} vor dem Ende deines Dienstes: Die %{n} gefahrenen Fahrten zählen, den Rest fährt ab dort die KI. Starte den Dienst erneut, um ihn dort zurückzunehmen, wo sein Bus ist."
  fr: "Votre jeu s'est terminé à %{time} avant la fin de votre service : les %{n} courses conduites comptent, l'IA conduit le reste à partir de là. Relancez le service pour le reprendre là où se trouve son bus."
  nl: "Je game eindigde om %{time} voordat je dienst klaar was: de %{n} ritten die je reed tellen, de AI rijdt de rest vanaf daar. Start de dienst opnieuw om hem terug te nemen waar zijn bus is."
  pl: "Twoja gra skończyła się o %{time} przed końcem twojej służby: liczą się %{n} przejechane kursy, resztę od tego miejsca jedzie SI. Uruchom służbę ponownie, aby przejąć ją tam, gdzie jest jej autobus."
  es: "Tu juego terminó a las %{time} antes de que terminara tu servicio: cuentan los %{n} viajes que condujiste, la IA conduce el resto desde ahí. Vuelve a iniciar el servicio para recuperarlo donde está su autobús."
  ru: "Игра закончилась в %{time} до конца вашей смены: проведённые рейсы (%{n}) засчитаны, дальше едет ИИ. Запустите смену снова, чтобы забрать её там, где сейчас автобус."
  uk: "Гра закінчилася о %{time} до кінця вашої зміни: проведені рейси (%{n}) зараховано, далі їде ШІ. Запустіть зміну знову, щоб забрати її там, де зараз автобус."
"You took the bus over where it was: drive on, the duty is typed in":
