  fr: "Vous avez repris le bus là où il était : continuez, le service est saisi"
  nl: "Je hebt de bus overgenomen waar hij was: rij verder, de dienst is ingevoerd"
  pl: "Przejąłeś autobus tam, gdzie był: jedź dalej, służba jest wpisana"
  es: "Tomaste el autobús donde estaba: sigue conduciendo, el servicio está introducido"
  ru: "Вы приняли автобус там, где он был: езжайте дальше, смена введена"
  uk: "Ви прийняли автобус там, де він був: їдьте далі, зміну введено"
