  fr: "Le bus n'a pas pu être placé sur son trajet : rendez-vous au prochain arrêt du service"
  nl: "De bus kon niet op zijn route gezet worden: rij naar de volgende halte van de dienst"
  pl: "Nie udało się ustawić autobusu na trasie: jedź do następnego przystanku służby"
  es: "No se pudo poner el autobús en su recorrido: ve a la siguiente parada del servicio"
  ru: "Не удалось поставить автобус на маршрут: езжайте к следующей остановке смены"
  uk: "Не вдалося поставити автобус на маршрут: їдьте до наступної зупинки зміни"
