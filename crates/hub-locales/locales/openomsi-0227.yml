"The place, the weather, the birds of the season and the town's life, from real recordings":
  de: "Der Ort, das Wetter, die Vögel der Jahreszeit und das Leben der Stadt, aus echten Aufnahmen"
  fr: "Le lieu, la météo, les oiseaux de la saison et la vie de la ville, d'après de vrais enregistrements"
  nl: "De plek, het weer, de vogels van het seizoen en het leven in de stad, van echte opnames"
  pl: "Miejsce, pogoda, ptaki pory roku i życie miasta — z prawdziwych nagrań"
  es: "El lugar, el tiempo, los pájaros de la estación y la vida de la ciudad, a partir de grabaciones reales"
  ru: "Место, погода, птицы времени года и жизнь города — из настоящих записей"
  uk: "Місце, погода, птахи пори року й життя міста — зі справжніх записів"
"The wheel reaches its lock past the window's edges; off: the crosshair stays free and without delay, as in OMSI":
  de: "Das Lenkrad erreicht seinen Anschlag jenseits der Fensterränder; aus: das Fadenkreuz bleibt frei und ohne Verzögerung, wie in OMSI"
  fr: "Le volant atteint sa butée au-delà des bords de la fenêtre ; désactivé : le réticule reste libre et sans délai, comme dans OMSI"
  nl: "Het stuur bereikt zijn uitslag voorbij de vensterranden; uit: het vizier blijft vrij en zonder vertraging, zoals in OMSI"
  pl: "Kierownica osiąga skrajne położenie za krawędziami okna; wył.: celownik jest wolny i bez opóźnienia, jak w OMSI"
  es: "El volante llega a su tope más allá de los bordes de la ventana; desactivado: la mira queda libre y sin retardo, como en OMSI"
  ru: "Руль доходит до упора за краями окна; выкл.: прицел свободен и без задержки, как в OMSI"
  uk: "Кермо доходить до упору за краями вікна; вимк.: приціл вільний і без затримки, як в OMSI"
