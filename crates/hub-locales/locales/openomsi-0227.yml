"Lower is faster: the drops on the glass painted less often, less spray and fewer streaks; Low shows OMSI 2's own rain on the glass (from the next bus loaded)":
  de: "Niedriger ist schneller: Tropfen auf der Scheibe seltener gezeichnet, weniger Gischt und weniger Schlieren; Niedrig zeigt OMSI 2s eigenen Regen auf der Scheibe (ab dem nächsten geladenen Bus)"
  fr: "Plus bas est plus rapide : gouttes sur la vitre dessinées moins souvent, moins d'embruns et de traînées ; Bas montre la pluie d'OMSI 2 sur la vitre (à partir du prochain bus chargé)"
  nl: "Lager is sneller: de druppels op het glas minder vaak getekend, minder nevel en minder strepen; Laag toont de eigen regen op het glas van OMSI 2 (vanaf de volgende geladen bus)"
  pl: "Niżej znaczy szybciej: krople na szybie rysowane rzadziej, mniej rozprysków i smug; Niska pokazuje deszcz na szybie z OMSI 2 (od następnego wczytanego autobusu)"
  es: "Más bajo es más rápido: las gotas del cristal se pintan con menos frecuencia, menos salpicaduras y menos regueros; Bajo muestra la lluvia propia de OMSI 2 en el cristal (a partir del próximo autobús cargado)"
  ru: "Ниже — быстрее: капли на стекле рисуются реже, меньше брызг и полос; «Низко» показывает родной дождь OMSI 2 на стекле (со следующего загруженного автобуса)"
  uk: "Нижче — швидше: краплі на склі малюються рідше, менше бризок і смуг; «Низько» показує рідний дощ OMSI 2 на склі (з наступного завантаженого автобуса)"
