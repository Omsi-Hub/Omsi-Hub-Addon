  nl: "Hoofdbeweging omhoog / omlaag. 100% is 1:1; het lage eind is bewust fijner."
  pl: "Ruch głowy w górę / w dół. 100% to 1:1; dolny zakres jest celowo dokładniejszy."
  es: "Movimiento de la cabeza arriba / abajo. 100% es 1:1; el extremo bajo es más fino a propósito."
  ru: "Движение головы вверх / вниз. 100% — 1:1; нижний диапазон специально точнее."
