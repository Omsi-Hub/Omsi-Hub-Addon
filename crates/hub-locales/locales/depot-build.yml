_version: 2
# The depot built from its land up (hub_core::company::depot): what can be added to each area,
# the building credit of a company founded now, the wash lanes, and the depot's look (the Build
# list in ui/js/company/depot.js). The English text is the key.

"%{name} is founded. Build your depot, add a line, buy a bus and hire drivers.":
  nl: "%{name} is opgericht. Bouw je depot, voeg een lijn toe, koop een bus en neem chauffeurs aan."
  de: "%{name} ist gegründet. Baue deinen Betriebshof, füge eine Linie hinzu, kaufe einen Bus und stelle Fahrer ein."
  fr: "%{name} est fondée. Construisez votre dépôt, ajoutez une ligne, achetez un bus et embauchez des conducteurs."
  ru: "%{name} основано. Постройте депо, добавьте линию, купите автобус и наймите водителей."
  uk: "%{name} засновано. Збудуйте депо, додайте лінію, купіть автобус і найміть водіїв."
  pl: "%{name} założone. Zbuduj zajezdnię, dodaj linię, kup autobus i zatrudnij kierowców."
  es: "Se ha fundado %{name}. Construye tu cochera, añade una línea, compra un autobús y contrata conductores."
"%{lanes} lanes: washes %{n} buses a night":
  nl: "%{lanes} wasstraten: wast %{n} bussen per nacht"
  de: "%{lanes} Waschstraßen: wäscht %{n} Busse pro Nacht"
  fr: "%{lanes} pistes de lavage : lave %{n} bus par nuit"
  ru: "Моечных линий: %{lanes}; моет %{n} автобусов за ночь"
  uk: "Мийних ліній: %{lanes}; миє %{n} автобусів за ніч"
  pl: "Myjnie: %{lanes}; myje %{n} autobusów na noc"
  es: "%{lanes} carriles: lava %{n} autobuses por noche"
"Building credit: what your company was given to build its first depot with, spent before your cash":
  nl: "Bouwkrediet: wat je bedrijf meekreeg om zijn eerste depot mee te bouwen, besteed vóór je kas"
  de: "Baukredit: was dein Unternehmen für seinen ersten Betriebshof bekommen hat, verbraucht vor deiner Kasse"
  fr: "Crédit de construction : ce que votre entreprise a reçu pour bâtir son premier dépôt, dépensé avant votre trésorerie"
  ru: "Строительный кредит: выделен предприятию на первое депо, расходуется раньше кассы"
  uk: "Будівельний кредит: виділений підприємству на перше депо, витрачається раніше за касу"
  pl: "Kredyt budowlany: środki na pierwszą zajezdnię, wydawane przed gotówką"
  es: "Crédito de construcción: lo que recibió tu empresa para construir su primera cochera, que se gasta antes que tu dinero"
"Building credit left":
  nl: "Bouwkrediet over"
  de: "Verbleibender Baukredit"
  fr: "Crédit de construction restant"
  ru: "Остаток строительного кредита"
  uk: "Залишок будівельного кредиту"
  pl: "Pozostały kredyt budowlany"
  es: "Crédito de construcción restante"
"Your land is empty: build parking spaces, a workshop, a diesel station and offices to start with.":
  nl: "Je terrein is leeg: bouw om te beginnen parkeerplaatsen, een werkplaats, een dieselstation en kantoren."
  de: "Dein Gelände ist leer: baue zu Beginn Stellplätze, eine Werkstatt, eine Dieseltankstelle und Büros."
  fr: "Votre terrain est vide : construisez pour commencer des places de stationnement, un atelier, une station diesel et des bureaux."
  ru: "Участок пуст: для начала постройте стоянку, мастерскую, дизельную заправку и офисы."
  uk: "Ділянка порожня: для початку збудуйте стоянку, майстерню, дизельну заправку й офіси."
  pl: "Teren jest pusty: na początek zbuduj miejsca postojowe, warsztat, stację diesla i biura."
  es: "Tu terreno está vacío: para empezar, construye plazas de aparcamiento, un taller, una estación de diésel y oficinas."
