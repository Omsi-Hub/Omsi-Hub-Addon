  de: "Die letzte Prüfung ist fehlgeschlagen"
  fr: "La dernière vérification a échoué"
  nl: "De laatste controle is mislukt"
  pl: "Ostatnie sprawdzenie nie powiodło się"
  es: "La última comprobación ha fallado"
  ru: "Последняя проверка не удалась"
  uk: "Остання перевірка не вдалася"
"The new version is put in place; Omsi-Hub starts again in a moment.":
  de: "Die neue Version wird eingesetzt; Omsi-Hub startet gleich neu."
  fr: "La nouvelle version est mise en place ; Omsi-Hub redémarre dans un instant."
  nl: "De nieuwe versie wordt geplaatst; Omsi-Hub start zo opnieuw."
  pl: "Nowa wersja jest instalowana; Omsi-Hub za chwilę uruchomi się ponownie."
  es: "Se está colocando la nueva versión; Omsi-Hub se reiniciará en un momento."
  ru: "Новая версия устанавливается; Omsi-Hub сейчас перезапустится."
  uk: "Нова версія встановлюється; Omsi-Hub зараз перезапуститься."
"This version cannot be installed from within the app. Download it from its page on GitHub.":
  de: "Diese Version kann nicht aus der App heraus installiert werden. Lade sie von ihrer Seite auf GitHub herunter."
  fr: "Cette version ne peut pas être installée depuis l'application. Téléchargez-la depuis sa page sur GitHub."
  nl: "Deze versie kan niet vanuit de app worden geïnstalleerd. Download hem van zijn pagina op GitHub."
  pl: "Tej wersji nie można zainstalować z poziomu aplikacji. Pobierz ją z jej strony na GitHub."
  es: "Esta versión no se puede instalar desde la app. Descárgala desde su página en GitHub."
  ru: "Эту версию нельзя установить из приложения. Скачайте её со страницы на GitHub."
  uk: "Цю версію не можна встановити з програми. Завантажте її зі сторінки на GitHub."
"You have %{current}. Update now? Omsi-Hub downloads the new version (%{size}) from GitHub, installs it and starts again. Your companies and settings stay as they are.":
  de: "Du hast %{current}. Jetzt aktualisieren? Omsi-Hub lädt die neue Version (%{size}) von GitHub herunter, installiert sie und startet neu. Deine Unternehmen und Einstellungen bleiben, wie sie sind."
  fr: "Vous avez %{current}. Mettre à jour maintenant ? Omsi-Hub télécharge la nouvelle version (%{size}) depuis GitHub, l'installe et redémarre. Vos entreprises et vos réglages restent tels quels."
  nl: "Je hebt %{current}. Nu bijwerken? Omsi-Hub downloadt de nieuwe versie (%{size}) van GitHub, installeert die en start opnieuw. Je bedrijven en instellingen blijven zoals ze zijn."
  pl: "Masz %{current}. Zaktualizować teraz? Omsi-Hub pobierze nową wersję (%{size}) z GitHub, zainstaluje ją i uruchomi się ponownie. Twoje firmy i ustawienia pozostaną bez zmian."
  es: "Tienes %{current}. ¿Actualizar ahora? Omsi-Hub descarga la nueva versión (%{size}) de GitHub, la instala y se reinicia. Tus empresas y ajustes se quedan como están."
  ru: "У вас %{current}. Обновить сейчас? Omsi-Hub скачает новую версию (%{size}) с GitHub, установит её и перезапустится. Ваши компании и настройки останутся без изменений."
  uk: "У вас %{current}. Оновити зараз? Omsi-Hub завантажить нову версію (%{size}) з GitHub, встановить її та перезапуститься. Ваші компанії та налаштування залишаться без змін."
