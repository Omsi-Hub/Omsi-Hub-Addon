"Its name, colour, map and figures (this month's profit and passengers, cash, buses, lines, staff, trips on time and reputation) are on omsihub.com, with your display name.":
  de: "Sein Name, seine Farbe, seine Karte und seine Zahlen (Gewinn und Fahrgäste dieses Monats, Kasse, Busse, Linien, Personal, pünktliche Fahrten und Ruf) stehen auf omsihub.com, mit deinem Anzeigenamen."
  fr: "Son nom, sa couleur, sa carte et ses chiffres (bénéfice et voyageurs du mois, trésorerie, bus, lignes, personnel, trajets à l'heure et réputation) sont sur omsihub.com, avec votre nom affiché."
  nl: "De naam, kleur, kaart en cijfers (winst en reizigers van deze maand, kas, bussen, lijnen, personeel, ritten op tijd en reputatie) staan op omsihub.com, met je weergavenaam."
  pl: "Jej nazwa, kolor, mapa i liczby (zysk i pasażerowie w tym miesiącu, gotówka, autobusy, linie, personel, punktualne kursy i reputacja) są na omsihub.com, z twoją nazwą wyświetlaną."
  es: "Su nombre, color, mapa y cifras (beneficio y viajeros de este mes, caja, autobuses, líneas, personal, viajes puntuales y reputación) están en omsihub.com, con tu nombre visible."
  ru: "Её название, цвет, карта и показатели (прибыль и пассажиры за этот месяц, касса, автобусы, линии, персонал, рейсы вовремя и репутация) видны на omsihub.com вместе с вашим отображаемым именем."
  uk: "Її назва, колір, мапа й показники (прибуток і пасажири цього місяця, каса, автобуси, лінії, персонал, рейси вчасно й репутація) видно на omsihub.com разом із вашим відображуваним іменем."
"Off: nothing of this company leaves this PC. At most 5 of your companies can be on the board.":
  de: "Aus: Nichts von diesem Betrieb verlässt diesen PC. Höchstens 5 deiner Betriebe können auf der Rangliste stehen."
  fr: "Désactivé : rien de cette entreprise ne quitte ce PC. Au plus 5 de vos entreprises peuvent figurer au classement."
  nl: "Uit: niets van dit bedrijf verlaat deze pc. Er kunnen hooguit 5 van je bedrijven op het bord staan."
  pl: "Wyłączone: nic z tej firmy nie opuszcza tego komputera. Najwyżej 5 twoich firm może być w rankingu."
  es: "Desactivado: nada de esta empresa sale de este PC. Como mucho 5 de tus empresas pueden estar en la clasificación."
  ru: "Выключено: ничего об этой компании не покидает этот ПК. В рейтинге может быть не больше 5 ваших компаний."
  uk: "Вимкнено: нічого про цю компанію не залишає цей ПК. У рейтингу може бути не більше 5 ваших компаній."
