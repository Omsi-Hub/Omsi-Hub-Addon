_version: 2
# Omsi-Hub online (docs/ONLINE.md): the optional account, the friends and the invites - the
# client's codes (crates/hub-online/src/codes.rs), the launcher's answers
# (crates/hub-api/src/online.rs) and the page's panel (ui/js/online/online.js).
"Friend request sent.":
  de: "Freundschaftsanfrage gesendet."
  fr: "Demande d'ami envoyée."
  nl: "Vriendschapsverzoek verstuurd."
  pl: "Wysłano zaproszenie do znajomych."
  es: "Solicitud de amistad enviada."
  ru: "Запрос в друзья отправлен."
  uk: "Запит у друзі надіслано."
"You are friends now: they had asked you already.":
  de: "Ihr seid jetzt befreundet: Die Anfrage kam schon von der anderen Seite."
  fr: "Vous êtes amis maintenant : cette personne vous l'avait déjà demandé."
  nl: "Jullie zijn nu vrienden: zij hadden het jou al gevraagd."
  pl: "Jesteście teraz znajomymi: ta osoba już cię zaprosiła."
  es: "Ahora sois amigos: ya te lo había pedido."
  ru: "Теперь вы друзья: этот игрок уже отправил вам запрос."
  uk: "Тепер ви друзі: цей гравець уже надіслав вам запит."
"You are friends already, or a request is open.":
  de: "Ihr seid schon befreundet, oder eine Anfrage ist offen."
  fr: "Vous êtes déjà amis, ou une demande est en attente."
  nl: "Jullie zijn al vrienden, of er staat nog een verzoek open."
  pl: "Jesteście już znajomymi albo zaproszenie czeka na odpowiedź."
  es: "Ya sois amigos, o hay una solicitud pendiente."
  ru: "Вы уже друзья, или запрос ещё ожидает ответа."
  uk: "Ви вже друзі, або запит ще чекає на відповідь."
"That is your own friend code.":
  de: "Das ist dein eigener Freundescode."
  fr: "C'est votre propre code ami."
  nl: "Dat is je eigen vriendcode."
  pl: "To twój własny kod znajomego."
  es: "Ese es tu propio código de amigo."
  ru: "Это ваш собственный код друга."
  uk: "Це ваш власний код друга."
"No player has that friend code.":
  de: "Kein Spieler hat diesen Freundescode."
  fr: "Aucun joueur n'a ce code ami."
  nl: "Geen speler heeft die vriendcode."
  pl: "Żaden gracz nie ma takiego kodu znajomego."
  es: "Ningún jugador tiene ese código de amigo."
  ru: "Ни у одного игрока нет такого кода друга."
  uk: "Жоден гравець не має такого коду друга."
"Choose your display name first.":
  de: "Wähle zuerst deinen Anzeigenamen."
  fr: "Choisissez d'abord votre nom affiché."
  nl: "Kies eerst je weergavenaam."
  pl: "Najpierw wybierz swoją nazwę wyświetlaną."
  es: "Elige primero tu nombre visible."
  ru: "Сначала выберите отображаемое имя."
  uk: "Спершу виберіть ім'я для показу."
"Too many tries in a short time. Try again later.":
  de: "Zu viele Versuche in kurzer Zeit. Versuche es später noch einmal."
  fr: "Trop d'essais en peu de temps. Réessayez plus tard."
  nl: "Te veel pogingen in korte tijd. Probeer het later opnieuw."
  pl: "Za dużo prób w krótkim czasie. Spróbuj ponownie później."
  es: "Demasiados intentos en poco tiempo. Inténtalo más tarde."
  ru: "Слишком много попыток за короткое время. Попробуйте позже."
  uk: "Забагато спроб за короткий час. Спробуйте пізніше."
"The friends list is full.":
  de: "Die Freundesliste ist voll."
  fr: "La liste d'amis est pleine."
  nl: "De vriendenlijst is vol."
  pl: "Lista znajomych jest pełna."
  es: "La lista de amigos está llena."
  ru: "Список друзей заполнен."
  uk: "Список друзів заповнений."
"The email address or the password is not right.":
  de: "Die E-Mail-Adresse oder das Passwort stimmt nicht."
  fr: "L'adresse e-mail ou le mot de passe n'est pas correct."
  nl: "Het e-mailadres of het wachtwoord klopt niet."
  pl: "Adres e-mail lub hasło jest nieprawidłowe."
  es: "La dirección de correo electrónico o la contraseña no son correctas."
  ru: "Неверный адрес электронной почты или пароль."
  uk: "Неправильна адреса електронної пошти або пароль."
"The password is not right.":
  de: "Das Passwort stimmt nicht."
  fr: "Le mot de passe n'est pas correct."
  nl: "Het wachtwoord klopt niet."
  pl: "Hasło jest nieprawidłowe."
  es: "La contraseña no es correcta."
  ru: "Неверный пароль."
  uk: "Неправильний пароль."
"There is an account with this email address already. Sign in, or reset its password.":
  de: "Mit dieser E-Mail-Adresse gibt es schon ein Konto. Melde dich an oder setze sein Passwort zurück."
  fr: "Un compte existe déjà avec cette adresse e-mail. Connectez-vous, ou réinitialisez son mot de passe."
  nl: "Er is al een account met dit e-mailadres. Log in, of stel het wachtwoord opnieuw in."
  pl: "Konto z tym adresem e-mail już istnieje. Zaloguj się lub zresetuj hasło."
  es: "Ya hay una cuenta con esta dirección de correo electrónico. Inicia sesión o restablece su contraseña."
  ru: "Аккаунт с этим адресом уже есть. Войдите или сбросьте пароль."
  uk: "Обліковий запис із цією адресою вже існує. Увійдіть або скиньте пароль."
"That is not an email address.":
  de: "Das ist keine E-Mail-Adresse."
  fr: "Ce n'est pas une adresse e-mail."
  nl: "Dat is geen e-mailadres."
  pl: "To nie jest adres e-mail."
  es: "Eso no es una dirección de correo electrónico."
  ru: "Это не адрес электронной почты."
  uk: "Це не адреса електронної пошти."
"The password is too short: at least 8 characters.":
  de: "Das Passwort ist zu kurz: mindestens 8 Zeichen."
  fr: "Le mot de passe est trop court : au moins 8 caractères."
  nl: "Het wachtwoord is te kort: minstens 8 tekens."
  pl: "Hasło jest za krótkie: co najmniej 8 znaków."
  es: "La contraseña es demasiado corta: al menos 8 caracteres."
  ru: "Пароль слишком короткий: не менее 8 символов."
  uk: "Пароль закороткий: щонайменше 8 символів."
"The password is too long: at most 72 characters.":
  de: "Das Passwort ist zu lang: höchstens 72 Zeichen."
  fr: "Le mot de passe est trop long : 72 caractères au plus."
  nl: "Het wachtwoord is te lang: hoogstens 72 tekens."
  pl: "Hasło jest za długie: najwyżej 72 znaki."
  es: "La contraseña es demasiado larga: como máximo 72 caracteres."
  ru: "Пароль слишком длинный: не более 72 символов."
  uk: "Пароль задовгий: не більше 72 символів."
"The password is too weak: choose a longer one, with letters, digits and symbols.":
  de: "Das Passwort ist zu schwach: Wähle ein längeres, mit Buchstaben, Ziffern und Sonderzeichen."
  fr: "Le mot de passe est trop faible : choisissez-en un plus long, avec des lettres, des chiffres et des symboles."
  nl: "Het wachtwoord is te zwak: kies een langer wachtwoord, met letters, cijfers en tekens."
  pl: "Hasło jest za słabe: wybierz dłuższe, z literami, cyframi i symbolami."
  es: "La contraseña es demasiado débil: elige una más larga, con letras, cifras y símbolos."
  ru: "Пароль слишком слабый: выберите более длинный, с буквами, цифрами и символами."
  uk: "Пароль заслабкий: виберіть довший, з літерами, цифрами та символами."
"The new password is the one you have now: choose another.":
  de: "Das neue Passwort ist dein jetziges: Wähle ein anderes."
  fr: "Le nouveau mot de passe est celui que vous avez déjà : choisissez-en un autre."
  nl: "Het nieuwe wachtwoord is je huidige: kies een ander."
  pl: "Nowe hasło jest takie samo jak obecne: wybierz inne."
  es: "La nueva contraseña es la que ya tienes: elige otra."
  ru: "Новый пароль совпадает с текущим: выберите другой."
  uk: "Новий пароль збігається з поточним: виберіть інший."
"That code is not right.":
  de: "Dieser Code stimmt nicht."
  fr: "Ce code n'est pas correct."
  nl: "Die code klopt niet."
  pl: "Ten kod jest nieprawidłowy."
  es: "Ese código no es correcto."
  ru: "Неверный код."
  uk: "Неправильний код."
"That code has expired. Ask for a new one.":
  de: "Dieser Code ist abgelaufen. Fordere einen neuen an."
  fr: "Ce code a expiré. Demandez-en un nouveau."
  nl: "Die code is verlopen. Vraag een nieuwe aan."
  pl: "Ten kod wygasł. Poproś o nowy."
  es: "Ese código ha caducado. Pide uno nuevo."
  ru: "Срок действия кода истёк. Запросите новый."
  uk: "Термін дії коду минув. Запросіть новий."
"Too many wrong codes. Ask for a new one.":
  de: "Zu viele falsche Codes. Fordere einen neuen an."
  fr: "Trop de codes erronés. Demandez-en un nouveau."
  nl: "Te veel verkeerde codes. Vraag een nieuwe aan."
  pl: "Za dużo błędnych kodów. Poproś o nowy."
  es: "Demasiados códigos erróneos. Pide uno nuevo."
  ru: "Слишком много неверных кодов. Запросите новый."
  uk: "Забагато неправильних кодів. Запросіть новий."
"Sign in again first, then try once more.":
  de: "Melde dich zuerst neu an und versuche es dann noch einmal."
  fr: "Reconnectez-vous d'abord, puis réessayez."
  nl: "Log eerst opnieuw in en probeer het dan nog eens."
  pl: "Najpierw zaloguj się ponownie, potem spróbuj jeszcze raz."
  es: "Vuelve a iniciar sesión primero y luego inténtalo otra vez."
  ru: "Сначала войдите снова, затем попробуйте ещё раз."
  uk: "Спершу увійдіть знову, потім спробуйте ще раз."
"Another player has that display name already.":
  de: "Ein anderer Spieler hat diesen Anzeigenamen schon."
  fr: "Un autre joueur a déjà ce nom affiché."
  nl: "Een andere speler heeft die weergavenaam al."
  pl: "Inny gracz ma już taką nazwę wyświetlaną."
  es: "Otro jugador ya tiene ese nombre visible."
  ru: "Это отображаемое имя уже занято другим игроком."
  uk: "Це ім'я для показу вже має інший гравець."
"A display name has 3 to 24 characters: letters A to Z, digits, spaces, _ . and -.":
  de: "Ein Anzeigename hat 3 bis 24 Zeichen: Buchstaben A bis Z, Ziffern, Leerzeichen, _ . und -."
  fr: "Un pseudo compte 3 à 24 caractères : lettres de A à Z, chiffres, espaces, _ . et -."
  nl: "Een weergavenaam heeft 3 tot 24 tekens: letters A tot Z, cijfers, spaties, _ . en -."
  pl: "Nazwa wyświetlana ma od 3 do 24 znaków: litery od A do Z, cyfry, spacje, _ . i -."
  es: "Un nombre visible tiene de 3 a 24 caracteres: letras de la A a la Z, cifras, espacios, _ . y -."
  ru: "Отображаемое имя содержит от 3 до 24 символов: латинские буквы A–Z, цифры, пробелы, _ . и -."
  uk: "Відображуване ім'я має від 3 до 24 символів: латинські літери A–Z, цифри, пробіли, _ . і -."
"A friend code has 8 letters and digits.":
  de: "Ein Freundescode hat 8 Buchstaben und Ziffern."
  fr: "Un code ami compte 8 lettres et chiffres."
  nl: "Een vriendcode heeft 8 letters en cijfers."
  pl: "Kod znajomego ma 8 liter i cyfr."
  es: "Un código de amigo tiene 8 letras y cifras."
  ru: "Код друга состоит из 8 букв и цифр."
  uk: "Код друга складається з 8 літер і цифр."
"Something in it is too long or not allowed.":
  de: "Etwas darin ist zu lang oder nicht erlaubt."
  fr: "Quelque chose est trop long ou n'est pas autorisé."
  nl: "Iets erin is te lang of niet toegestaan."
  pl: "Coś jest za długie albo niedozwolone."
  es: "Algo es demasiado largo o no está permitido."
  ru: "Что-то слишком длинное или недопустимое."
  uk: "Щось задовге або недопустиме."
"That is not allowed.":
  de: "Das ist nicht erlaubt."
  fr: "Ce n'est pas autorisé."
  nl: "Dat is niet toegestaan."
  pl: "To jest niedozwolone."
  es: "Eso no está permitido."
  ru: "Это не разрешено."
  uk: "Це не дозволено."
"Share your company first (Multiplayer): then there is a session to invite to.":
  de: "Teile zuerst dein Unternehmen (Mehrspieler): Dann gibt es eine Sitzung, zu der du einladen kannst."
  fr: "Partagez d'abord votre entreprise (Multijoueur) : il y aura alors une session à laquelle inviter."
  nl: "Deel eerst je bedrijf (Multiplayer): dan is er een sessie om voor uit te nodigen."
  pl: "Najpierw udostępnij firmę (Gra wieloosobowa): wtedy będzie sesja, do której można zaprosić."
  es: "Comparte primero tu empresa (Multijugador): así habrá una sesión a la que invitar."
  ru: "Сначала откройте доступ к компании (Мультиплеер): тогда будет сессия для приглашения."
  uk: "Спершу відкрийте доступ до компанії (Мультиплеєр): тоді буде сесія для запрошення."
"Sign in first.":
  de: "Melde dich zuerst an."
  fr: "Connectez-vous d'abord."
  nl: "Log eerst in."
  pl: "Najpierw się zaloguj."
  es: "Inicia sesión primero."
  ru: "Сначала войдите."
  uk: "Спершу увійдіть."
"Offline: the online features are back as soon as the network is.":
  de: "Offline: Die Online-Funktionen sind zurück, sobald das Netzwerk es ist."
  fr: "Hors ligne : les fonctions en ligne reviennent dès que le réseau revient."
  nl: "Offline: de online functies zijn terug zodra het netwerk terug is."
  pl: "Offline: funkcje online wrócą, gdy tylko wróci sieć."
  es: "Sin conexión: las funciones en línea vuelven en cuanto vuelva la red."
  ru: "Нет сети: онлайн-функции вернутся, как только появится сеть."
  uk: "Немає мережі: онлайн-функції повернуться, щойно з'явиться мережа."
"You were signed out. Sign in again.":
  de: "Du wurdest abgemeldet. Melde dich erneut an."
  fr: "Vous avez été déconnecté. Reconnectez-vous."
  nl: "Je bent afgemeld. Log opnieuw in."
  pl: "Wylogowano cię. Zaloguj się ponownie."
  es: "Se ha cerrado tu sesión. Vuelve a iniciar sesión."
  ru: "Вы вышли из аккаунта. Войдите снова."
  uk: "Ви вийшли з облікового запису. Увійдіть знову."
"The server does not offer this yet.":
  de: "Der Server bietet das noch nicht an."
  fr: "Le serveur ne le propose pas encore."
  nl: "De server biedt dit nog niet aan."
  pl: "Serwer jeszcze tego nie oferuje."
  es: "El servidor aún no ofrece esto."
  ru: "Сервер пока этого не поддерживает."
  uk: "Сервер поки цього не підтримує."
"The server could not do that just now. Try again later.":
  de: "Der Server konnte das gerade nicht tun. Versuche es später noch einmal."
  fr: "Le serveur n'a pas pu le faire pour l'instant. Réessayez plus tard."
  nl: "De server kon dat nu niet doen. Probeer het later opnieuw."
  pl: "Serwer nie mógł teraz tego zrobić. Spróbuj ponownie później."
  es: "El servidor no ha podido hacerlo ahora mismo. Inténtalo más tarde."
  ru: "Сервер сейчас не смог это выполнить. Попробуйте позже."
  uk: "Сервер зараз не зміг це виконати. Спробуйте пізніше."
"Joining did not work.":
  de: "Der Beitritt hat nicht geklappt."
  fr: "La connexion à la session a échoué."
  nl: "Meedoen is niet gelukt."
  pl: "Nie udało się dołączyć."
  es: "No se ha podido unir."
  ru: "Присоединиться не удалось."
  uk: "Приєднатися не вдалося."
"At least 8 characters. Longer is stronger.":
  de: "Mindestens 8 Zeichen. Länger ist sicherer."
  fr: "Au moins 8 caractères. Plus long, plus sûr."
  nl: "Minstens 8 tekens. Langer is sterker."
  pl: "Co najmniej 8 znaków. Dłuższe jest silniejsze."
  es: "Al menos 8 caracteres. Cuanto más larga, más segura."
  ru: "Не менее 8 символов. Чем длиннее, тем надёжнее."
  uk: "Щонайменше 8 символів. Що довше, то надійніше."
