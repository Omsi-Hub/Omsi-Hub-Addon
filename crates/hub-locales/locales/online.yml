"A company on the board shows its name, colour, map and figures (this month's profit and passengers, cash, buses, lines, staff, trips on time and reputation) on omsihub.com, with your display name. Off until you switch it on.":
  de: "Ein Betrieb auf der Rangliste zeigt seinen Namen, seine Farbe, seine Karte und seine Zahlen (Gewinn und Fahrgäste dieses Monats, Kasse, Busse, Linien, Personal, pünktliche Fahrten und Ruf) auf omsihub.com, mit deinem Anzeigenamen. Aus, bis du es einschaltest."
  fr: "Une entreprise au classement montre son nom, sa couleur, sa carte et ses chiffres (bénéfice et voyageurs du mois, trésorerie, bus, lignes, personnel, trajets à l'heure et réputation) sur omsihub.com, avec votre nom affiché. Désactivé tant que vous ne l'activez pas."
  nl: "Een bedrijf op het bord toont zijn naam, kleur, kaart en cijfers (winst en reizigers van deze maand, kas, bussen, lijnen, personeel, ritten op tijd en reputatie) op omsihub.com, met je weergavenaam. Uit tot je het aanzet."
  pl: "Firma w rankingu pokazuje na omsihub.com swoją nazwę, kolor, mapę i liczby (zysk i pasażerów w tym miesiącu, gotówkę, autobusy, linie, personel, punktualne kursy i reputację), z twoją nazwą wyświetlaną. Wyłączone, dopóki tego nie włączysz."
  es: "Una empresa en la clasificación muestra en omsihub.com su nombre, color, mapa y cifras (beneficio y viajeros de este mes, caja, autobuses, líneas, personal, viajes puntuales y reputación), con tu nombre visible. Desactivado hasta que lo actives."
  ru: "Компания в рейтинге показывает на omsihub.com своё название, цвет, карту и показатели (прибыль и пассажиров за этот месяц, кассу, автобусы, линии, персонал, рейсы вовремя и репутацию) вместе с вашим отображаемым именем. Выключено, пока вы не включите."
  uk: "Компанія в рейтингу показує на omsihub.com свою назву, колір, мапу й показники (прибуток і пасажирів цього місяця, касу, автобуси, лінії, персонал, рейси вчасно й репутацію) разом із вашим відображуваним іменем. Вимкнено, доки ви не ввімкнете."
