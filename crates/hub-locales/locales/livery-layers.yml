  pl: "W górę"
  es: "Arriba"
  ru: "Выше"
  uk: "Вище"
"Down":
  de: "Nach unten"
  fr: "Descendre"
  nl: "Omlaag"
  pl: "W dół"
  es: "Abajo"
  ru: "Ниже"
  uk: "Нижче"
"Left":
  de: "Links"
  fr: "Gauche"
