_version: 2
# openOMSI's own settings on the Settings page (hub-game's gamesettings.rs, ui/js/hub/gamesettings.js).
# The English text is the key, as in app.yml.

"openOMSI's settings":
  nl: "Instellingen van openOMSI"
  de: "Einstellungen von openOMSI"
  fr: "Réglages d’openOMSI"
  ru: "Настройки openOMSI"
  uk: "Налаштування openOMSI"
  pl: "Ustawienia openOMSI"
  es: "Ajustes de openOMSI"
"openOMSI's own settings. Omsi-Hub changes only these; everything else in the file stays as it is. openOMSI reads them when it starts.":
  nl: "De eigen instellingen van openOMSI. Omsi-Hub past alleen deze aan; de rest van het bestand blijft zoals het is. openOMSI leest ze bij het starten."
  de: "Die eigenen Einstellungen von openOMSI. Omsi-Hub ändert nur diese; alles andere in der Datei bleibt, wie es ist. openOMSI liest sie beim Start."
  fr: "Les réglages propres à openOMSI. Omsi-Hub ne modifie que ceux-ci ; le reste du fichier reste tel quel. openOMSI les lit au démarrage."
  ru: "Собственные настройки openOMSI. Omsi-Hub меняет только их; всё остальное в файле остаётся как есть. openOMSI читает их при запуске."
  uk: "Власні налаштування openOMSI. Omsi-Hub змінює лише їх; усе інше у файлі лишається як є. openOMSI читає їх під час запуску."
  pl: "Własne ustawienia openOMSI. Omsi-Hub zmienia tylko te; reszta pliku zostaje bez zmian. openOMSI odczytuje je przy starcie."
  es: "Los ajustes propios de openOMSI. Omsi-Hub solo cambia estos; todo lo demás del archivo se queda como está. openOMSI los lee al iniciarse."
"openOMSI's default":
  nl: "Standaard van openOMSI"
  de: "Standard von openOMSI"
  fr: "Par défaut d’openOMSI"
  ru: "По умолчанию openOMSI"
  uk: "Типово для openOMSI"
  pl: "Domyślne openOMSI"
  es: "Predeterminado de openOMSI"
"Not there yet: it is made with the first change.":
  nl: "Nog niet aanwezig: het wordt gemaakt bij de eerste wijziging."
  de: "Noch nicht vorhanden: sie wird bei der ersten Änderung angelegt."
  fr: "Pas encore là : il est créé à la première modification."
  ru: "Пока не существует: файл будет создан при первом изменении."
  uk: "Поки не існує: файл буде створено під час першої зміни."
  pl: "Jeszcze go nie ma: powstanie przy pierwszej zmianie."
  es: "Aún no existe: se crea con el primer cambio."
"openOMSI is running: change its settings once it has ended":
  nl: "openOMSI draait: pas de instellingen aan als het gestopt is"
  de: "openOMSI läuft: ändere die Einstellungen, wenn es beendet ist"
  fr: "openOMSI est en cours d’exécution : modifiez ses réglages une fois qu’il est fermé"
  ru: "openOMSI запущен: измените настройки после его закрытия"
  uk: "openOMSI запущено: змініть налаштування після його закриття"
  pl: "openOMSI działa: zmień ustawienia, gdy zostanie zamknięty"
  es: "openOMSI está en marcha: cambia sus ajustes cuando haya terminado"
