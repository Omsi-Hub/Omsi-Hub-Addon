"The timetable changed since the scheduling studio made the blocks of this line: make its blocks and duties anew":
  de: "Der Fahrplan hat sich geändert, seit das Planungsstudio die Umläufe dieser Linie erstellt hat: ihre Umläufe und Dienste neu erstellen"
  fr: "L'horaire a changé depuis que l'atelier de planification a construit les services de cette ligne : refaire ses services de bus et de conducteurs"
  nl: "De dienstregeling is veranderd sinds de planningsstudio de omlopen van deze lijn maakte: maak haar omlopen en diensten opnieuw"
  pl: "Rozkład zmienił się, odkąd studio planowania ułożyło brygady tej linii: ułóż jej brygady i służby od nowa"
  es: "El horario ha cambiado desde que el estudio de planificación hizo los recorridos de esta línea: vuelve a crear sus recorridos y servicios"
  ru: "Расписание изменилось с тех пор, как студия планирования составила выходы этой линии: составить её выходы и смены заново"
  uk: "Розклад змінився відтоді, як студія планування склала обороти цієї лінії: скласти її обороти й зміни заново"
