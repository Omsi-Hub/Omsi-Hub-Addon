"Type and press Enter (Tab: the next cell, Escape: leave it). Up and Down change it by a minute.":
  de: "Tippen und Enter drücken (Tab: nächste Zelle, Esc: verlassen). Pfeil hoch und runter ändern um eine Minute."
  fr: "Tapez puis Entrée (Tab : cellule suivante, Échap : la quitter). Haut et Bas changent d'une minute."
  nl: "Typ en druk op Enter (Tab: volgende cel, Escape: verlaten). Omhoog en omlaag veranderen met een minuut."
  pl: "Wpisz i naciśnij Enter (Tab: następna komórka, Escape: opuść ją). Strzałki w górę i w dół zmieniają o minutę."
  es: "Escribe y pulsa Enter (Tab: la celda siguiente, Escape: salir). Arriba y Abajo lo cambian en un minuto."
  ru: "Введите и нажмите Enter (Tab — следующая ячейка, Escape — выйти). Стрелки вверх и вниз меняют на минуту."
  uk: "Введіть і натисніть Enter (Tab — наступна клітинка, Escape — вийти). Стрілки вгору й униз змінюють на хвилину."
"Changes not saved yet.":
  de: "Änderungen noch nicht gespeichert."
  fr: "Modifications pas encore enregistrées."
  nl: "Wijzigingen nog niet opgeslagen."
  pl: "Zmiany jeszcze niezapisane."
  es: "Cambios aún sin guardar."
  ru: "Изменения ещё не сохранены."
  uk: "Зміни ще не збережено."
"Click a cell to type into it.":
  de: "Klicken Sie in eine Zelle, um hineinzuschreiben."
  fr: "Cliquez sur une cellule pour y taper."
  nl: "Klik op een cel om erin te typen."
  pl: "Kliknij komórkę, aby w niej pisać."
  es: "Haz clic en una celda para escribir en ella."
  ru: "Нажмите на ячейку, чтобы ввести значение."
  uk: "Натисніть на клітинку, щоб ввести значення."
"No issues: the timeplan of this day group is valid.":
  de: "Keine Probleme: Der Fahrplanentwurf dieser Tagesgruppe ist gültig."
  fr: "Aucun problème : le plan horaire de ce groupe de jours est valide."
  nl: "Geen problemen: het dienstregelingsplan van deze dagengroep is geldig."
  pl: "Brak problemów: plan rozkładu tej grupy dni jest poprawny."
  es: "Sin problemas: el plan horario de este grupo de días es válido."
  ru: "Проблем нет: план расписания этой группы дней корректен."
  uk: "Проблем немає: план розкладу цієї групи днів коректний."
