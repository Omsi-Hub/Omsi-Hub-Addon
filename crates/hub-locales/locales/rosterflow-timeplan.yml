_version: 2
# RosterFlow's timeplan (Luc: the company's planning "exactly" like Optibus Planning): the
# running times per time band, the timetable grid, its figures and its validation.
"Timeplan":
  de: "Fahrplanentwurf"
  fr: "Plan horaire"
  nl: "Dienstregelingsplan"
  pl: "Plan rozkładu"
  es: "Plan horario"
  ru: "План расписания"
  uk: "План розкладу"
"The line's running times and timetable, as a scheduler plans them":
  de: "Fahrzeiten und Fahrplan der Linie, wie ein Planer sie erstellt"
  fr: "Les temps de parcours et l'horaire de la ligne, comme un planificateur les établit"
  nl: "De rijtijden en de dienstregeling van de lijn, zoals een planner ze maakt"
  pl: "Czasy przejazdu i rozkład linii, tak jak układa je planista"
  es: "Los tiempos de recorrido y el horario de la línea, tal como los planifica un planificador"
  ru: "Время хода и расписание линии, как их составляет планировщик"
  uk: "Час руху й розклад лінії, як їх складає планувальник"
"A line of the map's own timetable: open it once in the line editor (Lines page) to plan its timetable here.":
  de: "Eine Linie aus dem eigenen Fahrplan der Karte: Öffnen Sie sie einmal im Linieneditor (Seite Linien), um ihren Fahrplan hier zu planen."
  fr: "Une ligne de l'horaire propre à la carte : ouvrez-la une fois dans l'éditeur de lignes (page Lignes) pour planifier son horaire ici."
  nl: "Een lijn uit de eigen dienstregeling van de kaart: open hem één keer in de lijneditor (pagina Lijnen) om zijn dienstregeling hier te plannen."
  pl: "Linia z własnego rozkładu mapy: otwórz ją raz w edytorze linii (strona Linie), aby planować tu jej rozkład."
  es: "Una línea con horario propio del mapa: ábrela una vez en el editor de líneas (página Líneas) para planificar aquí su horario."
  ru: "Линия из собственного расписания карты: откройте её один раз в редакторе линий (страница «Линии»), чтобы планировать её расписание здесь."
  uk: "Лінія з власного розкладу карти: відкрийте її один раз у редакторі ліній (сторінка «Лінії»), щоб планувати її розклад тут."
"The company runs no line yet: add one on the Lines page first.":
  de: "Das Unternehmen betreibt noch keine Linie: Fügen Sie zuerst auf der Seite Linien eine hinzu."
  fr: "L'entreprise n'exploite encore aucune ligne : ajoutez-en d'abord une sur la page Lignes."
  nl: "Het bedrijf rijdt nog geen lijn: voeg er eerst een toe op de pagina Lijnen."
  pl: "Firma nie obsługuje jeszcze żadnej linii: najpierw dodaj ją na stronie Linie."
  es: "La empresa aún no tiene ninguna línea: añade una primero en la página Líneas."
  ru: "У компании пока нет линий: сначала добавьте линию на странице «Линии»."
  uk: "У компанії поки немає ліній: спершу додайте лінію на сторінці «Лінії»."
"The timeplan has changes not saved: choose again to drop them.":
  de: "Der Fahrplanentwurf hat ungespeicherte Änderungen: Wählen Sie erneut, um sie zu verwerfen."
  fr: "Le plan horaire a des modifications non enregistrées : choisissez à nouveau pour les abandonner."
  nl: "Het dienstregelingsplan heeft niet-opgeslagen wijzigingen: kies opnieuw om ze te laten vallen."
  pl: "Plan rozkładu ma niezapisane zmiany: wybierz ponownie, aby je odrzucić."
  es: "El plan horario tiene cambios sin guardar: vuelve a elegir para descartarlos."
  ru: "В плане расписания есть несохранённые изменения: выберите ещё раз, чтобы отбросить их."
  uk: "У плані розкладу є незбережені зміни: виберіть ще раз, щоб відкинути їх."
