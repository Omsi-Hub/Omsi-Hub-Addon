_version: 2
# RosterFlow's Roster tab: taking a driver off a duty or a bus off a tour (the cross, the right
# click's menus, letting go on the list, Delete, several chosen), what it did and why something
# stays (the core's `unassign`).
"The roster changed":
  de: "Der Dienstplan wurde geändert"
  fr: "Le roulement a changé"
  nl: "Het rooster is gewijzigd"
  pl: "Grafik zmieniony"
  es: "El cuadrante ha cambiado"
  ru: "График изменён"
  uk: "Графік змінено"
"%{who} taken off line %{n}, tour %{tour}, duty %{k}: nobody for it in the roster of %{day}.":
  de: "%{who} von Linie %{n}, Umlauf %{tour}, Dienst %{k} genommen: niemand dafür im Dienstplan für %{day}."
  fr: "%{who} retiré de la ligne %{n}, service %{tour}, service conducteur %{k} : personne pour lui dans le roulement du %{day}."
  nl: "%{who} van lijn %{n}, omloop %{tour}, dienst %{k} gehaald: niemand ervoor in het rooster van %{day}."
  pl: "%{who} zdjęty z linii %{n}, obiegu %{tour}, służby %{k}: nikogo do niej w grafiku na %{day}."
  es: "%{who} retirado de la línea %{n}, recorrido %{tour}, servicio %{k}: nadie lo cubre en el cuadrante del %{day}."
  ru: "%{who} снят с линии %{n}, оборота %{tour}, смены %{k}: в графике на %{day} на неё никого."
  uk: "%{who} знято з лінії %{n}, обороту %{tour}, зміни %{k}: у графіку на %{day} на неї нікого."
"Your choice for today taken back: line %{n}, tour %{tour}, duty %{k} is open again.":
  de: "Ihre Wahl für heute zurückgenommen: Linie %{n}, Umlauf %{tour}, Dienst %{k} ist wieder offen."
  fr: "Votre choix du jour annulé : ligne %{n}, service %{tour}, service conducteur %{k} de nouveau ouvert."
  nl: "Uw keuze voor vandaag teruggenomen: lijn %{n}, omloop %{tour}, dienst %{k} staat weer open."
  pl: "Twój wybór na dziś cofnięty: linia %{n}, obieg %{tour}, służba %{k} znów jest otwarta."
  es: "Tu elección de hoy se ha retirado: la línea %{n}, recorrido %{tour}, servicio %{k} vuelve a estar libre."
  ru: "Ваш выбор на сегодня отменён: линия %{n}, оборот %{tour}, смена %{k} снова открыта."
  uk: "Ваш вибір на сьогодні скасовано: лінія %{n}, оборот %{tour}, зміна %{k} знову відкрита."
"Line %{n}, tour %{tour}, duty %{k} without its driver today: its trips are dropped (penalty %{amount}).":
  de: "Linie %{n}, Umlauf %{tour}, Dienst %{k} heute ohne Fahrer: seine Fahrten fallen aus (Strafe %{amount})."
  fr: "Ligne %{n}, service %{tour}, service conducteur %{k} sans conducteur aujourd'hui : ses courses sont supprimées (pénalité %{amount})."
  nl: "Lijn %{n}, omloop %{tour}, dienst %{k} vandaag zonder chauffeur: de ritten vervallen (boete %{amount})."
  pl: "Linia %{n}, obieg %{tour}, służba %{k} dziś bez kierowcy: jej kursy przepadają (kara %{amount})."
  es: "Línea %{n}, recorrido %{tour}, servicio %{k} sin conductor hoy: sus viajes se suprimen (penalización %{amount})."
  ru: "Линия %{n}, оборот %{tour}, смена %{k} сегодня без водителя: её рейсы отменены (штраф %{amount})."
  uk: "Лінія %{n}, оборот %{tour}, зміна %{k} сьогодні без водія: її рейси скасовано (штраф %{amount})."
"Bus %{bus} taken off line %{n}, tour %{tour}: no bus for it in the roster of %{day}.":
  de: "Bus %{bus} von Linie %{n}, Umlauf %{tour} genommen: kein Bus dafür im Dienstplan für %{day}."
  fr: "Bus %{bus} retiré de la ligne %{n}, service %{tour} : aucun bus pour lui dans le roulement du %{day}."
  nl: "Bus %{bus} van lijn %{n}, omloop %{tour} gehaald: geen bus ervoor in het rooster van %{day}."
  pl: "Autobus %{bus} zdjęty z linii %{n}, obiegu %{tour}: brak autobusu w grafiku na %{day}."
  es: "Autobús %{bus} retirado de la línea %{n}, recorrido %{tour}: no hay autobús para él en el cuadrante del %{day}."
  ru: "Автобус %{bus} снят с линии %{n}, оборота %{tour}: в графике на %{day} автобуса нет."
  uk: "Автобус %{bus} знято з лінії %{n}, обороту %{tour}: у графіку на %{day} автобуса немає."
"Your bus for today taken back: line %{n}, tour %{tour} has no bus again.":
  de: "Ihr Bus für heute zurückgenommen: Linie %{n}, Umlauf %{tour} hat wieder keinen Bus."
  fr: "Votre bus du jour annulé : ligne %{n}, service %{tour} de nouveau sans bus."
  nl: "Uw bus voor vandaag teruggenomen: lijn %{n}, omloop %{tour} heeft weer geen bus."
  pl: "Twój autobus na dziś cofnięty: linia %{n}, obieg %{tour} znów nie ma autobusu."
  es: "Tu autobús de hoy se ha retirado: la línea %{n}, recorrido %{tour} vuelve a no tener autobús."
  ru: "Ваш автобус на сегодня отменён: у линии %{n}, оборота %{tour} снова нет автобуса."
  uk: "Ваш автобус на сьогодні скасовано: лінія %{n}, оборот %{tour} знову без автобуса."
"The rental bus of line %{n}, tour %{tour} is cancelled: its %{amount} for the day are not paid.":
  de: "Der Mietbus von Linie %{n}, Umlauf %{tour} ist abbestellt: seine %{amount} für den Tag werden nicht bezahlt."
  fr: "Le bus de location de la ligne %{n}, service %{tour} est annulé : ses %{amount} pour la journée ne sont pas payés."
  nl: "De huurbus van lijn %{n}, omloop %{tour} is geannuleerd: de %{amount} voor de dag worden niet betaald."
  pl: "Wynajem autobusu dla linii %{n}, obiegu %{tour} odwołany: %{amount} za dzień nie zostanie zapłacone."
  es: "El autobús de alquiler de la línea %{n}, recorrido %{tour} se cancela: no se pagan sus %{amount} del día."
  ru: "Арендный автобус линии %{n}, оборота %{tour} отменён: его %{amount} за день не оплачиваются."
  uk: "Орендований автобус лінії %{n}, обороту %{tour} скасовано: його %{amount} за день не сплачуються."
"Line %{n}, tour %{tour} without its bus today: its trips are dropped (penalty %{amount}).":
  de: "Linie %{n}, Umlauf %{tour} heute ohne Bus: seine Fahrten fallen aus (Strafe %{amount})."
  fr: "Ligne %{n}, service %{tour} sans bus aujourd'hui : ses courses sont supprimées (pénalité %{amount})."
  nl: "Lijn %{n}, omloop %{tour} vandaag zonder bus: de ritten vervallen (boete %{amount})."
  pl: "Linia %{n}, obieg %{tour} dziś bez autobusu: jego kursy przepadają (kara %{amount})."
  es: "Línea %{n}, recorrido %{tour} sin autobús hoy: sus viajes se suprimen (penalización %{amount})."
  ru: "Линия %{n}, оборот %{tour} сегодня без автобуса: его рейсы отменены (штраф %{amount})."
  uk: "Лінія %{n}, оборот %{tour} сьогодні без автобуса: його рейси скасовано (штраф %{amount})."
"The rental bus is cancelled: %{amount} not paid.":
  de: "Der Mietbus ist abbestellt: %{amount} werden nicht bezahlt."
  fr: "Le bus de location est annulé : %{amount} non payés."
  nl: "De huurbus is geannuleerd: %{amount} niet betaald."
  pl: "Wynajem autobusu odwołany: %{amount} niezapłacone."
  es: "El autobús de alquiler se cancela: %{amount} sin pagar."
  ru: "Аренда автобуса отменена: %{amount} не оплачиваются."
  uk: "Оренду автобуса скасовано: %{amount} не сплачуються."
"Nothing to take off.":
  de: "Nichts zu entfernen."
  fr: "Rien à retirer."
  nl: "Niets om weg te halen."
  pl: "Nie ma czego zdjąć."
  es: "No hay nada que retirar."
  ru: "Снимать нечего."
  uk: "Знімати нічого."
"Trips dropped today: penalty %{amount}.":
  de: "Heute ausfallende Fahrten: Strafe %{amount}."
  fr: "Courses supprimées aujourd'hui : pénalité %{amount}."
  nl: "Vandaag vervallen ritten: boete %{amount}."
  pl: "Dzisiejsze odwołane kursy: kara %{amount}."
  es: "Viajes suprimidos hoy: penalización %{amount}."
  ru: "Отменённые сегодня рейсы: штраф %{amount}."
  uk: "Скасовані сьогодні рейси: штраф %{amount}."
"Rental buses cancelled: %{amount} not paid.":
  de: "Mietbusse abbestellt: %{amount} werden nicht bezahlt."
  fr: "Bus de location annulés : %{amount} non payés."
  nl: "Huurbussen geannuleerd: %{amount} niet betaald."
  pl: "Wynajmy autobusów odwołane: %{amount} niezapłacone."
  es: "Autobuses de alquiler cancelados: %{amount} sin pagar."
  ru: "Аренда автобусов отменена: %{amount} не оплачиваются."
  uk: "Оренду автобусів скасовано: %{amount} не сплачуються."
"%{n} taken off.":
  de: "%{n} entfernt."
  fr: "%{n} retiré(s)."
  nl: "%{n} weggehaald."
  pl: "Zdjęto: %{n}."
  es: "%{n} retirados."
  ru: "Снято: %{n}."
  uk: "Знято: %{n}."
