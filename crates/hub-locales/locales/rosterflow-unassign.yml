  de: "%{who} von %{n} Diensten am %{day} genommen."
  fr: "%{who} retiré de %{n} services du %{day}."
  nl: "%{who} van %{n} diensten van %{day} gehaald."
  pl: "%{who} zdjęty z %{n} służb na %{day}."
  es: "%{who} retirado de %{n} servicios del %{day}."
  ru: "%{who} снят с %{n} смен на %{day}."
  uk: "%{who} знято з %{n} змін на %{day}."
"Bus %{bus} taken off %{n} tours of %{day}.":
  de: "Bus %{bus} von %{n} Umläufen am %{day} genommen."
  fr: "Bus %{bus} retiré de %{n} services du %{day}."
  nl: "Bus %{bus} van %{n} omlopen van %{day} gehaald."
  pl: "Autobus %{bus} zdjęty z %{n} obiegów na %{day}."
  es: "Autobús %{bus} retirado de %{n} recorridos del %{day}."
  ru: "Автобус %{bus} снят с %{n} оборотов на %{day}."
  uk: "Автобус %{bus} знято з %{n} оборотів на %{day}."
"The roster changed meanwhile: try again.":
  de: "Der Dienstplan hat sich inzwischen geändert: bitte erneut versuchen."
  fr: "Le roulement a changé entre-temps : réessayez."
  nl: "Het rooster is intussen gewijzigd: probeer het opnieuw."
  pl: "Grafik zmienił się w międzyczasie: spróbuj ponownie."
  es: "El cuadrante ha cambiado mientras tanto: inténtalo de nuevo."
  ru: "График тем временем изменился: попробуйте снова."
  uk: "Графік тим часом змінився: спробуйте ще раз."
"This duty has begun already: its driver can no longer be taken off today.":
  de: "Dieser Dienst hat schon begonnen: sein Fahrer kann heute nicht mehr entfernt werden."
  fr: "Ce service a déjà commencé : son conducteur ne peut plus être retiré aujourd'hui."
  nl: "Deze dienst is al begonnen: de chauffeur kan er vandaag niet meer af."
  pl: "Ta służba już się zaczęła: dziś nie można już zdjąć jej kierowcy."
  es: "Este servicio ya ha empezado: hoy ya no se puede retirar a su conductor."
  ru: "Эта смена уже началась: сегодня водителя с неё уже не снять."
  uk: "Ця зміна вже почалася: сьогодні водія з неї вже не зняти."
"This tour is under way: its bus can no longer be taken off today.":
  de: "Dieser Umlauf ist unterwegs: sein Bus kann heute nicht mehr entfernt werden."
  fr: "Ce service est en cours : son bus ne peut plus être retiré aujourd'hui."
  nl: "Deze omloop is onderweg: de bus kan er vandaag niet meer af."
  pl: "Ten obieg jest w trakcie: dziś nie można już zdjąć jego autobusu."
  es: "Este recorrido está en marcha: hoy ya no se puede retirar su autobús."
  ru: "Этот оборот уже в пути: сегодня автобус с него уже не снять."
  uk: "Цей оборот уже в дорозі: сьогодні автобус із нього вже не зняти."
"You drove it already: what was driven stays.":
  de: "Sie sind ihn schon gefahren: was gefahren wurde, bleibt."
  fr: "Vous l'avez déjà conduit : ce qui a été conduit reste."
  nl: "U hebt hem al gereden: wat gereden is, blijft."
  pl: "Już go przejechałeś: to, co przejechane, zostaje."
  es: "Ya lo has conducido: lo conducido se queda."
  ru: "Вы его уже проехали: проеханное остаётся."
  uk: "Ви його вже проїхали: проїхане лишається."
"The game runs this tour now: take it off once it is back in the depot.":
  de: "Das Spiel fährt diesen Umlauf gerade: entfernen Sie ihn, wenn er wieder im Depot ist."
  fr: "Le jeu fait rouler ce service en ce moment : retirez-le une fois de retour au dépôt."
  nl: "Het spel rijdt deze omloop nu: haal hem eraf als hij terug in de remise is."
  pl: "Gra właśnie prowadzi ten obieg: zdejmij go, gdy wróci do zajezdni."
  es: "El juego está ejecutando este recorrido ahora: retíralo cuando vuelva a la cochera."
  ru: "Игра сейчас ведёт этот оборот: снимите его, когда он вернётся в депо."
  uk: "Гра зараз веде цей оборот: зніміть його, коли він повернеться в депо."
"Nobody drives it: there is nothing to take off.":
  de: "Niemand fährt ihn: es gibt nichts zu entfernen."
  fr: "Personne ne le conduit : il n'y a rien à retirer."
  nl: "Niemand rijdt hem: er is niets om weg te halen."
  pl: "Nikt go nie prowadzi: nie ma czego zdjąć."
  es: "Nadie lo conduce: no hay nada que retirar."
  ru: "Его никто не ведёт: снимать нечего."
  uk: "Його ніхто не веде: знімати нічого."
"It has no bus: there is nothing to take off.":
  de: "Er hat keinen Bus: es gibt nichts zu entfernen."
  fr: "Il n'a pas de bus : il n'y a rien à retirer."
  nl: "Hij heeft geen bus: er is niets om weg te halen."
  pl: "Nie ma autobusu: nie ma czego zdjąć."
  es: "No tiene autobús: no hay nada que retirar."
  ru: "У него нет автобуса: снимать нечего."
  uk: "У нього немає автобуса: знімати нічого."
