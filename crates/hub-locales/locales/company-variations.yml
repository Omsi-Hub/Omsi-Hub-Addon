  fr: "L'autorité n'accepte aucune modification majeure tant que le contrat est rouge."
  nl: "Zolang het contract rood is, spreekt de opdrachtgever geen grote wijziging af."
  pl: "Dopóki umowa jest czerwona, organizator nie zgodzi się na dużą zmianę."
  es: "La autoridad de transporte no acuerda ningún cambio importante mientras el contrato esté en rojo."
  ru: "Пока контракт красный, заказчик не согласует крупное изменение."
  uk: "Поки контракт червоний, замовник не погодить великої зміни."
"Nothing changes: choose what the change is.":
  de: "Es ändert sich nichts: wählen Sie, was sich ändern soll."
  fr: "Rien ne change : choisissez la modification."
  nl: "Er verandert niets: kies wat de wijziging is."
  pl: "Nic się nie zmienia: wybierz, na czym polega zmiana."
  es: "No cambia nada: elige en qué consiste el cambio."
  ru: "Ничего не меняется: выберите, в чём изменение."
  uk: "Нічого не змінюється: виберіть, у чому зміна."
"The authority answers one offer a week on a contract.":
  de: "Der Aufgabenträger beantwortet ein Angebot pro Woche und Vertrag."
  fr: "L'autorité répond à une offre par semaine et par contrat."
  nl: "De opdrachtgever beantwoordt één bod per week per contract."
  pl: "Organizator odpowiada na jedną ofertę tygodniowo dla każdej umowy."
  es: "La autoridad de transporte responde a una oferta por semana y contrato."
  ru: "Заказчик отвечает на одно предложение в неделю по каждому контракту."
  uk: "Замовник відповідає на одну пропозицію на тиждень за кожним контрактом."
"An offer cannot be less than nothing.":
  de: "Ein Angebot kann nicht kleiner als null sein."
