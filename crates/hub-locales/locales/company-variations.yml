_version: 2
# Contract variations (Beta 66): a tendered line's bus contract changed by agreement with the
# authority - the "Request a change" dialog, its price and its offer, the contract's history, and
# the line editor's note when a contracted line of the map's is changed.
"Request a change":
  de: "Änderung beantragen"
  fr: "Demander une modification"
  nl: "Wijziging aanvragen"
  pl: "Wnioskuj o zmianę"
  es: "Solicitar un cambio"
  ru: "Запросить изменение"
  uk: "Запросити зміну"
"Change the timetable, the route, the days or the bus type by agreement with the authority: priced by the size of the change.":
  de: "Fahrplan, Linienweg, Verkehrstage oder Bustyp im Einvernehmen mit dem Aufgabenträger ändern: der Preis richtet sich nach dem Umfang der Änderung."
  fr: "Modifier l'horaire, l'itinéraire, les jours ou le type de bus en accord avec l'autorité : le prix dépend de l'ampleur de la modification."
  nl: "Dienstregeling, route, dagen of bustype wijzigen in overleg met de opdrachtgever: de prijs hangt af van de omvang van de wijziging."
  pl: "Zmień rozkład, trasę, dni kursowania lub typ autobusu w porozumieniu z organizatorem: cena zależy od wielkości zmiany."
  es: "Cambia el horario, la ruta, los días o el tipo de autobús de acuerdo con la autoridad de transporte: el precio depende del tamaño del cambio."
  ru: "Изменить расписание, маршрут, дни работы или тип автобуса по согласованию с заказчиком: цена зависит от объёма изменения."
  uk: "Змінити розклад, маршрут, дні роботи або тип автобуса за погодженням із замовником: ціна залежить від обсягу зміни."
"Request a change: line %{n}":
  de: "Änderung beantragen: Linie %{n}"
  fr: "Demander une modification : ligne %{n}"
  nl: "Wijziging aanvragen: lijn %{n}"
  pl: "Wniosek o zmianę: linia %{n}"
  es: "Solicitar un cambio: línea %{n}"
  ru: "Запрос изменения: линия %{n}"
  uk: "Запит на зміну: лінія %{n}"
"The authority prices a change of a tendered line by its size: a few minutes or a few per cent cost an admin fee, a larger change a fee with the payment adjusted pro rata, a major one a penalty as well.":
  de: "Der Aufgabenträger bepreist die Änderung einer ausgeschriebenen Linie nach ihrem Umfang: ein paar Minuten oder wenige Prozent kosten eine Verwaltungsgebühr, eine größere Änderung eine Gebühr und eine anteilig angepasste Zahlung, eine große zusätzlich eine Vertragsstrafe."
  fr: "L'autorité tarife la modification d'une ligne attribuée par appel d'offres selon son ampleur : quelques minutes ou quelques pour cent coûtent des frais administratifs, une modification plus large des frais et un paiement ajusté au prorata, une modification majeure une pénalité en plus."
  nl: "De opdrachtgever prijst een wijziging van een aanbestede lijn naar haar omvang: een paar minuten of een paar procent kosten administratiekosten, een grotere wijziging een vergoeding en een naar rato aangepaste betaling, een grote bovendien een boete."
  pl: "Organizator wycenia zmianę linii z przetargu według jej wielkości: kilka minut lub kilka procent kosztuje opłatę administracyjną, większa zmiana opłatę i proporcjonalnie skorygowaną płatność, duża dodatkowo karę umowną."
  es: "La autoridad de transporte pone precio al cambio de una línea licitada según su tamaño: unos minutos o unos pocos por ciento cuestan una tasa administrativa; un cambio mayor, una tasa con el pago ajustado a prorrata; uno importante, además una penalización."
  ru: "Заказчик оценивает изменение тендерной линии по его объёму: несколько минут или несколько процентов стоят административного сбора, изменение побольше — сбора и пропорционально пересчитанного платежа, крупное — ещё и штрафа."
  uk: "Замовник оцінює зміну тендерної лінії за її обсягом: кілька хвилин або кілька відсотків коштують адміністративного збору, більша зміна — збору й пропорційно перерахованого платежу, велика — ще й штрафу."
