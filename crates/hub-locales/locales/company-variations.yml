"Minor: an admin fee, the payment stays as it is.":
  de: "Geringfügig: eine Verwaltungsgebühr, die Zahlung bleibt, wie sie ist."
  fr: "Mineure : des frais administratifs, le paiement reste tel quel."
  nl: "Klein: administratiekosten, de betaling blijft zoals ze is."
  pl: "Drobna: opłata administracyjna, płatność bez zmian."
  es: "Menor: una tasa administrativa; el pago se queda como está."
  ru: "Незначительное: административный сбор, платёж не меняется."
  uk: "Незначна: адміністративний збір, платіж не змінюється."
"Moderate: a variation fee, and the payment follows the service pro rata.":
  de: "Mittel: eine Änderungsgebühr, und die Zahlung folgt anteilig der Leistung."
  fr: "Moyenne : des frais de modification, et le paiement suit le service au prorata."
  nl: "Middelgroot: wijzigingskosten, en de betaling volgt de dienst naar rato."
  pl: "Średnia: opłata za zmianę, a płatność zmienia się proporcjonalnie do usługi."
  es: "Moderado: una tasa de modificación, y el pago sigue al servicio a prorrata."
  ru: "Умеренное: сбор за изменение, и платёж меняется пропорционально объёму работы."
  uk: "Помірна: збір за зміну, і платіж змінюється пропорційно обсягу роботи."
"Major: a penalty of the contract's value still to come, default points and reputation, and the payment pro rata.":
  de: "Groß: eine Vertragsstrafe auf den noch ausstehenden Vertragswert, Strafpunkte und Ansehen, und die Zahlung anteilig."
  fr: "Majeure : une pénalité sur la valeur restante du contrat, des points de pénalité et de la réputation, et le paiement au prorata."
  nl: "Groot: een boete over de nog resterende contractwaarde, strafpunten en reputatie, en de betaling naar rato."
  pl: "Duża: kara od pozostałej wartości umowy, punkty karne i reputacja, a płatność proporcjonalnie."
  es: "Importante: una penalización sobre el valor pendiente del contrato, puntos de incumplimiento y reputación, y el pago a prorrata."
  ru: "Крупное: штраф от оставшейся стоимости контракта, штрафные баллы и репутация, и платёж пропорционально."
  uk: "Велика: штраф від решти вартості контракту, штрафні бали й репутація, і платіж пропорційно."
