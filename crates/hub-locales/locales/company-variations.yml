"The authority takes your offer: the change is agreed for %{amount}.":
  de: "Der Aufgabenträger nimmt Ihr Angebot an: die Änderung ist für %{amount} vereinbart."
  fr: "L'autorité accepte votre offre : la modification est convenue pour %{amount}."
  nl: "De opdrachtgever neemt je bod aan: de wijziging is afgesproken voor %{amount}."
  pl: "Organizator przyjmuje twoją ofertę: zmiana uzgodniona za %{amount}."
  es: "La autoridad de transporte acepta tu oferta: el cambio queda acordado por %{amount}."
  ru: "Заказчик принимает ваше предложение: изменение согласовано за %{amount}."
  uk: "Замовник приймає вашу пропозицію: зміну погоджено за %{amount}."
"The authority refuses your offer. You can make another in a week.":
  de: "Der Aufgabenträger lehnt Ihr Angebot ab. In einer Woche können Sie ein neues machen."
  fr: "L'autorité refuse votre offre. Vous pourrez en faire une autre dans une semaine."
  nl: "De opdrachtgever weigert je bod. Over een week kun je een nieuw doen."
  pl: "Organizator odrzuca twoją ofertę. Kolejną możesz złożyć za tydzień."
  es: "La autoridad de transporte rechaza tu oferta. Puedes hacer otra dentro de una semana."
  ru: "Заказчик отклоняет ваше предложение. Новое можно сделать через неделю."
  uk: "Замовник відхиляє вашу пропозицію. Нову можна зробити за тиждень."
"This line has no tendered contract to change.":
  de: "Diese Linie hat keinen ausgeschriebenen Vertrag, der sich ändern ließe."
  fr: "Cette ligne n'a pas de contrat attribué par appel d'offres à modifier."
  nl: "Deze lijn heeft geen aanbesteed contract om te wijzigen."
  pl: "Ta linia nie ma umowy z przetargu, którą można zmienić."
  es: "Esta línea no tiene ningún contrato licitado que cambiar."
  ru: "У этой линии нет тендерного контракта, который можно изменить."
  uk: "Ця лінія не має тендерного контракту, який можна змінити."
"The authority refuses a change this large: it would put the line out to tender again.":
  de: "Der Aufgabenträger lehnt eine so große Änderung ab: er würde die Linie neu ausschreiben."
  fr: "L'autorité refuse une modification aussi large : elle remettrait la ligne en appel d'offres."
  nl: "De opdrachtgever weigert een zo grote wijziging: hij zou de lijn opnieuw aanbesteden."
  pl: "Organizator odrzuca tak dużą zmianę: ogłosiłby na linię nowy przetarg."
  es: "La autoridad de transporte rechaza un cambio tan grande: obligaría a licitar la línea de nuevo."
  ru: "Заказчик отклоняет такое крупное изменение: он выставил бы линию на новый тендер."
  uk: "Замовник відхиляє таку велику зміну: він виставив би лінію на новий тендер."
"The authority agrees no major change while the contract is red.":
