"Offer a sum instead of the price asked. The authority weighs the size of the change and your track record (the contract's rating, your default points); it answers one offer a week on a contract.":
  de: "Bieten Sie statt des verlangten Preises eine Summe. Der Aufgabenträger wägt den Umfang der Änderung und Ihre Bilanz ab (die Bewertung des Vertrags, Ihre Strafpunkte); er beantwortet ein Angebot pro Woche und Vertrag."
  fr: "Proposez une somme au lieu du prix demandé. L'autorité pèse l'ampleur de la modification et votre bilan (la note du contrat, vos points de pénalité) ; elle répond à une offre par semaine et par contrat."
  nl: "Bied een bedrag in plaats van de gevraagde prijs. De opdrachtgever weegt de omvang van de wijziging en je staat van dienst (de beoordeling van het contract, je strafpunten); hij beantwoordt één bod per week per contract."
  pl: "Zaproponuj kwotę zamiast żądanej ceny. Organizator waży wielkość zmiany i twoją historię (ocenę umowy, twoje punkty karne); odpowiada na jedną ofertę tygodniowo dla każdej umowy."
  es: "Ofrece una suma en lugar del precio pedido. La autoridad de transporte valora el tamaño del cambio y tu historial (la valoración del contrato, tus puntos de incumplimiento); responde a una oferta por semana y contrato."
  ru: "Предложите сумму вместо запрошенной цены. Заказчик учитывает объём изменения и вашу историю (рейтинг контракта, ваши штрафные баллы); он отвечает на одно предложение в неделю по каждому контракту."
  uk: "Запропонуйте суму замість запитаної ціни. Замовник зважає на обсяг зміни та вашу історію (рейтинг контракту, ваші штрафні бали); він відповідає на одну пропозицію на тиждень за кожним контрактом."
