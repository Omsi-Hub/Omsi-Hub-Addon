"A net subsidy follows the cost less the fares and BSOG you keep: the revenue risk stays yours.":
  de: "Ein Nettozuschuss folgt den Kosten abzüglich der Fahrgelder und des BSOG, die Sie behalten: das Erlösrisiko bleibt bei Ihnen."
  fr: "Une subvention nette suit le coût moins les recettes et le BSOG que vous gardez : le risque sur les recettes reste le vôtre."
  nl: "Een nettosubsidie volgt de kosten min de opbrengsten en de BSOG die je houdt: het opbrengstrisico blijft bij jou."
  pl: "Dopłata netto podąża za kosztem pomniejszonym o wpływy z biletów i BSOG, które zatrzymujesz: ryzyko przychodów zostaje po twojej stronie."
  es: "Una subvención neta sigue al coste menos las tarifas y la BSOG que te quedas: el riesgo de ingresos sigue siendo tuyo."
  ru: "Нетто-субсидия следует за затратами за вычетом выручки и BSOG, которые остаются вам: риск по выручке остаётся на вас."
  uk: "Нетто-субсидія йде за витратами без виручки та BSOG, які лишаються вам: ризик за виручкою лишається на вас."
"A gross-cost payment follows the cost of the work: the fares stay the authority's.":
  de: "Eine Bruttozahlung folgt den Kosten der Leistung: die Fahrgelder bleiben beim Aufgabenträger."
  fr: "Un paiement à coût brut suit le coût du service : les recettes restent à l'autorité."
  nl: "Een brutobetaling volgt de kosten van het werk: de opbrengsten blijven van de opdrachtgever."
  pl: "Płatność brutto podąża za kosztem pracy: wpływy z biletów zostają u organizatora."
  es: "Un pago a coste bruto sigue al coste del trabajo: las tarifas son de la autoridad de transporte."
  ru: "Брутто-платёж следует за затратами на работу: выручка остаётся у заказчика."
  uk: "Брутто-платіж іде за витратами на роботу: виручка лишається в замовника."
"%{n} default points on the contract: its rating, and your quality in the next tenders":
  de: "%{n} Strafpunkte auf dem Vertrag: seine Bewertung und Ihre Qualität in den nächsten Ausschreibungen"
  fr: "%{n} points de pénalité sur le contrat : sa note, et votre qualité aux prochains appels d'offres"
  nl: "%{n} strafpunten op het contract: de beoordeling ervan, en je kwaliteit in de volgende aanbestedingen"
  pl: "%{n} punktów karnych na umowie: jej ocena i twoja jakość w kolejnych przetargach"
  es: "%{n} puntos de incumplimiento en el contrato: su valoración y tu calidad en las próximas licitaciones"
  ru: "%{n} штрафных баллов по контракту: его рейтинг и ваше качество в следующих тендерах"
  uk: "%{n} штрафних балів за контрактом: його рейтинг і ваша якість у наступних тендерах"
