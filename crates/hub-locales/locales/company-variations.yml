"The higher payment begins when the line runs the change: save it in the line editor.":
  de: "Die höhere Zahlung beginnt, wenn die Linie die Änderung fährt: speichern Sie sie im Linieneditor."
  fr: "Le paiement plus élevé commence quand la ligne applique la modification : enregistrez-la dans l'éditeur de lignes."
  nl: "De hogere betaling begint zodra de lijn de wijziging rijdt: sla haar op in de lijneditor."
  pl: "Wyższa płatność zaczyna się, gdy linia realizuje zmianę: zapisz ją w edytorze linii."
  es: "El pago más alto empieza cuando la línea aplique el cambio: guárdala en el editor de líneas."
  ru: "Повышенный платёж начнётся, когда линия начнёт работать по изменению: сохраните его в редакторе линий."
  uk: "Вищий платіж почнеться, коли лінія працюватиме за зміною: збережіть її в редакторі ліній."
"Then change the line in the line editor: a save that runs the change agreed costs nothing more.":
  de: "Ändern Sie danach die Linie im Linieneditor: ein Speichern, das die vereinbarte Änderung umsetzt, kostet nichts mehr."
  fr: "Modifiez ensuite la ligne dans l'éditeur de lignes : un enregistrement qui applique la modification convenue ne coûte rien de plus."
  nl: "Pas daarna de lijn aan in de lijneditor: een opslag die de afgesproken wijziging uitvoert, kost niets meer."
  pl: "Następnie zmień linię w edytorze linii: zapis realizujący uzgodnioną zmianę nic już nie kosztuje."
  es: "Después cambia la línea en el editor de líneas: guardar el cambio acordado no cuesta nada más."
  ru: "Затем измените линию в редакторе линий: сохранение, воплощающее согласованное изменение, больше ничего не стоит."
  uk: "Потім змініть лінію в редакторі ліній: збереження, що втілює погоджену зміну, більше нічого не коштує."
"Choose what changes: its price is shown here.":
  de: "Wählen Sie, was sich ändert: der Preis wird hier angezeigt."
  fr: "Choisissez ce qui change : son prix s'affiche ici."
  nl: "Kies wat er verandert: de prijs staat hier."
  pl: "Wybierz, co się zmienia: cena pojawi się tutaj."
  es: "Elige qué cambia: aquí se muestra su precio."
  ru: "Выберите, что меняется: цена показана здесь."
  uk: "Виберіть, що змінюється: ціну показано тут."
