"This driver has your account: sign out first.":
  nl: "Deze chauffeur heeft je account: log eerst uit."
  de: "Dieser Fahrer hat dein Konto: melde dich zuerst ab."
  fr: "Ce conducteur a votre compte : déconnectez-vous d'abord."
  ru: "У этого водителя ваш аккаунт: сначала выйдите."
  uk: "У цього водія ваш обліковий запис: спершу вийдіть."
  pl: "Ten kierowca ma twoje konto: najpierw się wyloguj."
  es: "Este conductor tiene tu cuenta: cierra sesión primero."
"The account on this computer is %{name}'s. %{driver} plays locally, without friends, the leaderboard or cloud saves.":
  nl: "Het account op deze computer is van %{name}. %{driver} speelt lokaal, zonder vrienden, klassement of cloud-saves."
  de: "Das Konto auf diesem Computer gehört %{name}. %{driver} spielt lokal, ohne Freunde, Bestenliste oder Cloud-Spielstände."
  fr: "Le compte de cet ordinateur est celui de %{name}. %{driver} joue en local, sans amis, classement ni sauvegardes dans le cloud."
  ru: "Аккаунт на этом компьютере принадлежит %{name}. %{driver} играет локально, без друзей, таблицы лидеров и облачных сохранений."
  uk: "Обліковий запис на цьому комп'ютері належить %{name}. %{driver} грає локально, без друзів, таблиці лідерів і хмарних збережень."
  pl: "Konto na tym komputerze należy do %{name}. %{driver} gra lokalnie, bez znajomych, rankingu i zapisów w chmurze."
  es: "La cuenta de este ordenador es de %{name}. %{driver} juega en local, sin amigos, clasificación ni partidas en la nube."
"Choose %{name} under \"Who is driving today?\" to use the account.":
  nl: "Kies %{name} bij \"Wie rijdt er vandaag?\" om het account te gebruiken."
  de: "Wähle %{name} unter „Wer fährt heute?“, um das Konto zu verwenden."
  fr: "Choisissez %{name} sous « Qui conduit aujourd'hui ? » pour utiliser le compte."
  ru: "Выберите %{name} в «Кто сегодня за рулём?», чтобы пользоваться аккаунтом."
  uk: "Виберіть %{name} у «Хто сьогодні за кермом?», щоб користуватися обліковим записом."
  pl: "Wybierz %{name} w „Kto dziś jedzie?”, aby korzystać z konta."
  es: "Elige a %{name} en \"¿Quién conduce hoy?\" para usar la cuenta."
