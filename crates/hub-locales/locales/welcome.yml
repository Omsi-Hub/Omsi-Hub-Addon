  nl: "Kies eerst je openOMSI- en OMSI 2-map."
  de: "Wähle zuerst deinen openOMSI- und OMSI-2-Ordner."
  fr: "Choisissez d'abord vos dossiers openOMSI et OMSI 2."
  ru: "Сначала выберите папки openOMSI и OMSI 2."
  uk: "Спершу виберіть теки openOMSI та OMSI 2."
  pl: "Najpierw wybierz foldery openOMSI i OMSI 2."
  es: "Elige primero tus carpetas de openOMSI y OMSI 2."
"Sign in, or play locally?":
  nl: "Inloggen, of lokaal spelen?"
  de: "Anmelden oder lokal spielen?"
  fr: "Se connecter, ou jouer en local ?"
  ru: "Войти или играть локально?"
  uk: "Увійти чи грати локально?"
  pl: "Zalogować się czy grać lokalnie?"
  es: "¿Iniciar sesión o jugar en local?"
"With an account your driver has friends, the leaderboard and cloud saves on every computer. Without one, everything stays on this computer.":
  nl: "Met een account heeft je chauffeur vrienden, het klassement en cloud-saves op elke computer. Zonder account blijft alles op deze computer."
  de: "Mit einem Konto hat dein Fahrer Freunde, die Bestenliste und Cloud-Spielstände auf jedem Computer. Ohne Konto bleibt alles auf diesem Computer."
  fr: "Avec un compte, votre conducteur a des amis, le classement et des sauvegardes dans le cloud sur chaque ordinateur. Sans compte, tout reste sur cet ordinateur."
  ru: "С аккаунтом у вашего водителя есть друзья, таблица лидеров и облачные сохранения на любом компьютере. Без него всё остаётся на этом компьютере."
  uk: "З обліковим записом ваш водій має друзів, таблицю лідерів і хмарні збереження на будь-якому комп'ютері. Без нього все залишається на цьому комп'ютері."
  pl: "Z kontem twój kierowca ma znajomych, ranking i zapisy w chmurze na każdym komputerze. Bez konta wszystko zostaje na tym komputerze."
  es: "Con una cuenta, tu conductor tiene amigos, la clasificación y partidas guardadas en la nube en cualquier ordenador. Sin ella, todo se queda en este ordenador."
"Continue locally without sync":
  nl: "Doorgaan lokaal zonder sync"
  de: "Lokal ohne Synchronisierung weiter"
  fr: "Continuer en local sans synchronisation"
  ru: "Продолжить локально без синхронизации"
  uk: "Продовжити локально без синхронізації"
  pl: "Kontynuuj lokalnie bez synchronizacji"
  es: "Continuar en local sin sincronizar"
"Friends, the leaderboard and your cloud saves go with %{name}.":
  nl: "Vrienden, het klassement en je cloud-saves horen bij %{name}."
  de: "Freunde, die Bestenliste und deine Cloud-Spielstände gehören zu %{name}."
  fr: "Les amis, le classement et vos sauvegardes dans le cloud vont avec %{name}."
  ru: "Друзья, таблица лидеров и облачные сохранения принадлежат %{name}."
  uk: "Друзі, таблиця лідерів і хмарні збереження належать %{name}."
  pl: "Znajomi, ranking i zapisy w chmurze należą do %{name}."
  es: "Los amigos, la clasificación y tus partidas en la nube van con %{name}."
"Your display name is your driver's name too.":
  nl: "Je weergavenaam is ook de naam van je chauffeur."
  de: "Dein Anzeigename ist auch der Name deines Fahrers."
  fr: "Votre nom affiché est aussi le nom de votre conducteur."
  ru: "Ваше отображаемое имя - это и имя вашего водителя."
  uk: "Ваше відображуване ім'я - це й ім'я вашого водія."
  pl: "Twoja nazwa wyświetlana jest też imieniem twojego kierowcy."
  es: "Tu nombre visible es también el nombre de tu conductor."
"Your account's driver: their duties, kilometres and level go with your account.":
  nl: "De chauffeur van je account: zijn diensten, kilometers en niveau gaan mee met je account."
  de: "Der Fahrer deines Kontos: seine Dienste, Kilometer und Stufe gehen mit deinem Konto."
  fr: "Le conducteur de votre compte : ses services, ses kilomètres et son niveau suivent votre compte."
  ru: "Водитель вашего аккаунта: его смены, километры и уровень привязаны к аккаунту."
  uk: "Водій вашого облікового запису: його наряди, кілометри й рівень прив'язані до облікового запису."
  pl: "Kierowca twojego konta: jego służby, kilometry i poziom idą z twoim kontem."
  es: "El conductor de tu cuenta: sus servicios, kilómetros y nivel van con tu cuenta."
"Your duties, kilometres and level are kept per driver, on this computer.":
  nl: "Je diensten, kilometers en niveau worden per chauffeur bijgehouden, op deze computer."
  de: "Deine Dienste, Kilometer und Stufe werden pro Fahrer gespeichert, auf diesem Computer."
  fr: "Vos services, kilomètres et niveau sont gardés par conducteur, sur cet ordinateur."
  ru: "Смены, километры и уровень хранятся для каждого водителя на этом компьютере."
  uk: "Наряди, кілометри й рівень зберігаються для кожного водія на цьому комп'ютері."
  pl: "Służby, kilometry i poziom są zapisywane dla każdego kierowcy na tym komputerze."
  es: "Tus servicios, kilómetros y nivel se guardan por conductor, en este ordenador."
"This driver has the account on this computer":
  nl: "Deze chauffeur heeft het account op deze computer"
  de: "Dieser Fahrer hat das Konto auf diesem Computer"
  fr: "Ce conducteur a le compte de cet ordinateur"
  ru: "У этого водителя аккаунт на этом компьютере"
