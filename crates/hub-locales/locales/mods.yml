  fr: "Un .rar ne peut pas être installé ici : décompressez-le d'abord (avec 7-Zip ou WinRAR) et installez le dossier, ou utilisez un .zip ou un .7z"
  ru: "Файл .rar здесь установить нельзя: сначала распакуйте его (7-Zip или WinRAR) и установите папку либо используйте .zip или .7z"
  uk: "Файл .rar тут встановити не можна: спершу розпакуйте його (7-Zip або WinRAR) і встановіть теку або використайте .zip чи .7z"
  pl: "Pliku .rar nie można tu zainstalować: najpierw go rozpakuj (7-Zip lub WinRAR) i zainstaluj folder albo użyj pliku .zip lub .7z"
  es: "Aquí no se puede instalar un .rar: descomprímelo primero (con 7-Zip o WinRAR) e instala la carpeta, o usa un .zip o .7z"
