"A bus, a map, scenery or a whole OMSI folder - as a .zip or .7z, or a folder (a .rar: unpack it first). openOMSI's own installer puts it into its content folder; the original OMSI 2 folder is never written to.":
  nl: "Een bus, een kaart, scenery of een hele OMSI-map - als .zip of .7z, of als map (een .rar: eerst uitpakken). De installer van openOMSI zelf zet hem in zijn contentmap; in de originele OMSI 2-map wordt nooit geschreven."
  de: "Ein Bus, eine Karte, Szenerie oder ein ganzer OMSI-Ordner - als .zip oder .7z oder als Ordner (eine .rar: zuerst entpacken). openOMSIs eigener Installer legt ihn in seinen Content-Ordner; in den originalen OMSI-2-Ordner wird nie geschrieben."
  fr: "Un bus, une carte, des décors ou tout un dossier OMSI - en .zip ou .7z, ou en dossier (un .rar : décompressez-le d'abord). L'installateur d'openOMSI lui-même le place dans son dossier de contenu ; le dossier OMSI 2 d'origine n'est jamais modifié."
  ru: "Автобус, карта, декорации или целая папка OMSI - в виде .zip или .7z либо папки (.rar сначала распакуйте). Собственный установщик openOMSI помещает его в свою папку контента; в исходную папку OMSI 2 ничего не записывается."
  uk: "Автобус, карта, декорації або ціла тека OMSI - у вигляді .zip чи .7z або теки (.rar спершу розпакуйте). Власний інсталятор openOMSI розміщує його у своїй теці контенту; в оригінальну теку OMSI 2 нічого не записується."
  pl: "Autobus, mapa, sceneria albo cały folder OMSI - jako .zip lub .7z albo jako folder (plik .rar najpierw rozpakuj). Własny instalator openOMSI umieszcza go w swoim folderze zawartości; do oryginalnego folderu OMSI 2 nic nie jest zapisywane."
  es: "Un autobús, un mapa, escenario o toda una carpeta de OMSI, como .zip o .7z, o una carpeta (un .rar: descomprímelo primero). El propio instalador de openOMSI lo pone en su carpeta de contenido; en la carpeta original de OMSI 2 nunca se escribe."
