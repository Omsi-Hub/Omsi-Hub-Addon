"Omsi-Hub starts this openOMSI with its plugin. Only the company's buses on the map, duties of several tours and the display font still need Omsi-Hub's own copy of the game.":
  de: "Omsi-Hub startet dieses openOMSI mit seinem Plugin. Nur die Busse der Firma auf der Karte, Dienste aus mehreren Umläufen und die Anzeigeschrift brauchen noch Omsi-Hubs eigene Kopie des Spiels."
  fr: "Omsi-Hub lance cet openOMSI avec son plugin. Seuls les bus de l'entreprise sur la carte, les services de plusieurs tournées et la police de la girouette demandent encore la propre copie du jeu d'Omsi-Hub."
  nl: "Omsi-Hub start deze openOMSI met zijn plug-in. Alleen de bussen van het bedrijf op de kaart, diensten uit meerdere omlopen en het lettertype van de rolfilm hebben nog Omsi-Hubs eigen kopie van het spel nodig."
  pl: "Omsi-Hub uruchamia ten openOMSI ze swoją wtyczką. Tylko autobusy firmy na mapie, służby z kilku brygad i czcionka wyświetlacza wymagają jeszcze własnej kopii gry Omsi-Hub."
  es: "Omsi-Hub inicia este openOMSI con su plugin. Solo los autobuses de la empresa en el mapa, los servicios de varios recorridos y la fuente del letrero siguen necesitando la copia propia del juego de Omsi-Hub."
  ru: "Omsi-Hub запускает этот openOMSI со своим плагином. Только автобусы компании на карте, смены из нескольких выходов и шрифт табло пока требуют собственной копии игры Omsi-Hub."
