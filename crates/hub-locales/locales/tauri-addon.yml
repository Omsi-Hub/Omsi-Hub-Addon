"Omsi-Hub can join an openOMSI you installed yourself. Choose its folder: Omsi-Hub checks its version and puts the Omsi-Hub plugin into it.":
  de: "Omsi-Hub kann sich einem openOMSI anschließen, das du selbst installiert hast. Wähle seinen Ordner: Omsi-Hub prüft die Version und legt das Omsi-Hub-Plugin hinein."
  fr: "Omsi-Hub peut rejoindre un openOMSI que vous avez installé vous-même. Choisissez son dossier : Omsi-Hub vérifie sa version et y place le plugin Omsi-Hub."
  nl: "Omsi-Hub kan aansluiten bij een openOMSI die je zelf hebt geïnstalleerd. Kies de map: Omsi-Hub controleert de versie en zet de Omsi-Hub-plug-in erin."
  pl: "Omsi-Hub może dołączyć do openOMSI zainstalowanego przez ciebie. Wybierz jego folder: Omsi-Hub sprawdzi wersję i umieści w nim wtyczkę Omsi-Hub."
  es: "Omsi-Hub puede unirse a un openOMSI que hayas instalado tú. Elige su carpeta: Omsi-Hub comprueba su versión y coloca en ella el plugin de Omsi-Hub."
  ru: "Omsi-Hub может подключиться к openOMSI, который вы установили сами. Выберите его папку: Omsi-Hub проверит версию и поместит в неё плагин Omsi-Hub."
  uk: "Omsi-Hub може приєднатися до openOMSI, який ви встановили самі. Виберіть його теку: Omsi-Hub перевірить версію і покладе туди плагін Omsi-Hub."
