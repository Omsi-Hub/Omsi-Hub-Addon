# Windows' app control refusing openOMSI (crates/hub-game/src/process.rs, `BLOCKED`).
"Windows blocked openOMSI: Smart App Control (or your organisation's app control) does not let this unsigned program start. Smart App Control has no list of allowed programs: openOMSI only starts with it off (Windows Security, App & browser control, Smart App Control), and it cannot be switched on again without reinstalling Windows. Under your organisation's policy, ask your administrator.":
  de: "Windows hat openOMSI blockiert: Die intelligente App-Steuerung (oder die App-Steuerung deiner Organisation) lässt dieses nicht signierte Programm nicht starten. Die intelligente App-Steuerung kennt keine Liste erlaubter Programme: openOMSI startet nur, wenn sie aus ist (Windows-Sicherheit, App- und Browsersteuerung, Intelligente App-Steuerung), und sie lässt sich nur durch eine Neuinstallation von Windows wieder einschalten. Bei einer Richtlinie deiner Organisation frag deinen Administrator."
  fr: "Windows a bloqué openOMSI : le contrôle intelligent des applications (ou celui de votre organisation) ne laisse pas démarrer ce programme non signé. Le contrôle intelligent des applications n'a pas de liste de programmes autorisés : openOMSI ne démarre que s'il est désactivé (Sécurité Windows, Contrôle des applications et du navigateur, Contrôle intelligent des applications), et il ne peut être réactivé qu'en réinstallant Windows. Pour une stratégie de votre organisation, demandez à votre administrateur."
  nl: "Windows heeft openOMSI geblokkeerd: Slim app-beheer (of het app-beheer van je organisatie) laat dit niet-ondertekende programma niet starten. Slim app-beheer kent geen lijst met toegestane programma's: openOMSI start alleen als het uit staat (Windows-beveiliging, App- en browserbeheer, Slim app-beheer), en het kan alleen weer aan door Windows opnieuw te installeren. Gaat het om een beleid van je organisatie, vraag dan je beheerder."
  pl: "Windows zablokował openOMSI: Inteligentna kontrola aplikacji (lub kontrola aplikacji twojej organizacji) nie pozwala uruchomić tego niepodpisanego programu. Inteligentna kontrola aplikacji nie ma listy dozwolonych programów: openOMSI uruchomi się tylko po jej wyłączeniu (Zabezpieczenia Windows, Kontrola aplikacji i przeglądarki, Inteligentna kontrola aplikacji), a ponowne włączenie wymaga ponownej instalacji Windows. W przypadku zasad organizacji poproś administratora."
  es: "Windows ha bloqueado openOMSI: el Control inteligente de aplicaciones (o el control de aplicaciones de tu organización) no deja iniciar este programa sin firmar. El Control inteligente de aplicaciones no tiene lista de programas permitidos: openOMSI solo se inicia con él desactivado (Seguridad de Windows, Control de aplicaciones y navegador, Control inteligente de aplicaciones), y no se puede volver a activar sin reinstalar Windows. Si es una directiva de tu organización, pregunta a tu administrador."
  ru: "Windows заблокировала openOMSI: интеллектуальное управление приложениями (или управление приложениями вашей организации) не даёт запустить эту неподписанную программу. У интеллектуального управления приложениями нет списка разрешённых программ: openOMSI запустится, только если его отключить («Безопасность Windows», «Управление приложениями/браузером», «Интеллектуальное управление приложениями»), а снова включить его можно только переустановкой Windows. Если это политика вашей организации, обратитесь к администратору."
  uk: "Windows заблокувала openOMSI: розумне керування застосунками (або керування застосунками вашої організації) не дає запустити цю непідписану програму. Розумне керування застосунками не має списку дозволених програм: openOMSI запуститься, лише якщо його вимкнути («Безпека Windows», «Керування застосунками та браузером», «Розумне керування застосунками»), а знову ввімкнути його можна лише перевстановленням Windows. Якщо це політика вашої організації, зверніться до адміністратора."
