  uk: "Більше землі"
  pl: "Więcej gruntu"
  es: "Más terreno"
"Click to put it down, R to turn it, Esc to stop":
  nl: "Klik om te plaatsen, R om te draaien, Esc om te stoppen"
  de: "Klicken zum Setzen, R zum Drehen, Esc zum Beenden"
  fr: "Cliquer pour poser, R pour tourner, Échap pour arrêter"
  ru: "Щелчок — поставить, R — повернуть, Esc — выйти"
  uk: "Клік — поставити, R — повернути, Esc — вийти"
  pl: "Kliknij, aby postawić, R, aby obrócić, Esc, aby zakończyć"
  es: "Haz clic para colocarlo, R para girarlo, Esc para parar"
"Drag to move, scroll to zoom":
  nl: "Sleep om te verschuiven, scroll om te zoomen"
  de: "Ziehen zum Verschieben, scrollen zum Zoomen"
  fr: "Glisser pour déplacer, défiler pour zoomer"
  ru: "Перетащите, чтобы сдвинуть, колесо — масштаб"
  uk: "Перетягніть, щоб зсунути, коліщатко — масштаб"
  pl: "Przeciągnij, aby przesunąć, przewiń, aby przybliżyć"
  es: "Arrastra para mover, usa la rueda para hacer zoom"
"Move it where it fits: it costs nothing.":
  nl: "Zet het neer waar het past: het kost niets."
  de: "Dorthin setzen, wo es passt: es kostet nichts."
  fr: "Déplacez-le là où il tient : cela ne coûte rien."
  ru: "Переставьте туда, где помещается: это бесплатно."
  uk: "Переставте туди, де вміщується: це безкоштовно."
  pl: "Przenieś tam, gdzie się zmieści: to nic nie kosztuje."
  es: "Muévelo donde quepa: no cuesta nada."
"Put it down where it fits, its lane kept free.":
  nl: "Zet het neer waar het past, met zijn rijbaan vrij."
  de: "Dorthin setzen, wo es passt, seine Fahrspur frei."
  fr: "Posez-le là où il tient, sa voie laissée libre."
  ru: "Поставьте туда, где помещается, оставив проезд свободным."
  uk: "Поставте туди, де вміщується, залишивши проїзд вільним."
  pl: "Postaw tam, gdzie się zmieści, z wolnym pasem."
  es: "Colócalo donde quepa, dejando libre su carril."
"It does not fit on your land here: put it elsewhere or buy more land.":
  nl: "Het past hier niet op je grond: zet het ergens anders of koop meer grond."
  de: "Hier passt es nicht auf dein Land: setze es woanders hin oder kaufe mehr Land."
  fr: "Il ne tient pas sur votre terrain ici : posez-le ailleurs ou achetez du terrain."
  ru: "Здесь не помещается на вашей земле: поставьте в другом месте или купите землю."
  uk: "Тут не вміщується на вашій землі: поставте деінде або купіть землю."
  pl: "Tu nie mieści się na twoim gruncie: postaw gdzie indziej lub kup więcej gruntu."
  es: "Aquí no cabe en tu terreno: ponlo en otro sitio o compra más terreno."
"It would block the way in from the gate.":
  nl: "Het zou de toegang vanaf de poort blokkeren."
  de: "Es würde die Zufahrt vom Tor versperren."
  fr: "Il bloquerait l'accès depuis le portail."
  ru: "Это перекроет въезд от ворот."
  uk: "Це перекриє в'їзд від воріт."
  pl: "Zablokowałoby wjazd od bramy."
  es: "Bloquearía el acceso desde la entrada."
"Something stands there already.":
  nl: "Daar staat al iets."
  de: "Dort steht schon etwas."
  fr: "Quelque chose s'y trouve déjà."
  ru: "Там уже что-то стоит."
  uk: "Там уже щось стоїть."
  pl: "Coś już tam stoi."
  es: "Ahí ya hay algo."
"Keep the lanes in front of the buildings and spaces free.":
  nl: "Houd de rijbanen voor de gebouwen en vakken vrij."
  de: "Halte die Fahrspuren vor Gebäuden und Stellplätzen frei."
  fr: "Laissez libres les voies devant les bâtiments et les places."
  ru: "Оставьте проезды перед зданиями и местами свободными."
  uk: "Залиште проїзди перед будівлями та місцями вільними."
  pl: "Zostaw wolne pasy przed budynkami i miejscami."
  es: "Deja libres los carriles delante de los edificios y las plazas."
"This is not put down on the yard.":
  nl: "Dit wordt niet op het terrein geplaatst."
  de: "Das wird nicht auf den Hof gesetzt."
  fr: "Ceci ne se pose pas sur le dépôt."
  ru: "Это не ставится на территории."
  uk: "Це не ставиться на території."
  pl: "Tego nie stawia się na placu."
  es: "Esto no está colocado en el patio."
"That is not there any more.":
  nl: "Dat staat er niet meer."
  de: "Das steht nicht mehr dort."
  fr: "Cela n'y est plus."
  ru: "Этого там больше нет."
  uk: "Цього там більше немає."
  pl: "Tego już tam nie ma."
  es: "Eso ya no está."
"Building work is under way on it.":
  nl: "Er wordt aan gebouwd."
  de: "Daran wird gerade gebaut."
  fr: "Des travaux y sont en cours."
  ru: "Там идёт строительство."
  uk: "Там триває будівництво."
  pl: "Trwa tam budowa."
  es: "Hay obras en marcha en él."
"A bus is being worked on in it.":
  nl: "Er wordt een bus in onderhouden."
  de: "Darin wird gerade ein Bus bearbeitet."
  fr: "Un bus y est en cours de travaux."
  ru: "В нём ремонтируют автобус."
  uk: "У ньому ремонтують автобус."
  pl: "Trwa w nim praca przy autobusie."
  es: "Se está trabajando en un autobús dentro."
"There is no more land to buy here.":
  nl: "Hier is geen grond meer te koop."
  de: "Hier gibt es kein Land mehr zu kaufen."
  fr: "Il n'y a plus de terrain à acheter ici."
  ru: "Здесь больше нет земли для покупки."
  uk: "Тут більше немає землі для купівлі."
  pl: "Nie ma tu więcej gruntu do kupienia."
  es: "Aquí no queda más terreno que comprar."
"There is no room for it on the yard: buy more land.":
  nl: "Er is geen plek voor op het terrein: koop meer grond."
  de: "Auf dem Hof ist kein Platz dafür: kaufe mehr Land."
  fr: "Il n'y a pas de place sur le dépôt : achetez du terrain."
  ru: "На территории нет места: купите землю."
  uk: "На території немає місця: купіть землю."
  pl: "Na placu nie ma na to miejsca: kup więcej gruntu."
  es: "No hay sitio para ello en el patio: compra más terreno."
"It has been pulled down.":
  nl: "Het is gesloopt."
  de: "Es wurde abgerissen."
  fr: "Il a été démoli."
  ru: "Снесено."
  uk: "Знесено."
  pl: "Zostało wyburzone."
  es: "Se ha derribado."
"The land is yours: the yard is bigger.":
  nl: "De grond is van jou: het terrein is groter."
  de: "Das Land gehört dir: der Hof ist größer."
  fr: "Le terrain est à vous : le dépôt est plus grand."
  ru: "Земля ваша: территория стала больше."
  uk: "Земля ваша: територія стала більшою."
  pl: "Grunt jest twój: plac jest większy."
  es: "El terreno es tuyo: el patio es más grande."
"%{m} m more land beside the yard, yours at once":
  nl: "%{m} m extra grond naast het terrein, meteen van jou"
  de: "%{m} m mehr Land neben dem Hof, sofort deins"
  fr: "%{m} m de terrain en plus à côté du dépôt, à vous tout de suite"
  ru: "%{m} м земли рядом с территорией, сразу ваши"
  uk: "%{m} м землі поруч із територією, одразу ваші"
  pl: "%{m} m gruntu obok placu, od razu twoje"
  es: "%{m} m más de terreno junto al patio, tuyos al momento"
