[package]
name = "hub-api"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Omsi-Hub's commands: the page's `call(cmd, args)` routed by prefix to the company, RosterFlow, online, the editors, the plugin and the app's own (`hub_`)"

[dependencies]
hub-core.workspace = true
hub-omsi.workspace = true
hub-game.workspace = true
hub-locales.workspace = true
hub-online = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
chrono.workspace = true
# (the updates: this repository's releases asked of GitHub's API, `update.rs`)
ureq = { workspace = true, optional = true }
# (the 3D view, the bus photos and the livery studio: a bus read as the game reads it, with
# openOMSI's readers - THIRD_PARTY_NOTICES.md - and the studio's core, `content/bus3d`, `lak`)
omsi-cfg = { workspace = true, optional = true }
omsi-model = { workspace = true, optional = true }
omsi-o3d = { workspace = true, optional = true }
omsi-sim = { workspace = true, optional = true }
omsi-texture = { workspace = true, optional = true }
omsi-vehicle = { workspace = true, optional = true }
# (the line editor: the map's lanes and stops read from its tiles, `lineeditor/navmap.rs`)
omsi-geometry = { workspace = true, optional = true }
omsi-map = { workspace = true, optional = true }
omsi-scenery = { workspace = true, optional = true }
omsi-timetable = { workspace = true, optional = true }
omsi-world = { workspace = true, optional = true }
omsi-content = { workspace = true, optional = true }
omsi-launcher-core = { workspace = true, optional = true }
hashbrown.workspace = true
parking_lot.workspace = true
rayon = { workspace = true, optional = true }
log.workspace = true
# (Play together: the company server's key and the addresses friends join by, `together`)
omsi-net = { workspace = true, optional = true }
hub-livery = { workspace = true, optional = true }
# (the phone and tablet companion's server, `companion`)
hub-companion = { workspace = true, optional = true }
glam.workspace = true
sha2.workspace = true

# A fake openOMSI for the drive's end-to-end test (`tests/drive.rs`): it writes the plugin's
# files as the plugin in a real openOMSI would, then ends. Never shipped: the app links the library.
[[bin]]
name = "fake-openomsi"
path = "tests/support/fake_openomsi.rs"
test = false
bench = false
doc = false

[features]
# (the desktop app: the game, openOMSI's readers, the network, the files; without it, the bus company's
# and RosterFlow's commands over a company handed in, as the website runs them in the browser)
default = ["native"]
native = ["hub-core/native", "dep:hub-online", "dep:ureq", "dep:omsi-cfg", "dep:omsi-model", "dep:omsi-o3d", "dep:omsi-sim", "dep:omsi-texture", "dep:omsi-vehicle", "dep:omsi-geometry", "dep:omsi-map", "dep:omsi-scenery", "dep:omsi-timetable", "dep:omsi-world", "dep:omsi-content", "dep:omsi-launcher-core", "dep:rayon", "dep:omsi-net", "dep:hub-livery", "dep:hub-companion"]

[dev-dependencies]
# (the mods' tests: a mod packed as a .zip, as the installer reads it)
zip = { version = "8.6", default-features = false, features = ["deflate"] }
# (the livery studio's tests: a picture written and brought in)
image.workspace = true
