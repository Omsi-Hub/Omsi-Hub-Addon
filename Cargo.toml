[workspace]
resolver = "2"
members = [
    "crates/hub-omsi",
    "crates/hub-core",
    "crates/hub-api",
    "crates/hub-game",
    "crates/hub-locales",
    "crates/hub-online",
    "crates/hub-livery",
    "crates/hub-companion",
    "crates/hub-devices",
    "plugin/harness",
    "app",
    # (the website's bus company: built for wasm32-wasip1, `crates/hub-web`)
    "crates/hub-web",
]
# (the app builds with `cargo build -p omsi-hub`; plain `cargo build` builds the libraries)
default-members = [
    "crates/hub-omsi",
    "crates/hub-core",
    "crates/hub-api",
    "crates/hub-game",
    "crates/hub-locales",
    "crates/hub-online",
    "crates/hub-livery",
    "crates/hub-companion",
    "crates/hub-devices",
    "plugin/harness",
]

[workspace.package]
version = "1.1.1"
edition = "2021"
license = "LicenseRef-Proprietary"
authors = ["Omsi-Hub"]
repository = "https://github.com/Omsi-Hub/Omsi-Hub-Addon"
rust-version = "1.90"

[workspace.dependencies]
hub-omsi = { path = "crates/hub-omsi" }
# (without "native": the company and RosterFlow as plain logic, as the website runs them in the browser)
hub-core = { path = "crates/hub-core", default-features = false }
hub-api = { path = "crates/hub-api", default-features = false }
hub-game = { path = "crates/hub-game" }
hub-locales = { path = "crates/hub-locales" }
hub-online = { path = "crates/hub-online" }
hub-livery = { path = "crates/hub-livery" }
hub-companion = { path = "crates/hub-companion" }
hub-devices = { path = "crates/hub-devices" }

# openOMSI's readers and its vehicle simulation, as Luc's fork of openOMSI has them: the code of
# openOMSI from before it became AGPL (2026-10-14), under its MIT licence, with Luc's own changes
# (THIRD_PARTY_NOTICES.md). The 3D view, the photos and the livery studio read a bus with them as
# the game reads it. Pinned to one commit of the fork (its branch omsi-hub-rar-optional: beta and
# omsi-launcher-core's feature `rar`, which Omsi-Hub builds without).
omsi-cfg = { git = "https://github.com/Luc-nbr/openOMSI", rev = "b2244cf6c101fc6ed9c9bdd12b00d383433217c2" }
omsi-model = { git = "https://github.com/Luc-nbr/openOMSI", rev = "b2244cf6c101fc6ed9c9bdd12b00d383433217c2" }
omsi-net = { git = "https://github.com/Luc-nbr/openOMSI", rev = "b2244cf6c101fc6ed9c9bdd12b00d383433217c2" }
omsi-o3d = { git = "https://github.com/Luc-nbr/openOMSI", rev = "b2244cf6c101fc6ed9c9bdd12b00d383433217c2" }
omsi-sim = { git = "https://github.com/Luc-nbr/openOMSI", rev = "b2244cf6c101fc6ed9c9bdd12b00d383433217c2" }
omsi-texture = { git = "https://github.com/Luc-nbr/openOMSI", rev = "b2244cf6c101fc6ed9c9bdd12b00d383433217c2" }
omsi-vehicle = { git = "https://github.com/Luc-nbr/openOMSI", rev = "b2244cf6c101fc6ed9c9bdd12b00d383433217c2" }
omsi-geometry = { git = "https://github.com/Luc-nbr/openOMSI", rev = "b2244cf6c101fc6ed9c9bdd12b00d383433217c2" }
omsi-map = { git = "https://github.com/Luc-nbr/openOMSI", rev = "b2244cf6c101fc6ed9c9bdd12b00d383433217c2" }
omsi-scenery = { git = "https://github.com/Luc-nbr/openOMSI", rev = "b2244cf6c101fc6ed9c9bdd12b00d383433217c2" }
omsi-timetable = { git = "https://github.com/Luc-nbr/openOMSI", rev = "b2244cf6c101fc6ed9c9bdd12b00d383433217c2" }
omsi-world = { git = "https://github.com/Luc-nbr/openOMSI", rev = "b2244cf6c101fc6ed9c9bdd12b00d383433217c2" }
omsi-content = { git = "https://github.com/Luc-nbr/openOMSI", rev = "b2244cf6c101fc6ed9c9bdd12b00d383433217c2" }
# (its mod installer and the mods' notes: Omsi-Hub installs mods as openOMSI's launcher does, `hub-api`'s
# `mods`; without its feature `rar` - unrar-rs is GPL-3.0 - so a .rar is refused)
omsi-launcher-core = { git = "https://github.com/Luc-nbr/openOMSI", rev = "b2244cf6c101fc6ed9c9bdd12b00d383433217c2", default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
sha2 = "0.11"
ring = "0.17"
encoding_rs = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
dirs = "6"
glam = "0.30"
log = "0.4"
rayon = "1.10"
hashbrown = "0.17"
parking_lot = "0.12"
ab_glyph = "0.2"
# (tests only: pictures written and read back)
image = { version = "0.25", default-features = false, features = ["png"] }
mlua = { version = "0.12", features = ["lua54", "vendored", "serialize"] }

# (the dependencies without debug info and our own crates with line tables only: with openOMSI's
# crates the test binaries' debug info filled the CI runner's disk)
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"

# (the website's bus company, `crates/hub-web`: small rather than fast - the browser downloads it)
[profile.web]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
