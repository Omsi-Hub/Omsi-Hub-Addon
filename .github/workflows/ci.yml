# Every push: the Rust checks on Linux and the page's scripts (the repository is private, and its
# Actions minutes count: Windows' twice, macOS' ten times). Everything - the checks on Windows and
# macOS too, and the app built with its installers on all three, the Linux selftest included - runs
# by hand (Actions → CI → Run workflow) before a release, and the release builds all three anyway.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # What Tauri needs to build on Linux (WebKitGTK 4.1 and its friends)
  LINUX_DEPS: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev build-essential

jobs:
  rust:
    name: fmt, clippy, tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["windows-latest", "macos-latest", "ubuntu-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      # (rustup takes the toolchain rust-toolchain.toml pins, with rustfmt and clippy)
      # (Luc's openOMSI fork, which Cargo fetches, is private: read with the secret FORKED_OPEN_OMSI when
      # there is one - a fine-grained token with "Contents: Read-only" on Luc-nbr/openOMSI)
      - name: Access to the openOMSI fork
        shell: bash
        env:
          TOKEN: ${{ secrets.FORKED_OPEN_OMSI }}
        run: |
          if [ -n "$TOKEN" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/Luc-nbr/openOMSI".insteadOf "https://github.com/Luc-nbr/openOMSI"
            echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
          fi
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        # (warnings allowed at first: the ports bring their code as it is)
        run: cargo clippy --workspace --all-targets
      - name: cargo test
        run: cargo test --workspace
        env:
          # (Linux's temp folder is case-sensitive: hub-omsi's case test must really run there)
          OMSIHUB_REQUIRE_CASE_SENSITIVE: ${{ runner.os == 'Linux' && '1' || '' }}

  ui:
    name: UI scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: node --check
        shell: bash
        run: |
          set -e
          find ui/js tools -name '*.js' -o -name '*.mjs' | while read -r f; do
            node --check "$f"
          done

  tauri:
    name: Tauri build (${{ matrix.os }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # (the installers too, so that their pictures and settings are checked before a release)
          - os: windows-latest
            build: --bundles nsis
          - os: macos-latest
            build: --bundles dmg
          # (Linux's packages are made too: the AppImage, the updater's, and .deb and .rpm)
          - os: ubuntu-latest
            build: --bundles appimage,deb,rpm
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS xvfb xdg-utils file
      # (Luc's openOMSI fork, which Cargo fetches, is private: read with the secret FORKED_OPEN_OMSI when
      # there is one - a fine-grained token with "Contents: Read-only" on Luc-nbr/openOMSI)
      - name: Access to the openOMSI fork
        shell: bash
        env:
          TOKEN: ${{ secrets.FORKED_OPEN_OMSI }}
        run: |
          if [ -n "$TOKEN" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/Luc-nbr/openOMSI".insteadOf "https://github.com/Luc-nbr/openOMSI"
            echo "CARGO_NET_GIT_FETCH_WITH_CLI=true" >> "$GITHUB_ENV"
          fi
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: tauri build (no signing, no release)
        working-directory: app
        shell: bash
        run: npx --yes @tauri-apps/cli@2 build ${{ matrix.build }}
      # (the bundle in the .dmg signed as a whole, ad hoc: a downloaded app whose bundle is not
      # signed is "damaged" to macOS; the .app beside it is gone once the .dmg is made)
      - name: the app's signature on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          dmg=$(ls target/release/bundle/dmg/*.dmg)
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" "$dmg"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/dmg/Omsi-Hub.app"
          codesign -dv "$RUNNER_TEMP/dmg/Omsi-Hub.app"
          hdiutil detach "$RUNNER_TEMP/dmg"
      - name: Linux packages made
        if: runner.os == 'Linux'
        shell: bash
        run: ls -l target/release/bundle/appimage/*.AppImage target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm
      - name: the app's selftest on Linux (Xvfb), through the first-run setup
        if: runner.os == 'Linux'
        shell: bash
        env:
          OMSIHUB_SELFTEST: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: |
          OMSIHUB_DATA_DIR="$RUNNER_TEMP/omsihub-data" OMSIHUB_SELFTEST_FIXTURES="$PWD/fixtures" \
            timeout 120 xvfb-run -a target/release/omsi-hub
